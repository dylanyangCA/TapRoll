<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2343CE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121A3A" media="(prefers-color-scheme: dark)">
<title>TapRoll usage</title>
<link rel="privacy-policy" href="privacy.html">
<link rel="terms-of-service" href="terms.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@500;600&family=Public+Sans:wght@400..700&display=swap">
<style>
/* TapRoll usage: one column for the people who run the site. Totals first (stat tiles), then two charts
   (sign-ups over time, attendance taken in the last 14 days), then schools and teachers as tables, which
   turn into stacked cards on phones. Colors and type match the app. */
:root {
  --bg: #F1F3F6;
  --surface: #FFFFFF;
  --surface-2: #F6F8FA;
  --line: #DAE0E8;
  --line-2: #C3CBD7;
  --ink: #0F172A;
  --ink-2: #334155;
  --muted: #5F6B82;
  --accent: #2343CE;
  --accent-2: #1A34A6;
  --on-accent: #FFFFFF;
  --accent-soft: #E3E8FD;
  --t: #A85A06; --t-soft: #FCEED7;
  --a: #C22B33; --a-soft: #FBE2E3;
  --u: #8B95A8; --u-soft: #E9EDF3;
  --shadow-1: 0 1px 2px rgb(15 23 42 / .06), 0 1px 1px rgb(15 23 42 / .03);
  --shadow-2: 0 10px 28px rgb(15 23 42 / .16);
  /* Chart marks: TapRoll blue for tag taps and teachers, a quiet gray for attendance marked by hand.
     Checked with the data-viz palette validator against each mode's card surface. */
  --viz-1: #2343CE;
  --viz-2: #8B95A8;
  --display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r-sm: 8px;
  --r: 12px;
  --r-lg: 18px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0E14; --surface: #131821; --surface-2: #19202B;
    --line: #242C39; --line-2: #36404F;
    --ink: #E8ECF3; --ink-2: #C2CAD7; --muted: #8E99AD;
    --accent: #93A6FF; --accent-2: #B3C0FF; --on-accent: #0A0F1F; --accent-soft: #1D2647;
    --t: #F4B24A; --t-soft: #35260D; --a: #FF7D82; --a-soft: #3B171A;
    --u: #7C889C; --u-soft: #1C222D;
    --shadow-1: 0 0 0 1px rgb(255 255 255 / .02);
    --shadow-2: 0 14px 34px rgb(0 0 0 / .5);
    --viz-1: #6680F2;
    --viz-2: #5E6879;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B0E14; --surface: #131821; --surface-2: #19202B;
  --line: #242C39; --line-2: #36404F;
  --ink: #E8ECF3; --ink-2: #C2CAD7; --muted: #8E99AD;
  --accent: #93A6FF; --accent-2: #B3C0FF; --on-accent: #0A0F1F; --accent-soft: #1D2647;
  --t: #F4B24A; --t-soft: #35260D; --a: #FF7D82; --a-soft: #3B171A;
  --u: #7C889C; --u-soft: #1C222D;
  --shadow-1: 0 0 0 1px rgb(255 255 255 / .02);
  --shadow-2: 0 14px 34px rgb(0 0 0 / .5);
  --viz-1: #6680F2;
  --viz-2: #5E6879;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.ic { width: 18px; height: 18px; flex: none; }
code {
  font-family: var(--mono); font-size: .9em;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px;
  padding: 1px 6px; overflow-wrap: anywhere;
}
.dim { color: var(--muted); }

/* ---------- Top bar ---------- */
.top { background: var(--surface); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.top-in {
  max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding-block: 12px;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font-family: var(--display); font-stretch: 118%; font-weight: 800; font-size: 19px; letter-spacing: -.01em; }
.logo { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); }
.logo svg { width: 20px; height: 20px; }
.crumb { color: var(--muted); font-weight: 600; font-size: 15px; }
.crumb::before { content: "/"; margin-right: 10px; color: var(--line-2); }
.top-in .grow { flex: 1; }

/* ---------- Page ---------- */
.page {
  padding-block: 26px 64px;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.wrap.is-refreshing .kpis, .wrap.is-refreshing .charts, .wrap.is-refreshing .tablecard { opacity: .55; transition: opacity .2s; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 38px; padding: 0 14px;
  border-radius: var(--r-sm); border: 1px solid var(--line-2);
  background: var(--surface); color: var(--ink);
  font-weight: 600; font-size: 14px; white-space: nowrap; text-decoration: none;
  transition: background-color .15s, border-color .15s, color .15s;
}
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn.sm { min-height: 32px; padding: 0 10px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; }
.linkbtn:hover { text-decoration: underline; }

.vhead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 20px; }
.vhead-text { min-width: 0; }
.eyebrow { font: 600 12px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.vtitle { margin: 6px 0 0; font-family: var(--display); font-stretch: 114%; font-weight: 800; font-size: clamp(28px, 3.4vw, 40px); line-height: 1.04; letter-spacing: -.015em; }
.vsub { margin: 6px 0 0; font-size: 13.5px; color: var(--muted); overflow-wrap: anywhere; }
.vhead-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); font-size: 14px; }
.banner p { margin: 0; flex: 1 1 260px; min-width: 0; color: var(--ink-2); }
.banner.warn { border-color: var(--t); background: var(--t-soft); }
.banner.warn .ic { color: var(--t); }

/* ---------- Stat tiles ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { padding: 16px 18px 15px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.kpi-label { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.kpi-label .ic { color: var(--accent); }
.kpi-value { font: 650 40px/1.05 var(--body); letter-spacing: -.02em; color: var(--ink); }
.kpi-sub { font-size: 13px; color: var(--muted); }

/* ---------- Charts ---------- */
.charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.chart { padding: 16px 18px 12px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.ch-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 6px 16px; }
.ch-head h2 { margin: 0; font-size: 16px; font-weight: 700; }
.ch-head p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 2px 0 0; padding: 0; list-style: none; font-size: 12.5px; color: var(--ink-2); }
.legend li { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.sw.a { background: var(--viz-1); }
.sw.b { background: var(--viz-2); }
.ch-body { position: relative; min-height: 210px; border-radius: 6px; }
.ch-body svg { display: block; width: 100%; height: auto; overflow: visible; }
.ch-body:focus-visible { outline-offset: 4px; }
.ch-empty { position: absolute; inset: 0 0 28px 36px; display: grid; place-items: center; margin: 0; font-size: 13px; color: var(--muted); pointer-events: none; }
.viz-grid { stroke: var(--line); stroke-width: 1; shape-rendering: crispEdges; }
.viz-base { stroke: var(--line-2); stroke-width: 1; shape-rendering: crispEdges; }
.viz-tick { fill: var(--muted); font: 500 11px/1 var(--body); font-variant-numeric: tabular-nums; }
.viz-line { fill: none; stroke: var(--viz-1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.viz-area { fill: var(--viz-1); opacity: .1; }
.viz-dot { fill: var(--viz-1); stroke: var(--surface); stroke-width: 2; }
.viz-end { fill: var(--ink); font: 650 12px/1 var(--body); font-variant-numeric: tabular-nums; }
.viz-cross { stroke: var(--line-2); stroke-width: 1; shape-rendering: crispEdges; }
.viz-a { fill: var(--viz-1); }
.viz-b { fill: var(--viz-2); }
.viz-band { fill: var(--surface-2); opacity: 0; }
.viz-band.on { opacity: 1; }
.viz-hit { fill: transparent; cursor: default; }
.viz-hit:focus { outline: none; }
.viz-hit:focus-visible { stroke: var(--accent); stroke-width: 2; }
.tip {
  position: absolute; z-index: 3; pointer-events: none; min-width: 150px; max-width: 240px;
  padding: 8px 10px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line);
  box-shadow: var(--shadow-2); font-size: 12.5px;
}
.tip-title { color: var(--muted); font-size: 12px; margin-bottom: 4px; white-space: nowrap; }
.tip-row { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.tip-row b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.tip-row span:last-child { color: var(--ink-2); }
.tip-key { width: 12px; height: 2px; border-radius: 1px; flex: none; }
.tip-key.a { background: var(--viz-1); }
.tip-key.b { background: var(--viz-2); }
details.tv { font-size: 13px; }
details.tv summary { cursor: pointer; color: var(--accent); font-weight: 600; width: fit-content; }
details.tv table { margin-top: 8px; }

/* ---------- Tables ---------- */
.tablecard { overflow: hidden; }
.tc-head { padding: 16px 18px 12px; }
.tc-head h2 { margin: 0; font-size: 16px; font-weight: 700; }
.tc-head p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.dt { width: 100%; border-collapse: collapse; font-size: 14px; }
.dt th {
  text-align: left; padding: 8px 12px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  background: var(--surface-2); font: 600 11px/1.25 var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted);
}
.dt td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.dt tbody tr:last-child td { border-bottom: 0; }
.dt th:first-child, .dt td:first-child { padding-left: 18px; }
.dt th:last-child, .dt td:last-child { padding-right: 14px; }
.dt .n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dt .when { white-space: nowrap; }
.dt td.act { width: 1%; text-align: right; padding-top: 6px; padding-bottom: 6px; }
.who { min-width: 0; }
.who b { font-weight: 600; overflow-wrap: anywhere; }
.who small, .dt small { display: block; color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
.badge { display: inline-block; margin-left: 2px; padding: 1px 7px; border-radius: 999px; font: 700 10.5px/1.6 var(--body); letter-spacing: .02em; vertical-align: 1px; white-space: nowrap; background: var(--u-soft); color: var(--muted); }
.badge.you { background: var(--accent-soft); color: var(--accent); }
.tv-table { border-collapse: collapse; font-size: 13px; }
.tv-table th, .tv-table td { padding: 4px 14px 4px 0; text-align: left; border-bottom: 1px solid var(--line); }
.tv-table th { color: var(--muted); font-weight: 600; }
.tv-table .n { text-align: right; font-variant-numeric: tabular-nums; }
.empty-row td { color: var(--muted); text-align: center; padding: 22px 12px; }

/* ---------- Hidden accounts, notes, states ---------- */
.hidebox { padding: 0; }
.hidebox summary { padding: 14px 18px; cursor: pointer; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.hidebox .cnt { min-width: 22px; height: 22px; padding: 0 7px; border-radius: 999px; display: inline-grid; place-items: center; background: var(--u-soft); color: var(--ink-2); font: 700 12px/1 var(--body); }
.hb-body { padding: 0 18px 14px; }
.hlist { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; }
.hlist li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.hlist li span { min-width: 0; overflow-wrap: anywhere; }
.notes { padding: 16px 18px; }
.notes h2 { margin: 0 0 6px; font-size: 15px; font-weight: 700; }
.notes ul { margin: 0; padding-left: 20px; color: var(--ink-2); font-size: 13.5px; }
.notes li { margin: 4px 0; }
.small { font-size: 13px; color: var(--muted); }
.state { max-width: 640px; margin: 4vh auto 0; padding: 26px 26px 24px; display: flex; flex-direction: column; gap: 14px; }
.state h1 { margin: 0; font-family: var(--display); font-stretch: 112%; font-weight: 800; font-size: 26px; line-height: 1.15; letter-spacing: -.01em; }
.state p { margin: 0; color: var(--ink-2); }
.state p.small { color: var(--muted); }
.state-ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.state-ic svg.ic { width: 22px; height: 22px; }
.state.wait { flex-direction: row; align-items: center; gap: 14px; }
.state.wait p { font-weight: 600; }
.pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); position: relative; flex: none; margin: 0 4px; }
.pulse::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 2px solid var(--accent); animation: ping 1.4s ease-out infinite; }
@keyframes ping { from { transform: scale(.6); opacity: .9; } to { transform: scale(1.6); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .pulse::after { animation: none; } }
.steps { list-style: none; margin: 0; padding: 0; counter-reset: st; display: flex; flex-direction: column; gap: 14px; }
.steps > li { counter-increment: st; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; font-size: 14px; line-height: 1.55; color: var(--ink-2); }
.steps > li::before { content: counter(st); width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font: 700 12px/1 var(--mono); }
.steps > li > div { min-width: 0; }
.steps b { color: var(--ink); }
.idbox { margin-top: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.idbox code { font-size: 13px; padding: 6px 10px; border-radius: 8px; user-select: all; }
.noscript { max-width: 640px; margin: 40px auto; padding: 0 20px; }

@media (max-width: 960px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .charts { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 760px) {
  .page { padding-top: 18px; }
  .kpi { padding: 14px 14px 13px; }
  .kpi-value { font-size: 34px; }
  /* Each table row becomes a small card: the name across the top, the numbers below with their labels. */
  .dt thead { display: none; }
  .dt, .dt tbody { display: block; }
  .dt tr { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 12px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .dt td, .dt td:first-child, .dt td:last-child { display: block; padding: 0; border: 0; min-width: 0; }
  .dt td.main { grid-column: 1 / -1; }
  .dt td.wide { grid-column: span 2; }
  .dt td.act { grid-column: 1 / -1; width: auto; text-align: left; padding: 0; }
  .dt td.act .btn { margin-left: -10px; }
  .dt td[data-label]::before { content: attr(data-label); display: block; margin-bottom: 1px; font: 600 10.5px/1.3 var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  .dt .n { text-align: left; }
  .empty-row { display: block !important; }
  .state { padding: 22px 18px; margin-top: 0; }
}
@media (max-width: 420px) {
  .kpi-value { font-size: 30px; }
  .crumb { display: none; }
}
@media print {
  .top .btn, .vhead-actions, .act, .hidebox, details.tv summary { display: none !important; }
  .card { break-inside: avoid; }
}
</style>
</head>

<script>window.__taprollCfg={loaded:false,missing:false,error:null};window.addEventListener('error',function(e){if(e&&/config\.js/.test(e.filename||''))window.__taprollCfg.error=String(e.message||'error').replace(/^Uncaught\s+/,'');});</script>
<script src="config.js" onload="window.__taprollCfg.loaded=true" onerror="window.__taprollCfg.missing=true"></script>
<header class="top">
  <div class="top-in">
    <a class="brand" href="./" aria-label="TapRoll home"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12.8l3.4 3.4 6-7.2"/><path d="M15.8 8.4a5 5 0 0 1 0 7.2"/><path d="M18.7 5.9a8.6 8.6 0 0 1 0 12.2"/></svg></span><span>TapRoll</span></a>
    <span class="crumb">Usage</span>
    <span class="grow"></span>
    <a class="btn sm" href="app.html">Open TapRoll</a>
  </div>
</header>
<main class="page">
  <div class="wrap" id="root"><div class="card state wait"><span class="pulse"></span><p>Loading…</p></div></div>
  <p class="sr-only" id="live" aria-live="polite"></p>
</main>
<noscript><p class="noscript">TapRoll’s usage page needs JavaScript.</p></noscript>
<script>
(() => {
  'use strict';
  /* ============================== TapRoll usage ==============================
     How many schools, teachers and students use this TapRoll site, for the people who run it.
     Who can open it: accounts with a document at owners/<account ID>, which only the Firebase console can add
     (the Firestore rules' isSiteOwner). This page only reads:
       teachers/<uid>                               every profile (name, email, school, ws, sample, createdAt, lastActive)
       teachers/<uid>/ws/<ws>/meta                  periods and roster, to count classes and students
       teachers/<uid>/ws/<ws>/days/<date>           the last 14 days, only for teachers who used TapRoll lately
       schools/<sid>, its members and invites       School office schools, who's in them and who's invited
     Students are counted once across classes: by their school key or tag code, else by name within a school.
     Student names are never shown. Accounts and schools can be hidden from the counts (test accounts); that
     choice is kept in this browser (HIDE_KEY). */
  const FIREBASE_VERSION = '12.19.0';
  const FIREBASE_CDN = `https://cdn.jsdelivr.net/npm/firebase@${FIREBASE_VERSION}/`;
  const HIDE_KEY = 'taproll.usage.hidden.v1';
  const DAY = 86400000;
  const ACTIVE_DAYS = 7;   // "active" = opened TapRoll within this many days (profile lastActive)
  const CHART_DAYS = 14;   // attendance shown per day
  const REFRESH_AFTER = 10 * 60000;   // coming back to the tab after this long loads the numbers again
  const TAP = { nfc: 1, usb: 1, link: 1 };   // attendance marks that came from a tag (Web NFC, USB reader, iPhone tag link)
  const STATUS = { P: 1, T: 1, A: 1, E: 1 };
  const ROLES = { admin: 'Admin', registrar: 'Registrar', teacher: 'Teacher' };

  const ICONS = {
    school: '<path d="M3.5 20h17"/><path d="M5.5 20v-9.2L12 6.5l6.5 4.3V20"/><path d="M10 20v-4.2h4V20"/><path d="M12 6.5V3.5h3.2"/><circle cx="12" cy="11.4" r="1.5"/>',

  const isObj = (v) => !!v && typeof v === 'object' && !Array.isArray(v);

  const normKey = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  const fmt = (n) => { n = Number(n) || 0; return n >= 100000 ? new Intl.NumberFormat('en-US', { notation: 'compact', maximumFractionDigits: 1 }).format(n) : n.toLocaleString('en-US'); };
  const plural = (n, one, many) => `${fmt(n)} ${n === 1 ? one : (many || one + 's')}`;

  const dayKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseDay = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };

  function ago(ms, now) {

  /* ----- Test accounts hidden from the counts (this browser) ----- */
  function readHidden() {

  }

  /* ----- Firebase (the same settings and SDK as app.html) ----- */
  function readConfig() {
    let c = null;
    try { c = window.TAPROLL_FIREBASE || null; } catch (e) { c = null; }
    // eslint-disable-next-line no-undef
    if (!c) { try { c = typeof firebaseConfig !== 'undefined' ? firebaseConfig : null; } catch (e) { c = null; } }
    if (!isObj(c)) return null;
    const filled = ['apiKey', 'authDomain', 'projectId'].every((k) => typeof c[k] === 'string' && c[k].trim() && !/^(paste|your)/i.test(c[k].trim()));
    return filled ? c : null;
  }
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const el = document.createElement('script');
      el.src = src;
      el.async = false;
      el.onload = () => resolve();
      el.onerror = () => reject(new Error(`Couldn’t load ${src}`));
      document.head.appendChild(el);
    });
  }
  async function loadFirebase() {
    const work = (async () => {
      if (!(window.firebase && window.firebase.initializeApp)) await loadScript(FIREBASE_CDN + 'firebase-app-compat.js');
      const jobs = [];
      if (!window.firebase.auth) jobs.push(loadScript(FIREBASE_CDN + 'firebase-auth-compat.js'));
      if (!window.firebase.firestore) jobs.push(loadScript(FIREBASE_CDN + 'firebase-firestore-compat.js'));
      await Promise.all(jobs);
    })();
    let timer;

    try { await Promise.race([work, timeout]); } finally { clearTimeout(timer); }

  /* ----- What the page is showing ----- */
  // phase: loading, nocloud, cfgerror, fberror, signedout, checking, notowner, rules, counting, error, ready
  const S = { phase: 'loading', user: null, data: null, err: '', refreshErr: '', loadedAt: 0, busy: false, gen: 0 };
  let auth = null, fs = null, V = null;

  /* ----- Reading Firestore ----- */
  function normTeacher(uid, d) {
    return {
      uid, name: str(d.name, 80) || str(d.teacher, 80), email: str(d.email, 120), school: str(d.school, 80),
      schoolId: str(d.schoolId, 40), ws: str(d.ws, 40), sample: d.sample === true,
      createdAt: tsMs(d.createdAt), lastActive: tsMs(d.lastActive),
      periods: 0, students: {}, days: {}, failed: false
    };
  }
  function normStudents(map) {
    const out = {};
    if (!isObj(map)) return out;
    for (const [id, s] of Object.entries(map)) {
      if (!isObj(s)) continue;   // null marks a removed student
      out[id] = {
        id, first: str(s.first, 40), last: str(s.last, 40),
        code: (typeof s.sk === 'string' && s.sk) || (typeof s.token === 'string' && s.token) || '',
        tagged: (typeof s.token === 'string' && !!s.token) || (Array.isArray(s.uids) && s.uids.some((x) => typeof x === 'string' && x))
      };
    }
    return out;
  }
  const countPeriods = (map) => (isObj(map) ? Object.values(map).filter(isObj).length : 0);
  function normDay(per) {
    const out = {};
    if (!isObj(per)) return out;
    for (const [pid, marks] of Object.entries(per)) {
      if (!isObj(marks)) continue;
      const m = {};
      for (const [sid, mk] of Object.entries(marks)) if (isObj(mk) && STATUS[mk.s]) m[sid] = { s: mk.s, m: String(mk.m || 'manual') };
      out[pid] = m;
    }
    return out;
  }
  async function pool(jobs, size) {
    let next = 0;
    const worker = async () => { while (next < jobs.length) { const job = jobs[next++]; await job(); } };
    await Promise.all(Array.from({ length: Math.min(size, jobs.length) }, worker));
  }
  async function fetchAll(onProgress) {
    const now = Date.now();
    // Firestore bills each query at least one read, plus one for the owner check in the rules.
    let reads = 0;
    const billed = (n) => { reads += Math.max(1, n) + 1; };
    const [tq, sq] = await Promise.all([fs.collection('teachers').get(), fs.collection('schools').get()]);
    billed(tq.size); billed(sq.size);
    const teachers = tq.docs.map((d) => normTeacher(d.id, d.data() || {}));
    const schools = sq.docs.map((d) => {
      const x = d.data() || {};
      return { id: d.id, name: str(x.name, 80), createdAt: tsMs(x.createdAt), members: [], invites: 0, failed: false };
    });
    const since = lastDays(CHART_DAYS, now)[0], today = dayKey(new Date(now));
    const jobs = [];
    for (const s of schools) {
      jobs.push(() => fs.collection(`schools/${s.id}/members`).get().then((q) => {
        billed(q.size);
        s.members = q.docs.map((d) => { const m = d.data() || {}; return { uid: d.id, role: ROLES[m.role] ? m.role : 'teacher' }; });
      }, () => { s.failed = true; }));
      jobs.push(() => fs.collection(`schools/${s.id}/invites`).get().then((q) => { billed(q.size); s.invites = q.size; }, () => { s.invites = 0; }));
    }
    for (const t of teachers) {
      if (!t.ws) continue;   // never added a class or a student
      const base = `teachers/${t.uid}/ws/${t.ws}`;
      jobs.push(() => fs.collection(`${base}/meta`).get().then((q) => {
        billed(q.size);
        for (const d of q.docs) {
          const x = d.data() || {};
          if (d.id === 'periods') t.periods = countPeriods(x.periods);
          if (d.id === 'roster') t.students = normStudents(x.students);
        }
      }, () => { t.failed = true; }));
      // Attendance only for teachers who opened TapRoll in the chart's window: taking attendance updates lastActive.
      if (!t.sample && t.lastActive && now - t.lastActive < (CHART_DAYS + 1) * DAY) {
        const dayQuery = fs.collection(`${base}/days`).where(window.firebase.firestore.FieldPath.documentId(), '>=', since);
        jobs.push(() => dayQuery.get().then((q) => {
          billed(q.size);
          for (const d of q.docs) if (d.id <= today) t.days[d.id] = normDay((d.data() || {}).periods);
        }, () => { t.failed = true; }));
      }
    }
    let done = 0;
    const wrapped = jobs.map((job) => async () => { await job(); done++; if (onProgress) onProgress(done, jobs.length); });
    await pool(wrapped, 12);
    return { at: now, teachers, schools, reads };
  }

  /* ----- Working out the numbers ----- */
  function compute(data) {
    const now = data.at;
    const chartDays = lastDays(CHART_DAYS, now);
    const recent = new Set(lastDays(ACTIVE_DAYS, now));
    const activeSince = startOfDay(now) - (ACTIVE_DAYS - 1) * DAY;

    // School office schools, and who is in each.
    const memberOf = new Map();
    for (const s of data.schools) for (const m of s.members) {
      if (!memberOf.has(m.uid)) memberOf.set(m.uid, []);
      memberOf.get(m.uid).push({ sid: s.id, role: m.role });
    }
    const schoolById = new Map(data.schools.map((s) => [s.id, s]));
    const sidByName = new Map();
    [...data.schools].sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)).forEach((s) => {
      const k = normKey(s.name);
      if (k && !sidByName.has(k)) sidByName.set(k, s.id);
    });

    const schools = new Map();
    for (const s of data.schools) {
      schools.set('s:' + s.id, {
        key: 's:' + s.id, office: true, name: s.name || 'Unnamed school', since: s.createdAt,
        members: s.members.length, invites: s.invites, failed: s.failed, people: [], students: new Set()
      });
    }

    // Each account: its school (joined in TapRoll, or the name typed in Settings), role and counts.
    const teachers = [...data.teachers].sort((a, b) => (a.createdAt || Infinity) - (b.createdAt || Infinity)).map((t) => {
      const ms = memberOf.get(t.uid) || [];
      const m = ms.find((x) => x.sid === t.schoolId) || ms[0] || null;
      let skey = '', sname = '', joined = false;
      if (m) { skey = 's:' + m.sid; sname = (schoolById.get(m.sid) || {}).name || t.school; joined = true; }
      else {
        const k = normKey(t.school);
        if (k) { const sid = sidByName.get(k); skey = sid ? 's:' + sid : 'n:' + k; sname = sid ? (schoolById.get(sid).name || t.school) : t.school; }
      }
      const role = m ? m.role : '';
      // An admin or registrar with no classes of their own runs the School office rather than teaching in TapRoll.
      const office = (role === 'admin' || role === 'registrar') && t.periods === 0;
      return { ...t, role, office, skey, sname, joined, hidden: hidden.t.has(t.uid), active: t.lastActive >= activeSince, nStudents: 0, nTagged: 0, taps14: 0 };
    });
    for (const t of teachers) {
      if (!t.skey) continue;
      let s = schools.get(t.skey);
      if (!s) {
        s = { key: t.skey, office: false, name: t.sname || 'Unnamed school', since: t.createdAt, members: 0, invites: 0, failed: false, people: [], students: new Set() };
        schools.set(t.skey, s);
      }
      s.people.push(t);
    }

    // Students, once each: by school key or tag code, else by name within the school (or the teacher's own classes).
    // A student typed by name in one class is the same student as a tagged one with that name in the same school.
    const scopeOf = (t) => t.skey || 't:' + t.uid;
    const codeByName = new Map();
    for (const t of teachers) {
      if (t.hidden || t.sample) continue;
      for (const st of Object.values(t.students)) {
        const nk = st.code && normKey(`${st.first} ${st.last}`);
        if (nk && !codeByName.has(`${scopeOf(t)}:${nk}`)) codeByName.set(`${scopeOf(t)}:${nk}`, 'c:' + st.code);
      }
    }
    const keyOf = (t, st) => {
      if (st.code) return 'c:' + st.code;
      const nk = normKey(`${st.first} ${st.last}`);
      if (!nk) return `i:${t.uid}:${st.id}`;
      const scoped = `${scopeOf(t)}:${nk}`;
      return codeByName.get(scoped) || 'n:' + scoped;
    };
    const all = new Set(), tagged = new Set(), tapped = new Set();
    const days = new Map(chartDays.map((k) => [k, { date: k, taps: 0, hand: 0 }]));
    let taps7 = 0, hand7 = 0;
    for (const t of teachers) {
      if (t.hidden || t.sample) continue;
      const keys = {};
      const sch = t.skey ? schools.get(t.skey) : null;
      for (const st of Object.values(t.students)) {
        const k = keyOf(t, st);
        keys[st.id] = k;
        all.add(k);
        t.nStudents++;
        if (st.tagged) { tagged.add(k); t.nTagged++; }
        if (sch) sch.students.add(k);
      }
      for (const [date, per] of Object.entries(t.days)) {
        const day = days.get(date);
        if (!day) continue;
        const inWeek = recent.has(date);
        for (const marks of Object.values(per)) {
          for (const [sid, mk] of Object.entries(marks)) {
            if (mk.m === 'demo') continue;
            if (TAP[mk.m]) {
              day.taps++; t.taps14++;
              if (inWeek) { taps7++; if (keys[sid]) tapped.add(keys[sid]); }
            } else { day.hand++; if (inWeek) hand7++; }
          }
        }
      }
    }

    const counted = teachers.filter((t) => !t.hidden);
    const teaching = counted.filter((t) => !t.office);
    const schoolList = [...schools.values()];
    for (const s of schoolList) {
      const people = s.people.filter((t) => !t.hidden);
      s.hidden = hidden.s.has(s.key);
      s.nTeachers = people.filter((t) => !t.office).length;
      s.nActive = people.filter((t) => t.active).length;
      // A school counts while someone counted is in it (a School office school we know nobody in still counts).
      s.allHidden = s.people.length > 0 && people.length === 0;
      s.counted = !s.hidden && !s.allHidden;
    }
    const shownSchools = schoolList.filter((s) => s.counted)
      .sort((a, b) => (b.nTeachers - a.nTeachers) || (b.students.size - a.students.size) || a.name.localeCompare(b.name));

    // Teachers signed up, as a running total by day.
    const dated = teaching.map((t) => t.createdAt).filter((x) => x > 0).sort((a, b) => a - b);
    let signups = [];
    if (dated.length) {
      const perDay = new Map();
      for (const ms of dated) { const k = dayKey(new Date(Math.min(ms, now))); perDay.set(k, (perDay.get(k) || 0) + 1); }
      let total = 0;
      signups = daysBetween(Math.min(dated[0], startOfDay(now) - (CHART_DAYS - 1) * DAY), now)
        .map((k) => { const added = perDay.get(k) || 0; total += added; return { date: k, added, total }; });
    }

    const byRecent = (a, b) => (b.lastActive - a.lastActive) || (b.createdAt - a.createdAt);
    return {
      now, reads: data.reads,
      kpi: {
        schools: shownSchools.length, schoolsActive: shownSchools.filter((s) => s.nActive > 0).length,
        teachers: teaching.length, teachersActive: teaching.filter((t) => t.active).length, offices: counted.length - teaching.length,
        students: all.size, tagged: tagged.size, tapped: tapped.size, taps7, hand7
      },
      teachers: counted.sort(byRecent),
      hiddenTeachers: teachers.filter((t) => t.hidden),
      schools: shownSchools,
      hiddenSchools: schoolList.filter((s) => s.hidden || s.allHidden),
      failedTeachers: counted.filter((t) => t.failed).length,
      failedSchools: shownSchools.filter((s) => s.failed).length,
      signups, undated: teaching.length - dated.length,
      days: [...days.values()]
    };
  }

  /* ----- Rendering ----- */
  function render() {
    const root = $('#root');
    root.classList.toggle('is-refreshing', S.phase === 'ready' && S.busy);
    if (S.phase === 'ready' && S.data) {
      V = compute(S.data);
      root.innerHTML = readyHtml();
      drawCharts(true);
      return;
    }
    V = null;
    root.innerHTML = stateHtml();
  }
  const stateCard = (icon, title, body) => `<section class="card state"><div class="state-ic">${ic(icon)}</div><h1>${esc(title)}</h1>${body}</section>`;
  function ownerSteps(withRules) {
    const uid = S.user ? S.user.uid : '';
    return `<ol class="steps">`
      + (withRules ? `<li><div><b>Paste the latest Firestore rules.</b> In TapRoll, open <b>Settings</b>. Under <b>Data</b>, choose <b>Setup guide and Firestore rules</b>, copy the rules in step 6, paste them in Firebase under <b>Firestore Database › Rules</b>, and click <b>Publish</b>.</div></li>` : '')
      + `<li><div>Open <a href="https://console.firebase.google.com" target="_blank" rel="noopener">console.firebase.google.com</a>, choose your TapRoll project, then <b>Firestore Database › Data</b>.</div></li>`
      + `<li><div>Click <b>Start collection</b> and name it <code>owners</code>. If <code>owners</code> is already there, open it and click <b>Add document</b>.</div></li>`
      + `<li><div>For the <b>Document ID</b>, paste your TapRoll account ID:<div class="idbox"><code id="uid-code">${esc(uid)}</code><button type="button" class="btn sm" data-act="copy-uid">${ic('copy')} Copy</button></div></div></li>`
      + `<li><div>Add one field so Firebase can save it: field <code>name</code>, type <b>string</b>, value your name. Click <b>Save</b>.</div></li>`
      + `<li><div>Come back here and <button type="button" class="linkbtn" data-act="recheck">check again</button>.</div></li></ol>`;
  }
  function stateHtml() {
    const who = S.user && S.user.email ? `You’re signed in as <b>${esc(S.user.email)}</b>.` : 'You’re signed in.';
    switch (S.phase) {
      case 'nocloud':
        return stateCard('cloud', 'No cloud accounts to count', '<p>This TapRoll site saves accounts on each device, so there’s nothing here to count. Accounts saved on a device stay in that browser.</p><p class="small">To turn on cloud accounts, open TapRoll and choose <b>How cloud sign-in works</b> on the sign-in page.</p><div class="row"><a class="btn" href="app.html">Open TapRoll</a></div>');
      case 'cfgerror':
        return stateCard('alert', 'config.js has a mistake', `<p>${esc(S.err)}. Paste only the <code>firebaseConfig</code> block from Firebase into <code>config.js</code>.</p>`);
      case 'fberror':
        return stateCard('alert', 'Firebase didn’t load', '<p>Check your connection, then try again.</p><div class="row"><button type="button" class="btn primary" data-act="reload">Try again</button></div>');
      case 'signedout':

  /* ----- Charts: hand-drawn SVG, sized from each card's width ----- */
  function yScale(maxVal) {
    const m = Math.max(1, maxVal), raw = m / 4;
    const p = Math.pow(10, Math.floor(Math.log10(raw)));
    let step = [1, 2, 2.5, 5, 10].map((x) => x * p).find((s) => s >= raw) || 10 * p;
    step = Math.max(1, Math.ceil(step));

        tip.style.top = `${Math.max(0, y - h / 2)}px`;

      hide() { tip.hidden = true; }

  const H = 210;
  function drawSignups(host) {
    const s = V.signups;
    host.innerHTML = '';
    const W = Math.max(260, host.clientWidth);
    const m = { l: 34, r: 40, t: 14, b: 28 };
    const pw = W - m.l - m.r, ph = H - m.t - m.b;
    const n = s.length;
    const { top, ticks } = yScale(n ? s[n - 1].total : 0);
    const x = (i) => m.l + (n <= 1 ? pw : (i / (n - 1)) * pw);
    const y = (v) => m.t + ph - (v / top) * ph;
    let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">`;
    for (const v of ticks) {
      svg += `<line class="${v ? 'viz-grid' : 'viz-base'}" x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/>`;
      svg += `<text class="viz-tick" x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${tickText(v)}</text>`;
    }
    if (n) {
      // Dates along the bottom: as many as fit, always including today.
      const maxLabels = Math.max(2, Math.floor(pw / 64));
      const every = Math.max(1, Math.ceil((n - 1) / (maxLabels - 1)));
      for (let i = n - 1; i >= 0; i -= every) {
        const anchor = i === n - 1 ? 'end' : (i - every < 0 && i < every / 2 ? 'start' : 'middle');
        svg += `<text class="viz-tick" x="${x(i)}" y="${H - 8}" text-anchor="${anchor}">${esc(fmtDayKey(s[i].date))}</text>`;
      }
      const pts = s.map((p, i) => `${x(i).toFixed(1)},${y(p.total).toFixed(1)}`);
      if (n > 1) {
        svg += `<path class="viz-area" d="M${pts.join('L')}L${x(n - 1).toFixed(1)},${y(0)}L${x(0).toFixed(1)},${y(0)}Z"/>`;
        svg += `<path class="viz-line" d="M${pts.join('L')}"/>`;
      }
      svg += `<line class="viz-cross" id="sg-cross" x1="0" x2="0" y1="${m.t}" y2="${m.t + ph}" visibility="hidden"/>`;
      svg += `<circle class="viz-dot" cx="${x(n - 1)}" cy="${y(s[n - 1].total)}" r="4"/>`;
      svg += `<circle class="viz-dot" id="sg-dot" cx="0" cy="0" r="4" visibility="hidden"/>`;
      svg += `<text class="viz-end" x="${x(n - 1) + 8}" y="${y(s[n - 1].total) + 4}">${fmt(s[n - 1].total)}</text>`;
      svg += `<rect id="sg-hit" x="${m.l}" y="${m.t}" width="${pw}" height="${ph}" fill="transparent"/>`;
    }
    svg += '</svg>';
    host.insertAdjacentHTML('beforeend', svg);
    if (!n) { host.insertAdjacentHTML('beforeend', '<p class="ch-empty">No sign-ups yet.</p>'); return; }

    const cross = host.querySelector('#sg-cross'), dot = host.querySelector('#sg-dot');
    let cur = -1;
    const show = (i) => {
      cur = Math.max(0, Math.min(n - 1, i));
      const p = s[cur];
      cross.setAttribute('x1', x(cur)); cross.setAttribute('x2', x(cur)); cross.setAttribute('visibility', 'visible');
      dot.setAttribute('cx', x(cur)); dot.setAttribute('cy', y(p.total)); dot.setAttribute('visibility', 'visible');
      tip.show(fmtDayKey(p.date, true), [{ key: 'a', value: fmt(p.total), label: p.total === 1 ? 'teacher in all' : 'teachers in all' }, { value: p.added ? `+${fmt(p.added)}` : '0', label: 'signed up that day' }], x(cur), x(cur), y(p.total));
    };
    const hide = () => { cur = -1; tip.hide(); cross.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); };
    const hit = host.querySelector('#sg-hit');
    const fromEvent = (e) => {
      const r = host.querySelector('svg').getBoundingClientRect();
      const px = (e.clientX - r.left) * (W / r.width);
      return n <= 1 ? 0 : Math.round(((px - m.l) / pw) * (n - 1));

    host.onblur = hide;

      if (e.key in moves) { e.preventDefault(); show((cur >= 0 ? cur : n - 1) + moves[e.key]); }
      else if (e.key === 'Home') { e.preventDefault(); show(0); }
      else if (e.key === 'End') { e.preventDefault(); show(n - 1); }
      else if (e.key === 'Escape') hide();
    };
  }
  function drawTaps(host) {

    };
    let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="group" aria-label="Attendance taken each day, last 14 days">`;
    days.forEach((d, i) => { svg += `<rect class="viz-band" data-i="${i}" x="${m.l + band * i + 1}" y="${m.t}" width="${Math.max(0, band - 2)}" height="${ph}" rx="6"/>`; });
    for (const v of ticks) {
      svg += `<line class="${v ? 'viz-grid' : 'viz-base'}" x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/>`;
      svg += `<text class="viz-tick" x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${tickText(v)}</text>`;
    }
    const labelEvery = band >= 22 ? 1 : 2;
    let lastMonth = '';
    days.forEach((d, i) => {
      const cx = m.l + band * (i + 0.5), x0 = cx - bw / 2;
      const hT = (d.taps / top) * ph, hH = (d.hand / top) * ph;
      if (d.taps) svg += d.hand ? `<rect class="viz-a" x="${x0}" y="${base - hT}" width="${bw}" height="${hT}"/>` : `<path class="viz-a" d="${roundTop(x0, base - hT, bw, hT)}"/>`;
      if (d.hand) {

      tip.show(fmtDayKey(d.date, true), [{ key: 'a', value: fmt(d.taps), label: 'Tag taps' }, { key: 'b', value: fmt(d.hand), label: 'Marked by hand' }], cx - (bw / 2) * scale, cx + (bw / 2) * scale, Math.min(cy, (m.t + ph) * scale - 30));
    };
    const hide = () => { bands.forEach((b) => b.classList.remove('on')); tip.hide(); };
    host.querySelectorAll('.viz-hit').forEach((el) => {
      const i = Number(el.dataset.i);
      el.addEventListener('pointerenter', () => show(i));
      el.addEventListener('pointerdown', () => show(i));
      el.addEventListener('focus', () => show(i));
      el.addEventListener('blur', hide);
    });
    host.addEventListener('pointerleave', hide);
  }
  const drawn = new WeakMap();
  function drawCharts(force) {
    if (!V) return;
    const a = $('[data-chart="signups"]'), b = $('[data-chart="taps"]');
    for (const [el, draw] of [[a, drawSignups], [b, drawTaps]]) {
      if (!el) continue;
      const w = el.clientWidth;
      if (!force && drawn.get(el) === w) continue;
      drawn.set(el, w);
      draw(el);
    }
  }
  let resizeQueued = false;
  window.addEventListener('resize', () => {
    if (resizeQueued) return;
    resizeQueued = true;
    requestAnimationFrame(() => { resizeQueued = false; drawCharts(false); });
  });

  /* ----- Copy summary ----- */
  function summaryText() {
    const k = V.kpi;
    const date = new Date(V.now).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    return `TapRoll usage on ${date}: ${plural(k.schools, 'school')}, ${plural(k.teachers, 'teacher')} (${fmt(k.teachersActive)} active in the last 7 days), `
      + `${plural(k.students, 'student')} (${fmt(k.tapped)} tapped in during the last 7 days) and ${plural(k.taps7, 'tag tap')} in the last 7 days.`;
  }
  async function copyText(text, btn) {
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch (e) { ok = false; }
    if (!ok) {
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove();
    }
    if (btn) {
      const old = btn.innerHTML;
      btn.textContent = ok ? 'Copied' : 'Couldn’t copy';
      setTimeout(() => { if (btn.isConnected) btn.innerHTML = old; }, 1800);
    }
    live(ok ? 'Copied' : 'Couldn’t copy');
  }

  /* ----- Loading ----- */
  async function checkOwner() {
    const user = S.user;
    if (!user) return;
    const gen = ++S.gen;
    // A count still running for the last account is ignored when it finishes (its gen is old).
    S.phase = 'checking'; S.data = null; S.refreshErr = ''; S.busy = false;
    render();
    let snap;
    try { snap = await fs.doc(`owners/${user.uid}`).get(); }
    catch (err) {
      if (gen !== S.gen) return;
      S.phase = codeOf(err) === 'permission-denied' ? 'rules' : 'error';
      S.err = describe(err);
      render();
      return;
    }
    if (gen !== S.gen) return;
    if (!snap.exists) { S.phase = 'notowner'; render(); return; }
    load();
  }
  async function load() {
    if (S.busy || !S.user) return;
    const gen = S.gen;
    S.busy = true;
    if (S.phase !== 'ready') S.phase = 'counting';
    render();
    try {
      const data = await fetchAll((done, total) => {
        const el = $('#progress');
        if (el) el.textContent = `${done} of ${total}`;
      });
      if (gen !== S.gen) return;
      S.data = data; S.loadedAt = Date.now(); S.phase = 'ready'; S.refreshErr = '';
      live('Usage updated');
    } catch (err) {
      if (gen !== S.gen) return;
      console.warn('TapRoll usage: counting failed', err);
      if (S.data) S.refreshErr = describe(err);
      else { S.phase = codeOf(err) === 'permission-denied' ? 'rules' : 'error'; S.err = describe(err); }
    } finally {
      if (gen === S.gen) { S.busy = false; render(); }
    }
  }

  /* ----- Controls ----- */
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act, id = el.dataset.id || '';
    if (act === 'refresh') { if (S.phase === 'ready') load(); }
    else if (act === 'recheck') checkOwner();
    else if (act === 'reload') location.reload();
    else if (act === 'copy' && V) copyText(summaryText(), el);
    else if (act === 'copy-uid' && S.user) copyText(S.user.uid, el);
    else if (act === 'hide-t' || act === 'show-t' || act === 'hide-s' || act === 'show-s') {
      const set = act.endsWith('-t') ? hidden.t : hidden.s;
      if (act.startsWith('hide')) set.add(id); else set.delete(id);
      saveHidden();
      const open = !!($('#hidden-box') && $('#hidden-box').open);
      render();
      if (open && $('#hidden-box')) $('#hidden-box').open = true;
      live(act.startsWith('hide') ? 'Hidden from the counts' : 'Counted again');
    }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && S.phase === 'ready' && Date.now() - S.loadedAt > REFRESH_AFTER) load();
  });
  // Another tab changed which accounts are hidden.
  window.addEventListener('storage', (e) => {
    if (e.key !== HIDE_KEY) return;
    hidden = readHidden();
    if (S.phase === 'ready') render();
  });

  /* ----- Start ----- */
  async function start() {
    const c = window.__taprollCfg || {};
    const cfg = readConfig();
    if (!cfg) {
      if (c.error) { S.phase = 'cfgerror'; S.err = String(c.error); } else S.phase = 'nocloud';
      render();
      return;
    }
    try {
      await loadFirebase();
      const fb = window.firebase;
      if (!fb.apps.length) fb.initializeApp(cfg);
      auth = fb.auth();
      fs = fb.firestore();
      // For local testing only, as in app.html: { emulators: { auth: 'http://127.0.0.1:9099', firestore: '127.0.0.1:8080' } }
      const emu = isObj(cfg.emulators) ? cfg.emulators : null;
      if (emu && emu.auth) auth.useEmulator(emu.auth);
      if (emu && emu.firestore) { const mm = /^(.+):(\d+)$/.exec(String(emu.firestore)); if (mm) fs.useEmulator(mm[1], Number(mm[2])); }
    } catch (err) {
      console.warn('TapRoll usage: Firebase didn’t load', err);
      S.phase = 'fberror';
      render();
      return;
    }
    auth.onAuthStateChanged((user) => {
      const same = S.user && user && S.user.uid === user.uid;
      S.user = user ? { uid: user.uid, email: user.email || '' } : null;
      if (same) return;
      if (!user) { S.gen++; S.phase = 'signedout'; S.data = null; S.busy = false; render(); return; }
      checkOwner();
    });
  }
  start();
})();
</script>
</body>
</html>
