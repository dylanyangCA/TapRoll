    if (!kind) { el.innerHTML = ''; return; }
    el.innerHTML = `<div class="opstatus ${kind}">${kind === 'wait' ? '<span class="pulse"></span>' : ic(kind === 'ok' ? 'check' : kind === 'info' ? 'info' : 'alert')}<p>${esc(text)}</p>`
      + `${cancelable ? '<button class="btn sm" data-act="cancel-op">Cancel</button>' : ''}</div>`;
  }
  // Asks before a tag is taken from another student. Nothing changes unless the teacher picks the first button.
  function opConfirm({ text, okLabel, keepLabel, keptText, onOk }) {
    const el = $('#tag-op');
    if (!el) return;
    el.innerHTML = `<div class="opstatus warn" role="alert">${ic('alert')}<div class="op-body"><p>${esc(text)}</p>`
      + `<div class="row"><button type="button" class="btn sm primary" id="op-ok">${esc(okLabel)}</button><button type="button" class="btn sm" id="op-keep">${esc(keepLabel)}</button></div></div></div>`;
    $('#op-ok').addEventListener('click', onOk);
    $('#op-keep').addEventListener('click', () => opStatus('info', keptText));
  }
  // Other students in your classes who have this tag now, matched by its TapRoll code or its reader ID.
  function tagOwners(sid, token, code) {
    const me = S.students[sid];
    return Object.values(S.students).filter((o) => o.id !== sid && ((token && (o.token === token || (o.sk === token && !(me && me.sk === token)))) || (code && uidIn(o.uids, code))));
  }
  const namesOf = (list) => list.map(fullName).join(' and ');
  function takeWarning(owners, ifClause) {
    const names = namesOf(owners);
    const single = owners.length === 1;
    const who = single ? (owners[0].first || names) : names;
    return {
      text: `This tag belongs to ${names}. ${ifClause}, ${who} will need ${single ? 'a new tag' : 'new tags'}.`,
      keepLabel: single && owners[0].first ? `Keep it with ${owners[0].first}` : 'Cancel',
      keptText: `Nothing changed. The tag still belongs to ${names}.`
    };
  }

  // Writing a tag gives it a fresh code; whoever had that physical tag before loses it, so TapRoll asks first.
  // confirmed: the tag (serial and code) the teacher already agreed to take from another student.
  async function writeTag(sid, confirmed) {
    const st = S.students[sid];
    if (!st || !editable()) return;
    primeAudio();
    // A student a school office added keeps their school tag code, so this one tag checks them in to all of
    // their classes at the school. Anyone else gets a fresh code.
    const token = st.sk || rid(12);
    opStatus('wait', confirmed ? `Hold the same tag to the back of the phone again to write ${st.first || 'this student'}’s tag…` : `Hold a blank or old tag to the back of the phone to write ${st.first || 'this student'}’s tag…`, true);
    const sameTag = (serial, before) => !!confirmed && (confirmed.serial ? confirmed.serial === serial : (!!confirmed.token && !!before && before.token === confirmed.token));
    try {
      const res = await NFC.session(tagRecords(token), 30000, (serial, before) => sameTag(serial, before) || !tagOwners(sid, before && before.token, serial).length);
      if (res.held) {
        const fresh = S.students[sid];
        if (!fresh) return;
        const owners = tagOwners(sid, res.before && res.before.token, res.serial);
        if (!owners.length) { writeTag(sid); return; }   // the other student lost the tag meanwhile (another device)
        const w = takeWarning(owners, `If you write a new code on it for ${fullName(fresh)}`);
        beep('warn'); buzz('warn');
        opConfirm({ ...w, okLabel: 'Write it anyway', onOk: () => writeTag(sid, { serial: res.serial, token: res.before && res.before.token }) });
        return;
      }
      const changes = [];
      let prevOwner = null;
      for (const other of Object.values(S.students)) {
        if (other.id === sid) continue;
        const hadToken = !!(res.before && res.before.token && other.token === res.before.token);
        const hadUid = !!(res.serial && uidIn(other.uids, res.serial));
        if (hadToken || hadUid) {
          prevOwner = other;
          changes.push({ ...other, token: hadToken ? null : other.token, uids: res.serial ? other.uids.filter((u) => !uidIn([u], res.serial)) : other.uids });
        }
      }
      const fresh = S.students[sid];
      if (!fresh) return;
      changes.push({ ...fresh, token, uids: res.serial ? [res.serial] : [], tagAt: Date.now() });
      upsertStudents(changes);
      refreshStudent();
      const foreign = !!(res.before && res.before.token) && !prevOwner && res.before.token !== token && fresh.token !== res.before.token;
      opStatus('ok', `Tag written for ${fullName(fresh)}.${prevOwner ? ` It used to be ${fullName(prevOwner)}’s tag, so ${prevOwner.first || 'they'} will need a new one.` : ''}${fresh.sk ? ` It works in all of ${fresh.first || 'their'}${fresh.first ? '’s' : ''} classes at your school.` : ''}${foreign && !fresh.sk ? ' This tag was set up for another class before, so that class needs to link it again.' : ''}`);
      beep('present'); buzz('present');
      scheduleRender();
    } catch (err) {
      if (err && err.name === 'AbortError') { opStatus(null); return; }
      opStatus('err', tagErrorText(err));
    }
  }
  // Links a tag the student already has (for example one set up in another teacher's class) without rewriting it.
  function linkExisting(sid) {
    const st = S.students[sid];
    if (!st || !editable()) return;
    NFC.cancelBusy();
    const nfcOk = NFC.status().ok;
    const who = st.first || 'the student';
    opStatus('wait', nfcOk ? `Hold ${who}’s tag to the back of this phone, or tap it on a USB reader…` : `Tap ${who}’s tag on the USB reader now…`, true);
    let done = false;
    const finish = (found) => {
      if (done) return;
      done = true;
      Wedge.capture = null;
      NFC.cancelBusy();
      applyLink(sid, found);
    };
    Wedge.capture = (code) => finish({ uid: code });
    if (nfcOk) {
      NFC.session(null)
        .then((res) => finish({ serial: res.serial, token: res.before && res.before.token }))
        .catch((err) => {
          if (done || (err && err.name === 'AbortError')) return;
          done = true;
          Wedge.capture = null;
          opStatus('err', tagErrorText(err));
        });
    }
  }
  function applyLink(sid, found, confirmed) {
    const fresh = S.students[sid];
    if (!fresh) return;
    const code = found.uid || found.serial || null;
    const token = found.token || null;
    if (!code && !token) { opStatus('err', 'TapRoll couldn’t read an ID from that tag. Write a new tag instead.'); return; }
    if ((!token || fresh.token === token) && (!code || uidIn(fresh.uids, code))) { opStatus('ok', `That tag is already linked to ${fullName(fresh)}.`); return; }
    const owners = tagOwners(sid, token, code);
    if (owners.length && !confirmed) {
      const w = takeWarning(owners, `If you move it to ${fullName(fresh)}`);
      beep('warn'); buzz('warn');
      opConfirm({ ...w, okLabel: `Move tag to ${fresh.first || 'this student'}`, onOk: () => applyLink(sid, found, true) });
      return;
    }
    const changes = [];
    let prevOwner = null;
    for (const other of Object.values(S.students)) {
      if (other.id === sid) continue;
      const hadToken = !!(token && other.token === token);
      const hadUid = !!(code && uidIn(other.uids, code));
      if (hadToken || hadUid) {
        prevOwner = other;
        changes.push({ ...other, token: hadToken ? null : other.token, uids: code ? other.uids.filter((u) => !uidIn([u], code)) : other.uids });
      }
    }
    changes.push({ ...fresh, token: token || fresh.token, uids: code && !uidIn(fresh.uids, code) ? [...fresh.uids, code] : fresh.uids, tagAt: Date.now() });
    upsertStudents(changes);
    refreshStudent();
    opStatus('ok', `Linked this tag to ${fullName(fresh)}.${prevOwner ? ` It used to be ${fullName(prevOwner)}’s tag, so ${prevOwner.first || 'they'} will need a new one.` : ''}${token ? ' It keeps working in any other class that uses it.' : ''}`);
    beep('present');
    scheduleRender();
  }
  function confirmUnlink(sid) {
    const st = S.students[sid];
    if (!st) return;
    confirmBox({
      title: `Remove ${st.first || 'this student'}’s tag?`,
      body: 'Their current tag will stop checking them in. You can write or link a new one anytime.',
      okLabel: 'Remove tag', danger: true,
      onOk: () => { upsertStudent({ ...S.students[sid], token: null, uids: [], tagAt: null }); openStudent(sid); scheduleRender(); }
    });
  }
  function confirmDeleteStudent(sid) {
    const st = S.students[sid];
    if (!st) return;
    confirmBox({
      title: `Remove ${fullName(st)}?`,
      body: 'They’ll be taken off every roster and their tag will stop working. Past attendance stays in your backups and CSV exports made before now.',
      okLabel: 'Remove student', danger: true,
      onOk: () => { removeStudents([sid]); toast({ kind: 'info', text: `${fullName(st)} removed` }); scheduleRender(); }
    });
  }
  async function copyPayload(sid) {
    let st = S.students[sid];
    if (!st || !editable()) return;
    if (!st.token) { upsertStudent({ ...st, token: st.sk || rid(12), tagAt: Date.now() }); st = S.students[sid]; }
    const text = tagPayload(st.token).text;
    const code = $('#payload-code');
    if (code) code.textContent = text;
    try { await navigator.clipboard.writeText(text); toast({ kind: 'ok', text: 'Copied', sub: 'Paste it into your NFC writer app.' }); }
    catch (e) {
      if (code) { const r = document.createRange(); r.selectNodeContents(code); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); }
      toast({ kind: 'info', text: 'Text selected', sub: 'Copy it with your device’s copy command.' });
    }
    scheduleRender();
  }

  /* ----- Assign an unknown tag ----- */
  function openAssign(scan) {
    if (!editable()) return;
    const target = resolveTarget(null);
    const pid = target.pid || (S.periods[ui.periodId] ? ui.periodId : null);
    const pool = pid ? rosterOf(pid) : Object.values(S.students).sort(byName);
    pool.sort((a, b) => (a.token || a.uids.length ? 1 : 0) - (b.token || b.uids.length ? 1 : 0) || byName(a, b));
    const label = scan.uid || scan.serial || scan.token || '';
    openModal(`${modalHead('Link this tag', `${pid ? `Choose a student in ${periodLabel(S.periods[pid])}.` : 'Choose a student.'} Students without a tag are listed first.`)}`
      + `<div class="m-body"><p class="m-text small">Tag ID <code>${esc(label)}</code></p>`
      + `<label class="search">${ic('search')}<span class="sr-only">Search students</span><input class="input" id="assign-q" type="search" placeholder="Search" autocomplete="off"></label>`
      + `<ul class="pick" id="assign-list">${pool.map((s) => `<li data-name="${esc(fullName(s).toLowerCase())}"><button data-pick="${esc(s.id)}"><span class="av" style="--h:${hueOf(s.id)}">${esc(initials(s))}</span>${esc(fullName(s))}<small>${s.token || s.uids.length ? 'has a tag' : 'no tag'}</small></button></li>`).join('')}</ul></div>`, { label: 'Link tag' });
    $('#assign-q').addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      document.querySelectorAll('#assign-list li').forEach((li) => { li.hidden = !!q && !li.dataset.name.includes(q); });
    });
    $('#assign-list').addEventListener('click', (e) => {
      const b = e.target.closest('[data-pick]');
      if (!b) return;
      const st = S.students[b.dataset.pick];
      if (!st) return;
      const code = scan.uid || scan.serial;
      const changes = [];
      for (const other of Object.values(S.students)) {
        if (other.id === st.id) continue;
        if ((code && uidIn(other.uids, code)) || (scan.token && other.token === scan.token)) {
          changes.push({ ...other, uids: code ? other.uids.filter((u) => !uidIn([u], code)) : other.uids, token: scan.token && other.token === scan.token ? null : other.token });
        }
      }
      changes.push({ ...st, token: scan.token || st.token, uids: code && !uidIn(st.uids, code) ? [...st.uids, code] : st.uids, tagAt: Date.now() });
      upsertStudents(changes);
      closeModal();
      toast({ kind: 'ok', text: 'Tag linked', sub: fullName(st) });
      handleScan({ ...scan, source: scan.source === 'link' ? 'link' : (scan.source || 'usb') });
    });
  }

  /* ----- Tag tools ----- */
  function openTagTools() {
    const nfc = NFC.status();
    const base = hostedBase();
    openModal(`${modalHead('Tag tools', 'Write, read and test student NFC tags.')}<div class="m-body"><div class="caps">`
      + `<div class="cap ${nfc.ok ? 'ok' : 'no'}"><div class="cap-h">${ic(nfc.ok ? 'check' : 'alert')} Phone NFC</div><p>${esc(nfc.title)}. ${esc(nfc.ok ? 'Write tags from a student’s page and scan from any period.' : nfc.detail)}</p></div>`
      + `<div class="cap ok"><div class="cap-h">${ic('check')} USB reader</div><p>Plug a 13.56 MHz USB reader into this computer. Each time it types a tag ID, TapRoll checks that student in.</p></div>`
      + `<div class="cap ${base ? 'ok' : 'no'}"><div class="cap-h">${ic(base ? 'check' : 'info')} Tag links</div><p>${base ? `New tags open ${esc(base)} when tapped on a phone, so an iPhone can check students in too.` : 'Add your hosted site link in Settings so tags can open TapRoll on any phone, iPhones included.'}</p></div></div>`
      + `<div class="row"><button class="btn primary" data-act="identify-tag" ${nfc.ok ? '' : 'disabled'}>${ic('nfc')} Identify a tag</button><button class="btn" data-act="test-usb">${ic('usb')} Test USB reader</button></div>`

  function toolStatus(kind, html, cancelable) {
    const el = $('#tool-result');
    if (!el) return;
    el.innerHTML = kind ? `<div class="opstatus ${kind}">${kind === 'wait' ? '<span class="pulse"></span>' : ic(kind === 'ok' ? 'check' : kind === 'err' ? 'alert' : 'info')}<p>${html}</p>${cancelable ? '<button class="btn sm" data-act="cancel-op">Cancel</button>' : ''}</div>` : '';
  }
  async function identifyTag() {
    Wedge.capture = null;
    toolStatus('wait', 'Hold a tag to the back of the phone…', true);
    try {
      const res = await NFC.session(null);
      const b = res.before;
      const st = (b && findByToken(b.token)) || findByUid(res.serial);
      const parts = [];
      parts.push(st ? `<b>${esc(fullName(st))}</b> · ${esc(st.periods.map((id) => S.periods[id]).filter(Boolean).map(periodLabel).join(', ') || 'no period')}` : '<b>Not linked to a student.</b>');
      if (!b) parts.push('The tag was detected but its data couldn’t be read. It may be blank or an unsupported type.');
      else if (b.empty) parts.push('The tag is blank and ready to write.');
      else {
        if (b.urls.length) parts.push(`Link: ${esc(b.urls.join(', '))}`);
        if (b.texts.length) parts.push(`Text: ${esc(b.texts.join(', '))}`);
        if (b.other) parts.push(`${b.other} other record${b.other === 1 ? '' : 's'}`);
      }
      if (res.serial) parts.push(`Serial ${esc(res.serial)}`);
      toolStatus(st ? 'ok' : 'info', parts.join('<br>'));
    } catch (err) {
      if (err && err.name === 'AbortError') { toolStatus(null); return; }
      toolStatus('err', esc(tagErrorText(err)));
    }
  }
  function testUsb() {
    NFC.cancelBusy();
    toolStatus('wait', 'Tap any tag on the USB reader…', true);
    Wedge.capture = (code) => {
      const st = findByUid(code);
      toolStatus('ok', `Reader works. It typed <code>${esc(code)}</code>.<br>${st ? `That tag belongs to <b>${esc(fullName(st))}</b>.` : 'That tag isn’t linked to a student yet. Link it from the student’s page.'}`);
    };
  }

  /* ----- Settings & data ----- */

  const csvCell = (v) => { const s = String(v == null ? '' : v); return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const toCsv = (rows) => rows.map((r) => r.map(csvCell).join(',')).join('\r\n');
  const HEAD = ['Date', 'Period', 'Course', 'Last name', 'First name', 'Status', 'Time', 'How', 'Note'];
  function rowsFor(date, p) {
    const marks = marksOf(date, p.id);
    return rosterOf(p.id).map((st) => { const mk = marks[st.id]; return [date, p.num, p.course, st.last, st.first, mk ? markLabel(mk) : 'Not marked', mk ? fmtClock(mk.t) : '', mk ? (METHOD[mk.m] || mk.m) : '', mk && mk.why ? mk.why : '']; });
  }
  function exportPeriodCsv() {
    const p = S.periods[ui.periodId];

  function exportAllCsv() {
    const rows = [HEAD];
    for (const date of Object.keys(S.days).sort()) for (const p of periodList()) if (S.days[date][p.id]) rows.push(...rowsFor(date, p));
    if (rows.length === 1) { toast({ kind: 'info', text: 'Nothing to export yet', sub: 'Take attendance first.' }); return; }
    saveFile(`attendance-all-${todayStr()}.csv`, toCsv(rows));
  }
  function exportBackup() {
    const settings = { ...S.settings };
    ['ws', 'name', 'email', 'createdAt', 'sampleDate'].forEach((k) => { delete settings[k]; });
    const data = { app: 'TapRoll', version: 1, exportedAt: new Date().toISOString(), data: { settings, periods: S.periods, students: S.students, days: S.days } };
    saveFile(`taproll-backup-${todayStr()}.json`, JSON.stringify(data));
  }
  async function saveFile(filename, text) {
    const inViewer = !!(window.claude && typeof window.claude.use === 'function');
    if (inViewer) {
      try {
        const dl = await window.claude.use('downloads');
        if (dl) { await dl.save({ filename, data: text }); toast({ kind: 'ok', text: 'Saved', sub: filename }); return; }
      } catch (e) {
        if (e && e.code === 'declined') return;
        if (e && e.code === 'rate_limited') { toast({ kind: 'info', text: 'Finish the open save first' }); return; }
      }
      if (NFC.framed) { toast({ kind: 'warn', text: 'Downloads aren’t available here', sub: 'Open the hosted site to download files.' }); return; }
    }
    try {
      const type = filename.endsWith('.json') ? 'application/json' : 'text/csv';
      const url = URL.createObjectURL(new Blob([text], { type }));

  /* ============================== Spreadsheets ==============================
     Reads Excel workbooks (.xlsx) and CSV or tab-separated text in the browser, with no library.
     An .xlsx file is a zip of XML files: the zip is unpacked with the browser's DecompressionStream and the
     sheets are read with DOMParser. Every cell comes back as trimmed text. Old binary .xls files aren't supported. */
  const SHEET_MAX_ROWS = 20000, SHEET_MAX_COLS = 60;
  const sheetErr = (code) => Object.assign(new Error(code), { code });

  async function readSpreadsheet(file) {
    const name = String((file && file.name) || '').toLowerCase();
    if (file.size > 25 * 1024 * 1024) throw sheetErr('too-big');
    const bytes = new Uint8Array(await file.arrayBuffer());
    if (bytes[0] === 0x50 && bytes[1] === 0x4b) return readXlsx(bytes);   // "PK": a zip, so an Excel workbook
    if (/\.(xls|numbers|ods)$/.test(name) || (bytes[0] === 0xd0 && bytes[1] === 0xcf)) throw sheetErr('format');
    if (/\.xlsx$/.test(name)) throw sheetErr('format');
    return [{ name: file.name || 'Sheet', rows: parseDelimited(decodeText(bytes)) }];
  }

  function decodeText(bytes) {
    try { return new TextDecoder('utf-8', { fatal: true }).decode(bytes).replace(/^﻿/, ''); }
    catch (e) { return new TextDecoder('windows-1252').decode(bytes); }
  }

  // CSV, semicolon or tab separated text (what Excel puts on the clipboard), with quoted fields.
  function parseDelimited(text) {
    text = String(text || '').replace(/\r\n?/g, '\n');
    const sample = text.split('\n').slice(0, 8).join('\n').replace(/"[^"]*"/g, '');
    const count = (ch) => sample.split(ch).length - 1;
    const tabs = count('\t'), commas = count(','), semis = count(';');
    const sep = tabs && tabs >= commas / 2 ? '\t' : (semis > commas ? ';' : ',');
    const rows = [];
    let row = [], cell = '', quoted = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (quoted) {
        if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else quoted = false; }
        else cell += ch;
      } else if (ch === '"' && cell.trim() === '') { quoted = true; cell = ''; }
      else if (ch === sep) { row.push(cell.trim()); cell = ''; }
      else if (ch === '\n') { row.push(cell.trim()); rows.push(row); row = []; cell = ''; if (rows.length >= SHEET_MAX_ROWS) break; }
      else cell += ch;
    }
    if (cell !== '' || row.length) { row.push(cell.trim()); rows.push(row); }
    return rows.map((r) => r.slice(0, SHEET_MAX_COLS)).filter((r) => r.some((c) => c !== ''));
  }

  /* ----- .xlsx ----- */
  function zipIndex(bytes) {
    const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    let eocd = -1;
    for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw sheetErr('format');
    const total = dv.getUint16(eocd + 10, true);
    let p = dv.getUint32(eocd + 16, true);
    const out = new Map();
    const dec = new TextDecoder();
    for (let n = 0; n < total && p + 46 <= bytes.length; n++) {
      if (dv.getUint32(p, true) !== 0x02014b50) break;
      const method = dv.getUint16(p + 10, true);
      const size = dv.getUint32(p + 20, true);
      const nameLen = dv.getUint16(p + 28, true), extraLen = dv.getUint16(p + 30, true), commentLen = dv.getUint16(p + 32, true);
      const local = dv.getUint32(p + 42, true);
      const name = dec.decode(bytes.subarray(p + 46, p + 46 + nameLen));
      out.set(name.replace(/\\/g, '/'), { method, size, local });
      p += 46 + nameLen + extraLen + commentLen;
    }
    return out;
  }
  async function unzipEntry(bytes, entry) {
    const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    if (dv.getUint32(entry.local, true) !== 0x04034b50) throw sheetErr('format');
    const start = entry.local + 30 + dv.getUint16(entry.local + 26, true) + dv.getUint16(entry.local + 28, true);
    const data = bytes.subarray(start, start + entry.size);
    if (entry.method === 0) return data;
    if (entry.method !== 8) throw sheetErr('format');
    if (typeof DecompressionStream !== 'function') throw sheetErr('browser');
    const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }
  const xmlAll = (node, tag) => Array.from(node.getElementsByTagNameNS('*', tag));
  function parseXml(text) {
    const doc = new DOMParser().parseFromString(text, 'application/xml');
    if (doc.getElementsByTagName('parsererror').length) throw sheetErr('format');
    return doc;
  }
  // The text of a shared or inline string: its runs, without the phonetic guides some Japanese files add.
  const runText = (node) => xmlAll(node, 't').filter((t) => !(t.parentNode && t.parentNode.localName === 'rPh')).map((t) => t.textContent).join('');
  function colIndex(ref) {
    const m = /^([A-Z]+)/i.exec(ref || '');
    if (!m) return -1;
    let n = 0;
    for (const ch of m[1].toUpperCase()) n = n * 26 + (ch.charCodeAt(0) - 64);
    return n - 1;
  }
  function cellText(c, shared) {
    const t = c.getAttribute('t') || 'n';
    const v = xmlAll(c, 'v')[0];
    const raw = v ? v.textContent : '';
    if (t === 's') return shared[Number(raw)] || '';
    if (t === 'inlineStr') { const is = xmlAll(c, 'is')[0]; return is ? runText(is) : ''; }
    if (t === 'b') return raw === '1' ? 'TRUE' : 'FALSE';
    if (t === 'e') return '';
    if (t === 'n' && /^-?\d+(\.\d+)?(e[-+]?\d+)?$/i.test(raw)) {
      const num = Number(raw);
      return Number.isInteger(num) ? String(num) : String(Math.round(num * 1e9) / 1e9);
    }
    return raw;
  }
  async function readXlsx(bytes) {
    const zip = zipIndex(bytes);
    const text = async (path) => { const e = zip.get(path); return e ? new TextDecoder().decode(await unzipEntry(bytes, e)) : null; };
    const wbText = await text('xl/workbook.xml');
    if (!wbText) throw sheetErr('format');
    const wb = parseXml(wbText);
    const rels = {};
    const relText = await text('xl/_rels/workbook.xml.rels');
    if (relText) {
      for (const r of xmlAll(parseXml(relText), 'Relationship')) {
        const target = String(r.getAttribute('Target') || '');
        rels[r.getAttribute('Id')] = target.startsWith('/') ? target.slice(1) : 'xl/' + target.replace(/^\.\//, '');
      }
    }
    const shared = [];
    const ssText = await text('xl/sharedStrings.xml');
    if (ssText) for (const si of xmlAll(parseXml(ssText), 'si')) shared.push(runText(si));
    const REL_NS = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
    const sheets = [];
    const list = xmlAll(wb, 'sheet');
    for (let i = 0; i < list.length; i++) {
      const el = list[i];
      const rid = el.getAttributeNS(REL_NS, 'id') || el.getAttribute('r:id');
      const path = rels[rid] || `xl/worksheets/sheet${i + 1}.xml`;
      const xml = await text(path);
      if (!xml) continue;
      const rows = [];
      let next = 0;
      for (const r of xmlAll(parseXml(xml), 'row')) {
        const at = Number(r.getAttribute('r'));
        const ri = Number.isFinite(at) && at > 0 ? at - 1 : next;
        next = ri + 1;
        if (ri >= SHEET_MAX_ROWS) break;
        const row = [];
        let ci = 0;
        for (const c of xmlAll(r, 'c')) {
          const ref = colIndex(c.getAttribute('r'));
          if (ref >= 0) ci = ref;
          if (ci < SHEET_MAX_COLS) row[ci] = String(cellText(c, shared)).trim();
          ci++;
        }
        for (let k = 0; k < row.length; k++) if (row[k] === undefined) row[k] = '';
        rows[ri] = row;
      }
      sheets.push({ name: el.getAttribute('name') || `Sheet ${i + 1}`, rows: rows.filter((row) => row && row.some((c) => c !== '')) });
    }
    if (!sheets.length) throw sheetErr('format');
    return sheets;
  }
  function sheetErrorText(err) {
    const code = err && err.code;
    if (code === 'format') return 'TapRoll can read Excel workbooks (.xlsx) and CSV files. Save the sheet as one of those and try again.';
    if (code === 'browser') return 'This browser can’t open Excel files. Save the sheet as CSV, or copy the cells and paste them here.';
    if (code === 'too-big') return 'That file is bigger than 25 MB. Save just the sheet with the class lists and try again.';
    return 'TapRoll couldn’t read that file. Save it as .xlsx or CSV and try again.';
  }

  /* ============================== Schools ==============================
     A school links teachers so its admins and registrars can watch attendance in every class as it happens and put
     students in teachers' classes. It needs cloud accounts. The example classroom belongs to a made-up school so
     the School office can be explored without one. In Firestore:
       schools/<sid>                     { name, owner, createdAt }            owner: whoever set it up (always an admin)
       schools/<sid>/members/<uid>       { role, name, email, at }             role: admin | registrar | teacher
       schools/<sid>/invites/<email>     { email, role, byName, byEmail, at }  pending invites; joining deletes it
       invites/<sid>~<email>             { sid, email, school, role, byName, byEmail, at }   so the invited person can
                                         find invites from any school with a query on email
       teachers/<uid>.schoolId           set by the teacher when they join; it's their consent to the school's access
     A teacher's classes stay in their own space (teachers/<uid>/...). The Firestore rules let the school's admins and
     registrars read them, and change class rosters, only while the teacher is a member and has schoolId set.
     Students a school office adds get a school key (sk). It is also their school tag code, so one tag written in any
     class checks the student in to all of their classes. */
  const ROLE_LABEL = { admin: 'Admin', registrar: 'Registrar', teacher: 'Teacher' };
  const ROLE_NOTE = {
    admin: 'Sees every class, adds students, and invites or removes anyone.',
    registrar: 'Sees every class, adds students, and invites teachers.',
    teacher: 'Takes attendance in their own classes.'
  };
  const isStaffRole = (r) => r === 'admin' || r === 'registrar';
  const emailKey = (e) => String(e || '').trim().toLowerCase();
  const offSub = (u) => { if (typeof u === 'function') { try { u(); } catch (e) { /* already closed */ } } };
  const normKey = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  const nameKey = (first, last) => normKey(`${first} ${last}`);
  const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + 's')}`;
  const fmtCount = (n) => Number(n || 0).toLocaleString();

  const School = {
    kind: null, me: null,
    sid: '', name: '', owner: '', role: null, state: 'off', error: null,
    invite: null, inviteList: [], inviteState: 'idle',
    members: {}, invites: {}, membersLoaded: false,
    t: {}, date: todayStr(), passes: [], passSub: null,

  // Admins and registrars watch every member's classes live.

  /* ----- Reading a school's classes ----- */
  // One teacher's classes as the school sees them. Your own come straight from this page, so they're always current.
  function tData(uid) {
    if (uid === meUid()) {
      return { self: true, profile: S.settings, ws: Store.ws || S.settings.ws || '', periods: S.periods, students: S.students, day: S.days[School.date] || {}, status: Store.isLoaded() ? 'ready' : 'loading' };

  /* ----- Changing a teacher's roster (admins and registrars) ----- */
  // patch: { <studentId>: changes | null }. Changes to an existing student hold only the fields that change, so a
  // teacher's own edits made at the same moment aren't overwritten. A new student is a complete record.
  function writeRoster(uid, patch) {

  const dref = (p) => Cloud.fs.doc(p);

  // Email/password accounts confirm their address before joining a school or sending invites.

    catch (e) {
      if (!/continue-uri|unauthorized|invalid-continue/.test(String(e && e.code))) throw e;
      await u.sendEmailVerification();
    }
    School.verifySent = true;
  }
  async function recheckVerified() {
    const u = Cloud.auth && Cloud.auth.currentUser;
    if (!u) return false;
    await u.reload();
    const fresh = Cloud.auth.currentUser;
    if (fresh && fresh.emailVerified) { await fresh.getIdToken(true); School.me.verified = true; }
    return !!(fresh && fresh.emailVerified);
  }

  /* ----- School office view ----- */
  function schoolRailItem() {
    if (!isStaff()) return '';
    const active = ui.view === 'school';
    return `<li><button class="pitem school ${active ? 'is-active' : ''}" data-act="open-school" aria-current="${active ? 'page' : 'false'}">`
      + `<span class="pnum">${ic('school')}</span><span class="pmain"><span class="pcourse">School office</span><span class="ptime">${esc(School.name || 'Your school')}</span></span><span class="pside"></span></button></li>`;
  }
  function openSchoolView(tab) {
    if (!isStaff()) { openSchoolPanel(); return; }
    closeModal();
    ui.view = 'school'; ui.periodId = null;
    if (tab) ui.scTab = tab;
    NFC.stopScan(true);
    scheduleRender();
    window.scrollTo({ top: 0 });
  }
  // A school office account with no classes of its own opens to the School office.
  function maybeOpenOffice() {
    if (School.autoOpened || !isStaff() || !ui.ready || ui.screen !== 'app') return;
    School.autoOpened = true;
    if (pendingSchoolLink || (ui.view === 'overview' && !Object.keys(S.periods).length)) {
      pendingSchoolLink = false;
      ui.view = 'school'; ui.periodId = null;
      scheduleRender();
    }
  }
  function viewSchool() {
    const tab = ['live', 'teachers', 'students'].includes(ui.scTab) ? ui.scTab : 'live';
    const people = schoolPeople();
    const pend = Object.keys(School.invites).length;
    const tabs = [['live', 'Live', ''], ['teachers', 'People', pend ? `<b class="cnt">${pend}</b>` : ''], ['students', 'Students', '']];
    const actions = tab === 'live' ? `<button class="btn sm" data-act="sc-csv">${ic('download')} Today (CSV)</button>`
      : tab === 'teachers' ? `<button class="btn sm primary" data-act="sc-invite">${ic('plus')} Invite people</button>`
        : `<button class="btn sm" data-act="sc-import">${ic('sheet')} Import spreadsheet</button><button class="btn sm primary" data-act="sc-add">${ic('plus')} Add students</button>`;
    const head = `<header class="vhead"><div class="vhead-text"><div class="eyebrow">${esc(fmtDateLong(todayStr()))} · ${esc(ROLE_LABEL[School.role])}</div>`
      + `<h1 class="vtitle">${esc(School.name || 'School office')}</h1></div><div class="vhead-actions">${actions}</div></header>`;
    const nav = `<div class="sc-tabs" role="tablist" aria-label="School office">${tabs.map(([v, l, b]) => `<button type="button" role="tab" aria-selected="${tab === v}" data-act="sc-tab" data-v="${v}">${l}${b}</button>`).join('')}</div>`;
    const body = tab === 'teachers' ? scPeopleTab(people) : tab === 'students' ? scStudentsTab() : scLiveTab(people);
    return head + schoolBanners() + nav + body;
  }
  function schoolBanners() {
    let out = '';
    if (Session.kind === 'demo' && !ui.hideSample) {
      out += `<div class="banner">${ic('spark')}<p><b>You’re exploring an example school.</b> The teachers and students are made up, and changes stay on this device.</p>`
        + `<button class="btn sm primary" data-act="demo-signup">Create your account</button><button class="btn sm ghost" data-act="hide-sample">Keep exploring</button></div>`;
    }
    if (School.error && School.error.includes('permission-denied')) {
      out += `<div class="banner warn">${ic('alert')}<p><b>Some school data is blocked.</b> If you run this TapRoll site, paste the latest Firestore rules from the setup guide into Firebase.</p><button class="btn sm" data-act="setup-guide">Setup guide</button></div>`;
    }
    return out;
  }

  // Live: each teacher's class right now, school totals for today, and who's absent.
  function scLiveTab(people) {
    const teaching = people.filter((x) => x.role === 'teacher' || (usable(x) && dPeriods(x.d).length));
    if (!teaching.length) {
      return `<div class="empty"><h3>No teachers yet</h3><p>Invite your teachers. Once they join and add their classes, you’ll see each class fill in here as students tap in.</p>`
        + `<div class="row"><button class="btn primary" data-act="sc-invite">${ic('plus')} Invite teachers</button></div></div>`;
    }
    const rank = { now: 0, passing: 1, next: 2, done: 3, none: 4, wait: 5 };
    const rows = teaching.map((x) => ({ x, now: usable(x) ? dNow(x.d) : { kind: 'wait' } }))
      .sort((a, b) => (rank[a.now.kind] - rank[b.now.kind]) || sortName(a.x.name, b.x.name));
    let inNow = 0, inTot = 0, tardy = 0, classesNow = 0;
    const absent = new Map();
    for (const { x, now } of rows) {
      if (!usable(x)) continue;
      if ((now.kind === 'now' || now.kind === 'passing') && now.p) {
        const c = dCounts(x.d, now.p.id);
        inNow += c.P + c.T; inTot += c.total;
        if (now.kind === 'now') classesNow++;
      }
      for (const p of dPeriods(x.d)) {
        const marks = (x.d.day || {})[p.id] || {};
        for (const [sid, mk] of Object.entries(marks)) {
          const st = x.d.students[sid];
          if (!st || !st.periods.includes(p.id)) continue;
          if (mk.s === 'T') tardy++;
          if (mk.s === 'A') {
            const k = st.sk || nameKey(st.first, st.last);
            const a = absent.get(k) || { st, where: [] };
            a.where.push(`P${p.num} ${tShort(x)}`);
            absent.set(k, a);
          }
        }
      }
    }
    const kpis = `<section class="card kpis" aria-label="Today at ${esc(School.name)}">`
      + `<div class="kpi"><div class="k">Checked in now</div><div class="v">${fmtCount(inNow)}<small>of ${fmtCount(inTot)}</small></div></div>`
      + `<div class="kpi"><div class="k">Classes in session</div><div class="v">${classesNow}<small>of ${teaching.length} teachers</small></div></div>`
      + `<div class="kpi"><div class="k">Tardies today</div><div class="v">${fmtCount(tardy)}</div></div>`
      + `<div class="kpi"><div class="k">Students absent today</div><div class="v">${fmtCount(absent.size)}</div></div></section>`;
    const list = `<ul class="sc-live">${rows.map(({ x, now }) => scLiveRow(x, now)).join('')}</ul>`;
    const abs = [...absent.values()].sort((a, b) => byName(a.st, b.st));
    const absHtml = abs.length
      ? `<ul class="sc-absent">${abs.slice(0, 14).map((a) => `<li><span class="av" style="--h:${hueOf(a.st.sk || a.st.id)}">${esc(initials(a.st))}</span><span class="wname"><b>${esc(fullName(a.st))}</b><span>${esc(a.where.join(' · '))}</span></span></li>`).join('')}</ul>`
        + (abs.length > 14 ? `<p class="watch-empty">And ${abs.length - 14} more. Download today’s CSV for the full list.</p>` : '')
      : `<p class="watch-empty">No one is marked absent yet today.</p>`;
    return kpis + `<div class="ov-grid"><section aria-label="Classes right now"><div class="sect-head"><h2 class="sect">Right now</h2><span class="sect-note">${esc(fmtClock(Date.now()))} · updates as students tap in</span></div>${list}</section>`
      + `<div class="side-stack"><section><div class="sect-head"><h2 class="sect">Absent today</h2><span class="sect-note">Marked absent in any class</span></div><div class="card">${absHtml}</div></section></div></div>`;
  }
  function scLiveRow(x, now) {
    const av = `<span class="av" style="--h:${hueOf(x.uid)}">${esc(nameInitials(x.name))}</span>`;
    const who = (sub) => `<span class="sc-who"><b>${esc(x.name)}${x.you ? ' <em>(you)</em>' : ''}</b><span>${sub}</span></span>`;
    let sub = '', meter = '', phase = '';
    if (!x.d || x.d.status === 'loading') { sub = 'Loading classes…'; phase = '<span class="phase">Loading</span>'; }
    else if (x.d.status === 'denied' || x.d.status === 'error') { sub = 'TapRoll can’t open these classes right now.'; phase = '<span class="phase">No access</span>'; }
    else if (now.kind === 'none') { sub = 'No classes added yet'; phase = '<span class="phase">No classes</span>'; }
    else if (now.kind === 'done') {
      const tot = dPeriods(x.d).reduce((acc, p) => { const c = dCounts(x.d, p.id); acc.in += c.P + c.T; acc.n += c.total; acc.A += c.A; return acc; }, { in: 0, n: 0, A: 0 });
      sub = `Done for today · ${tot.A} absent`;
      meter = `<span class="sc-meter"><span class="sc-nums"><b>${fmtCount(tot.in)}</b>/${fmtCount(tot.n)} <span>checked in today</span></span></span>`;
      phase = '<span class="phase done">Done</span>';
    } else if (now.kind === 'next') {
      sub = `Next: P${esc(now.p.num)} ${esc(now.p.course)} at ${esc(fmtHMap(now.p.start))}`;
      phase = '<span class="phase">Later</span>';
    } else {
      const p = now.p, c = dCounts(x.d, p.id);
      sub = `P${esc(p.num)} · ${esc(p.course || periodLabel(p))}${p.room ? ` · Rm ${esc(p.room)}` : ''}`;
      const extra = [c.T ? `${c.T} tardy` : '', c.A ? `${c.A} absent` : '', c.E ? `${c.E} excused` : '', c.U ? `${c.U} not yet` : ''].filter(Boolean).join(' · ');
      meter = `<span class="sc-meter"><span class="bar" aria-hidden="true">${segs(c)}</span><span class="sc-nums"><b>${c.P + c.T}</b>/${c.total} <span>${esc(extra || 'everyone’s here')}</span></span></span>`;
      phase = now.kind === 'now' ? '<span class="phase now">In class</span>' : `<span class="phase">Bell ${esc(fmtHM(p.start))}</span>`;
    }
    return `<li><button class="sc-trow ${now.kind === 'now' ? 'ph-now' : ''}" data-act="sc-teacher" data-id="${esc(x.uid)}">${av}${who(sub)}${meter}${phase}</button></li>`;
  }

  // People: members with their roles, and invites that haven't been accepted yet.
  function scPeopleTab(people) {
    const rows = people.map((x) => {
      const cls = usable(x) ? dPeriods(x.d) : [];
      const nStu = usable(x) ? Object.keys(x.d.students).length : 0;
      const meta = x.role === 'teacher' || cls.length ? (usable(x) ? `${plural(cls.length, 'class', 'classes')} · ${plural(nStu, 'student')}` : (x.d && x.d.status === 'loading' ? 'Loading classes…' : 'Classes not shared')) : ROLE_NOTE[x.role];
      const tag = x.owner ? 'Owner' : ROLE_LABEL[x.role];
      const can = canManage(x);
      return `<li class="sc-prow"><span class="av" style="--h:${hueOf(x.uid)}">${esc(nameInitials(x.name))}</span>`
        + `<span class="sc-who"><b>${esc(x.name)}${x.you ? ' <em>(you)</em>' : ''}</b><span>${esc(x.email || '')}${x.email ? ' · ' : ''}${esc(meta)}</span></span>`
        + `<span class="role r-${esc(x.role)}">${esc(tag)}</span>`
        + `<span class="sc-pact">${x.role === 'teacher' || cls.length ? `<button class="btn sm" data-act="sc-teacher" data-id="${esc(x.uid)}">Classes</button>` : ''}`
        + `${can ? `<button class="btn sm ghost icon" data-act="sc-member" data-id="${esc(x.uid)}" aria-label="Manage ${esc(x.name)}">${ic('edit')}</button>` : ''}</span></li>`;
    }).join('');
    const pend = Object.entries(School.invites).map(([email, v]) => ({ email, ...v })).sort((a, b) => (b.at || 0) - (a.at || 0));
    const pendHtml = pend.length
      ? `<ul class="sc-people">${pend.map((v) => {
        const canCancel = v.role === 'teacher' || isAdmin();
        const msg = inviteMessage([v.email], v.role);
        const web = prefs.mailVia !== 'app';
        return `<li class="sc-prow"><span class="av av-pend">${ic('mail')}</span><span class="sc-who"><b>${esc(v.email)}</b><span>Invited ${v.at ? esc(fmtDay(dateStr(new Date(v.at)))) : ''}${v.byName ? ` by ${esc(v.byName)}` : ''} · not joined yet</span></span>`
          + `<span class="role r-${esc(v.role)}">${esc(ROLE_LABEL[v.role] || 'Teacher')}</span>`
          + `<span class="sc-pact"><a class="btn sm" href="${esc(composeUrl([v.email], msg.subject, msg.body))}"${web ? ' target="_blank" rel="noopener"' : ''}>${ic('mail')} Email</a>`
          + `${canCancel ? `<button class="btn sm ghost" data-act="sc-uninvite" data-email="${esc(v.email)}">Cancel</button>` : ''}</span></li>`;
      }).join('')}</ul>`
      : '<p class="watch-empty">No pending invites.</p>';
    const loading = School.kind === 'cloud' && !School.membersLoaded;
    return `<section aria-label="People"><div class="sect-head"><h2 class="sect">${loading ? 'People' : plural(people.length, 'person', 'people')}</h2><span class="sect-note">Admins and registrars see every class</span></div>`
      + `<div class="card"><ul class="sc-people">${rows || '<li class="watch-empty">Loading…</li>'}</ul></div></section>`
      + `<section aria-label="Pending invites"><div class="sect-head"><h2 class="sect">Pending invites</h2><span class="sect-note">They join by signing in with the invited email</span></div><div class="card">${pendHtml}</div></section>`;
  }
  // Admins manage anyone but the owner. Registrars can remove teachers.
  const canManage = (x) => !x.owner && !x.you && (isAdmin() || (isStaff() && x.role === 'teacher'));

  function scStudentsTab() {
    const groups = schoolStudents();
    const q = normKey(ui.scSearch);
    const shown = q ? groups.filter((g) => g.nk.includes(q) || [...g.parents].some((p) => p.includes(q))) : groups;
    const placements = groups.reduce((n, g) => n + groupClasses(g).length, 0);
    const noTag = groups.filter((g) => !g.tag).length;
    const limit = ui.scAll ? shown.length : 120;
    const tools = `<div class="rtools"><label class="search">${ic('search')}<span class="sr-only">Search students</span>`
      + `<input class="input" id="sc-search" type="search" placeholder="Search ${fmtCount(groups.length)} students" value="${esc(ui.scSearch)}" autocomplete="off"></label>`
      + `<span class="sect-note">${fmtCount(placements)} class spots · ${fmtCount(noTag)} without a tag</span></div>`;
    if (!groups.length) {
      return tools + `<div class="empty"><h3>No students yet</h3><p>Import a spreadsheet with a row for each student in each class, or add students to a class by name. Teachers can also add their own.</p>`
        + `<div class="row"><button class="btn primary" data-act="sc-import">${ic('sheet')} Import spreadsheet</button><button class="btn" data-act="sc-add">${ic('plus')} Add students</button></div></div>`;
    }
    const rows = shown.slice(0, limit).map((g) => {
      const cls = groupClasses(g);
      return `<li><button class="sc-srow" data-act="sc-student" data-key="${esc(g.key)}"><span class="av" style="--h:${hueOf(g.key)}">${esc(initials(g))}</span>`
        + `<span class="sc-who"><b>${esc(fullName(g))}</b><span>${esc(g.parents.size ? [...g.parents].join(', ') : 'No parent email')}</span></span>`
        + `<span class="sc-cls">${cls.map((c) => `<span class="ctag">P${esc(c.p.num)} ${esc(tShort(c.x))}</span>`).join('')}</span>`
        + `<span class="sc-tag ${g.tag ? 'on' : ''}" title="${g.tag ? 'Has a tag' : 'No tag yet'}">${ic('tag')}</span></button></li>`;
    }).join('');
    return tools + (shown.length ? `<div class="card"><ul class="sc-students">${rows}</ul></div>` : '<p class="feed-empty">No students match.</p>')
      + (shown.length > limit ? `<div class="row"><button class="btn" data-act="sc-all">Show all ${fmtCount(shown.length)}</button></div>` : '');
  }

  /* ----- Drawers: a teacher's classes, a student's classes ----- */
  function openSchoolTeacher(uid) {
    ui.scDrawer = { kind: 'teacher', uid, open: new Set() };
    const x = schoolPeople().find((p) => p.uid === uid);
    if (x && usable(x)) { const now = dNow(x.d); if (now.p && (now.kind === 'now' || now.kind === 'passing')) ui.scDrawer.open.add(now.p.id); }
    openModal(scTeacherHtml(uid), { cls: 'drawer', label: 'Teacher', onClose: () => { ui.scDrawer = null; } });
    bindScDrawer();
  }
  function scTeacherHtml(uid) {
    const x = schoolPeople().find((p) => p.uid === uid);
    if (!x) return `${modalHead('Not in your school anymore')}<p class="m-text">This person has left ${esc(School.name)}.</p>`;
    const head = `<div class="m-head dr-head"><span class="av" style="--h:${hueOf(x.uid)}">${esc(nameInitials(x.name))}</span>`
      + `<div class="dr-title"><h2>${esc(x.name)}${x.you ? ' (you)' : ''}</h2><p>${esc([x.email, x.owner ? 'Owner' : ROLE_LABEL[x.role]].filter(Boolean).join(' · '))}</p></div>`
      + `<button class="btn ghost icon" data-act="close-modal" aria-label="Close">${ic('x')}</button></div>`;
    let body;
    if (!x.d || x.d.status === 'loading') body = '<p class="m-text">Loading classes…</p>';
    else if (x.d.status !== 'ready') body = `<p class="m-text">TapRoll can’t open ${esc(x.name)}’s classes. They may need to join ${esc(School.name)} again.</p>`;
    else {
      const list = dPeriods(x.d);
      body = list.length ? list.map((p, i) => scPeriodSection(x, p, i === 0)).join('') : `<p class="m-text">${esc(x.name)} hasn’t added any classes yet. Once they add their periods, you can put students in them.</p>`;
    }
    const foot = canManage(x) ? `<section class="dsec"><div class="row"><button class="btn" data-act="sc-member" data-id="${esc(x.uid)}">${ic('edit')} ${isAdmin() ? 'Change role or remove' : 'Remove from school'}</button></div></section>` : '';
    return head + body + foot;
  }
  function scPeriodSection(x, p, first) {
    const c = dCounts(x.d, p.id);
    const ph = phaseOf(p);
    const marks = (x.d.day || {})[p.id] || {};
    const roster = dRoster(x.d, p.id);
    const label = ph === 'now' ? '<span class="phase now">In class</span>' : ph === 'done' ? '<span class="phase done">Done</span>' : '<span class="phase">Later</span>';
    const roll = roster.length
      ? `<ul class="sc-roll">${roster.map((st) => {
        const mk = marks[st.id];
        const s = mk ? mk.s : 'U';
        return `<li><span class="sc-rname">${esc(st.first)} <b>${esc(st.last)}</b></span><span class="pill ${s === 'U' ? 'u' : STATUS_CLS[s]}">${esc(mk ? markLabel(mk) : 'Not yet')}</span><time>${mk && (mk.s === 'P' || mk.s === 'T') ? esc(fmtClock(mk.t)) : ''}</time></li>`;
      }).join('')}</ul>`
      : '<p class="m-text small">No students in this class yet.</p>';
    const open = ui.scDrawer && ui.scDrawer.open.has(p.id);
    return `<section class="dsec${first ? ' first' : ''} sc-per"><div class="sc-phead"><span class="pnum">P${esc(p.num)}</span>`
      + `<div class="sc-ptitle"><b>${esc(p.course || periodLabel(p))}</b><span>${esc(fmtHM(p.start))}–${esc(fmtHM(p.end))}${p.room ? ` · Rm ${esc(p.room)}` : ''} · ${plural(c.total, 'student')}</span></div>${label}</div>`
      + `<div class="bar" aria-hidden="true">${segs(c)}</div><div class="legend">${legend(c, true)}</div>`
      + `<details class="sc-rollbox" data-pid="${esc(p.id)}"${open ? ' open' : ''}><summary>Roster and check-ins</summary>${roll}</details>`
      + `${isStaff() ? `<div class="row"><button class="btn sm" data-act="sc-add" data-uid="${esc(x.uid)}" data-pid="${esc(p.id)}">${ic('plus')} Add students</button></div>` : ''}</section>`;
  }
  function bindScDrawer() {
    document.querySelectorAll('#modal-root .sc-rollbox').forEach((d) => d.addEventListener('toggle', () => {
      if (!ui.scDrawer || !ui.scDrawer.open) return;
      if (d.open) ui.scDrawer.open.add(d.dataset.pid); else ui.scDrawer.open.delete(d.dataset.pid);
    }));
    const f = $('#scs-form');
    if (f) bindScStudentForm(f);
  }
  function refreshScDrawer() {
    const box = $('#modal-root .modal');
    if (!box || !ui.scDrawer) return;
    if (ui.scDrawer.kind === 'student' && box.contains(document.activeElement) && document.activeElement.matches('input, select, textarea')) return;   // don't redraw under someone typing
    const top = box.scrollTop;
    box.innerHTML = ui.scDrawer.kind === 'teacher' ? scTeacherHtml(ui.scDrawer.uid) : scStudentHtml(ui.scDrawer.key);
    box.scrollTop = top;
    bindScDrawer();
  }

  function findGroup(key) { return schoolStudents().find((g) => g.key === key) || null; }
  function openSchoolStudent(key) {
    ui.scDrawer = { kind: 'student', key, open: new Set(), pickUid: '' };
    openModal(scStudentHtml(key), { cls: 'drawer', label: 'Student', onClose: () => { ui.scDrawer = null; } });
    bindScDrawer();
  }
  function scStudentHtml(key) {
    const g = findGroup(key);
    if (!g) return `${modalHead('Student not found')}<p class="m-text">This student isn’t in any class anymore.</p>`;
    const cls = groupClasses(g);
    const head = `<div class="m-head dr-head"><span class="av" style="--h:${hueOf(g.key)}">${esc(initials(g))}</span>`
      + `<div class="dr-title"><h2>${esc(fullName(g))}</h2><p>${esc(plural(cls.length, 'class', 'classes'))} · ${g.tag ? 'has a tag' : 'no tag yet'}</p></div>`
      + `<button class="btn ghost icon" data-act="close-modal" aria-label="Close">${ic('x')}</button></div>`;
    const today = (x, st, p) => { const mk = ((x.d.day || {})[p.id] || {})[st.id]; return mk ? `<span class="pill ${STATUS_CLS[mk.s]}">${esc(markLabel(mk))}</span>` : '<span class="pill u">Not yet</span>'; };
    const rows = cls.map(({ x, st, p }) => `<li><span class="pnum">P${esc(p.num)}</span><span class="sc-who"><b>${esc(p.course || periodLabel(p))}</b><span>${esc(x.name)} · ${esc(fmtHM(p.start))}–${esc(fmtHM(p.end))}</span></span>${today(x, st, p)}`
      + `<button class="btn sm ghost icon" data-act="sc-unplace" data-key="${esc(g.key)}" data-uid="${esc(x.uid)}" data-sid="${esc(st.id)}" data-pid="${esc(p.id)}" aria-label="Remove from P${esc(p.num)} ${esc(p.course)}">${ic('x')}</button></li>`).join('');
    const teachers = schoolPeople().filter((x) => usable(x) && dPeriods(x.d).length);
    const pick = ui.scDrawer && ui.scDrawer.pickUid && teachers.find((x) => x.uid === ui.scDrawer.pickUid) ? ui.scDrawer.pickUid : (teachers[0] ? teachers[0].uid : '');

    const addForm = teachers.length

  /* ----- Putting students in classes ----- */
  // items: [{ first, last, parents, group (optional school group), places: [{ uid, pid }] }]
  // Each student keeps one school key in every class, so one tag works in all of them. Returns counts.
  async function applyPlacements(items) {
    const groups = schoolStudents();
    const byNk = new Map();
    for (const g of groups) if (!byNk.has(g.nk)) byNk.set(g.nk, g);
    const claimed = new Set();
    const patches = new Map();   // uid -> { sid: changes }
    // students: how many were placed; added: class spots filled; same: spots they already had.
    const res = { students: 0, added: 0, same: 0, failed: 0, errors: [] };
    const patchFor = (uid) => { if (!patches.has(uid)) patches.set(uid, {}); return patches.get(uid); };
    const people = schoolPeople();
    // Each roster indexed once by school key and by name, so big imports stay quick.
    const index = new Map();
    const rosterIndex = (x) => {
      if (!index.has(x.uid)) {
        const bySk = new Map(), byNk = new Map();
        for (const st of Object.values(x.d.students)) {
          if (st.sk) bySk.set(st.sk, st);
          const k = nameKey(st.first, st.last);
          byNk.set(k, [...(byNk.get(k) || []), st]);
        }
        index.set(x.uid, { bySk, byNk });
      }
      return index.get(x.uid);
    };
    for (const it of items) {
      let g = it.group || byNk.get(nameKey(it.first, it.last)) || null;
      if (g && !it.group && claimed.has(g.key)) g = null;   // another student in this list with the same name
      if (g) claimed.add(g.key);
      const sk = groupSk(g);
      // Give the student's other classes the same school key, so a tag written anywhere works everywhere.
      if (g) for (const { x, st } of g.entries) if (st.sk !== sk) patchFor(x.uid)[st.id] = { ...(patchFor(x.uid)[st.id] || {}), sk };
      const byUid = new Map();
      for (const pl of it.places) byUid.set(pl.uid, [...(byUid.get(pl.uid) || []), pl.pid]);
      let placed = false;
      for (const [uid, pids] of byUid) {
        const x = people.find((p) => p.uid === uid);
        if (!x || !usable(x)) { res.failed++; res.errors.push('That teacher’s classes aren’t available.'); continue; }
        const ri = rosterIndex(x);
        const ex = ri.bySk.get(sk) || (ri.byNk.get(nameKey(it.first, it.last)) || []).find((s) => !s.sk || s.sk === sk) || null;
        const patch = patchFor(uid);
        const valid = uniq(pids.filter((pid) => x.d.periods[pid]));
        if (!valid.length) { res.failed++; res.errors.push('That class isn’t in TapRoll anymore.'); continue; }
        placed = true;
        if (ex) {
          const fresh = valid.filter((pid) => !ex.periods.includes(pid));
          const parents = uniq([...ex.parents, ...it.parents]).slice(0, 3);
          const ch = { ...(patch[ex.id] || {}) };
          if (fresh.length) ch.periods = [...ex.periods, ...fresh];
          if (parents.length !== ex.parents.length) ch.parents = parents;
          if (ex.sk !== sk) ch.sk = sk;
          res.added += fresh.length; res.same += valid.length - fresh.length;
          if (Object.keys(ch).length) patch[ex.id] = ch;
        } else {
          const rec = newStudentRec(it.first, it.last, valid, it.parents, sk);
          patch[rec.id] = rec;
          ri.bySk.set(sk, rec);
          res.added += valid.length;
        }
      }
      if (placed) res.students++;
    }
    const jobs = [...patches].map(([uid, patch]) => writeRoster(uid, patch).catch((e) => {
      res.failed++; res.errors.push(schoolErrText(e, 'adding students'));
    }));
    await Promise.all(jobs);
    return res;
  }

  /* ----- Inviting and managing people ----- */
  function inviteMessage(emails, role) {
    const link = `${autoBase() || APP_URL}#school`;
    const who = role === 'admin' ? 'an admin' : role === 'registrar' ? 'a registrar' : 'a teacher';
    const subject = `Join ${School.name} on TapRoll`;
    const body = ['Hello,', '', `I’ve invited you to join ${School.name} on TapRoll as ${who}. TapRoll takes attendance when students tap their NFC tags.`, '',
      'To join:', `1. Open ${link}`,
      `2. Sign in, or create a free account, with ${emails.length === 1 ? emails[0] : 'the email address this message was sent to'}.`,
      '3. Confirm your email address if TapRoll asks, then choose Join.', '',
      role === 'teacher' ? `Once you join, the ${School.name} office can see your classes and attendance and can add students to your class rosters.` : `Once you join, you’ll see attendance for every class at ${School.name} as it’s taken.`,
      '', 'Thank you,', meName()].filter((l) => l !== null).join('\r\n');
    return { subject, body };
  }
  function needsVerify() { return School.kind === 'cloud' && School.me && !School.me.verified; }

  function openInvite(done) {

      + (roles.length > 1 ? `<fieldset class="reasons"><legend>Role</legend><div class="sc-roles">${roles.map((r, i) => `<label class="sc-rolepick"><input type="radio" name="sci-role" value="${r}" ${i === 0 ? 'checked' : ''}><span><b>${ROLE_LABEL[r]}</b><small>${esc(ROLE_NOTE[r])}</small></span></label>`).join('')}</div></fieldset>` : `<p class="m-text small">Registrars can invite teachers. Only admins can invite registrars and admins.</p>`)

    $('#sci-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const parts = $('#sci-emails').value.split(/[\s,;]+/).map(emailKey).filter(Boolean);

      if (!parts.length) { err.textContent = 'Type at least one email address.'; err.hidden = false; return; }
      if (bad.length) { err.textContent = `“${bad[0]}” doesn’t look like an email address.`; err.hidden = false; return; }
      const list = uniq(parts);
      if (list.length > 50) { err.textContent = 'Invite up to 50 people at a time.'; err.hidden = false; return; }
      const go = $('#sci-go'); go.disabled = true; go.innerHTML = `<span class="spin" aria-hidden="true"></span>Sending…`;

      for (const email of list) {
        if (memberEmails.has(email)) { skipped.push({ email, why: `already part of ${School.name}` }); continue; }
        try { await inviteOne(email, role); ok.push({ email, role }); }
        catch (ex) {
          const denied = String((ex && ex.code) || '').includes('permission-denied');
          skipped.push({ email, why: denied ? (School.invites[email] && School.invites[email].role !== 'teacher' && !isAdmin() ? 'an admin sent this invite, so only an admin can change it' : 'Firestore didn’t allow the invite. If you run this TapRoll site, paste the latest rules from the setup guide into Firebase.') : 'couldn’t send the invite. Try again.' });
        }
      }
      schoolChanged();
      openInvite({ ok, skipped });
    });
  }

  }

  /* ----- School attendance as a spreadsheet ----- */
  function exportSchoolCsv() {
    const rows = [['Date', 'Teacher', 'Period', 'Course', 'Last name', 'First name', 'Status', 'Time', 'How', 'Note']];
    for (const x of schoolPeople()) {
      if (!usable(x)) continue;
      for (const p of dPeriods(x.d)) {
        const m = (x.d.day || {})[p.id] || {};
        for (const st of dRoster(x.d, p.id)) {
          const mk = m[st.id];
          rows.push([School.date, x.name, p.num, p.course, st.last, st.first, mk ? markLabel(mk) : 'Not marked', mk ? fmtClock(mk.t) : '', mk ? (METHOD[mk.m] || mk.m) : '', mk && mk.why ? mk.why : '']);
        }
      }
    }
    if (rows.length === 1) { toast({ kind: 'info', text: 'Nothing to download yet', sub: 'Classes appear here once teachers add them.' }); return; }
    const slug = normKey(School.name).replace(/ /g, '-') || 'school';
    saveFile(`${slug}-attendance-${School.date}.csv`, toCsv(rows));
  }

  /* ============================== Spreadsheet import ==============================
     One row per student per class. Columns are matched by their names (Teacher, Period, First name, and so on),
     and can be changed before anything is added. Nothing is saved until the office reviews the plan. */
  const IMPORT_FIELDS = [
    ['first', 'Student first name'], ['last', 'Student last name'], ['full', 'Student full name'],
    ['teacher', 'Teacher (name or email)'], ['period', 'Period'], ['course', 'Course'],
    ['parent', 'Parent email'], ['parent2', 'Second parent email'], ['sid', 'Student ID']
  ];
  const IMPORT_GUESS = {
    first: /^(student\s*)?(first|given|preferred\s*first)(\s*name)?$|^f\s*name$/,
    last: /^(student\s*)?(last|family|sur)(\s*name)?$|^surname$|^l\s*name$/,
    full: /^(student|student\s*name|name|full\s*name|student\s*full\s*name|last\s*first(\s*name)?|last\s*name\s*first\s*name|pupil)$/,
    teacher: /^(teacher|instructor|staff|educator)(\s*(name|email|e\s*mail|of\s*record|full\s*name))?$/,
    period: /^(period|per|pd|prd|block|period\s*block|class\s*period|bell|period\s*number|period\s*no|sched\s*period)$/,
    course: /^(course|class|subject|section)(\s*(name|title|description|desc))?$/,
    parent: /(parent|guardian|family|contact|mother|father|home).*(email|e\s*mail)|(email|e\s*mail).*(parent|guardian)/,
    sid: /^(student\s*)?(id|number|no|num)(\s*(number|no|num))?$|^perm(\s*id)?$|^(ssid|sis\s*id|local\s*id|student\s*id\s*number)$/
  };
  const hdrKey = (h) => String(h || '').toLowerCase().replace(/[#._:*()/\\-]+/g, ' ').replace(/\s+/g, ' ').trim();
  const colLetter = (i) => { let s = ''; let n = i + 1; while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); } return s; };
  function guessMap(header) {
    const map = {};
    const used = new Set();
    for (const [f] of IMPORT_FIELDS) {
      if (f === 'parent2') continue;
      const i = header.findIndex((h, k) => !used.has(k) && IMPORT_GUESS[f].test(hdrKey(h)));
      if (i >= 0) { map[f] = i; used.add(i); if (f === 'parent') { const j = header.findIndex((h, k) => !used.has(k) && IMPORT_GUESS.parent.test(hdrKey(h))); if (j >= 0) { map.parent2 = j; used.add(j); } } }
    }
    if (map.first != null && map.last != null) delete map.full;
    return map;
  }
  // The header row: the one among the first few that names the most known columns.
  function findHeader(rows) {
    let best = { at: -1, score: 0 };
    rows.slice(0, 10).forEach((r, i) => {
      const score = Object.keys(guessMap(r)).length;
      if (score > best.score) best = { at: i, score };
    });
    return best.score >= 2 ? best.at : -1;
  }
  function splitName(full) {
    const s = String(full || '').replace(/\s+/g, ' ').trim();
    if (s.includes(',')) { const i = s.indexOf(','); return { first: s.slice(i + 1).trim(), last: s.slice(0, i).trim() }; }
    const parts = s.split(' ');
    return parts.length > 1 ? { first: parts.slice(0, -1).join(' '), last: parts[parts.length - 1] } : { first: s, last: '' };
  }
  function personParts(n) {
    const s = bareName(n);
    if (s.includes(',')) { const i = s.indexOf(','); return { first: s.slice(i + 1).trim(), last: s.slice(0, i).trim() }; }
    const parts = s.split(/\s+/).filter(Boolean);
    return parts.length > 1 ? { first: parts.slice(0, -1).join(' '), last: parts[parts.length - 1] } : { first: '', last: parts[0] || '' };
  }
  // Finds a teacher by email, full name ("Jane Lee", "Lee, Jane") or last name ("Ms. Lee") when only one fits.
  function teacherIndex() {
    const people = schoolPeople().filter((x) => x.role === 'teacher' || (usable(x) && dPeriods(x.d).length));
    const byEmail = new Map(), byFull = new Map(), byLast = new Map();
    const add = (map, k, x) => { if (!k) return; const cur = map.get(k); if (cur === undefined) map.set(k, x); else if (cur && cur.uid !== x.uid) map.set(k, null); };
    for (const x of people) {
      if (x.email) add(byEmail, emailKey(x.email), x);
      const prof = x.d && x.d.profile;
      const names = uniq([x.name, x.m.name, prof && prof.teacher, prof && prof.name].filter(Boolean));
      for (const n of names) {
        const pp = personParts(n);
        if (pp.first) { add(byFull, normKey(`${pp.first} ${pp.last}`), x); add(byFull, normKey(`${pp.last} ${pp.first}`), x); }
        add(byLast, normKey(pp.last), x);
      }
    }
    return (val) => {
      const v = String(val || '').trim();
      if (!v) return { err: 'blank' };
      if (v.includes('@')) { const x = byEmail.get(emailKey(v)); return x ? { x } : { err: 'unknown' }; }
      const pp = personParts(v);
      const full = pp.first ? byFull.get(normKey(`${pp.first} ${pp.last}`)) : undefined;
      if (full) return { x: full };
      const last = byLast.get(normKey(pp.last));
      if (last) return { x: last };
      return { err: full === null || last === null ? 'ambiguous' : 'unknown' };
    };
  }
  function periodNum(v) {
    const s = String(v || '').trim().toLowerCase();
    if (!s) return null;
    const m = /^(?:p|per|pd|prd|period|block|blk)?\s*\.?\s*#?\s*0*(\d{1,2})(?:st|nd|rd|th)?(?!\d)/.exec(s) || /(?:period|per|pd|block)\s*#?\s*0*(\d{1,2})(?!\d)/.exec(s);
    return m ? Number(m[1]) : null;
  }
  const courseMatch = (p, v) => { const a = normKey(p.course), b = normKey(v); return !!a && !!b && (a === b || a.includes(b) || b.includes(a)); };
  function matchPeriod(d, perVal, courseVal) {
    const list = dPeriods(d);
    const num = periodNum(perVal);
    let c;
    if (num != null) c = list.filter((p) => p.num === num);
    else if (perVal) c = list.filter((p) => courseMatch(p, perVal));
    else c = list;
    if (c.length > 1 && courseVal) { const f = c.filter((p) => courseMatch(p, courseVal)); if (f.length) c = f; }
    if (!perVal && !courseVal) return { err: 'blank' };
    return c.length === 1 ? { p: c[0] } : { err: c.length ? 'ambiguous' : 'missing', num };
  }

  const imp = { step: 'pick', sheets: [], sheet: 0, header: -1, hasHeader: true, map: {}, one: { uid: '', pid: '' }, file: '', plan: null, result: null, busy: false };
  function openImport() {
    if (!isStaff()) return;
    Object.assign(imp, { step: 'pick', sheets: [], sheet: 0, header: -1, hasHeader: true, map: {}, one: { uid: '', pid: '' }, file: '', plan: null, result: null, busy: false });
    renderImport(true);
  }
  function renderImport(fresh) {
    const html = imp.step === 'pick' ? importPickHtml() : imp.step === 'done' ? importDoneHtml() : importMapHtml();
    const box = $('#modal-root .modal');
    if (!fresh && box && ui.impOpen) { box.innerHTML = html; } else { openModal(html, { cls: 'wide', label: 'Import students', onClose: () => { ui.impOpen = false; } }); ui.impOpen = true; }
    bindImport();
  }
  function importPickHtml() {
    return `${modalHead('Import students', `Add students to classes across ${School.name} from a spreadsheet.`)}<div class="m-body">`
      + `<label class="drop" id="imp-drop" for="imp-file">${ic('sheet')}<b>Choose a spreadsheet</b><span>Excel (.xlsx) or CSV, with one row for each student in each class. You can also drop the file here.</span></label>`
      + `<input type="file" id="imp-file" accept=".xlsx,.xlsm,.csv,.tsv,.txt,text/csv,text/tab-separated-values,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>`
      + `<div class="or" role="presentation"><span>or</span></div>`
      + `<label class="field"><span>Paste cells from a spreadsheet</span><textarea id="imp-paste" class="short" placeholder="Select the cells in Excel or Google Sheets, including the header row, then copy and paste them here."></textarea></label>`
      + `<details class="tip"><summary>Which columns to include</summary><ul>`
      + `<li><b>Student name:</b> First name and Last name columns, or one Name column.</li>`
      + `<li><b>Teacher:</b> the teacher’s name or the email they use for TapRoll.</li>`
      + `<li><b>Period:</b> the class period number, like 3 or P3. A Course column helps when a teacher has two classes in one period.</li>`
      + `<li><b>Parent email</b> (optional): one or two columns.</li>`
      + `<li><b>Student ID</b> (optional): only used to tell apart students with the same name. TapRoll doesn’t save it.</li>`
      + `<li>No Teacher or Period column? You can put everyone in one class on the next step.</li></ul></details>`
      + `<p class="m-text small err-text" id="imp-err" role="alert" hidden></p></div>`
      + `<div class="m-foot"><button type="button" class="btn" data-act="close-modal">Cancel</button><button type="button" class="btn primary" id="imp-paste-go">Continue with pasted cells</button></div>`;
  }
  function importRows() {
    const sh = imp.sheets[imp.sheet];
    if (!sh) return { header: [], rows: [] };
    const width = sh.rows.reduce((m, r) => Math.max(m, r.length), 0);
    const hdr = imp.hasHeader && imp.header >= 0 ? sh.rows[imp.header] : [];
    const header = Array.from({ length: width }, (_, i) => (hdr[i] || '').trim() || `Column ${colLetter(i)}`);
    return { header, rows: sh.rows.slice(imp.hasHeader && imp.header >= 0 ? imp.header + 1 : 0) };
  }
  function selectSheet(i) {
    imp.sheet = i;
    const sh = imp.sheets[i];
    imp.header = findHeader(sh.rows);
    imp.hasHeader = imp.header >= 0;
    imp.map = imp.hasHeader ? guessMap(sh.rows[imp.header]) : {};
    imp.step = 'map';
  }
  function buildPlan() {
    const { rows } = importRows();
    const col = (r, f) => (imp.map[f] != null && imp.map[f] >= 0 ? String(r[imp.map[f]] || '').trim() : '');
    const findT = teacherIndex();
    const people = schoolPeople();
    const plan = { rows: rows.length, students: new Map(), places: 0, byTeacher: new Map(), problems: new Map(), skipped: [], preview: [] };
    const problem = (key, text, r) => { const p = plan.problems.get(key) || { text, n: 0 }; p.n++; plan.problems.set(key, p); plan.skipped.push({ r, why: text }); return text; };
    const oneT = people.find((x) => x.uid === imp.one.uid);
    const inClass = new Map();   // teacher uid -> Set of "class id|name" already on the roster
    const seated = (x, pid, first, last) => {
      if (!inClass.has(x.uid)) {
        const set = new Set();
        for (const st of Object.values(x.d.students)) { const k = nameKey(st.first, st.last); for (const p of st.periods) set.add(`${p}|${k}`); }
        inClass.set(x.uid, set);
      }
      return inClass.get(x.uid).has(`${pid}|${nameKey(first, last)}`);
    };
    for (const r of rows) {
      let first = col(r, 'first'), last = col(r, 'last');
      if (!first && !last) { const full = col(r, 'full'); if (full) ({ first, last } = splitName(full)); }
      first = first.slice(0, 40); last = last.slice(0, 40);
      const show = { name: `${first} ${last}`.trim(), teacher: '', cls: '', note: '' };
      if (plan.preview.length < 6) plan.preview.push(show);
      if (!first && !last) { show.note = problem('noname', 'No student name', r); continue; }
      let x = null;
      if (imp.map.teacher != null) {
        const tv = col(r, 'teacher');
        const m = findT(tv);
        if (m.err === 'blank') { show.note = problem('noteacher', 'No teacher listed', r); continue; }
        if (m.err) { show.note = problem(`t:${normKey(tv)}`, m.err === 'ambiguous' ? `More than one teacher matches “${tv}”` : `No teacher “${tv}” at ${School.name}`, r); continue; }
        x = m.x;
      } else {
        if (!oneT) { show.note = problem('pickt', 'Choose a teacher below', r); continue; }
        x = oneT;
      }
      show.teacher = x.name;
      if (!usable(x)) { show.note = problem(`load:${x.uid}`, `${x.name}’s classes aren’t loaded yet`, r); continue; }
      let p = null;
      if (imp.map.period != null || imp.map.course != null) {
        const pv = col(r, 'period'), cv = col(r, 'course');
        const m = matchPeriod(x.d, pv, cv);
        if (m.err === 'blank') { show.note = problem('noperiod', 'No period listed', r); continue; }
        if (m.err) {
          const what = pv ? `Period ${m.num != null ? m.num : pv}` : `a ${cv} class`;
          show.note = problem(`p:${x.uid}:${normKey(pv)}:${normKey(cv)}`, m.err === 'ambiguous' ? `${x.name} has more than one class that fits ${what}${cv ? '' : '. Add a Course column'}` : `${x.name} has no ${what} in TapRoll yet`, r);
          continue;
        }
        p = m.p;
      } else {
        p = x.uid === imp.one.uid ? x.d.periods[imp.one.pid] : null;
        if (!p) { show.note = problem('pickp', 'Choose a class below', r); continue; }
      }
      show.cls = `P${p.num} ${p.course}`;
      const sidv = col(r, 'sid');
      const key = sidv ? `id:${sidv}` : `n:${nameKey(first, last)}`;
      let s = plan.students.get(key);
      if (!s) { s = { first, last, parents: new Set(), places: [] }; plan.students.set(key, s); }
      parseEmails(`${col(r, 'parent')} ${col(r, 'parent2')}`).ok.forEach((e) => s.parents.add(e));
      if (!s.places.some((q) => q.uid === x.uid && q.pid === p.id)) {
        s.places.push({ uid: x.uid, pid: p.id });
        plan.places++;
        const tb = plan.byTeacher.get(x.uid) || { x, per: new Map() };
        const cur = tb.per.get(p.id) || { p, n: 0, fresh: 0 };
        cur.n++;
        if (!seated(x, p.id, first, last)) cur.fresh++;
        tb.per.set(p.id, cur);
        plan.byTeacher.set(x.uid, tb);
      }
    }
    return plan;
  }
  function importMapHtml() {
    const sh = imp.sheets[imp.sheet];
    const { header, rows } = importRows();
    const plan = imp.plan = buildPlan();
    const opt = (f) => `<option value="-1">Not in this file</option>${header.map((h, i) => `<option value="${i}" ${imp.map[f] === i ? 'selected' : ''}>${esc(h)}</option>`).join('')}`;
    const people = schoolPeople().filter((x) => usable(x) && dPeriods(x.d).length);
    const needOne = imp.map.teacher == null || (imp.map.period == null && imp.map.course == null);
    const oneT = people.find((x) => x.uid === imp.one.uid);
    const one = needOne ? `<div class="imp-one"><p class="m-text small">${imp.map.teacher == null ? 'This file has no Teacher column, so put everyone in one class:' : 'This file has no Period or Course column, so choose the class:'}</p><div class="grid2">`
      + `<label class="field"><span>Teacher</span><select id="imp-one-t"><option value="">Choose a teacher</option>${people.map((x) => `<option value="${esc(x.uid)}" ${x.uid === imp.one.uid ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></label>`
      + `<label class="field"><span>Class</span><select id="imp-one-p"><option value="">Choose a class</option>${oneT ? dPeriods(oneT.d).map((p) => `<option value="${esc(p.id)}" ${p.id === imp.one.pid ? 'selected' : ''}>P${esc(p.num)} · ${esc(p.course)}</option>`).join('') : ''}</select></label></div></div>` : '';
    const nStu = plan.students.size;
    const tList = [...plan.byTeacher.values()].sort((a, b) => sortName(a.x.name, b.x.name));
    const sum = `<div class="imp-sum"><div><b>${fmtCount(nStu)}</b><span>${nStu === 1 ? 'student' : 'students'}</span></div><div><b>${fmtCount(plan.places)}</b><span>class spots</span></div><div><b>${tList.length}</b><span>${tList.length === 1 ? 'teacher' : 'teachers'}</span></div><div class="${plan.skipped.length ? 'warn' : ''}"><b>${fmtCount(plan.skipped.length)}</b><span>rows skipped</span></div></div>`;

    const probs = [...plan.problems.values()].sort((a, b) => b.n - a.n);
    const pHtml = probs.length ? `<div class="opstatus warn">${ic('alert')}<div class="op-body"><p><b>Some rows will be skipped.</b> Fix them in the file and import it again, or add those students by hand.</p><ul class="imp-probs">${probs.slice(0, 8).map((p) => `<li>${esc(p.text)} <span>${plural(p.n, 'row')}</span></li>`).join('')}${probs.length > 8 ? `<li>And ${probs.length - 8} more kinds of problems.</li>` : ''}</ul></div></div>` : '';
    const prev = plan.preview.length ? `<div class="imp-prev"><table><thead><tr><th>Student</th><th>Teacher</th><th>Class</th></tr></thead><tbody>${plan.preview.map((r) => `<tr><td>${esc(r.name || '(no name)')}</td><td>${esc(r.teacher || '')}</td><td>${r.note ? `<span class="imp-skip">${esc(r.note)}</span>` : esc(r.cls)}</td></tr>`).join('')}</tbody></table><p class="m-text small">The first rows, as TapRoll reads them.</p></div>` : '';
    return `${modalHead('Check the columns', `${imp.file || sh.name} · ${plural(rows.length, 'row')}`)}<div class="m-body">`
      + (imp.sheets.length > 1 ? `<label class="field"><span>Sheet</span><select id="imp-sheet">${imp.sheets.map((s, i) => `<option value="${i}" ${i === imp.sheet ? 'selected' : ''}>${esc(s.name)} (${plural(s.rows.length, 'row')})</option>`).join('')}</select></label>` : '')
      + `<label class="check fit"><input type="checkbox" id="imp-hdr" ${imp.hasHeader && imp.header >= 0 ? 'checked' : ''}> ${imp.hasHeader && imp.header >= 0 ? `Row ${imp.header + 1} has the column names` : 'The file has a row of column names'}</label>`
      + `<div class="imp-map">${IMPORT_FIELDS.map(([f, l]) => `<label class="field"><span>${esc(l)}</span><select data-f="${f}">${opt(f)}</select></label>`).join('')}</div>`
      + one + sum + tHtml + pHtml + prev
      + `<p class="m-text small">Students already in a class aren’t added twice. A student in several classes gets one tag code for all of them.</p>`
      + `<p class="m-text small err-text" id="imp-err" role="alert" hidden></p></div>`
      + `<div class="m-foot"><button type="button" class="btn spacer" id="imp-back">Back</button><button type="button" class="btn" data-act="close-modal">Cancel</button>`
      + `<button type="button" class="btn primary" id="imp-go" ${plan.places ? '' : 'disabled'}>${plan.places ? `Add ${plural(nStu, 'student')}` : 'Nothing to add yet'}</button></div>`;
  }
  function importDoneHtml() {
    const r = imp.result || { students: 0, added: 0, same: 0, failed: 0, errors: [] };

      + (r.failed ? `<div class="opstatus err">${ic('alert')}<p>${esc(r.errors[0] || 'Some classes weren’t updated.')}</p></div>` : '')
      + `<p class="m-text">Teachers see their new students right away. Each student’s tag can be written in any of their classes.</p>`
