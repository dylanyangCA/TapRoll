    emit(code) {
      if (this.capture) { const fn = this.capture; this.capture = null; fn(code.trim()); return; }
      if (modal.open) { toast({ kind: 'info', text: 'Scan ignored', sub: 'Close the open window to check students in.' }); return; }
      primeAudio();
      handleScan({ uid: code.trim(), source: 'usb' });
    }
  };

  /* ============================== Check-in logic ============================== */
  function tapStatus(p) {
    if (prefs.tapAs === 'P' || prefs.tapAs === 'T') return prefs.tapAs;
    const s = toMin(p.start);
    if (s == null) return 'P';
    return nowMin() > s + (Number(S.settings.graceMin) || 0) ? 'T' : 'P';
  }
  function resolveTarget(st) {
    const today = todayStr();
    if (ui.view === 'period' && S.periods[ui.periodId]) {
      if (ui.date !== today) return { reason: 'Switch to today to check students in.' };
      return { pid: ui.periodId, date: today };
    }
    const now = nowMin();
    if (st) {
      const mine = st.periods.map((id) => S.periods[id]).filter(Boolean);
      const live = mine.find((p) => phaseOf(p) === 'now');
      if (live) return { pid: live.id, date: today };
      const soon = mine.filter((p) => { const s = toMin(p.start); return s != null && s - now >= 0 && s - now <= 20; })
        .sort((a, b) => toMin(a.start) - toMin(b.start))[0];
      if (soon) return { pid: soon.id, date: today };
    }
    const cur = currentPeriod();
    if (cur) return { pid: cur.id, date: today };
    return { reason: 'No period is in session. Open a period to check students in.' };
  }

  function handleScan(scan) {
    if (!ui.ready || !Session.kind) return;
    let st = null;
    if (scan.sid) st = S.students[scan.sid] || null;
    if (!st && scan.token) st = findByToken(scan.token);
    if (!st && scan.serial) st = findByUid(scan.serial);
    if (!st && scan.uid) st = findByUid(scan.uid);
    // Remember a written tag's serial number so a USB reader recognizes the same tag later.
    if (st && scan.serial && scan.token && st.token === scan.token && !uidIn(st.uids, scan.serial) && editable()) {
      upsertStudent({ ...st, uids: [...st.uids, scan.serial] });
      st = S.students[st.id];
    }
    const viaLink = scan.source === 'link';
    const report = (ev) => (viaLink ? linkResult(ev) : feedback(ev));

    if (!st) {
      const ev = {
        kind: 'unknown',
        text: scan.token ? 'This tag isn’t in your classes' : 'Unknown tag',
        sub: scan.token ? 'It may be set up for another class. Link it to a student to use it here too.' : 'Link it to a student to start using it.'
      };
      if (editable() && Object.keys(S.students).length) ev.actions = [{ label: 'Link to student', run: () => openAssign(scan) }];
      report(ev);
      return;
    }
    const target = resolveTarget(st);
    if (!target.pid) { report({ kind: 'warn', text: fullName(st), sub: target.reason, sid: st.id }); return; }
    const p = S.periods[target.pid];
    if (!st.periods.includes(p.id)) {
      const other = st.periods.map((id) => S.periods[id]).filter(Boolean).map(periodLabel).join(', ');
      report({ kind: 'warn', text: fullName(st), sub: `Not on the ${periodLabel(p)} roster${other ? ` · in ${other}` : ''}`, pid: p.id });
      return;
    }
    const prev = marksOf(target.date, p.id)[st.id] || null;
    if (prev && (prev.s === 'P' || prev.s === 'T')) {
      report({ kind: 'dup', text: fullName(st), sub: `Already checked in at ${fmtClock(prev.t)}`, pid: p.id, sid: st.id });
      return;
    }
    if (!editable()) { report({ kind: 'warn', text: 'View only', sub: 'Your access to this portal doesn’t allow check-ins.' }); return; }
    const s = tapStatus(p);
    const t = Date.now();
    setMark(target.date, p.id, st.id, { s, t, m: scan.source });
    const ev = {
      kind: s === 'T' ? 'tardy' : 'present', text: fullName(st),
      sub: `${STATUS[s]} · ${periodLabel(p)} · ${fmtClock(t)}`, pid: p.id, sid: st.id,
      actions: [{ label: 'Undo', run: () => { setMark(target.date, p.id, st.id, prev); scheduleRender(); } }]
    };
    if (viaLink) { ui.view = 'period'; ui.periodId = p.id; ui.date = target.date; scheduleRender(); }
    report(ev);
  }

  function simulateTap() {
    if (!editable() || !S.periods[ui.periodId]) return;
    primeAudio();
    const marks = marksOf(todayStr(), ui.periodId);
    const pool = rosterOf(ui.periodId).filter((s) => !marks[s.id]);
    if (!pool.length) { feedback({ kind: 'dup', text: 'Everyone is marked', sub: 'There’s no one left to simulate.', feed: false }); return; }
    const st = pool[Math.floor(Math.random() * pool.length)];
    handleScan(st.token ? { token: st.token, source: 'demo' } : { sid: st.id, source: 'demo' });
  }

  function markManual(sid, s) {
    if (!editable() || !S.periods[ui.periodId]) return;
    const pid = ui.periodId, date = ui.date;
    const cur = marksOf(date, pid)[sid];
    if (cur && cur.s === s) setMark(date, pid, sid, null);
    else {
      const keepTime = cur && (cur.s === 'P' || cur.s === 'T') && (s === 'P' || s === 'T');
      setMark(date, pid, sid, { s, t: keepTime ? cur.t : Date.now(), m: keepTime ? cur.m : 'manual' });
    }
    scheduleRender();
  }

  function markRestAbsent() {
    if (!editable() || !S.periods[ui.periodId]) return;
    const pid = ui.periodId, date = ui.date;
    const marks = marksOf(date, pid);
    const ids = rosterOf(pid).filter((s) => !marks[s.id]).map((s) => s.id);
    if (!ids.length) return;
    const t = Date.now();
    setMarks(date, pid, ids.map((sid) => ({ sid, mark: { s: 'A', t, m: 'manual' } })));
    toast({ kind: 'info', text: `Marked ${ids.length} absent`, sub: periodLabel(S.periods[pid]), actions: [{ label: 'Undo', run: () => { setMarks(date, pid, ids.map((sid) => ({ sid, mark: null }))); scheduleRender(); } }] });
    scheduleRender();
  }

  /* ============================== Feedback ============================== */
  let audioCtx = null;
  function primeAudio() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) { audioCtx = null; }
  }
  function beep(kind) {
    if (!prefs.sound || !audioCtx) return;
    const seq = { present: [880, 1318], tardy: [740, 988], dup: [620], unknown: [330, 247], warn: [392, 311] }[kind];
    if (!seq) return;
    try {
      let t = audioCtx.currentTime + 0.01;
      for (const f of seq) {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.2, t + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t); o.stop(t + 0.15);
        t += 0.12;
      }
    } catch (e) { /* audio unavailable */ }
  }
  function buzz(kind) {
    try {
      if (!navigator.vibrate) return;
      if (kind === 'present' || kind === 'tardy') navigator.vibrate(35);
      else if (kind === 'unknown' || kind === 'warn') navigator.vibrate([70, 50, 70]);
    } catch (e) { /* not allowed */ }
  }
  function announce(text) {
    const el = $('#live');
    if (!el) return;
    el.textContent = '';
    setTimeout(() => { el.textContent = text; }, 30);
  }

  let kioskTimer = null;
  function feedback(ev) {
    ev.ts = Date.now();
    if (ev.feed !== false) { ui.feed.unshift(ev); if (ui.feed.length > 40) ui.feed.length = 40; }
    ui.lastEvent = ev;
    beep(ev.kind); buzz(ev.kind);
    announce(`${ev.text}. ${ev.sub || ''}`);
    toast(ev);
    if (ev.sid) ui.flash = { sid: ev.sid, at: Date.now() };
    if (ui.kiosk) { renderKiosk(); clearTimeout(kioskTimer); kioskTimer = setTimeout(renderKiosk, 6500); }
    scheduleRender();
  }

  const TOAST_ICON = { present: 'check', tardy: 'clock', dup: 'info', unknown: 'tag', warn: 'alert', info: 'info', ok: 'check' };
  const TOAST_BG = { present: 'var(--p)', tardy: 'var(--t)', dup: 'var(--u)', unknown: 'var(--a)', warn: 'var(--a)', info: 'var(--accent)', ok: 'var(--p)' };
  function toast(ev) {
    const host = $('#toasts');
    if (!host || ui.kiosk) return;   // kiosk mode shows each scan full-screen instead
    while (host.children.length >= 3) host.firstElementChild.remove();
    const el = document.createElement('div');
    el.className = 'toast';
    el.setAttribute('role', 'status');
    const acts = (ev.actions || []).map((a, i) => `<button class="tact" data-i="${i}">${esc(a.label)}</button>`).join('');
    el.innerHTML = `<span class="tbadge" style="background:${TOAST_BG[ev.kind] || 'var(--u)'}">${ic(TOAST_ICON[ev.kind] || 'info')}</span>`
      + `<span class="ttxt"><b>${esc(ev.text)}</b>${ev.sub ? `<span>${esc(ev.sub)}</span>` : ''}</span>${acts}`
      + `<button class="tact x" data-x="1" aria-label="Dismiss">${ic('x')}</button>`;
    const kill = () => { el.remove(); };
    el.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.x) { kill(); return; }
      const a = (ev.actions || [])[Number(b.dataset.i)];
      kill();
      if (a && a.run) a.run();
    });
    host.appendChild(el);
    const life = ev.kind === 'unknown' ? 9000 : (ev.actions && ev.actions.length ? 6000 : 3800);
    setTimeout(kill, life);
  }

  /* ============================== Rendering ============================== */
  let renderQueued = false;
  function scheduleRender() {
    if (renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(() => { renderQueued = false; renderAll(); });
  }
  let firstReadyDone = false;
  function dataChanged() {
    ui.ready = !!Session.kind && Store.isLoaded();
    if (ui.ready && !firstReadyDone) {
      firstReadyDone = true;
      pickInitialView();
      setTimeout(() => { if (pendingTag) processPendingHash(); else maybeOfferImport(); }, 0);
    }
    if (ui.view === 'period' && ui.ready && !S.periods[ui.periodId]) { ui.view = 'overview'; ui.periodId = null; }
    scheduleRender();
  }
  function renderAll() {
    if (ui.screen !== 'app') return;
    renderRail();
    renderMain();
    renderScanbar();
    if (ui.kiosk) renderKiosk();
    setSyncState();
  }

  function segs(c) {
    if (!c.total) return '';
    return ['P', 'T', 'A', 'E'].map((k) => (c[k] ? `<i class="b-${STATUS_CLS[k]}" style="width:${(c[k] / c.total) * 100}%"></i>` : '')).join('');
  }
  function legend(c, short) {
    return `<span class="lg p">${short ? 'P' : 'Present'} <b>${c.P}</b></span><span class="lg t">${short ? 'T' : 'Tardy'} <b>${c.T}</b></span>`
      + `<span class="lg a">${short ? 'A' : 'Absent'} <b>${c.A}</b></span><span class="lg e">${short ? 'E' : 'Excused'} <b>${c.E}</b></span>`
      + `<span class="lg u">Not yet <b>${c.U}</b></span>`;
  }

  function accountName() {
    if (Session.kind === 'demo') return 'Example classroom';
    const u = Session.user || {};
    return S.settings.teacher || u.name || u.email || 'Teacher';
  }
  function nameInitials(name) {
    const parts = String(name || '').replace(/^(mr|mrs|ms|mx|dr|coach)\.?\s+/i, '').trim().split(/\s+/).filter(Boolean);
    return ((parts[0] || '?').charAt(0) + (parts.length > 1 ? parts[parts.length - 1].charAt(0) : '')).toUpperCase();
  }
  function accountAvatar(cls) {
    const name = accountName();
    if (Session.kind === 'demo') return `<span class="av ${cls || ''} av-demo">${ic('spark')}</span>`;
    return `<span class="av ${cls || ''}" style="--h:${hueOf((Session.user && Session.user.id) || name)}">${esc(nameInitials(name))}</span>`;
  }
  function renderRail() {
    const rail = $('#rail');
    const brand = `<div class="brand"><span class="logo">${LOGO}</span><span class="brand-text"><span class="brand-name">TapRoll</span>`
      + `<span class="brand-sub">${esc(S.settings.school || 'Attendance portal')}</span></span>`
      + `<span class="brand-tools"><button class="btn ghost icon" data-act="tag-tools" aria-label="Tag tools">${ic('tag')}</button>`
      + `<button class="av-btn" data-act="account" aria-label="Account: ${esc(accountName())}">${accountAvatar()}</button></span></div>`;
    if (!ui.ready) { rail.innerHTML = brand; return; }
    const oldStrip = rail.querySelector('.schedule');
    const keepLeft = oldStrip ? oldStrip.scrollLeft : 0;
    const today = todayStr();
    const todayItem = `<li><button class="pitem today ${ui.view === 'overview' ? 'is-active' : ''}" data-act="open-overview" aria-current="${ui.view === 'overview' ? 'page' : 'false'}">`
      + `<span class="pnum">${ic('grid')}</span><span class="pmain"><span class="pcourse">Today</span><span class="ptime">${esc(fmtDateShort(today))}</span></span><span class="pside"></span></button></li>`;
    const items = periodList().map((p) => {
      const c = countsOf(today, p.id);
      const ph = phaseOf(p, today);
      const active = ui.view === 'period' && ui.periodId === p.id;
      return `<li><button class="pitem ph-${ph} ${active ? 'is-active' : ''}" data-act="open-period" data-id="${esc(p.id)}" aria-current="${active ? 'page' : 'false'}" aria-label="${esc(periodLabel(p))}, ${esc(p.course)}">`
        + `<span class="pnum">P${esc(p.num)}</span>`
        + `<span class="pmain"><span class="pcourse">${esc(p.course || periodLabel(p))}</span><span class="ptime">${esc(fmtHM(p.start))}–${esc(fmtHM(p.end))}${p.room ? ` · Rm ${esc(p.room)}` : ''}</span></span>`
        + `<span class="pside">${ph === 'now' ? '<span class="nowchip">Now</span>' : ''}<span class="pcount">${c.P + c.T}/${c.total}</span></span>`
        + `<span class="pbar" aria-hidden="true">${segs(c)}</span></button></li>`;
    }).join('');
    rail.innerHTML = `${brand}<nav class="schedule" aria-label="Periods">`
      + `<div class="sched-head"><span class="sched-label">Bell schedule</span><span class="sched-clock">${esc(fmtClock(Date.now()))}</span></div>`
      + `<ol class="plist">${todayItem}${items}</ol>`
      + `${editable() ? `<button class="addp" data-act="add-period">${ic('plus')} Add period</button>` : ''}</nav>`
      + `<div class="rail-foot"><button class="rail-link" data-act="tag-tools">${ic('tag')} Tag tools</button>`
      + `<button class="rail-link" data-act="settings">${ic('sliders')} Settings</button>`
      + `<button class="acct" data-act="account" aria-label="Account: ${esc(accountName())}">${accountAvatar()}`
      + `<span class="acct-txt"><b>${esc(accountName())}</b><span>${esc(Session.kind === 'demo' ? 'Made-up students' : ((Session.user && Session.user.email) || ''))}</span></span>${ic('chevron')}</button>`
      + `<div class="syncstate" id="syncstate"></div></div>`;
    // On phones the periods scroll sideways: keep the strip where it was, and center a newly opened period.
    const strip = rail.querySelector('.schedule');
    if (strip) {
      strip.scrollLeft = keepLeft;
      const key = ui.view === 'period' ? ui.periodId : 'overview';
      const act = rail.querySelector('.pitem.is-active');
      if (act && key !== lastChip && strip.scrollWidth > strip.clientWidth) {
        const delta = act.getBoundingClientRect().left - strip.getBoundingClientRect().left;
        strip.scrollLeft = Math.max(0, strip.scrollLeft + delta - (strip.clientWidth - act.offsetWidth) / 2);
      }
      lastChip = key;
    }
  }
  let lastChip = null;

  function syncInfo() {
    if (Store.mode === 'fs') {
      if (ui.syncError) return { icon: 'alert', text: 'Sync stopped. Reload to reconnect.' };
      if (navigator.onLine === false) return { icon: 'cloud', text: 'Offline. Changes save when you reconnect.' };
      return { icon: 'cloud', text: Store.pending() ? 'Saving…' : 'Synced to your account' };
    }
    if (Store.mode === 'memory') return { icon: 'alert', text: 'Not saved: browser storage is blocked' };
    if (Session.kind === 'demo') return { icon: 'device', text: 'Example data on this device' };
    return { icon: 'device', text: 'Saved on this device' };
  }
  function setSyncState() {
    const el = $('#syncstate');
    if (!el) return;
    const s = syncInfo();
    el.innerHTML = `${ic(s.icon)}<span>${esc(s.text)}</span>`;
  }

  function renderMain() {
    const main = $('#main');
    const active = document.activeElement;
    const keep = active && active.id && main.contains(active) ? { id: active.id, s: active.selectionStart, e: active.selectionEnd } : null;
    let html;
    if (!ui.ready) html = viewLoading();
    else if (ui.view === 'period' && S.periods[ui.periodId]) html = viewPeriod(S.periods[ui.periodId]);
    else html = viewOverview();
    main.innerHTML = `<div class="wrap">${html}</div>`;
    if (keep) {
      const el = document.getElementById(keep.id);
      if (el) { el.focus({ preventScroll: true }); try { if (keep.s != null) el.setSelectionRange(keep.s, keep.e); } catch (e) { /* not a text input */ } }
    }
    if (ui.flash && Date.now() - ui.flash.at < 1500) {
      const tile = main.querySelector(`[data-tile="${CSS.escape(ui.flash.sid)}"]`);
      if (tile) tile.classList.add('flash');
      ui.flash = null;
    }
  }

  function viewLoading() {
    return `<div class="empty" aria-busy="true"><span class="pulse"></span><h3>Loading your periods</h3><p>Getting rosters and today’s attendance.</p></div>`;
  }

  function banners() {
    let out = '';
    if (ui.syncError === 'permission-denied') {
      out += `<div class="banner warn">${ic('alert')}<p><b>TapRoll can’t open your saved classes.</b> The Firestore rules are blocking this account. Paste the rules from the setup guide into Firebase, then reload.</p><button class="btn sm" data-act="setup-guide">Setup guide</button></div>`;
    } else if (ui.syncError) {
      out += `<div class="banner warn">${ic('alert')}<p><b>Live sync stopped.</b> Check your connection, then reload the page.</p><button class="btn sm" data-act="reload">Reload</button></div>`;
    } else if (ui.readOnly) out += `<div class="banner warn">${ic('alert')}<p>You can view these classes, but changes aren’t being saved.</p></div>`;
    if (Session.kind === 'demo' && !ui.hideSample) {
      out += `<div class="banner">${ic('spark')}<p><b>You’re exploring an example classroom.</b> The students are made up, and changes stay on this device.</p>`
        + `<button class="btn sm primary" data-act="demo-signup">Create your account</button><button class="btn sm ghost" data-act="hide-sample">Keep exploring</button></div>`;
    } else if (S.settings.sample && !ui.hideSample) {
      out += `<div class="banner">${ic('info')}<p><b>You’re looking at example data.</b> The school and student names are made up. Start fresh when you’re ready to add your own classes.</p>`
        + `${editable() ? `<button class="btn sm primary" data-act="start-fresh">Start fresh</button>` : ''}<button class="btn sm ghost" data-act="hide-sample">Keep exploring</button></div>`;
    }
    return out;
  }

  function viewOverview() {
    const today = todayStr();
    const list = periodList();
    const head = `<header class="vhead"><div class="vhead-text"><div class="eyebrow">${esc(fmtDateLong(today))}${S.settings.school ? ` · ${esc(S.settings.school)}` : ''}</div>`
      + `<h1 class="vtitle">Today</h1></div><div class="vhead-actions">${editable() ? `<button class="btn sm" data-act="add-period">${ic('plus')} Add period</button>` : ''}</div></header>`;
    if (!list.length) {
      const legacy = Session.kind !== 'demo' && readLegacy();
      return head + banners() + `<div class="empty"><h3>Set up your bell schedule</h3><p>Add each period you teach with its bell times, then paste in each roster. TapRoll uses the bell times to decide when a tap counts as tardy.</p>`
        + `<div class="row">${editable() ? `<button class="btn primary" data-act="add-period">${ic('plus')} Add Period 1</button>`
          + `${legacy ? `<button class="btn" data-act="import-legacy">${ic('upload')} Bring in classes from this device</button>` : ''}`
          + `<button class="btn" data-act="load-demo">${ic('spark')} Load example data</button>` : ''}</div></div>`;
    }
    const tot = { P: 0, T: 0, A: 0, E: 0, U: 0, total: 0 };
    for (const p of list) { const c = countsOf(today, p.id); for (const k of Object.keys(tot)) tot[k] += c[k]; }
    const rate = overallRate();
    const kpis = `<section class="card kpis" aria-label="Today at a glance">`
      + `<div class="kpi"><div class="k">Checked in today</div><div class="v">${tot.P + tot.T}<small>of ${tot.total}</small></div></div>`
      + `<div class="kpi"><div class="k">Tardy today</div><div class="v">${tot.T}</div></div>`
      + `<div class="kpi"><div class="k">Absent today</div><div class="v">${tot.A}<small>${tot.E} excused</small></div></div>`
      + `<div class="kpi"><div class="k">Attendance, last 15 days</div><div class="v">${rate == null ? '—' : Math.round(rate * 100) + '%'}</div></div></section>`;

    const n = nowMin();
    const nowLine = `<li class="nowline" aria-hidden="true"><span>${esc(fmtClock(Date.now()))}</span><i></i></li>`;
    let placed = false;
    const anyNow = list.some((p) => phaseOf(p) === 'now');
    let nextFound = false;
    const rows = [];
    for (const p of list) {
      const ph = phaseOf(p);
      if (!anyNow && !placed && toMin(p.start) != null && toMin(p.start) > n) { rows.push(nowLine); placed = true; }
      const c = countsOf(today, p.id);
      let label = 'Later';
      if (ph === 'done') label = 'Done';
      else if (ph === 'now') label = 'In session';
      else if (!nextFound) { label = 'Up next'; nextFound = true; }
      const s = toMin(p.start), e = toMin(p.end);
      const elapsed = ph === 'now' && s != null && e > s ? Math.min(100, ((n - s) / (e - s)) * 100) : 0;
      rows.push(`<li class="tl"><div class="tl-time"><b>${esc(fmtHM(p.start))}</b>${esc(fmtHM(p.end))}</div>`
        + `<button class="pcard ph-${ph}" data-act="open-period" data-id="${esc(p.id)}">`
        + `<span class="pcard-title"><span class="pnum">P${esc(p.num)}</span><span class="pcard-name"><b>${esc(p.course || periodLabel(p))}</b><span>${p.room ? `Room ${esc(p.room)} · ` : ''}${c.total} students</span></span></span>`
        + `<span class="phase ${ph === 'now' ? 'now' : ph === 'done' ? 'done' : ''}">${label}</span>`
        + `<span class="bar" aria-hidden="true">${segs(c)}</span><span class="legend">${legend(c, true)}</span>`
        + `${elapsed ? `<span class="elapsed" style="width:${elapsed}%"></span>` : ''}</button></li>`);
    }
    if (!anyNow && !placed) rows.push(nowLine);

    const watch = chronicList();
    const watchHtml = watch.length
      ? `<ul class="watch">${watch.slice(0, 7).map((w) => `<li><button data-act="open-student" data-id="${esc(w.st.id)}"><span class="av" style="--h:${hueOf(w.st.id)}">${esc(initials(w.st))}</span>`
        + `<span class="wname"><b>${esc(fullName(w.st))}</b><span>${esc(w.st.periods.map((id) => S.periods[id]).filter(Boolean).map(periodLabel).join(', '))} · missed ${w.miss} of ${w.n}</span></span>`
        + `<span class="rate">${Math.round(w.rate * 100)}%</span></button></li>`).join('')}</ul>`
      : `<p class="watch-empty">No one has missed 10% or more of recent sessions.</p>`;
    const trend = list.map((p) => {
      const r = periodRates(p.id, 10);
      const vals = r.map((x) => x.att / x.tot);
      const avg = r.length ? Math.round((r.reduce((a, x) => a + x.att, 0) / r.reduce((a, x) => a + x.tot, 0)) * 100) + '%' : '—';
      return `<div class="trow"><span class="pnum">P${esc(p.num)}</span><span class="tname">${esc(p.course)}</span>${spark(vals)}<span class="tv">${avg}</span></div>`;
    }).join('');

    return head + banners() + kpis
      + `<div class="ov-grid"><section aria-label="Bell schedule"><div class="sect-head"><h2 class="sect">Bell schedule</h2><span class="sect-note">Tap a period to take roll</span></div><ol class="timeline">${rows.join('')}</ol></section>`
      + `<div class="side-stack"><section><div class="sect-head"><h2 class="sect">Chronic absence watch</h2><span class="sect-note">Missed 10%+ of the last 15 sessions</span></div><div class="card">${watchHtml}</div></section>`
      + `<section><div class="sect-head"><h2 class="sect">Attendance by period</h2><span class="sect-note">Last 10 sessions · dashed line 90%</span></div><div class="card trend">${trend}</div></section></div></div>`;
  }

  function spark(vals) {
    const W = 96, H = 26, lo = 0.6, hi = 1;
    const y = (v) => 2 + (1 - (Math.min(hi, Math.max(lo, v)) - lo) / (hi - lo)) * (H - 4);
    const g = `<line class="spark-grid" x1="0" y1="${y(0.9).toFixed(1)}" x2="${W}" y2="${y(0.9).toFixed(1)}" stroke-dasharray="2 3"/>`;
    if (vals.length < 2) return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">${g}</svg>`;
    const x = (i) => 2 + (i * (W - 6)) / (vals.length - 1);
    const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`);
    const last = vals.length - 1;
    const area = `M${x(0).toFixed(1)},${H} L${pts.join(' L')} L${x(last).toFixed(1)},${H} Z`;
    return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">${g}<path class="spark-area" d="${area}"/><polyline class="spark-line" points="${pts.join(' ')}"/>`
      + `<circle class="spark-dot" cx="${x(last).toFixed(1)}" cy="${y(vals[last]).toFixed(1)}" r="2.4"/></svg>`;
  }

  function tapSeg() {
    const opts = [['auto', 'Auto'], ['P', 'Present'], ['T', 'Tardy']];
    return `<div class="seg" role="radiogroup" aria-label="Taps count as">${opts.map(([v, l]) => `<button type="button" role="radio" aria-checked="${prefs.tapAs === v}" data-act="tap-as" data-v="${v}">${l}</button>`).join('')}</div>`;
  }
  function tardyRule(p) {
    const s = toMin(p.start);
    if (s == null) return 'Add bell times to count late taps as tardy.';
    if (prefs.tapAs === 'P') return 'Every tap counts as present.';
    if (prefs.tapAs === 'T') return 'Every tap counts as tardy.';
    return `Bell <b>${esc(fmtHMap(p.start))}</b> · tardy after <b>${esc(fmtHMap(minToHM(s + (Number(S.settings.graceMin) || 0))))}</b>`;
  }

  function viewPeriod(p) {
    const date = ui.date;
    const today = todayStr();
    const isToday = date === today;
    const roster = rosterOf(p.id);
    const marks = marksOf(date, p.id);
    const c = countsOf(date, p.id);
    const nfc = NFC.status();
    const head = `<header class="vhead"><div class="vhead-text"><div class="eyebrow">${esc(periodLabel(p))} · ${esc(fmtHM(p.start))}–${esc(fmtHM(p.end))}${p.room ? ` · Room ${esc(p.room)}` : ''}</div>`
      + `<h1 class="vtitle">${esc(p.course || periodLabel(p))}</h1></div><div class="vhead-actions">`
      + `<div class="datenav" role="group" aria-label="Date"><button class="btn ghost sm icon" data-act="date-prev" aria-label="Previous day">${ic('left')}</button>`
      + `<span class="dlabel">${isToday ? 'Today' : esc(fmtDateShort(date))}</span><button class="btn ghost sm icon" data-act="date-next" aria-label="Next day">${ic('right')}</button></div>`
      + `${isToday ? '' : `<button class="btn sm" data-act="date-today">Back to today</button>`}`
      + `<button class="btn sm" data-act="export-period">${ic('download')} CSV</button>`
      + `${editable() ? `<button class="btn sm icon" data-act="edit-period" data-id="${esc(p.id)}" aria-label="Edit period">${ic('edit')}</button>` : ''}</div></header>`;

    const tally = `<section class="card tally" aria-label="Attendance summary"><div class="tally-big num">${c.P + c.T}<span class="dim">/${c.total}</span><small>checked in${isToday ? ' so far' : ` on ${esc(fmtDay(date))}`}</small></div>`
      + `<div class="legend">${legend(c)}</div><div class="bar" aria-hidden="true">${segs(c)}</div></section>`;

    let scan = '';
    if (isToday) {
      const btn = ui.scanning
        ? `<button class="btn-scan live" data-act="toggle-scan"><span class="pulse"></span> Listening… tap to stop</button>`
        : `<button class="btn-scan" data-act="toggle-scan" ${nfc.ok && editable() ? '' : 'disabled'}>${ic('nfc')} Start NFC scan</button>`;
      const base = hostedBase();
      const nfcLine = nfc.ok
        ? (ui.scanning ? '<b>Phone NFC:</b> scanning. Students tap the back of this phone.' : '<b>Phone NFC:</b> ready.')
        : `<b>Phone NFC:</b> ${esc(nfc.title)}.${nfc.code === 'framed' && base ? ` <a href="${esc(base)}" target="_blank" rel="noopener">Open hosted site</a>` : ''} <button class="btn ghost sm" data-act="tag-tools">Why?</button>`;
      const recent = Object.entries(marks).filter(([sid, mk]) => S.students[sid] && (mk.s === 'P' || mk.s === 'T'))
        .sort((a, b) => b[1].t - a[1].t).slice(0, 5);
      const feed = recent.length
        ? `<ol class="feed">${recent.map(([sid, mk]) => `<li><span class="dot ${mk.s === 'T' ? 'k-tardy' : 'k-present'}"></span><span class="fx"><b>${esc(fullName(S.students[sid]))}</b> · ${esc(STATUS[mk.s])}${mk.m !== 'manual' ? ` · ${esc(METHOD[mk.m] || mk.m)}` : ''}</span><time>${esc(fmtClock(mk.t))}</time></li>`).join('')}</ol>`
        : '<p class="feed-empty">Check-ins appear here as students tap in.</p>';
      scan = `<section class="card scanpanel ${ui.scanning ? 'is-live' : ''}" aria-label="Check-in">`
        + `<div class="scan-main"><div class="scan-row">${btn}`
        + `<button class="btn" data-act="kiosk">${ic('expand')} Kiosk</button>`
        + `<button class="btn ghost" data-act="simulate" ${editable() && roster.length ? '' : 'disabled'}>${ic('spark')} Simulate tap</button></div>`
        + `<div class="sources"><div class="src ${nfc.ok ? 'ok' : ''}">${ic('nfc')}<span>${nfcLine}</span></div>`
        + `<div class="src ok">${ic('usb')}<span><b>USB reader:</b> ready. Scans go to ${esc(periodLabel(p))}.</span></div></div>`
        + `<div class="scan-row"><span class="rule">Taps count as</span>${tapSeg()}</div><div class="rule">${tardyRule(p)}</div></div>`
        + `<div class="scan-side"><div class="sect-head"><h2 class="sect">Recent check-ins</h2></div>${feed}</div></section>`;
    } else {
      scan = `<div class="banner">${ic('clock')}<p>You’re viewing ${esc(fmtDateLong(date))}. Scanning only records to today; you can still fix marks by hand.</p><button class="btn sm" data-act="date-today">Back to today</button></div>`;
    }

    const q = ui.search.trim().toLowerCase();
    const filters = [['all', 'All', c.total], ['U', 'Not yet', c.U], ['P', 'Present', c.P], ['T', 'Tardy', c.T], ['A', 'Absent', c.A], ['E', 'Excused', c.E]];
    const shown = roster.filter((st) => {
      const mk = marks[st.id];
      const s = mk ? mk.s : 'U';
      if (ui.filter !== 'all' && s !== ui.filter) return false;
      return !q || fullName(st).toLowerCase().includes(q);
    });
    const tools = `<div class="rtools"><label class="search">${ic('search')}<span class="sr-only">Search students</span>`
      + `<input class="input" id="roster-search" type="search" placeholder="Search ${roster.length} students" value="${esc(ui.search)}" autocomplete="off"></label>`
      + `<div class="chips">${filters.map(([v, l, n]) => `<button class="chip" data-act="filter" data-v="${v}" aria-pressed="${ui.filter === v}">${l} <b>${n}</b></button>`).join('')}</div>`
      + `${editable() ? `<div class="rtools-actions"><button class="btn sm" data-act="mark-rest" ${c.U ? '' : 'disabled'}>Mark ${c.U} not-yet absent</button><button class="btn sm primary" data-act="add-students">${ic('plus')} Add students</button></div>` : ''}</div>`;
    let grid;
    if (!roster.length) {
      grid = `<div class="empty"><h3>No students in ${esc(periodLabel(p))} yet</h3><p>Paste names from your class list or a spreadsheet. You can write or link each student’s NFC tag afterward.</p>`
        + `${editable() ? `<div class="row"><button class="btn primary" data-act="add-students">${ic('plus')} Add students</button></div>` : ''}</div>`;
    } else if (!shown.length) grid = '<p class="feed-empty">No students match.</p>';
    else grid = `<div class="roster">${shown.map((st) => tile(st, marks[st.id])).join('')}</div>`;

    return head + banners() + tally + scan + `<section class="rsec" aria-label="Roster">${tools}</section>` + grid;
  }

  function tile(st, mk) {
    const s = mk ? mk.s : null;
    const how = mk && METHOD_ICON[mk.m] ? `<span class="how" title="${esc(METHOD[mk.m] || mk.m)}" aria-label="${esc(METHOD[mk.m] || mk.m)}">${ic(METHOD_ICON[mk.m])}</span>` : '';
    const meta = s ? `${STATUS[s]} · ${fmtClock(mk.t)}` : 'Not marked yet';
    const noTag = st.token || st.uids.length ? '' : ' · <span class="notag">no tag</span>';
    const can = editable();
    return `<article class="stu ${s ? 's-' + STATUS_CLS[s] : 's-u'}" data-tile="${esc(st.id)}">`
      + `<button class="stu-main" data-act="open-student" data-id="${esc(st.id)}" aria-label="${esc(fullName(st))}: open details">`
      + `<span class="av" style="--h:${hueOf(st.id)}">${esc(initials(st))}</span>`
      + `<span class="stu-txt"><span class="stu-name">${esc(st.first)} <b>${esc(st.last)}</b></span><span class="stu-meta">${how}<span class="mt">${esc(meta)}${noTag}</span></span></span></button>`
      + `<div class="marks" role="group" aria-label="Mark ${esc(fullName(st))}">${['P', 'T', 'A', 'E'].map((k) => `<button class="mk mk-${k} ${s === k ? 'on' : ''}" data-act="mark" data-sid="${esc(st.id)}" data-s="${k}" aria-pressed="${s === k}" title="${STATUS[k]}" ${can ? '' : 'disabled'}>${k}</button>`).join('')}</div></article>`;
  }

  function renderScanbar() {
    const bar = $('#scanbar');
    if (!ui.ready || ui.view !== 'period' || !S.periods[ui.periodId] || ui.date !== todayStr()) { bar.hidden = true; bar.innerHTML = ''; return; }
    const p = S.periods[ui.periodId];
    const c = countsOf(ui.date, p.id);
    const nfc = NFC.status();
    // The dock exists for NFC scanning; phones that can't scan don't need it.
    if (!nfc.ok && !ui.scanning) { bar.hidden = true; bar.innerHTML = ''; return; }
    const btn = ui.scanning
      ? `<button class="btn-scan live" data-act="toggle-scan"><span class="pulse"></span> Listening… tap to stop</button>`
      : `<button class="btn-scan" data-act="toggle-scan" ${editable() ? '' : 'disabled'}>${ic('nfc')} Start NFC scan</button>`;
    bar.hidden = false;
    bar.innerHTML = `${btn}<div class="sb-count"><b class="num">${c.P + c.T}/${c.total}</b>checked in</div>`;
  }

  function renderKiosk() {
    const k = $('#kiosk');
    const p = S.periods[ui.periodId];
    if (!ui.kiosk || !p) { k.hidden = true; k.innerHTML = ''; return; }
    const c = countsOf(todayStr(), p.id);
    const ev = ui.lastEvent && Date.now() - ui.lastEvent.ts < 6000 ? ui.lastEvent : null;
    const prompt = ui.scanning ? 'Tap your tag on the back of this phone' : 'Tap your tag on the reader';
    k.hidden = false;
    k.innerHTML = `<div class="k-head"><div><b>${esc(periodLabel(p))} · ${esc(p.course)}</b><br><span>${tardyRule(p).replace(/<[^>]+>/g, '')}</span></div>`
      + `<button class="btn" data-act="exit-kiosk">${ic('x')} Exit</button></div>`
      + `<div class="k-center"><div class="k-ring">${ic('nfc')}</div><div class="k-prompt">${esc(prompt)}</div>`
      + `<div class="k-last ${ev ? esc(ev.kind) : ''}">${ev ? `<b>${esc(ev.text)}</b><span>${esc(ev.sub || '')}</span>` : ''}</div></div>`
      + `<div class="k-foot"><span><b class="num">${c.P}</b>present</span><span><b class="num">${c.T}</b>tardy</span><span><b class="num">${c.U}</b>not yet</span></div>`;
  }
  function enterKiosk() {
    if (!S.periods[ui.periodId] || ui.date !== todayStr()) return;
    primeAudio();
    ui.kiosk = true;
    renderKiosk();
    // Start NFC first, while the click still counts as a user gesture for Chrome's permission prompt.
    if (NFC.status().ok && !ui.scanning && editable()) NFC.startScan();
    try {
      const el = document.documentElement;
      const r = el.requestFullscreen && !document.fullscreenElement ? el.requestFullscreen() : null;
      if (r && typeof r.catch === 'function') r.catch(() => {});
    } catch (e) { /* fullscreen is optional */ }
    requestWakeLock();
  }
  function exitKiosk() {
    ui.kiosk = false;
    renderKiosk();
    try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) { /* optional */ }
    if (!ui.scanning) releaseWakeLock();
    scheduleRender();
  }

  /* ============================== Modals ============================== */
  const modal = { open: false, onClose: null };
  function openModal(html, opts = {}) {
    const root = $('#modal-root');
    if (modal.open) closeModal();
    root.innerHTML = `<div class="scrim" data-act="close-modal"></div><div class="modal ${opts.cls || ''}" role="dialog" aria-modal="true" tabindex="-1" aria-label="${esc(opts.label || 'Dialog')}">${html}</div>`;
    modal.open = true;
    modal.onClose = opts.onClose || null;
    // Focus the dialog itself unless it exists to collect typing; on phones a focused field opens the keyboard.
    const f = (opts.focus && root.querySelector(opts.focus)) || root.querySelector('.modal');
    if (f) setTimeout(() => f.focus({ preventScroll: true }), 40);
  }
  function closeModal() {
    if (!modal.open) return;
    NFC.cancelBusy();
    Wedge.capture = null;
    const fn = modal.onClose;
    modal.open = false; modal.onClose = null;
    $('#modal-root').innerHTML = '';
    if (fn) fn();
  }
  const modalHead = (title, sub) => `<div class="m-head"><div><h2>${esc(title)}</h2>${sub ? `<p>${esc(sub)}</p>` : ''}</div><button class="btn ghost icon" data-act="close-modal" aria-label="Close">${ic('x')}</button></div>`;

  function confirmBox({ title, body, okLabel = 'Confirm', danger = false, onOk }) {
    openModal(`${modalHead(title)}<div class="m-body"><p class="m-text">${esc(body)}</p></div>`
      + `<div class="m-foot"><button class="btn" data-act="close-modal">Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" id="confirm-ok">${esc(okLabel)}</button></div>`, { label: title });
    $('#confirm-ok').addEventListener('click', () => { closeModal(); onOk(); });
  }

  function linkResult(ev) {
    beep(ev.kind); buzz(ev.kind);
    const color = TOAST_BG[ev.kind] || 'var(--u)';
    const act = ev.actions && ev.kind === 'unknown' ? ev.actions[0] : null;
    openModal(`<div class="confirm-big"><span class="badge" style="background:${color}">${ic(TOAST_ICON[ev.kind] || 'info').replace('class="ic"', 'class="ic big"')}</span>`
      + `<h2>${esc(ev.text)}</h2><p>${esc(ev.sub || '')}</p></div><div class="m-foot">${act ? `<button class="btn" id="lr-act">${esc(act.label)}</button>` : ''}`
      + `${ev.kind === 'present' || ev.kind === 'tardy' ? `<button class="btn" id="lr-undo">Undo</button>` : ''}<button class="btn primary" data-act="close-modal">Done</button></div>`, { label: 'Check-in' });
    const a = $('#lr-act'); if (a) a.addEventListener('click', () => { closeModal(); act.run(); });
    const u = $('#lr-undo'); if (u) u.addEventListener('click', () => { closeModal(); ev.actions[0].run(); });
  }

  function openPeriodEditor(id) {
    if (!editable()) return;
    const p = id ? S.periods[id] : null;
    const list = periodList();
    const nextNum = list.reduce((m, x) => Math.max(m, x.num), 0) + 1;
    const last = list[list.length - 1];
    const ds = last && toMin(last.end) != null ? minToHM(Math.min(toMin(last.end) + 6, 22 * 60)) : '08:00';
    const de = minToHM(Math.min(toMin(ds) + 50, 23 * 60 + 59));
    openModal(`${modalHead(p ? `Edit ${periodLabel(p)}` : 'Add a period', p ? '' : 'Bell times decide when a tap counts as tardy.')}`
      + `<form id="period-form" class="m-body" novalidate>`
      + `<div class="grid2"><label class="field"><span>Period number</span><input id="pf-num" type="number" min="0" max="20" required value="${p ? p.num : nextNum}"></label>`
      + `<label class="field"><span>Room</span><input id="pf-room" maxlength="20" value="${esc(p ? p.room : '')}" placeholder="214"></label></div>`
      + `<label class="field"><span>Course</span><input id="pf-course" maxlength="60" required value="${esc(p ? p.course : '')}" placeholder="Biology"></label>`
      + `<div class="grid2"><label class="field"><span>Bell rings</span><input id="pf-start" type="time" required value="${esc(p ? p.start : ds)}"></label>`
      + `<label class="field"><span>Class ends</span><input id="pf-end" type="time" required value="${esc(p ? p.end : de)}"></label></div>`
      + `<p class="m-text small" id="pf-err" hidden></p>`
      + `<div class="m-foot">${p ? `<button type="button" class="btn danger spacer" data-act="delete-period" data-id="${esc(p.id)}">${ic('trash')} Delete</button>` : ''}`
      + `<button type="button" class="btn" data-act="close-modal">Cancel</button><button type="submit" class="btn primary">${p ? 'Save changes' : 'Add period'}</button></div></form>`, { label: 'Period', focus: p ? null : '#pf-course' });
    $('#period-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const num = Number($('#pf-num').value);
      const course = $('#pf-course').value.trim();
      const start = $('#pf-start').value, end = $('#pf-end').value;
      const err = $('#pf-err');
      let msg = '';
      if (!Number.isFinite(num) || $('#pf-num').value === '') msg = 'Enter a period number.';
      else if (!course) msg = 'Enter a course name.';
      else if (toMin(start) == null || toMin(end) == null) msg = 'Enter both bell times.';
      else if (toMin(end) <= toMin(start)) msg = 'Class has to end after the bell rings.';
      if (msg) { err.textContent = msg; err.hidden = false; return; }
      const saved = upsertPeriod({ id: p ? p.id : 'p' + rid(8), num, course, room: $('#pf-room').value, start, end });
      closeModal();
      toast({ kind: 'ok', text: p ? 'Period saved' : `${periodLabel(saved)} added`, sub: saved.course });
      if (!p) openPeriod(saved.id); else scheduleRender();
    });
  }
  function confirmDeletePeriod(id) {
    const p = S.periods[id];
    if (!p) return;
    const only = rosterOf(id).filter((s) => s.periods.length === 1).length;
    confirmBox({
      title: `Delete ${periodLabel(p)}?`,
      body: `${p.course} and its schedule will be removed${only ? `, along with ${only} student${only === 1 ? '' : 's'} who aren’t in another period` : ''}. Students in other periods stay. Download a backup first if you might need this later.`,
      okLabel: 'Delete period', danger: true,
      onOk: () => { removePeriod(id); ui.view = 'overview'; ui.periodId = null; toast({ kind: 'info', text: `${periodLabel(p)} deleted` }); scheduleRender(); }
    });
  }

  function parseNames(text) {
    return String(text).split(/\r?\n/).map((l) => l.trim()).filter(Boolean).map((line) => {
      let first = '', last = '';
      if (line.includes('\t')) { const parts = line.split('\t').map((s) => s.trim()).filter(Boolean); first = parts[0] || ''; last = parts.slice(1).join(' '); }
      else if (line.includes(',')) { const i = line.indexOf(','); last = line.slice(0, i).trim(); first = line.slice(i + 1).trim(); }
      else { const parts = line.split(/\s+/); last = parts.length > 1 ? parts.pop() : ''; first = parts.join(' '); }
      return { first: first.slice(0, 40), last: last.slice(0, 40) };
    }).filter((n) => n.first || n.last);
  }
  function openAddStudents(pid) {
    if (!editable()) return;
    const list = periodList();
    openModal(`${modalHead('Add students', 'Paste names from a spreadsheet or type one per line.')}`
      + `<form id="add-form" class="m-body"><label class="field"><span>Names</span><textarea id="af-names" placeholder="Maya Lopez&#10;Nguyen, Kevin&#10;Jordan Brooks"></textarea>`
      + `<small>One student per line. “First Last” and “Last, First” both work.</small></label>`
      + `<div class="field"><span>Periods</span><div class="checks">${list.map((p) => `<label class="check"><input type="checkbox" name="af-p" value="${esc(p.id)}" ${p.id === pid ? 'checked' : ''}> P${esc(p.num)} · ${esc(p.course)}</label>`).join('')}</div></div>`
      + `<p class="m-text small" id="af-err" hidden></p>`
      + `<div class="m-foot"><button type="button" class="btn" data-act="close-modal">Cancel</button><button type="submit" class="btn primary">Add students</button></div></form>`, { label: 'Add students', focus: '#af-names' });
    $('#add-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const names = parseNames($('#af-names').value);
      const periods = Array.from(document.querySelectorAll('input[name="af-p"]:checked')).map((i) => i.value);
      const err = $('#af-err');
      if (!names.length) { err.textContent = 'Type or paste at least one name.'; err.hidden = false; return; }
      if (!periods.length) { err.textContent = 'Pick at least one period.'; err.hidden = false; return; }
      upsertStudents(names.map((n) => ({ id: 's' + rid(9), first: n.first, last: n.last, periods, token: null, uids: [], tagAt: null })));
      closeModal();
      toast({ kind: 'ok', text: `Added ${names.length} student${names.length === 1 ? '' : 's'}`, sub: periods.map((id) => S.periods[id]).filter(Boolean).map(periodLabel).join(', ') });
      scheduleRender();
    });
  }

  /* ----- Student drawer ----- */
  function openStudent(sid) {
    if (!S.students[sid]) return;
    ui.openStudent = sid;
    openModal(studentHtml(sid), { cls: 'drawer', label: 'Student', onClose: () => { ui.openStudent = null; } });
    bindStudentForm(sid);
  }
  function refreshStudent() {
    if (!ui.openStudent || !modal.open) return;
    const box = $('#modal-root .modal');
    if (!box) return;
    box.innerHTML = studentHtml(ui.openStudent);
    bindStudentForm(ui.openStudent);
  }
  function studentHtml(sid) {
    const st = S.students[sid];
    if (!st) return `${modalHead('Student removed')}<p class="m-text">This student is no longer on any roster.</p>`;
    const periods = st.periods.map((id) => S.periods[id]).filter(Boolean).sort((a, b) => a.num - b.num);
    const hasTag = !!(st.token || st.uids.length);
    const nfc = NFC.status();
    const can = editable();
    const tagLine = hasTag ? `Tag linked${st.tagAt ? ` · ${fmtDay(dateStr(new Date(st.tagAt)))}` : ''}` : 'No tag yet';
    const tagDetail = [st.token ? `Tag code ${st.token}` : '', st.uids.length ? `Reader ID ${st.uids.join(', ')}` : ''].filter(Boolean).join(' · ');
    const payload = st.token ? tagPayload(st.token).text : '';
    const hist = periods.map((p) => {
      const h = studentHistory(st, p.id);
      const marked = h.P + h.T + h.A + h.E;
      const rate = marked ? `${pct(h.P + h.T, marked)}%` : '—';
      return `<div class="hrow"><span class="pnum">P${esc(p.num)}</span><div class="cells">${h.cells.length ? h.cells.map((c) => `<span class="cell ${c.s}" title="${esc(fmtDay(c.d))}: ${esc(STATUS[c.s] || 'Not marked')}">${c.s === 'U' ? '·' : c.s}</span>`).join('') : '<span class="m-text small">No sessions yet</span>'}</div><span class="hrate">${rate}</span></div>`;
    }).join('');
    return `<div class="m-head dr-head"><span class="av" style="--h:${hueOf(st.id)}">${esc(initials(st))}</span>`
      + `<div class="dr-title"><h2>${esc(fullName(st))}</h2><p>${esc(periods.map((p) => `P${p.num} ${p.course}`).join(' · ') || 'Not in any period')}</p></div>`
      + `<button class="btn ghost icon" data-act="close-modal" aria-label="Close">${ic('x')}</button></div>`
      + `<section class="dsec first"><h3>NFC tag</h3>`
      + `<div class="tagcard ${hasTag ? 'linked' : ''}">${ic('tag')}<div><b>${esc(tagLine)}</b><span>${esc(tagDetail || 'Write a new tag with an Android phone, or link a tag the student already has.')}</span></div></div>`
      + `${can ? `<div class="row"><button class="btn primary" data-act="write-tag" data-id="${esc(st.id)}" ${nfc.ok ? '' : 'disabled'}>${ic('nfc')} ${hasTag ? 'Write a new tag' : 'Write tag'}</button>`
        + `<button class="btn" data-act="link-tag" data-id="${esc(st.id)}">${ic('link')} Link existing tag</button>`
        + `${hasTag ? `<button class="btn ghost danger" data-act="unlink-tag" data-id="${esc(st.id)}">Remove tag</button>` : ''}</div>`
        + `<p class="m-text small">Already has a TapRoll tag from another class? Choose <b>Link existing tag</b> so one tag works in both classes.</p>` : ''}`
      + `${nfc.ok ? '' : `<p class="m-text small">${esc(nfc.title)}. ${esc(nfc.detail)}</p>`}`
      + `${can ? `<details class="tip"><summary>Write the tag with another app instead</summary><p class="m-text small">Any NFC writer app (NFC Tools works on iPhone and Android) can write this ${tagPayload('x').kind === 'link' ? 'link' : 'text'} to an NTAG sticker or card. TapRoll recognizes the tag once it’s written.</p>`
        + `<div class="payload"><code id="payload-code">${payload ? esc(payload) : 'A code is created when you copy.'}</code><button class="btn sm" data-act="copy-payload" data-id="${esc(st.id)}">${ic('copy')} Copy</button></div></details>` : ''}`
      + `<div id="tag-op"></div></section>`
      + `<section class="dsec"><h3>Last 15 class sessions</h3><div class="hist">${hist || '<p class="m-text small">Not in any period.</p>'}</div></section>`
      + `${can ? `<section class="dsec"><h3>Details</h3><form id="stu-form" class="m-body"><div class="grid2"><label class="field"><span>First name</span><input id="sf-first" maxlength="40" value="${esc(st.first)}"></label>`
        + `<label class="field"><span>Last name</span><input id="sf-last" maxlength="40" value="${esc(st.last)}"></label></div>`
        + `<div class="field"><span>Periods</span><div class="checks">${periodList().map((p) => `<label class="check"><input type="checkbox" name="sp" value="${esc(p.id)}" ${st.periods.includes(p.id) ? 'checked' : ''}> P${esc(p.num)} · ${esc(p.course)}</label>`).join('')}</div></div>`
        + `<p class="m-text small" id="sf-err" hidden></p>`
        + `<div class="m-foot"><button type="button" class="btn danger spacer" data-act="delete-student" data-id="${esc(st.id)}">${ic('trash')} Remove student</button><button type="submit" class="btn primary">Save</button></div></form></section>` : ''}`;
  }
  function bindStudentForm(sid) {
    const form = $('#stu-form');
    if (!form) return;
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const st = S.students[sid];
      if (!st) return;
      const first = $('#sf-first').value.trim(), last = $('#sf-last').value.trim();
      const periods = Array.from(form.querySelectorAll('input[name="sp"]:checked')).map((i) => i.value);
      const err = $('#sf-err');
      if (!first && !last) { err.textContent = 'Enter a name.'; err.hidden = false; return; }
      if (!periods.length) { err.textContent = 'Keep at least one period, or remove the student instead.'; err.hidden = false; return; }
      upsertStudent({ ...st, first, last, periods });
      refreshStudent();
      toast({ kind: 'ok', text: 'Student saved', sub: `${first} ${last}`.trim() });
      scheduleRender();
    });
  }
  function opStatus(kind, text, cancelable) {
    const el = $('#tag-op');
    if (!el) return;
    if (!kind) { el.innerHTML = ''; return; }
    el.innerHTML = `<div class="opstatus ${kind}">${kind === 'wait' ? '<span class="pulse"></span>' : ic(kind === 'ok' ? 'check' : 'alert')}<p>${esc(text)}</p>`
      + `${cancelable ? '<button class="btn sm" data-act="cancel-op">Cancel</button>' : ''}</div>`;
  }

  // Writing a tag gives it a fresh code; whoever had that physical tag before loses it.
  async function writeTag(sid) {
    const st = S.students[sid];
    if (!st || !editable()) return;
    primeAudio();
    const token = rid(12);
    opStatus('wait', `Hold a blank or old tag to the back of the phone to write ${st.first || 'this student'}’s tag…`, true);
    try {
      const res = await NFC.session(tagRecords(token));
      const changes = [];
      let prevOwner = null;
      for (const other of Object.values(S.students)) {
        if (other.id === sid) continue;
        const hadToken = !!(res.before && res.before.token && other.token === res.before.token);
        const hadUid = !!(res.serial && uidIn(other.uids, res.serial));
        if (hadToken || hadUid) {
          prevOwner = other;
          changes.push({ ...other, token: hadToken ? null : other.token, uids: res.serial ? other.uids.filter((u) => !uidIn([u], res.serial)) : other.uids });
        }
      }
      const fresh = S.students[sid];
      if (!fresh) return;
      changes.push({ ...fresh, token, uids: res.serial ? [res.serial] : [], tagAt: Date.now() });
      upsertStudents(changes);
      refreshStudent();
      const foreign = !!(res.before && res.before.token) && !prevOwner && fresh.token !== res.before.token;
      opStatus('ok', `Tag written for ${fullName(fresh)}.${prevOwner ? ` It used to be ${fullName(prevOwner)}’s tag, so ${prevOwner.first || 'they'} will need a new one.` : ''}${foreign ? ' This tag was set up for another class before, so that class needs to link it again.' : ''}`);
      beep('present'); buzz('present');
      scheduleRender();
    } catch (err) {
      if (err && err.name === 'AbortError') { opStatus(null); return; }
      opStatus('err', tagErrorText(err));
    }
  }
  // Links a tag the student already has (for example one set up in another teacher's class) without rewriting it.
  function linkExisting(sid) {
    const st = S.students[sid];
    if (!st || !editable()) return;
    NFC.cancelBusy();
    const nfcOk = NFC.status().ok;
    const who = st.first || 'the student';
    opStatus('wait', nfcOk ? `Hold ${who}’s tag to the back of this phone, or tap it on a USB reader…` : `Tap ${who}’s tag on the USB reader now…`, true);
    let done = false;
    const finish = (found) => {
      if (done) return;
      done = true;
      Wedge.capture = null;
      NFC.cancelBusy();
      applyLink(sid, found);
    };
    Wedge.capture = (code) => finish({ uid: code });
    if (nfcOk) {
      NFC.session(null)
        .then((res) => finish({ serial: res.serial, token: res.before && res.before.token }))
        .catch((err) => {
          if (done || (err && err.name === 'AbortError')) return;
          done = true;
          Wedge.capture = null;
          opStatus('err', tagErrorText(err));
        });
    }
  }
  function applyLink(sid, found) {
    const fresh = S.students[sid];
    if (!fresh) return;
    const code = found.uid || found.serial || null;
    const token = found.token || null;
    if (!code && !token) { opStatus('err', 'TapRoll couldn’t read an ID from that tag. Write a new tag instead.'); return; }
    if ((!token || fresh.token === token) && (!code || uidIn(fresh.uids, code))) { opStatus('ok', `That tag is already linked to ${fullName(fresh)}.`); return; }
    const changes = [];
    let prevOwner = null;
    for (const other of Object.values(S.students)) {
      if (other.id === sid) continue;
      const hadToken = !!(token && other.token === token);
      const hadUid = !!(code && uidIn(other.uids, code));
      if (hadToken || hadUid) {
        prevOwner = other;
        changes.push({ ...other, token: hadToken ? null : other.token, uids: code ? other.uids.filter((u) => !uidIn([u], code)) : other.uids });
      }
    }
    changes.push({ ...fresh, token: token || fresh.token, uids: code && !uidIn(fresh.uids, code) ? [...fresh.uids, code] : fresh.uids, tagAt: Date.now() });
    upsertStudents(changes);
    refreshStudent();
    opStatus('ok', `Linked this tag to ${fullName(fresh)}.${prevOwner ? ` It used to be ${fullName(prevOwner)}’s tag.` : ''}${token ? ' It keeps working in any other class that uses it.' : ''}`);
    beep('present');
    scheduleRender();
  }
  function confirmUnlink(sid) {
    const st = S.students[sid];
    if (!st) return;
    confirmBox({
      title: `Remove ${st.first || 'this student'}’s tag?`,

  function confirmDeleteStudent(sid) {

  async function copyPayload(sid) {
    let st = S.students[sid];
    if (!st || !editable()) return;
    if (!st.token) { upsertStudent({ ...st, token: rid(12), tagAt: Date.now() }); st = S.students[sid]; }
    const text = tagPayload(st.token).text;

    }

  }

    $('#assign-q').addEventListener('input', (e) => {

  function toolStatus(kind, html, cancelable) {
    const el = $('#tool-result');
    if (!el) return;
    el.innerHTML = kind ? `<div class="opstatus ${kind}">${kind === 'wait' ? '<span class="pulse"></span>' : ic(kind === 'ok' ? 'check' : kind === 'err' ? 'alert' : 'info')}<p>${html}</p>${cancelable ? '<button class="btn sm" data-act="cancel-op">Cancel</button>' : ''}</div>` : '';
  }
  async function identifyTag() {
    Wedge.capture = null;
    toolStatus('wait', 'Hold a tag to the back of the phone…', true);
    try {
      const res = await NFC.session(null);
      const b = res.before;
      const st = (b && findByToken(b.token)) || findByUid(res.serial);
      const parts = [];
      parts.push(st ? `<b>${esc(fullName(st))}</b> · ${esc(st.periods.map((id) => S.periods[id]).filter(Boolean).map(periodLabel).join(', ') || 'no period')}` : '<b>Not linked to a student.</b>');
      if (!b) parts.push('The tag was detected but its data couldn’t be read. It may be blank or an unsupported type.');
      else if (b.empty) parts.push('The tag is blank and ready to write.');
      else {
        if (b.urls.length) parts.push(`Link: ${esc(b.urls.join(', '))}`);
        if (b.texts.length) parts.push(`Text: ${esc(b.texts.join(', '))}`);
        if (b.other) parts.push(`${b.other} other record${b.other === 1 ? '' : 's'}`);
      }
      if (res.serial) parts.push(`Serial ${esc(res.serial)}`);
      toolStatus(st ? 'ok' : 'info', parts.join('<br>'));
    } catch (err) {
      if (err && err.name === 'AbortError') { toolStatus(null); return; }
      toolStatus('err', esc(tagErrorText(err)));
    }
  }
  function testUsb() {
    NFC.cancelBusy();

      const st = findByUid(code);
      toolStatus('ok', `Reader works. It typed <code>${esc(code)}</code>.<br>${st ? `That tag belongs to <b>${esc(fullName(st))}</b>.` : 'That tag isn’t linked to a student yet. Link it from the student’s page.'}`);

  }

  const csvCell = (v) => { const s = String(v == null ? '' : v); return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const toCsv = (rows) => rows.map((r) => r.map(csvCell).join(',')).join('\r\n');
  const HEAD = ['Date', 'Period', 'Course', 'Last name', 'First name', 'Status', 'Time', 'How'];
  function rowsFor(date, p) {
    const marks = marksOf(date, p.id);
    return rosterOf(p.id).map((st) => { const mk = marks[st.id]; return [date, p.num, p.course, st.last, st.first, mk ? STATUS[mk.s] : 'Not marked', mk ? fmtClock(mk.t) : '', mk ? (METHOD[mk.m] || mk.m) : '']; });
  }
  function exportPeriodCsv() {
    const p = S.periods[ui.periodId];
    if (!p) return;
    saveFile(`attendance-period-${p.num}-${ui.date}.csv`, toCsv([HEAD, ...rowsFor(ui.date, p)]));
  }
  function exportAllCsv() {
    const rows = [HEAD];
    for (const date of Object.keys(S.days).sort()) for (const p of periodList()) if (S.days[date][p.id]) rows.push(...rowsFor(date, p));
    if (rows.length === 1) { toast({ kind: 'info', text: 'Nothing to export yet', sub: 'Take attendance first.' }); return; }
    saveFile(`attendance-all-${todayStr()}.csv`, toCsv(rows));
  }
  function exportBackup() {
    const settings = { ...S.settings };
    ['ws', 'name', 'email', 'createdAt', 'sampleDate'].forEach((k) => { delete settings[k]; });
    const data = { app: 'TapRoll', version: 1, exportedAt: new Date().toISOString(), data: { settings, periods: S.periods, students: S.students, days: S.days } };
    saveFile(`taproll-backup-${todayStr()}.json`, JSON.stringify(data));
  }
  async function saveFile(filename, text) {
    const inViewer = !!(window.claude && typeof window.claude.use === 'function');
    if (inViewer) {
      try {
        const dl = await window.claude.use('downloads');
        if (dl) { await dl.save({ filename, data: text }); toast({ kind: 'ok', text: 'Saved', sub: filename }); return; }
      } catch (e) {
        if (e && e.code === 'declined') return;
        if (e && e.code === 'rate_limited') { toast({ kind: 'info', text: 'Finish the open save first' }); return; }
      }
      if (NFC.framed) { toast({ kind: 'warn', text: 'Downloads aren’t available here', sub: 'Open the hosted site to download files.' }); return; }
    }
    try {
      const type = filename.endsWith('.json') ? 'application/json' : 'text/csv';
      const url = URL.createObjectURL(new Blob([text], { type }));
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast({ kind: 'ok', text: 'Downloaded', sub: filename });
    } catch (e) { toast({ kind: 'warn', text: 'Couldn’t download the file', sub: 'Your browser blocked it.' }); }
  }
  function importBackup(file) {
    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try { parsed = JSON.parse(String(reader.result)); } catch (e) { toast({ kind: 'warn', text: 'That file isn’t a TapRoll backup', sub: 'Choose the .json file you downloaded from Settings.' }); return; }
      const state = normalizeState(isObj(parsed) && isObj(parsed.data) ? parsed.data : parsed);
      const np = Object.keys(state.periods).length, ns = Object.keys(state.students).length;
      if (!np && !ns) { toast({ kind: 'warn', text: 'No classes found in that file', sub: 'Choose a backup that has periods and students.' }); return; }
      confirmBox({
        title: 'Replace everything with this backup?',
        body: `The backup has ${np} period${np === 1 ? '' : 's'} and ${ns} student${ns === 1 ? '' : 's'}. Your current rosters and attendance will be replaced.`,
        okLabel: 'Restore backup', danger: true,
        onOk: () => { replaceAll(state, false); toast({ kind: 'ok', text: 'Backup restored' }); }
      });
    };
    reader.readAsText(file);
  }
  function resetView() {
    ui.view = 'overview'; ui.periodId = null; ui.date = todayStr(); ui.feed = []; ui.hideSample = false; ui.filter = 'all'; ui.search = '';
  }
  function replaceAll(state, sample) {
    const keep = {
      school: S.settings.school || (sample ? '' : state.settings.school) || '',
      teacher: S.settings.teacher || (sample ? '' : state.settings.teacher) || '',
      graceMin: Number.isFinite(Number(state.settings.graceMin)) ? Number(state.settings.graceMin) : 5,
      tagBase: S.settings.tagBase || state.settings.tagBase || ''
    };
    NFC.stopScan(true);
    if (Store.mode === 'fs') {
      const old = Store.ws;
      const ws = (sample ? 'demo-' : 'ws-') + rid(6);
      Store.switchWs(ws, true);
      S.periods = state.periods; S.students = state.students; S.days = state.days;
      const base = `${Store.root}/ws/${ws}`;
      Store.write(`${base}/meta/periods`, { periods: state.periods });
      Store.write(`${base}/meta/roster`, { students: state.students });
      for (const [date, per] of Object.entries(state.days)) Store.write(`${base}/days/${date}`, { date, periods: per });
      setSettings({ ...keep, ws, sample });
      Store.purgeWs(old);
    } else {
      S = { settings: { ...S.settings, ...keep, sample }, periods: state.periods, students: state.students, days: state.days };
      Store.saveLocalSoon();
    }
    resetView();
    pickInitialView();
    dataChanged();
  }

  function startFresh() {

  /* ============================== Navigation & events ============================== */
  function openPeriod(id) {

  function pickInitialView() {

  /* ============================== Start ============================== */
  function init() {

  /* ============================== Accounts ==============================
     Device accounts need no setup. They live in this browser, with passwords hashed (PBKDF2, SHA-256).
     Cloud accounts use Firebase Authentication once config.js holds a Firebase web config.
     Then teachers sign in with email or Google on any device, and their classes sync through Firestore.
     The example classroom needs no account at all. */
  const SESSION_KEY = 'taproll.session.v1';
  const LEGACY_KEY = 'taproll.data.v1';          // data saved before sign-in existed
  const LEGACY_DONE_KEY = 'taproll.legacy.done';
  const DEMO_KEY = 'taproll.data.demo';
  const dataKey = (id) => `taproll.data.acct.${id}`;

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { /* storage blocked */ } }
  const toB64 = (bytes) => btoa(String.fromCharCode(...new Uint8Array(bytes)));
  const fromB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const normEmail = (e) => String(e || '').trim().toLowerCase();
  const validEmail = (e) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(e || '').trim());
  const authErr = (code) => Object.assign(new Error(code), { code });
  function firstName(name) {
    const n = String(name || '').trim();
    if (/^(mr|mrs|ms|mx|dr|coach)\.?\s/i.test(n)) return n;
    return n.split(/\s+/)[0] || 'there';
  }

  /* ----- Device accounts ----- */
  const Device = {
    KEY: 'taproll.accounts.v1', ITER: 250000, mem: null,
    blank() { return { v: 1, accounts: {}, current: null }; },
    read() {
      if (this.mem) return this.mem;
      try { const r = JSON.parse(localStorage.getItem(this.KEY) || 'null'); if (isObj(r) && isObj(r.accounts)) return r; } catch (e) { /* blocked or unreadable */ }
      return this.blank();
    },
    // Falls back to memory when the browser blocks storage, so sign-in still works until the page closes.
    write(reg) { if (lsSet(this.KEY, JSON.stringify(reg))) { this.mem = null; return true; } this.mem = reg; return false; },
    find(reg, email) { const e = normEmail(email); return Object.values(reg.accounts).find((a) => a.email === e) || null; },
    async derive(password, salt, iterations) {
      if (!(window.crypto && crypto.subtle)) throw authErr('no-crypto');
      const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
      const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations }, key, 256);
      return toB64(bits);
    },
    async create({ name, school, email, password }) {
      const reg = this.read();
      if (this.find(reg, email)) throw authErr('email-in-use');
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const hash = await this.derive(password, salt, this.ITER);
      const acct = { id: 'a' + rid(10), name, school, email: normEmail(email), salt: toB64(salt), hash, iter: this.ITER, created: Date.now() };
      reg.accounts[acct.id] = acct;
      reg.current = acct.id;
      this.write(reg);
      return acct;
    },
    async signIn(email, password) {
      const reg = this.read();
      const acct = this.find(reg, email);
      // Hash even for an unknown email, so both cases take the same time.
      const hash = await this.derive(password, acct ? fromB64(acct.salt) : new Uint8Array(16), acct ? acct.iter : this.ITER);
      if (!acct || hash !== acct.hash) throw authErr('bad-credentials');
      reg.current = acct.id;
      this.write(reg);
      return acct;
    },
    current() { const reg = this.read(); return (reg.current && reg.accounts[reg.current]) || null; },
    signOut() { const reg = this.read(); reg.current = null; this.write(reg); },
    update(id, patch) { const reg = this.read(); if (!reg.accounts[id]) return; Object.assign(reg.accounts[id], patch); this.write(reg); },
    async changePassword(id, current, next) {
      const reg = this.read();

      if (await this.derive(current, fromB64(acct.salt), acct.iter) !== acct.hash) throw authErr('bad-current');
      const salt = crypto.getRandomValues(new Uint8Array(16));
      acct.hash = await this.derive(next, salt, this.ITER);
      acct.salt = toB64(salt);
      acct.iter = this.ITER;
      this.write(reg);
    },
    remove(id) { const reg = this.read(); delete reg.accounts[id]; if (reg.current === id) reg.current = null; this.write(reg); lsDel(dataKey(id)); }
  };

  /* ----- Cloud accounts (Firebase) ----- */
  const FIREBASE_VERSION = '12.19.0';
  const FIREBASE_CDN = `https://cdn.jsdelivr.net/npm/firebase@${FIREBASE_VERSION}/`;
  const Cloud = {
    cfg: null, auth: null, fs: null, state: 'off', pendingProfile: null,
    // config.js may set window.TAPROLL_FIREBASE, or simply hold Firebase's own `const firebaseConfig = {...}` block.
    readConfig() {
      let c = null;
      try { c = window.TAPROLL_FIREBASE || null; } catch (e) { c = null; }
      if (!c) { try { c = typeof firebaseConfig !== 'undefined' ? firebaseConfig : null; } catch (e) { c = null; } }
      if (!isObj(c)) return null;
      const filled = ['apiKey', 'authDomain', 'projectId'].every((k) => typeof c[k] === 'string' && c[k].trim() && !/^(paste|your)/i.test(c[k].trim()));
      return filled ? c : null;
    },
    async init(cfg) {
      this.cfg = cfg;
      this.state = 'loading';
      try {
        await loadFirebase();
        const fb = window.firebase;
        if (!fb.apps.length) fb.initializeApp(cfg);
        this.auth = fb.auth();
        this.fs = fb.firestore();
        // For local testing only: { emulators: { auth: 'http://127.0.0.1:9099', firestore: '127.0.0.1:8080' } }
        const emu = isObj(cfg.emulators) ? cfg.emulators : null;
        if (emu && emu.auth) this.auth.useEmulator(emu.auth);
        if (emu && emu.firestore) { const m = /^(.+):(\d+)$/.exec(String(emu.firestore)); if (m) this.fs.useEmulator(m[1], Number(m[2])); }

        try { const r = this.fs.enablePersistence({ synchronizeTabs: true }); if (r && r.catch) r.catch(() => {}); } catch (e) { /* optional */ }

        this.state = 'error';

  function loadScript(src) {

      const jobs = [];
      if (!window.firebase.auth) jobs.push(loadScript(FIREBASE_CDN + 'firebase-auth-compat.js'));
      if (!window.firebase.firestore) jobs.push(loadScript(FIREBASE_CDN + 'firebase-firestore-compat.js'));
      await Promise.all(jobs);

  // Made-up check-ins for the preview card on the sign-in page.
  const LIVE_ROWS = [
    ['Maya Patel', 'P', '9:49'], ['Jordan Brooks', 'P', '9:50'], ['Aiden Nguyen', 'P', '9:50'], ['Sofia Ramirez', 'P', '9:51'],
    ['Leo Santos', 'P', '9:51'], ['Imani Okafor', 'P', '9:52'], ['Ethan Cho', 'P', '9:52'], ['Kai Hernandez', 'T', '9:58'], ['Grace Kim', 'T', '10:01']
  ];
  const LIVE_BASE = 14, LIVE_TOTAL = 24, LIVE_START = 4;
  function liveRow(r, enter) {

    const c = liveCounts(shown);

  }
  function liveCard() {
    const rows = LIVE_ROWS.slice(0, LIVE_START).reverse().map((r) => liveRow(r)).join('');

      + `<span class="lv-live"><i></i>Live</span></div>`
      + `<div class="lv-count"><b class="num" id="lv-n">${liveCounts(LIVE_START).n}</b><span>/${LIVE_TOTAL} checked in</span></div>`

  const WAVES = '<svg class="ab-waves" viewBox="0 0 400 400" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round">'

  function brandPanel() {

  function authMessage(err) {
    const code = String((err && err.code) || '').replace(/^auth\//, '');
    const mismatch = 'That email and password don’t match.';
    const map = {
      'bad-credentials': mismatch, 'invalid-credential': mismatch, 'wrong-password': mismatch, 'user-not-found': mismatch, 'invalid-login-credentials': mismatch,
      'email-in-use': 'There’s already an account for this email on this device. Sign in instead.',
      'email-already-in-use': 'There’s already an account for this email. Sign in instead.',
      'weak-password': 'Use at least 8 characters for your password.',
      'invalid-email': 'Enter a valid email address.',
      'missing-password': 'Enter your password.',
      'missing-email': 'Enter your email address.',
      'too-many-requests': 'Too many tries. Wait a few minutes, or reset your password.',
      'user-disabled': 'This account has been turned off.',
      'network-request-failed': 'Can’t reach the sign-in service. Check your internet connection.',
      'popup-blocked': 'Your browser blocked the Google window. Allow pop-ups for this site, then try again.',
      'operation-not-allowed': 'This sign-in method is turned off in Firebase. Turn it on under Authentication › Sign-in method.',
      'unauthorized-domain': `Firebase doesn’t allow sign-in from ${location.hostname}. Add it under Authentication › Settings › Authorized domains.`,
      'account-exists-with-different-credential': 'This email already signs in with a password. Use your email and password.',
      'cloud-unavailable': 'Sign-in isn’t connected. Check your internet connection, then reload the page.',
      'no-crypto': 'This browser can’t create accounts here. Open TapRoll from its https address.'
    };
    if (map[code]) return map[code];
    if (/api-key/.test(code)) return 'Firebase didn’t accept the settings in config.js. Copy the firebaseConfig block again.';
    return 'Something went wrong. Try again.';
  }
  function onAuthSubmit(e) {
    const form = e.target && e.target.closest ? e.target.closest('form[data-form]') : null;
    if (!form) return;
    e.preventDefault();
    if (form.dataset.form === 'change-pw') { submitChangePassword(form); return; }
    if (authUI.busy) return;
    captureAuthFields();
    if (form.dataset.form === 'signin') submitSignIn(form);

    else if (form.dataset.form === 'reset') submitReset(form);

  async function submitSignIn(form) {
    const email = form.elements.email.value.trim(), pw = form.elements.password.value;
    if (!validEmail(email)) { showAuthError('Enter a valid email address.', 'au-email'); return; }
    if (!pw) { showAuthError('Enter your password.', 'au-pw'); return; }
    setAuthBusy(true, 'submit', 'Signing in…');
    try {
      if (Cloud.cfg) { requireCloud(); await Cloud.auth.signInWithEmailAndPassword(email, pw); }
      else startDevice(await Device.signIn(email, pw));
    } catch (err) {
      setAuthBusy(false);
      showAuthError(authMessage(err), /password|credential|not-found/.test(String(err && err.code)) ? 'au-pw' : null);
      return;
    }
    setAuthBusy(false);
  }
  async function submitSignUp(form) {
    const name = form.elements.name.value.trim(), school = form.elements.school.value.trim();
    const email = form.elements.email.value.trim(), pw = form.elements.password.value;
    if (!name) { showAuthError('Enter your name.', 'au-name'); return; }
    if (!validEmail(email)) { showAuthError('Enter a valid email address.', 'au-email'); return; }
    if (pw.length < 8) { showAuthError('Use at least 8 characters for your password.', 'au-pw'); return; }
    setAuthBusy(true, 'submit', 'Creating account…');
    try {
      if (Cloud.cfg) {
        requireCloud();
        Cloud.pendingProfile = { name, school };
        const cred = await Cloud.auth.createUserWithEmailAndPassword(email, pw);
        try { await cred.user.updateProfile({ displayName: name }); } catch (e) { /* the profile document holds the name too */ }
      } else {
        startDevice(await Device.create({ name, school, email, password: pw }));
      }
    } catch (err) {
      Cloud.pendingProfile = null;
      setAuthBusy(false);
      const code = String(err && err.code);
      showAuthError(authMessage(err), /email/.test(code) ? 'au-email' : (/password/.test(code) ? 'au-pw' : null));
      return;
    }
    setAuthBusy(false);
    authUI.name = ''; authUI.school = '';
    toast({ kind: 'ok', text: `Welcome, ${firstName(name)}`, sub: 'Add your first period to get started.' });
  }
  async function submitReset(form) {
    const email = form.elements.email.value.trim();
    if (!validEmail(email)) { showAuthError('Enter a valid email address.', 'au-email'); return; }
    setAuthBusy(true, 'submit', 'Sending…');
    try { requireCloud(); await Cloud.auth.sendPasswordResetEmail(email); }
    catch (err) {
      // Don't reveal whether an account exists for this email.
      if (!/user-not-found/.test(String(err && err.code))) { setAuthBusy(false); showAuthError(authMessage(err), 'au-email'); return; }
    }
    setAuthBusy(false);
    authUI.email = email;
    authUI.view = 'reset-sent';
    renderAuth();
  }
  function signInGoogle() {

    setAuthBusy(true, 'google', 'Waiting for Google…');
    // Called straight from the click, so browsers allow the Google window to open.
    Cloud.auth.signInWithPopup(provider).then(() => setAuthBusy(false)).catch((err) => {
      setAuthBusy(false);
      const code = String((err && err.code) || '');
      if (/popup-closed-by-user|cancelled-popup-request|user-cancelled/.test(code)) return;

    if (!isObj(raw) || !isObj(raw.periods)) return null;

  /* ============================== Cloud sign-in setup guide ============================== */

service cloud.firestore {
  match /databases/{database}/documents {
    // Each teacher can read and write only their own classes.

      allow read, write: if request.auth != null && request.auth.uid == uid;

}`;
  function cloudStatus() {

    if (Cloud.state === 'ready') return { kind: 'ok', icon: 'check', text: 'Cloud sign-in is on for this site.' };
    if (Cloud.state === 'error') return { kind: 'err', icon: 'alert', text: 'config.js is filled in, but Firebase didn’t load. Check your connection and the values you pasted, then reload.' };
    if (c.error) return { kind: 'err', icon: 'alert', text: `config.js has a mistake (${c.error}). Paste only the firebaseConfig block.` };
    if (c.missing || !c.loaded) return { kind: 'info', icon: 'info', text: 'There’s no config.js next to app.html yet, so accounts are saved on each device.' };
    return { kind: 'info', icon: 'info', text: 'config.js is there but still empty. Paste your Firebase values into it.' };
  }
  const setupStep = (title, body) => `<li><div><b>${esc(title)}.</b> ${body}</div></li>`;
  const codeBlock = (id, text) => `<div class="codeblock"><pre id="${id}">${esc(text)}</pre><button type="button" class="btn sm" data-act="copy-text" data-target="${id}">${ic('copy')} Copy</button></div>`;
  function openSetupGuide() {
    const st = cloudStatus();
    const host = BUILD_TARGET === 'site' && location.hostname && !/^(localhost|127\.|\[)/.test(location.hostname) ? location.hostname : 'yourname.github.io';
    openModal(`${modalHead('Set up cloud sign-in', 'A free Firebase project lets teachers sign in with email or Google on any device, with classes that stay in sync.')}<div class="m-body">`
      + `<div class="opstatus ${st.kind}">${ic(st.icon)}<p>${esc(st.text)}</p></div><ol class="steps">`
      + setupStep('Create a Firebase project', 'Go to <a href="https://console.firebase.google.com" target="_blank" rel="noopener">console.firebase.google.com</a>, choose <b>Create a project</b>, and name it TapRoll. You can turn off Google Analytics.')
      + setupStep('Register a web app', 'On the project’s home page, click the web icon <code>&lt;/&gt;</code>, name the app TapRoll, and click <b>Register app</b>. Firebase shows a <code>firebaseConfig</code> block. Keep that page open.')
      + setupStep('Turn on sign-in', 'Open <b>Authentication</b>, click <b>Get started</b>, then enable <b>Email/Password</b> and <b>Google</b>.')
      + setupStep('Allow your site', `In Authentication, open <b>Settings › Authorized domains</b> and add <code>${esc(host)}</code>.`)
      + setupStep('Create the database', 'Open <b>Firestore Database</b>, click <b>Create database</b>, keep the defaults, and start in <b>production mode</b>.')
      + setupStep('Paste these rules', `In Firestore, open the <b>Rules</b> tab, replace everything with these rules, and click <b>Publish</b>. Each teacher can then read and write only their own classes.${codeBlock('rules-code', FIRESTORE_RULES)}`)
      + setupStep('Fill in config.js', 'Copy the <code>const firebaseConfig = { … };</code> block from step 2 and paste it into <code>config.js</code> in place of everything there. Upload <code>config.js</code> to the same folder as <code>app.html</code>. You can find the block again later under <b>Project settings › General › Your apps</b>.')
      + setupStep('Reload TapRoll', 'GitHub can take a few minutes to update. Then the sign-in page shows <b>Continue with Google</b>, and classes sync across devices.')
      + `</ol><p class="m-text small">Accounts made on a device before the switch stay on that device. To move classes over, download a backup in Settings, sign in with your new account, and restore it.</p></div>`,
    { cls: 'wide', label: 'Set up cloud sign-in' });
  }

  init();
})();
</script>
</body>
</html>
