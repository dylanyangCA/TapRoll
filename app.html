  /* ============================== Storage ==============================
     Each signed-in teacher's data lives in one place:
       Device accounts and the example classroom: this browser's localStorage, one key per account.
       Cloud accounts: Firestore, under the teacher's own document:
         teachers/<uid>                          { name, email, school, teacher, graceMin, tagBase, ws, sample }
         teachers/<uid>/ws/<ws>/meta/periods     { periods: { <id>: period | null } }
         teachers/<uid>/ws/<ws>/meta/roster      { students: { <id>: student | null } }
         teachers/<uid>/ws/<ws>/days/<date>      { date, periods: { <periodId>: { <studentId>: mark | null } } }
       Cloud writes send only what changed and merge, so a phone and a laptop can mark students at the same time.
       null marks a deleted entry. "ws" is a workspace id: Start fresh and imports switch to a new one. */
  const Store = {
    mode: 'none', key: null, timer: null,
    fs: null, root: '', ws: null, unsubs: [], wsUnsubs: [], pendingWrites: 0,
    graceTimer: null, graceDone: false, lastSettings: null, profileWritten: false, onNewProfile: null,
    loaded: { settings: true, periods: true, roster: true, days: true },

    localWorks() { try { localStorage.setItem('taproll.probe', '1'); localStorage.removeItem('taproll.probe'); return true; } catch (e) { return false; } },
    readKey(key) { try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } },
    setLoaded(v) { this.loaded = { settings: v, periods: v, roster: v, days: v }; },

    // Device accounts and the example classroom.
    openLocal(key, makeInitial) {
      this.close();
      this.key = key;
      this.mode = this.localWorks() ? 'local' : 'memory';
      const saved = this.mode === 'local' ? this.readKey(key) : null;
      if (saved && isObj(saved) && isObj(saved.periods)) S = normalizeState(saved);
      else { S = makeInitial ? makeInitial() : emptyState(); this.saveLocalSoon(); }
      this.setLoaded(true);
    },
    // Cloud accounts.
    openFirestore(fs, uid) {
      this.close();
      this.mode = 'fs'; this.fs = fs; this.root = `teachers/${uid}`;
      this.graceDone = false; this.profileWritten = false; this.lastSettings = null;
      S = emptyState();
      this.setLoaded(false);
      this.unsubs.push(fs.doc(this.root).onSnapshot((snap) => this.onSettings(snap), (e) => this.subFailed(e)));
    },
    close() {
      this.flushLocal();
      [...this.unsubs, ...this.wsUnsubs].forEach((u) => { try { u(); } catch (e) { /* already closed */ } });
      this.unsubs = []; this.wsUnsubs = [];
      clearTimeout(this.graceTimer); this.graceTimer = null;
      this.mode = 'none'; this.key = null; this.fs = null; this.root = ''; this.ws = null; this.pendingWrites = 0;
      this.onNewProfile = null;
      S = emptyState();
      this.setLoaded(true);
    },

    flushLocal() {
      clearTimeout(this.timer); this.timer = null;
      if (this.mode !== 'local' || !this.key) return;
      try { localStorage.setItem(this.key, JSON.stringify(S)); }
      catch (e) { toast({ kind: 'warn', text: 'Couldn’t save on this device', sub: 'Browser storage is full or blocked. Download a backup from Settings.' }); }
    },
    saveLocalSoon() { if (this.mode !== 'local') return; clearTimeout(this.timer); this.timer = setTimeout(() => this.flushLocal(), 200); },
    persist(change) { if (this.mode === 'fs') this.write(this.pathOf(change), change.patch); else this.saveLocalSoon(); },
    pathOf(c) {
      if (c.doc === 'settings') return this.root;
      const base = `${this.root}/ws/${this.ws}`;
      if (c.doc === 'periods') return `${base}/meta/periods`;
      if (c.doc === 'roster') return `${base}/meta/roster`;
      return `${base}/days/${c.date}`;
    },
    // Firestore applies the write locally right away and keeps it queued while offline.
    write(path, patch) {
      if (this.mode !== 'fs') return;
      this.pendingWrites++;
      setSyncState();
      let p;
      try { p = this.fs.doc(path).set(clone(patch), { merge: true }); } catch (err) { p = Promise.reject(err); }
      Promise.resolve(p)
        .catch((err) => this.writeFailed(err, path))
        .finally(() => { this.pendingWrites = Math.max(0, this.pendingWrites - 1); setSyncState(); });
    },
    writeFailed(err, path) {
      const code = String((err && err.code) || '');
      console.warn('TapRoll: a change was not saved', path, err);
      if (code === 'permission-denied') {
        ui.syncError = 'permission-denied';
        if (!ui.readOnly) { ui.readOnly = true; toast({ kind: 'warn', text: 'Changes aren’t being saved', sub: 'Your Firestore rules are blocking this account. Check them in the setup guide.' }); }
        scheduleRender();
      } else if (code === 'resource-exhausted') toast({ kind: 'warn', text: 'Daily free limit reached', sub: 'Firebase’s free plan resets each day. Try again later.' });
      else if (code === 'unauthenticated') toast({ kind: 'warn', text: 'You’re signed out', sub: 'Sign in again to keep saving.' });
      else toast({ kind: 'warn', text: 'Couldn’t save a change', sub: 'Check your connection, then try again.' });
    },

    if (open && ui.date !== today) return { reason: 'Switch to today to check students in.' };
    // The bell schedule decides first. So when period 1 ends at 8:00 and period 2's bell rings at 8:05, a tap at
    // 8:02 counts for period 2, even if period 1 is still open on this screen.
    const timed = st ? scheduledPeriod(st) : null;
    if (timed) return { pid: timed.id, date: today };
    // Outside the schedule, taps go to the period open on screen (for example, checking in early before class).
    if (open) return { pid: open.id, date: today };
    const cur = currentPeriod();
    if (cur) return { pid: cur.id, date: today };
    return { reason: 'No period is in session. Open a period to check students in.' };
  }

  function handleScan(scan) {
    if (!ui.ready || !Session.kind) return;
    let st = null;
    if (scan.sid) st = S.students[scan.sid] || null;
    if (!st && scan.token) st = findByToken(scan.token);
    if (!st && scan.serial) st = findByUid(scan.serial);
    if (!st && scan.uid) st = findByUid(scan.uid);
    // A school tag tapped here for the first time: link it to this class too.
    if (st && scan.token && !st.token && st.sk === scan.token && editable()) {
      upsertStudent({ ...st, token: scan.token, tagAt: Date.now() });
      st = S.students[st.id];
    }
    // Remember a written tag's serial number so a USB reader recognizes the same tag later.
    if (st && scan.serial && scan.token && st.token === scan.token && !uidIn(st.uids, scan.serial) && editable()) {
      upsertStudent({ ...st, uids: [...st.uids, scan.serial] });
      st = S.students[st.id];
    }
    const viaLink = scan.source === 'link';
    const report = (ev) => (viaLink ? linkResult(ev) : feedback(ev));

    if (!st) {
      const ev = {
        kind: 'unknown',
        text: scan.token ? 'This tag isn’t in your classes' : 'Unknown tag',
        sub: scan.token ? 'It may be set up for another class. Link it to a student to use it here too.' : 'Link it to a student to start using it.'
      };
      if (editable() && Object.keys(S.students).length) ev.actions = [{ label: 'Link to student', run: () => openAssign(scan) }];
      report(ev);
      return;
    }
    const target = resolveTarget(st);
    if (!target.pid) { report({ kind: 'warn', text: fullName(st), sub: target.reason, sid: st.id }); return; }
    const p = S.periods[target.pid];
    if (!st.periods.includes(p.id)) {
      const other = st.periods.map((id) => S.periods[id]).filter(Boolean).map(periodLabel).join(', ');
      report({ kind: 'warn', text: fullName(st), sub: `Not on the ${periodLabel(p)} roster${other ? ` · in ${other}` : ''}`, pid: p.id });
      return;
    }
    const prev = marksOf(target.date, p.id)[st.id] || null;
    if (prev && (prev.s === 'P' || prev.s === 'T')) {
      report({ kind: 'dup', text: fullName(st), sub: `Already checked in at ${fmtClock(prev.t)}`, pid: p.id, sid: st.id });
      return;
    }
    if (!editable()) { report({ kind: 'warn', text: 'View only', sub: 'Your access to this portal doesn’t allow check-ins.' }); return; }
    let s = tapStatus(p);
    const t = Date.now();
    // Kept late by their last teacher: the tardy is excused right away.
    const pass = s === 'T' ? passFor(st, p, target.date) : null;
    if (pass) s = 'P';
    setMark(target.date, p.id, st.id, pass ? { s, t, m: scan.source, xt: 1, why: passWhy(pass), px: pass.id } : { s, t, m: scan.source });
    const ev = {
      kind: s === 'T' ? 'tardy' : 'present', text: fullName(st),
      sub: `${pass ? `Excused tardy (${passWhy(pass)})` : STATUS[s]} · ${periodLabel(p)} · ${fmtClock(t)}`, pid: p.id, sid: st.id,
      actions: [{ key: 'undo', label: 'Undo', run: () => { setMark(target.date, p.id, st.id, prev); scheduleRender(); } }]
    };
    // A late student often has a reason (another teacher kept them), so offer to excuse it right away.
    if (s === 'T') ev.actions.push({ key: 'excuse', label: 'Excuse', run: () => openStudent(st.id, { excuse: { date: target.date, pid: p.id } }) });
    if (viaLink) { ui.view = 'period'; ui.periodId = p.id; ui.date = target.date; scheduleRender(); }
    report(ev);
  }

  function simulateTap() {
    if (!editable() || !S.periods[ui.periodId]) return;
    primeAudio();
    const marks = marksOf(todayStr(), ui.periodId);
    const pool = rosterOf(ui.periodId).filter((s) => !marks[s.id]);
    if (!pool.length) { feedback({ kind: 'dup', text: 'Everyone is marked', sub: 'There’s no one left to simulate.', feed: false }); return; }
    const st = pool[Math.floor(Math.random() * pool.length)];
    handleScan(st.token ? { token: st.token, source: 'demo' } : { sid: st.id, source: 'demo' });
  }

  function markManual(sid, s) {
    if (!editable() || !S.periods[ui.periodId]) return;
    const pid = ui.periodId, date = ui.date;
    const cur = marksOf(date, pid)[sid];
    if (cur && cur.s === s) setMark(date, pid, sid, null);
    else {
      const keepTime = cur && (cur.s === 'P' || cur.s === 'T') && (s === 'P' || s === 'T');
      setMark(date, pid, sid, { s, t: keepTime ? cur.t : Date.now(), m: keepTime ? cur.m : 'manual' });
    }
    scheduleRender();
  }

  function markRestAbsent() {
    if (!editable() || !S.periods[ui.periodId]) return;
    const pid = ui.periodId, date = ui.date;
    const marks = marksOf(date, pid);
    const ids = rosterOf(pid).filter((s) => !marks[s.id]).map((s) => s.id);
    if (!ids.length) return;
    const t = Date.now();
    setMarks(date, pid, ids.map((sid) => ({ sid, mark: { s: 'A', t, m: 'manual' } })));
    toast({ kind: 'info', text: `Marked ${ids.length} absent`, sub: periodLabel(S.periods[pid]), actions: [{ label: 'Undo', run: () => { setMarks(date, pid, ids.map((sid) => ({ sid, mark: null }))); scheduleRender(); } }] });
    scheduleRender();
  }

  /* ============================== Feedback ============================== */
  let audioCtx = null;
  function primeAudio() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) { audioCtx = null; }
  }
  function beep(kind) {
    if (!prefs.sound || !audioCtx) return;
    const seq = { present: [880, 1318], tardy: [740, 988], dup: [620], unknown: [330, 247], warn: [392, 311] }[kind];
    if (!seq) return;
    try {
      let t = audioCtx.currentTime + 0.01;
      for (const f of seq) {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.2, t + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t); o.stop(t + 0.15);
        t += 0.12;
      }
    } catch (e) { /* audio unavailable */ }
  }
  function buzz(kind) {
    try {
      if (!navigator.vibrate) return;
      if (kind === 'present' || kind === 'tardy') navigator.vibrate(35);
      else if (kind === 'unknown' || kind === 'warn') navigator.vibrate([70, 50, 70]);
    } catch (e) { /* not allowed */ }
  }
  function announce(text) {
    const el = $('#live');
    if (!el) return;
    el.textContent = '';
    setTimeout(() => { el.textContent = text; }, 30);
  }

  let kioskTimer = null;
  function feedback(ev) {
    ev.ts = Date.now();
    if (ev.feed !== false) { ui.feed.unshift(ev); if (ui.feed.length > 40) ui.feed.length = 40; }
    ui.lastEvent = ev;
    beep(ev.kind); buzz(ev.kind);
    announce(`${ev.text}. ${ev.sub || ''}`);
    toast(ev);
    if (ev.sid) ui.flash = { sid: ev.sid, at: Date.now() };
    if (ui.kiosk) { renderKiosk(); clearTimeout(kioskTimer); kioskTimer = setTimeout(renderKiosk, 6500); }
    scheduleRender();
  }

  const TOAST_ICON = { present: 'check', tardy: 'clock', dup: 'info', unknown: 'tag', warn: 'alert', info: 'info', ok: 'check' };
  const TOAST_BG = { present: 'var(--p)', tardy: 'var(--t)', dup: 'var(--u)', unknown: 'var(--a)', warn: 'var(--a)', info: 'var(--accent)', ok: 'var(--p)' };
  function toast(ev) {
    const host = $('#toasts');
    if (!host || ui.kiosk) return;   // kiosk mode shows each scan full-screen instead
    while (host.children.length >= 3) host.firstElementChild.remove();
    const el = document.createElement('div');
    el.className = 'toast';
    el.setAttribute('role', 'status');
    const acts = (ev.actions || []).map((a, i) => `<button class="tact" data-i="${i}">${esc(a.label)}</button>`).join('');
    el.innerHTML = `<span class="tbadge" style="background:${TOAST_BG[ev.kind] || 'var(--u)'}">${ic(TOAST_ICON[ev.kind] || 'info')}</span>`
      + `<span class="ttxt"><b>${esc(ev.text)}</b>${ev.sub ? `<span>${esc(ev.sub)}</span>` : ''}</span>${acts}`
      + `<button class="tact x" data-x="1" aria-label="Dismiss">${ic('x')}</button>`;
    const kill = () => { el.remove(); };
    el.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.x) { kill(); return; }
      const a = (ev.actions || [])[Number(b.dataset.i)];
      kill();
      if (a && a.run) a.run();
    });
    host.appendChild(el);
    const life = ev.kind === 'unknown' ? 9000 : (ev.actions && ev.actions.length ? 6000 : 3800);
    setTimeout(kill, life);
  }

  /* ============================== Rendering ============================== */
  let renderQueued = false;
  function scheduleRender() {
    if (renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(() => { renderQueued = false; renderAll(); });
  }
  let firstReadyDone = false;
  function dataChanged() {
    ui.ready = !!Session.kind && Store.isLoaded();
    if (ui.ready && !firstReadyDone) {
      firstReadyDone = true;
      pickInitialView();
      maybeOpenOffice();
      setTimeout(() => {
        applyPasses();
        if (pendingTag) processPendingHash();
        else if (Session.office && School.state === 'none' && !modal.open) { Session.office = false; openOfficeStart(); }
        else if (pendingSchoolLink) applySchoolLink();
        else maybeOfferImport();
      }, 0);
    }
    if (ui.view === 'period' && ui.ready && !S.periods[ui.periodId]) { ui.view = 'overview'; ui.periodId = null; }
    scheduleRender();
  }
  function renderAll() {
    if (ui.screen !== 'app') return;
    renderRail();
    renderMain();
    renderScanbar();
    if (ui.kiosk) renderKiosk();
    setSyncState();
  }

  function segs(c) {
    if (!c.total) return '';
    return ['P', 'T', 'A', 'E'].map((k) => (c[k] ? `<i class="b-${STATUS_CLS[k]}" style="width:${(c[k] / c.total) * 100}%"></i>` : '')).join('');
  }
  function legend(c, short) {
    return `<span class="lg p">${short ? 'P' : 'Present'} <b>${c.P}</b></span><span class="lg t">${short ? 'T' : 'Tardy'} <b>${c.T}</b></span>`
      + `<span class="lg a">${short ? 'A' : 'Absent'} <b>${c.A}</b></span><span class="lg e">${short ? 'E' : 'Excused'} <b>${c.E}</b></span>`
      + `<span class="lg u">Not yet <b>${c.U}</b></span>`;
  }

  function accountName() {
    if (Session.kind === 'demo') return 'Example classroom';
    const u = Session.user || {};
    return S.settings.teacher || u.name || u.email || 'Teacher';
  }
  function nameInitials(name) {
    const parts = String(name || '').replace(/^(mr|mrs|ms|mx|dr|coach)\.?\s+/i, '').trim().split(/\s+/).filter(Boolean);
    return ((parts[0] || '?').charAt(0) + (parts.length > 1 ? parts[parts.length - 1].charAt(0) : '')).toUpperCase();
  }
  function accountAvatar(cls) {
    const name = accountName();
    if (Session.kind === 'demo') return `<span class="av ${cls || ''} av-demo">${ic('spark')}</span>`;
    return `<span class="av ${cls || ''}" style="--h:${hueOf((Session.user && Session.user.id) || name)}">${esc(nameInitials(name))}</span>`;
  }
  function renderRail() {
    const rail = $('#rail');
    const brand = `<div class="brand"><span class="logo">${LOGO}</span><span class="brand-text"><span class="brand-name">TapRoll</span>`
      + `<span class="brand-sub">${esc(S.settings.school || 'Attendance portal')}</span></span>`
      + `<span class="brand-tools"><button class="btn ghost icon" data-act="tag-tools" aria-label="Tag tools">${ic('tag')}</button>`
      + `<button class="av-btn" data-act="account" aria-label="Account: ${esc(accountName())}">${accountAvatar()}</button></span></div>`;
    if (!ui.ready) { rail.innerHTML = brand; return; }
    const oldStrip = rail.querySelector('.schedule');
    const keepLeft = oldStrip ? oldStrip.scrollLeft : 0;
    const today = todayStr();
    const todayItem = `<li><button class="pitem today ${ui.view === 'overview' ? 'is-active' : ''}" data-act="open-overview" aria-current="${ui.view === 'overview' ? 'page' : 'false'}">`
      + `<span class="pnum">${ic('grid')}</span><span class="pmain"><span class="pcourse">${isStaff() ? 'My classes' : 'Today'}</span><span class="ptime">${esc(fmtDateShort(today))}</span></span><span class="pside"></span></button></li>`;
    const items = periodList().map((p) => {
      const c = countsOf(today, p.id);
      const ph = phaseOf(p, today);
      const active = ui.view === 'period' && ui.periodId === p.id;
      return `<li><button class="pitem ph-${ph} ${active ? 'is-active' : ''}" data-act="open-period" data-id="${esc(p.id)}" aria-current="${active ? 'page' : 'false'}" aria-label="${esc(periodLabel(p))}, ${esc(p.course)}">`
        + `<span class="pnum">P${esc(p.num)}</span>`
        + `<span class="pmain"><span class="pcourse">${esc(p.course || periodLabel(p))}</span><span class="ptime">${esc(fmtHM(p.start))}–${esc(fmtHM(p.end))}${p.room ? ` · Rm ${esc(p.room)}` : ''}</span></span>`
        + `<span class="pside">${ph === 'now' ? '<span class="nowchip">Now</span>' : ''}<span class="pcount">${c.P + c.T}/${c.total}</span></span>`
        + `<span class="pbar" aria-hidden="true">${segs(c)}</span></button></li>`;
    }).join('');
    rail.innerHTML = `${brand}<nav class="schedule" aria-label="Periods">`
      + `<div class="sched-head"><span class="sched-label">Bell schedule</span><span class="sched-clock">${esc(fmtClock(Date.now()))}</span></div>`
      + `<ol class="plist">${schoolRailItem()}${todayItem}${items}</ol>`
      + `${editable() ? `<button class="addp" data-act="add-period">${ic('plus')} Add period</button>` : ''}</nav>`
      + `<div class="rail-foot"><button class="rail-link" data-act="tag-tools">${ic('tag')} Tag tools</button>`
      + `<button class="rail-link" data-act="settings">${ic('sliders')} Settings</button>`
      + `<button class="acct" data-act="account" aria-label="Account: ${esc(accountName())}">${accountAvatar()}`
      + `<span class="acct-txt"><b>${esc(accountName())}</b><span>${esc(Session.kind === 'demo' ? 'Made-up students' : ((Session.user && Session.user.email) || ''))}</span></span>${ic('chevron')}</button>`
      + `<div class="syncstate" id="syncstate"></div></div>`;
    // On phones the periods scroll sideways: keep the strip where it was, and center a newly opened period.
    const strip = rail.querySelector('.schedule');
    if (strip) {
      strip.scrollLeft = keepLeft;
      const key = ui.view === 'period' ? ui.periodId : ui.view;
      const act = rail.querySelector('.pitem.is-active');
      if (act && key !== lastChip && strip.scrollWidth > strip.clientWidth) {
        const delta = act.getBoundingClientRect().left - strip.getBoundingClientRect().left;
        strip.scrollLeft = Math.max(0, strip.scrollLeft + delta - (strip.clientWidth - act.offsetWidth) / 2);
      }
      lastChip = key;
    }
  }
  let lastChip = null;

  function syncInfo() {
    if (Store.mode === 'fs') {
      if (ui.syncError) return { icon: 'alert', text: 'Sync stopped. Reload to reconnect.' };
      if (navigator.onLine === false) return { icon: 'cloud', text: 'Offline. Changes save when you reconnect.' };
      return { icon: 'cloud', text: Store.pending() ? 'Saving…' : 'Synced to your account' };
    }
    if (Store.mode === 'memory') return { icon: 'alert', text: 'Not saved: browser storage is blocked' };
    if (Session.kind === 'demo') return { icon: 'device', text: 'Example data on this device' };
    return { icon: 'device', text: 'Saved on this device' };
  }
  function setSyncState() {
    const el = $('#syncstate');
    if (!el) return;
    const s = syncInfo();
    el.innerHTML = `${ic(s.icon)}<span>${esc(s.text)}</span>`;
  }

  function renderMain() {
    const main = $('#main');
    const active = document.activeElement;
    const keep = active && active.id && main.contains(active) ? { id: active.id, s: active.selectionStart, e: active.selectionEnd } : null;
    let html;
    if (ui.view === 'school' && !isStaff()) ui.view = 'overview';
    if (!ui.ready) html = viewLoading();
    else if (ui.view === 'period' && S.periods[ui.periodId]) html = viewPeriod(S.periods[ui.periodId]);
    else if (ui.view === 'school') html = viewSchool();
    else html = viewOverview();
    main.innerHTML = `<div class="wrap">${html}</div>`;
    if (keep) {
      const el = document.getElementById(keep.id);
      if (el) { el.focus({ preventScroll: true }); try { if (keep.s != null) el.setSelectionRange(keep.s, keep.e); } catch (e) { /* not a text input */ } }
    }
    if (ui.flash && Date.now() - ui.flash.at < 1500) {
      const tile = main.querySelector(`[data-tile="${CSS.escape(ui.flash.sid)}"]`);
      if (tile) tile.classList.add('flash');
      ui.flash = null;
    }
  }

  function viewLoading() {
    return `<div class="empty" aria-busy="true"><span class="pulse"></span><h3>Loading your periods</h3><p>Getting rosters and today’s attendance.</p></div>`;
  }

  function banners() {
    let out = '';
    if (ui.syncError === 'permission-denied') {
      out += `<div class="banner warn">${ic('alert')}<p><b>TapRoll can’t open your saved classes.</b> The Firestore rules are blocking this account. Paste the rules from the setup guide into Firebase, then reload.</p><button class="btn sm" data-act="setup-guide">Setup guide</button></div>`;
    } else if (ui.syncError) {
      out += `<div class="banner warn">${ic('alert')}<p><b>Live sync stopped.</b> Check your connection, then reload the page.</p><button class="btn sm" data-act="reload">Reload</button></div>`;
    } else if (ui.readOnly) out += `<div class="banner warn">${ic('alert')}<p>You can view these classes, but changes aren’t being saved.</p></div>`;
    if (School.invite && School.state !== 'member' && !ui.hideInvite) {
      const inv = School.invite;
      const more = School.inviteList.length - 1;
      out += `<div class="banner">${ic('school')}<p><b>${esc(inv.school || 'Your school')} invited you to join as ${inv.role === 'admin' ? 'an admin' : `a ${esc(ROLE_LABEL[inv.role].toLowerCase())}`}${more > 0 ? `, and ${more === 1 ? 'another school has' : `${more} other schools have`} too` : ''}.</b> ${inv.role === 'teacher' ? 'The school office will see your classes and can add students to them.' : 'You’ll see attendance for every class.'}</p>`
        + `<button class="btn sm primary" data-act="sc-panel">Review invite</button><button class="btn sm ghost" data-act="hide-invite">Not now</button></div>`;
    }
    if (Session.kind === 'demo' && !ui.hideSample) {
      out += `<div class="banner">${ic('spark')}<p><b>You’re exploring an example classroom.</b> The students are made up, and changes stay on this device.</p>`
        + `<button class="btn sm primary" data-act="demo-signup">Create your account</button><button class="btn sm ghost" data-act="hide-sample">Keep exploring</button></div>`;
    } else if (S.settings.sample && !ui.hideSample) {
      out += `<div class="banner">${ic('info')}<p><b>You’re looking at example data.</b> The school and student names are made up. Start fresh when you’re ready to add your own classes.</p>`
        + `${editable() ? `<button class="btn sm primary" data-act="start-fresh">Start fresh</button>` : ''}<button class="btn sm ghost" data-act="hide-sample">Keep exploring</button></div>`;
    }
    return out;
  }

  function viewOverview() {
    const today = todayStr();
    const list = periodList();
    const head = `<header class="vhead"><div class="vhead-text"><div class="eyebrow">${esc(fmtDateLong(today))}${S.settings.school ? ` · ${esc(S.settings.school)}` : ''}</div>`
      + `<h1 class="vtitle">Today</h1></div><div class="vhead-actions">${editable() ? `<button class="btn sm" data-act="add-period">${ic('plus')} Add period</button>` : ''}</div></header>`;
    if (!list.length) {
      const legacy = Session.kind !== 'demo' && readLegacy();
      return head + banners() + `<div class="empty"><h3>Set up your bell schedule</h3><p>Add each period you teach with its bell times, then paste in each roster. TapRoll uses the bell times to decide when a tap counts as tardy.</p>`
        + `<div class="row">${editable() ? `<button class="btn primary" data-act="add-period">${ic('plus')} Add Period 1</button>`
          + `${legacy ? `<button class="btn" data-act="import-legacy">${ic('upload')} Bring in classes from this device</button>` : ''}`
          + `<button class="btn" data-act="load-demo">${ic('spark')} Load example data</button>` : ''}</div></div>`;
    }
    const tot = { P: 0, T: 0, A: 0, E: 0, U: 0, total: 0 };
    for (const p of list) { const c = countsOf(today, p.id); for (const k of Object.keys(tot)) tot[k] += c[k]; }
    const rate = overallRate();
    const kpis = `<section class="card kpis" aria-label="Today at a glance">`
      + `<div class="kpi"><div class="k">Checked in today</div><div class="v">${tot.P + tot.T}<small>of ${tot.total}</small></div></div>`
      + `<div class="kpi"><div class="k">Tardy today</div><div class="v">${tot.T}</div></div>`
      + `<div class="kpi"><div class="k">Absent today</div><div class="v">${tot.A}<small>${tot.E} excused</small></div></div>`
      + `<div class="kpi"><div class="k">Attendance, last 15 days</div><div class="v">${rate == null ? '—' : Math.round(rate * 100) + '%'}</div></div></section>`;

    const n = nowMin();
    const nowLine = `<li class="nowline" aria-hidden="true"><span>${esc(fmtClock(Date.now()))}</span><i></i></li>`;
    let placed = false;
    const anyNow = list.some((p) => phaseOf(p) === 'now');
    let nextFound = false;
    const rows = [];
    for (const p of list) {
      const ph = phaseOf(p);
      if (!anyNow && !placed && toMin(p.start) != null && toMin(p.start) > n) { rows.push(nowLine); placed = true; }
      const c = countsOf(today, p.id);
      let label = 'Later';
      if (ph === 'done') label = 'Done';
      else if (ph === 'now') label = 'In session';
      else if (!nextFound) { label = 'Up next'; nextFound = true; }
      const s = toMin(p.start), e = toMin(p.end);
      const elapsed = ph === 'now' && s != null && e > s ? Math.min(100, ((n - s) / (e - s)) * 100) : 0;
      rows.push(`<li class="tl"><div class="tl-time"><b>${esc(fmtHM(p.start))}</b>${esc(fmtHM(p.end))}</div>`
        + `<button class="pcard ph-${ph}" data-act="open-period" data-id="${esc(p.id)}">`
        + `<span class="pcard-title"><span class="pnum">P${esc(p.num)}</span><span class="pcard-name"><b>${esc(p.course || periodLabel(p))}</b><span>${p.room ? `Room ${esc(p.room)} · ` : ''}${c.total} students</span></span></span>`
        + `<span class="phase ${ph === 'now' ? 'now' : ph === 'done' ? 'done' : ''}">${label}</span>`
        + `<span class="bar" aria-hidden="true">${segs(c)}</span><span class="legend">${legend(c, true)}</span>`
        + `${elapsed ? `<span class="elapsed" style="width:${elapsed}%"></span>` : ''}</button></li>`);
    }
    if (!anyNow && !placed) rows.push(nowLine);

    const watch = chronicList();
    const watchHtml = watch.length
      ? `<ul class="watch">${watch.slice(0, 7).map((w) => `<li><button data-act="open-student" data-id="${esc(w.st.id)}"><span class="av" style="--h:${hueOf(w.st.id)}">${esc(initials(w.st))}</span>`
        + `<span class="wname"><b>${esc(fullName(w.st))}</b><span>${esc(w.st.periods.map((id) => S.periods[id]).filter(Boolean).map(periodLabel).join(', '))} · missed ${w.miss} of ${w.n}</span></span>`
        + `<span class="rate">${Math.round(w.rate * 100)}%</span></button></li>`).join('')}</ul>`
      : `<p class="watch-empty">No one has missed 10% or more of recent sessions.</p>`;
    const trend = list.map((p) => {
      const r = periodRates(p.id, 10);
      const vals = r.map((x) => x.att / x.tot);
      const avg = r.length ? Math.round((r.reduce((a, x) => a + x.att, 0) / r.reduce((a, x) => a + x.tot, 0)) * 100) + '%' : '—';
      return `<div class="trow"><span class="pnum">P${esc(p.num)}</span><span class="tname">${esc(p.course)}</span>${spark(vals)}<span class="tv">${avg}</span></div>`;
    }).join('');

    return head + banners() + kpis
      + `<div class="ov-grid"><section aria-label="Bell schedule"><div class="sect-head"><h2 class="sect">Bell schedule</h2><span class="sect-note">Tap a period to take roll</span></div><ol class="timeline">${rows.join('')}</ol></section>`
      + `<div class="side-stack"><section><div class="sect-head"><h2 class="sect">Chronic absence watch</h2><span class="sect-note">Missed 10%+ of the last 15 sessions</span></div><div class="card">${watchHtml}</div></section>`
      + `<section><div class="sect-head"><h2 class="sect">Attendance by period</h2><span class="sect-note">Last 10 sessions · dashed line 90%</span></div><div class="card trend">${trend}</div></section></div></div>`;
  }

  function spark(vals) {
    const W = 96, H = 26, lo = 0.6, hi = 1;
    const y = (v) => 2 + (1 - (Math.min(hi, Math.max(lo, v)) - lo) / (hi - lo)) * (H - 4);
    const g = `<line class="spark-grid" x1="0" y1="${y(0.9).toFixed(1)}" x2="${W}" y2="${y(0.9).toFixed(1)}" stroke-dasharray="2 3"/>`;
    if (vals.length < 2) return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">${g}</svg>`;
    const x = (i) => 2 + (i * (W - 6)) / (vals.length - 1);
    const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`);
    const last = vals.length - 1;
    const area = `M${x(0).toFixed(1)},${H} L${pts.join(' L')} L${x(last).toFixed(1)},${H} Z`;
    return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">${g}<path class="spark-area" d="${area}"/><polyline class="spark-line" points="${pts.join(' ')}"/>`
      + `<circle class="spark-dot" cx="${x(last).toFixed(1)}" cy="${y(vals[last]).toFixed(1)}" r="2.4"/></svg>`;
  }

  function tapSeg() {
    const opts = [['auto', 'Auto'], ['P', 'Present'], ['T', 'Tardy']];
    return `<div class="seg" role="radiogroup" aria-label="Taps count as">${opts.map(([v, l]) => `<button type="button" role="radio" aria-checked="${prefs.tapAs === v}" data-act="tap-as" data-v="${v}">${l}</button>`).join('')}</div>`;
  }
  function tardyRule(p) {
    const s = toMin(p.start);
    if (s == null) return 'Add bell times to count late taps as tardy.';
    if (prefs.tapAs === 'P') return 'Every tap counts as present.';
    if (prefs.tapAs === 'T') return 'Every tap counts as tardy.';
    return `Check-in opens <b>${esc(fmtHMap(minToHM(Math.max(0, s - passOf(p)))))}</b> · bell <b>${esc(fmtHMap(p.start))}</b> · tardy after <b>${esc(fmtHMap(minToHM(s + graceOf(p))))}</b>`;
  }

  function viewPeriod(p) {
    const date = ui.date;
    const today = todayStr();
    const isToday = date === today;
    const roster = rosterOf(p.id);
    const marks = marksOf(date, p.id);
    const c = countsOf(date, p.id);
    const nfc = NFC.status();
    const head = `<header class="vhead"><div class="vhead-text"><div class="eyebrow">${esc(periodLabel(p))} · ${esc(fmtHM(p.start))}–${esc(fmtHM(p.end))}${p.room ? ` · Room ${esc(p.room)}` : ''}</div>`
      + `<h1 class="vtitle">${esc(p.course || periodLabel(p))}</h1></div><div class="vhead-actions">`
      + `<div class="datenav" role="group" aria-label="Date"><button class="btn ghost sm icon" data-act="date-prev" aria-label="Previous day">${ic('left')}</button>`
      + `<span class="dlabel">${isToday ? 'Today' : esc(fmtDateShort(date))}</span><button class="btn ghost sm icon" data-act="date-next" aria-label="Next day">${ic('right')}</button></div>`
      + `${isToday ? '' : `<button class="btn sm" data-act="date-today">Back to today</button>`}`
      + `<button class="btn sm" data-act="export-period">${ic('download')} CSV</button>`
      + `${editable() ? `<button class="btn sm icon" data-act="edit-period" data-id="${esc(p.id)}" aria-label="Edit period">${ic('edit')}</button>` : ''}</div></header>`;

    const tally = `<section class="card tally" aria-label="Attendance summary"><div class="tally-big num">${c.P + c.T}<span class="dim">/${c.total}</span><small>checked in${isToday ? ' so far' : ` on ${esc(fmtDay(date))}`}</small></div>`
      + `<div class="legend">${legend(c)}</div><div class="bar" aria-hidden="true">${segs(c)}</div></section>`;

    let scan = '';
    if (isToday) {
      const btn = ui.scanning
        ? `<button class="btn-scan live" data-act="toggle-scan"><span class="pulse"></span> Listening… tap to stop</button>`
        : `<button class="btn-scan" data-act="toggle-scan" ${nfc.ok && editable() ? '' : 'disabled'}>${ic('nfc')} Start NFC scan</button>`;
      const base = hostedBase();
      const nfcLine = nfc.ok
        ? (ui.scanning ? '<b>Phone NFC:</b> scanning. Students tap the back of this phone.' : '<b>Phone NFC:</b> ready.')
        : `<b>Phone NFC:</b> ${esc(nfc.title)}.${nfc.code === 'framed' && base ? ` <a href="${esc(base)}" target="_blank" rel="noopener">Open hosted site</a>` : ''} <button class="btn ghost sm" data-act="tag-tools">Why?</button>`;
      const recent = Object.entries(marks).filter(([sid, mk]) => S.students[sid] && (mk.s === 'P' || mk.s === 'T'))
        .sort((a, b) => b[1].t - a[1].t).slice(0, 5);
      const feed = recent.length
        ? `<ol class="feed">${recent.map(([sid, mk]) => `<li><span class="dot ${mk.s === 'T' ? 'k-tardy' : 'k-present'}"></span><span class="fx"><b>${esc(fullName(S.students[sid]))}</b> · ${esc(markLabel(mk))}${mk.m !== 'manual' ? ` · ${esc(METHOD[mk.m] || mk.m)}` : ''}</span><time>${esc(fmtClock(mk.t))}</time></li>`).join('')}</ol>`
        : '<p class="feed-empty">Check-ins appear here as students tap in.</p>';
      scan = `<section class="card scanpanel ${ui.scanning ? 'is-live' : ''}" aria-label="Check-in">`
        + `<div class="scan-main"><div class="scan-row">${btn}`
        + `<button class="btn" data-act="kiosk">${ic('expand')} Kiosk</button>`
        + `<button class="btn ghost" data-act="simulate" ${editable() && roster.length ? '' : 'disabled'}>${ic('spark')} Simulate tap</button></div>`
        + `<div class="sources"><div class="src ${nfc.ok ? 'ok' : ''}">${ic('nfc')}<span>${nfcLine}</span></div>`
        + `<div class="src ok">${ic('usb')}<span><b>USB reader:</b> ready. Taps follow your bell schedule.</span></div></div>`
        + `<div class="scan-row"><span class="rule">Taps count as</span>${tapSeg()}</div><div class="rule">${tardyRule(p)}</div></div>`
        + `<div class="scan-side"><div class="sect-head"><h2 class="sect">Recent check-ins</h2></div>${feed}</div></section>`;
    } else {
      scan = `<div class="banner">${ic('clock')}<p>You’re viewing ${esc(fmtDateLong(date))}. Scanning only records to today; you can still fix marks by hand.</p><button class="btn sm" data-act="date-today">Back to today</button></div>`;
    }

    const q = ui.search.trim().toLowerCase();
    const filters = [['all', 'All', c.total], ['U', 'Not yet', c.U], ['P', 'Present', c.P], ['T', 'Tardy', c.T], ['A', 'Absent', c.A], ['E', 'Excused', c.E]];
    const shown = roster.filter((st) => {
      const mk = marks[st.id];
      const s = mk ? mk.s : 'U';
      if (ui.filter !== 'all' && s !== ui.filter) return false;
      return !q || fullName(st).toLowerCase().includes(q);
    });
    const tools = `<div class="rtools"><label class="search">${ic('search')}<span class="sr-only">Search students</span>`
      + `<input class="input" id="roster-search" type="search" placeholder="Search ${roster.length} students" value="${esc(ui.search)}" autocomplete="off"></label>`
      + `<div class="chips">${filters.map(([v, l, n]) => `<button class="chip" data-act="filter" data-v="${v}" aria-pressed="${ui.filter === v}">${l} <b>${n}</b></button>`).join('')}</div>`
      + `${editable() ? `<div class="rtools-actions">${c.A + c.T ? `<button class="btn sm" data-act="email-parents">${ic('mail')} Email parents${pendingEmails(p, date) ? ` <b class="cnt">${pendingEmails(p, date)}</b>` : ''}</button>` : ''}`
        + `${isToday && phaseOf(p) !== 'later' && roster.length ? `<button class="btn sm" data-act="late-pass">${ic('clock')} Kept class late</button>` : ''}`
        + `<button class="btn sm" data-act="mark-rest" ${c.U ? '' : 'disabled'}>Mark ${c.U} not-yet absent</button><button class="btn sm primary" data-act="add-students">${ic('plus')} Add students</button></div>` : ''}</div>`
      + latePassNote(p, date) + autoMailNote(p, date);
    let grid;
    if (!roster.length) {
      grid = `<div class="empty"><h3>No students in ${esc(periodLabel(p))} yet</h3><p>Paste names from your class list or a spreadsheet. You can write or link each student’s NFC tag afterward.</p>`
        + `${editable() ? `<div class="row"><button class="btn primary" data-act="add-students">${ic('plus')} Add students</button></div>` : ''}</div>`;
    } else if (!shown.length) grid = '<p class="feed-empty">No students match.</p>';
    else grid = `<div class="roster">${shown.map((st) => tile(st, marks[st.id])).join('')}</div>`;

    return head + banners() + tally + scan + `<section class="rsec" aria-label="Roster">${tools}</section>` + grid;
  }

  function tile(st, mk) {
    const s = mk ? mk.s : null;
    const how = mk && METHOD_ICON[mk.m] ? `<span class="how" title="${esc(METHOD[mk.m] || mk.m)}" aria-label="${esc(METHOD[mk.m] || mk.m)}">${ic(METHOD_ICON[mk.m])}</span>` : '';
    const meta = s ? `${markLabel(mk)} · ${fmtClock(mk.t)}` : 'Not marked yet';
    const noTag = st.token || st.uids.length ? '' : ' · <span class="notag">no tag</span>';
    const can = editable();
    return `<article class="stu ${s ? 's-' + STATUS_CLS[s] : 's-u'}" data-tile="${esc(st.id)}">`
      + `<button class="stu-main" data-act="open-student" data-id="${esc(st.id)}" aria-label="${esc(fullName(st))}: open details">`
      + `<span class="av" style="--h:${hueOf(st.id)}">${esc(initials(st))}</span>`
      + `<span class="stu-txt"><span class="stu-name">${esc(st.first)} <b>${esc(st.last)}</b></span><span class="stu-meta">${how}<span class="mt">${esc(meta)}${noTag}</span></span></span></button>`
      + `<div class="marks" role="group" aria-label="Mark ${esc(fullName(st))}">${['P', 'T', 'A', 'E'].map((k) => `<button class="mk mk-${k} ${s === k ? 'on' : ''}" data-act="mark" data-sid="${esc(st.id)}" data-s="${k}" aria-pressed="${s === k}" title="${STATUS[k]}" ${can ? '' : 'disabled'}>${k}</button>`).join('')}</div></article>`;
  }

  function renderScanbar() {
    const bar = $('#scanbar');
    if (!ui.ready || ui.view !== 'period' || !S.periods[ui.periodId] || ui.date !== todayStr()) { bar.hidden = true; bar.innerHTML = ''; return; }
    const p = S.periods[ui.periodId];
    const c = countsOf(ui.date, p.id);
    const nfc = NFC.status();
    // The dock exists for NFC scanning; phones that can't scan don't need it.
    if (!nfc.ok && !ui.scanning) { bar.hidden = true; bar.innerHTML = ''; return; }
    const btn = ui.scanning
      ? `<button class="btn-scan live" data-act="toggle-scan"><span class="pulse"></span> Listening… tap to stop</button>`
      : `<button class="btn-scan" data-act="toggle-scan" ${editable() ? '' : 'disabled'}>${ic('nfc')} Start NFC scan</button>`;
    bar.hidden = false;
    bar.innerHTML = `${btn}<div class="sb-count"><b class="num">${c.P + c.T}/${c.total}</b>checked in</div>`;
  }

  function renderKiosk() {
    const k = $('#kiosk');
    const p = S.periods[ui.periodId];
    if (!ui.kiosk || !p) { k.hidden = true; k.innerHTML = ''; return; }
    const c = countsOf(todayStr(), p.id);
    const ev = ui.lastEvent && Date.now() - ui.lastEvent.ts < 6000 ? ui.lastEvent : null;
    const prompt = ui.scanning ? 'Tap your tag on the back of this phone' : 'Tap your tag on the reader';
    k.hidden = false;
    k.innerHTML = `<div class="k-head"><div><b>${esc(periodLabel(p))} · ${esc(p.course)}</b><br><span>${tardyRule(p).replace(/<[^>]+>/g, '')}</span></div>`
      + `<button class="btn" data-act="exit-kiosk">${ic('x')} Exit</button></div>`
      + `<div class="k-center"><div class="k-ring">${ic('nfc')}</div><div class="k-prompt">${esc(prompt)}</div>`
      + `<div class="k-last ${ev ? esc(ev.kind) : ''}">${ev ? `<b>${esc(ev.text)}</b><span>${esc(ev.sub || '')}</span>` : ''}</div></div>`
      + `<div class="k-foot"><span><b class="num">${c.P}</b>present</span><span><b class="num">${c.T}</b>tardy</span><span><b class="num">${c.U}</b>not yet</span></div>`;
  }
  function enterKiosk() {
    if (!S.periods[ui.periodId] || ui.date !== todayStr()) return;
    primeAudio();
    ui.kiosk = true;
    renderKiosk();
    // Start NFC first, while the click still counts as a user gesture for Chrome's permission prompt.
    if (NFC.status().ok && !ui.scanning && editable()) NFC.startScan();
    try {
      const el = document.documentElement;
      const r = el.requestFullscreen && !document.fullscreenElement ? el.requestFullscreen() : null;
      if (r && typeof r.catch === 'function') r.catch(() => {});
    } catch (e) { /* fullscreen is optional */ }
    requestWakeLock();
  }
  function exitKiosk() {
    ui.kiosk = false;
    renderKiosk();
    try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) { /* optional */ }
    if (!ui.scanning) releaseWakeLock();
    scheduleRender();
  }

  /* ============================== Modals ============================== */
  const modal = { open: false, onClose: null };
  function openModal(html, opts = {}) {
    const root = $('#modal-root');
    if (modal.open) closeModal();
    root.innerHTML = `<div class="scrim" data-act="close-modal"></div><div class="modal ${opts.cls || ''}" role="dialog" aria-modal="true" tabindex="-1" aria-label="${esc(opts.label || 'Dialog')}">${html}</div>`;
    modal.open = true;
    modal.onClose = opts.onClose || null;
    // Focus the dialog itself unless it exists to collect typing; on phones a focused field opens the keyboard.
    const f = (opts.focus && root.querySelector(opts.focus)) || root.querySelector('.modal');
    if (f) setTimeout(() => f.focus({ preventScroll: true }), 40);
  }
  function closeModal() {
    if (!modal.open) return;
    NFC.cancelBusy();
    Wedge.capture = null;
    const fn = modal.onClose;
    modal.open = false; modal.onClose = null;
    $('#modal-root').innerHTML = '';
    if (fn) fn();
  }
  const modalHead = (title, sub) => `<div class="m-head"><div><h2>${esc(title)}</h2>${sub ? `<p>${esc(sub)}</p>` : ''}</div><button class="btn ghost icon" data-act="close-modal" aria-label="Close">${ic('x')}</button></div>`;

  function confirmBox({ title, body, okLabel = 'Confirm', danger = false, onOk }) {
    openModal(`${modalHead(title)}<div class="m-body"><p class="m-text">${esc(body)}</p></div>`
      + `<div class="m-foot"><button class="btn" data-act="close-modal">Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" id="confirm-ok">${esc(okLabel)}</button></div>`, { label: title });
    $('#confirm-ok').addEventListener('click', () => { closeModal(); onOk(); });
  }

  function linkResult(ev) {
    beep(ev.kind); buzz(ev.kind);
    const color = TOAST_BG[ev.kind] || 'var(--u)';
    const act = ev.actions && ev.kind === 'unknown' ? ev.actions[0] : null;
    openModal(`<div class="confirm-big"><span class="badge" style="background:${color}">${ic(TOAST_ICON[ev.kind] || 'info').replace('class="ic"', 'class="ic big"')}</span>`
      + `<h2>${esc(ev.text)}</h2><p>${esc(ev.sub || '')}</p></div><div class="m-foot">${act ? `<button class="btn" id="lr-act">${esc(act.label)}</button>` : ''}`
      + `${ev.kind === 'present' || ev.kind === 'tardy' ? `<button class="btn" id="lr-undo">Undo</button>` : ''}`
      + `${ev.kind === 'tardy' ? `<button class="btn" id="lr-excuse">Excuse tardy</button>` : ''}<button class="btn primary" data-act="close-modal">Done</button></div>`, { label: 'Check-in' });
    const pick = (key) => (ev.actions || []).find((x) => x.key === key);
    const a = $('#lr-act'); if (a) a.addEventListener('click', () => { closeModal(); act.run(); });
    const u = $('#lr-undo'); if (u) u.addEventListener('click', () => { closeModal(); pick('undo').run(); });
    const x = $('#lr-excuse'); if (x) x.addEventListener('click', () => { closeModal(); pick('excuse').run(); });
  }

  function openPeriodEditor(id) {
    if (!editable()) return;
    const p = id ? S.periods[id] : null;
    const list = periodList();
    const nextNum = list.reduce((m, x) => Math.max(m, x.num), 0) + 1;
    const last = list[list.length - 1];
    const ds = last && toMin(last.end) != null ? minToHM(Math.min(toMin(last.end) + 6, 22 * 60)) : '08:00';
    const de = minToHM(Math.min(toMin(ds) + 50, 23 * 60 + 59));
    // A new period starts with the timing of the one before it, so it only has to be set once.
    const pass = p ? passOf(p) : (last ? passOf(last) : DEFAULT_PASS);
    const grace = p ? graceOf(p) : (last ? graceOf(last) : defaultGrace());
    const others = list.filter((x) => !p || x.id !== p.id).length;
    const timeField = (id, label, hm) => `<label class="field"><span>${label}</span><input id="${id}" class="tinput" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" maxlength="10" placeholder="8:00 AM" value="${esc(fmtHMap(hm))}"></label>`;
    const minField = (id, label, v, help) => `<label class="field"><span>${label}</span><span class="ufield"><input id="${id}" type="number" min="0" max="60" step="1" inputmode="numeric" value="${v}"><span aria-hidden="true">min</span></span><small>${help}</small></label>`;
    openModal(`${modalHead(p ? `Edit ${periodLabel(p)}` : 'Add a period', p ? '' : 'Bell times decide which period a tap counts for and when it’s tardy.')}`
      + `<form id="period-form" class="m-body" novalidate>`
      + `<div class="grid2"><label class="field"><span>Period number</span><input id="pf-num" type="number" min="0" max="20" required value="${p ? p.num : nextNum}"></label>`
      + `<label class="field"><span>Room</span><input id="pf-room" maxlength="20" value="${esc(p ? p.room : '')}" placeholder="214"></label></div>`
      + `<label class="field"><span>Course</span><input id="pf-course" maxlength="60" required value="${esc(p ? p.course : '')}" placeholder="Biology"></label>`
      + `<div class="grid2">${timeField('pf-start', 'Bell rings', p ? p.start : ds)}${timeField('pf-end', 'Class ends', p ? p.end : de)}</div>`
      + `<div class="grid2">${minField('pf-pass', 'Passing time', pass, 'Taps this early count for this period.')}${minField('pf-grace', 'Tardy grace', grace, 'Taps this late still count as present.')}</div>`
      + `<p class="pf-sum" id="pf-sum" aria-live="polite"></p>`
      + `${others ? `<label class="check fit"><input type="checkbox" id="pf-all"> Use this passing time and grace for all ${others + 1} periods</label>` : ''}`
      + `<p class="m-text small err-text" id="pf-err" role="alert" hidden></p>`
      + `<div class="m-foot">${p ? `<button type="button" class="btn danger spacer" data-act="delete-period" data-id="${esc(p.id)}">${ic('trash')} Delete</button>` : ''}`
      + `<button type="button" class="btn" data-act="close-modal">Cancel</button><button type="submit" class="btn primary">${p ? 'Save changes' : 'Add period'}</button></div></form>`, { label: 'Period', focus: p ? null : '#pf-course' });
    const form = $('#period-form');
    const read = () => ({
      start: parseClock($('#pf-start').value), end: parseClock($('#pf-end').value),
      pass: mins0to60($('#pf-pass').value), grace: mins0to60($('#pf-grace').value)
    });
    const at = (m) => fmtHMap(minToHM(((m % 1440) + 1440) % 1440));
    const summarize = () => {
      const v = read();
      const sum = $('#pf-sum');
      if (v.start == null) { sum.textContent = 'Type the bell time, like 8:05.'; return; }
      const parts = [];
      if (v.pass != null) parts.push(`Check-in opens at ${at(v.start - v.pass)}.`);
      if (v.grace != null) parts.push(v.grace ? `Taps until ${at(v.start + v.grace)} count as present. After that, they’re tardy.` : `Taps after ${at(v.start)} count as tardy.`);
      sum.textContent = parts.join(' ');
    };
    form.addEventListener('input', () => { $('#pf-err').hidden = true; summarize(); });
    // Show what a typed time was read as (805 becomes 8:05 AM), or flag it if it can't be read.
    form.addEventListener('focusout', (e) => {
      const el = e.target;
      if (!el.classList || !el.classList.contains('tinput')) return;
      const m = parseClock(el.value);
      if (m != null) { el.value = at(m); el.removeAttribute('aria-invalid'); } else if (el.value.trim()) el.setAttribute('aria-invalid', 'true');
      summarize();
    });
    form.addEventListener('focusin', (e) => { if (e.target.classList && e.target.classList.contains('tinput')) e.target.select(); });
    summarize();
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const num = Number($('#pf-num').value);
      const course = $('#pf-course').value.trim();
      const v = read();
      const err = $('#pf-err');
      let msg = '';
      if (!Number.isFinite(num) || $('#pf-num').value === '') msg = 'Enter a period number.';
      else if (!course) msg = 'Enter a course name.';
      else if (v.start == null || v.end == null) msg = 'Enter both bell times, like 8:05 or 1:16 PM.';
      else if (v.end <= v.start) msg = 'Class has to end after the bell rings.';
      else if (v.pass == null) msg = 'Enter a passing time from 0 to 60 minutes.';
      else if (v.grace == null) msg = 'Enter a tardy grace from 0 to 60 minutes.';
      if (msg) { err.textContent = msg; err.hidden = false; return; }
      const saved = upsertPeriod({ id: p ? p.id : 'p' + rid(8), num, course, room: $('#pf-room').value, start: minToHM(v.start), end: minToHM(v.end), pass: v.pass, grace: v.grace });
      const all = $('#pf-all') && $('#pf-all').checked;
      if (all) for (const o of periodList()) if (o.id !== saved.id && (o.pass !== v.pass || o.grace !== v.grace)) upsertPeriod({ ...o, pass: v.pass, grace: v.grace });
      closeModal();
      toast({ kind: 'ok', text: p ? 'Period saved' : `${periodLabel(saved)} added`, sub: all ? 'Passing time and grace now match for every period.' : saved.course });
      if (!p) openPeriod(saved.id); else scheduleRender();
    });
  }
  function confirmDeletePeriod(id) {
    const p = S.periods[id];
    if (!p) return;
    const only = rosterOf(id).filter((s) => s.periods.length === 1).length;
    confirmBox({
      title: `Delete ${periodLabel(p)}?`,
      body: `${p.course} and its schedule will be removed${only ? `, along with ${only} student${only === 1 ? '' : 's'} who aren’t in another period` : ''}. Students in other periods stay. Download a backup first if you might need this later.`,
      okLabel: 'Delete period', danger: true,
      onOk: () => { removePeriod(id); ui.view = 'overview'; ui.periodId = null; toast({ kind: 'info', text: `${periodLabel(p)} deleted` }); scheduleRender(); }
    });
  }

  // One student per line: "First Last", "Last, First" or spreadsheet columns. Any email addresses on the line are
  // taken as parent emails, so "Maya Lopez, maya.mom@example.com" works too.
  function parseNames(text) {
    return String(text).split(/\r?\n/).map((l) => l.trim()).filter(Boolean).map((raw) => {
      // Names never contain @, so every word with one is a parent email (or a mistyped one, which is skipped).
      const found = parseEmails((raw.match(/[^\s,;<>()"']*@[^\s,;<>()"']*/g) || []).join(' '));
      const parents = found.ok, badEmails = found.bad.length;
      const line = raw.replace(/<?[^\s,;<>()"']*@[^\s,;<>()"']*>?/g, ' ').replace(/[\t ]*[,;]+[\t ]*(?=[,;\t]|$)/g, '').replace(/[ ]{2,}/g, ' ').trim().replace(/^[,;\t\s]+|[,;\t\s]+$/g, '');
      let first = '', last = '';
      if (line.includes('\t')) { const parts = line.split('\t').map((s) => s.trim()).filter(Boolean); first = parts[0] || ''; last = parts.slice(1).join(' '); }
      else if (line.includes(',')) { const i = line.indexOf(','); last = line.slice(0, i).trim(); first = line.slice(i + 1).trim(); }
      else { const parts = line.split(/\s+/); last = parts.length > 1 ? parts.pop() : ''; first = parts.join(' '); }
      return { first: first.slice(0, 40), last: last.slice(0, 40), parents, badEmails };
    }).filter((n) => n.first || n.last);
  }
  function openAddStudents(pid) {
    if (!editable()) return;

    openModal(`${modalHead('Add students', 'Paste names from a spreadsheet or type one per line.')}`
      + `<form id="add-form" class="m-body"><label class="field"><span>Names</span><textarea id="af-names" placeholder="Maya Lopez&#10;Nguyen, Kevin&#10;Jordan Brooks, jbrooks.parent@example.com"></textarea>`
      + `<small>One student per line. “First Last” and “Last, First” both work. Add a parent’s email after a name to save it too.</small></label>`
      + `<div class="field"><span>Periods</span><div class="checks">${list.map((p) => `<label class="check"><input type="checkbox" name="af-p" value="${esc(p.id)}" ${p.id === pid ? 'checked' : ''}> P${esc(p.num)} · ${esc(p.course)}</label>`).join('')}</div></div>`
      + `<p class="m-text small" id="af-err" hidden></p>`
      + `<div class="m-foot"><button type="button" class="btn" data-act="close-modal">Cancel</button><button type="submit" class="btn primary">Add students</button></div></form>`, { label: 'Add students', focus: '#af-names' });
    $('#add-form').addEventListener('submit', (e) => {

      const err = $('#af-err');
      if (!names.length) { err.textContent = 'Type or paste at least one name.'; err.hidden = false; return; }
      if (!periods.length) { err.textContent = 'Pick at least one period.'; err.hidden = false; return; }
      upsertStudents(names.map((n) => ({ id: 's' + rid(9), first: n.first, last: n.last, periods, token: null, uids: [], tagAt: null, parents: n.parents })));
      closeModal();
      const bad = names.reduce((sum, n) => sum + n.badEmails, 0);
      toast({
        kind: bad ? 'warn' : 'ok', text: `Added ${names.length} student${names.length === 1 ? '' : 's'}`,
        sub: bad ? `${bad} parent email${bad === 1 ? '' : 's'} couldn’t be read. Add ${bad === 1 ? 'it' : 'them'} in each student’s details.` : periods.map((id) => S.periods[id]).filter(Boolean).map(periodLabel).join(', ')
      });
      scheduleRender();
    });

  /* ----- Student drawer ----- */
  // opts.excuse = { date, pid }: open with the form for excusing that tardy (from a check-in's Excuse button).
  function openStudent(sid, opts = {}) {
    if (!S.students[sid]) return;
    ui.openStudent = sid;
    ui.excuseFor = opts.excuse || null;
    openModal(studentHtml(sid), { cls: 'drawer', label: 'Student', onClose: () => { ui.openStudent = null; ui.excuseFor = null; } });
    bindStudentForm(sid);
  }
  // Absences and tardies the drawer can act on (excuse a tardy, email a parent): the student's periods on the day
  // being viewed (today from the overview), plus the check-in an Excuse button pointed at.
  function followUps(st) {
    const date = ui.view === 'period' ? ui.date : todayStr();
    const out = [];
    const seen = new Set();
    const add = (d, pid) => {
      if (seen.has(d + '|' + pid) || !S.periods[pid] || !st.periods.includes(pid)) return;
      seen.add(d + '|' + pid);
      const mk = marksOf(d, pid)[st.id];
      if (mk && (mk.s === 'T' || mk.s === 'A' || mk.xt)) out.push({ date: d, p: S.periods[pid], mk });
    };
    if (ui.excuseFor) add(ui.excuseFor.date, ui.excuseFor.pid);
    st.periods.map((id) => S.periods[id]).filter(Boolean).sort((a, b) => a.num - b.num).forEach((p) => add(date, p.id));
    return out;
  }
  // The parent email part of a follow-up: the button, when it was last opened, or a pointer to add an address.
  function parentEmailBits(st, p, date, mk) {
    if (!needsEmail(mk)) return { btn: '', note: '' };
    if (!st.parents.length) return { btn: '', note: `<p class="m-text small">To email ${esc(st.first || 'their')} parent, add a parent email under Details below.</p>` };
    if (mk.n) {
      return {
        btn: emailLink(st, p, date, mk, 'Email parent again'),
        note: `<p class="m-text small sent-line">${ic('check')}${mk.na ? 'Parent emailed automatically' : 'Parent email opened'} at ${esc(fmtClock(mk.n))}.</p>`
      };
    }
    if (mk.nf) {
      return {
        btn: emailLink(st, p, date, mk, 'Email parent'),
        note: `<p class="m-text small warn-line">${ic('alert')}TapRoll couldn’t email ${esc(st.first ? `${st.first}’s` : 'their')} parent automatically. Check the address under Details below, then email them yourself.</p>`
      };
    }
    if (autoToday(date)) {
      return {
        btn: emailLink(st, p, date, mk, 'Email parent now'),
        note: `<p class="m-text small sent-line">${ic('mail')}TapRoll emails ${esc(st.first ? `${st.first}’s` : 'their')} parent automatically after class.</p>`
      };
    }
    return { btn: emailLink(st, p, date, mk, 'Email parent'), note: '' };
  }
  function followSection(st, { date, p, mk }, first) {
    const when = `${periodLabel(p)}${date !== todayStr() ? `, ${fmtDateShort(date)}` : ''}`;
    const can = editable();
    if (mk.s === 'A') {
      const em = parentEmailBits(st, p, date, mk);
      return `<section class="dsec${first ? ' first' : ''} follow absent"><h3>Absent · ${esc(when)}</h3>`
        + `<p class="m-text">Marked absent.</p>${em.note}${em.btn ? `<div class="row">${em.btn}</div>` : ''}</section>`;
    }
    const bell = toMin(p.start);
    const at = new Date(mk.t);
    const late = bell == null ? 0 : at.getHours() * 60 + at.getMinutes() - bell;
    const checked = `Checked in at ${fmtClock(mk.t)}${late > 0 ? `, ${late} minute${late === 1 ? '' : 's'} after the bell` : ''}.`;
    const ids = `data-sid="${esc(st.id)}" data-date="${esc(date)}" data-pid="${esc(p.id)}"`;
    const em = parentEmailBits(st, p, date, mk);
    let body;
    if (mk.xt) {
      body = `<p class="m-text">${esc(checked)} Excused${mk.why ? `: ${esc(mk.why)}` : ''}.</p>`
        + (can ? `<div class="row"><button type="button" class="btn sm" data-act="unexcuse" ${ids}>Mark tardy again</button></div>` : '');
    } else if (can && ui.excuseFor && ui.excuseFor.date === date && ui.excuseFor.pid === p.id) {
      body = `<p class="m-text">${esc(checked)} An excused tardy counts as on time.</p>`
        + `<form class="excuse-form" ${ids}><fieldset class="reasons"><legend>Reason</legend><div class="checks">`
        + EXCUSES.map((r, i) => `<label class="check"><input type="radio" name="ex-why" value="${esc(r)}" ${i === 0 ? 'checked' : ''}> ${esc(r)}</label>`).join('')
        + `</div></fieldset><label class="field"><span>Note <em>optional</em></span><input id="ex-note" maxlength="60" autocomplete="off" placeholder="Like the teacher’s name"></label>`
        + `<div class="row"><button type="submit" class="btn sm primary">Excuse tardy</button><button type="button" class="btn sm" data-act="excuse-cancel">Cancel</button></div></form>`;
    } else {
      body = `<p class="m-text">${esc(checked)}</p>${em.note}`
        + `<div class="row">${can ? `<button type="button" class="btn sm" data-act="excuse-open" ${ids}>${ic('check')} Excuse tardy</button>` : ''}${em.btn}</div>`;
    }
    return `<section class="dsec${first ? ' first' : ''} follow late${mk.xt ? ' is-excused' : ''}"><h3>${mk.xt ? 'Excused tardy' : 'Tardy'} · ${esc(when)}</h3>${body}</section>`;
  }
  // Absent or tardy students in a period whose parent has an email on file and hasn't been emailed yet.
  function pendingEmails(p, date) {
    const marks = marksOf(date, p.id);
    // TapRoll sends these itself after class, except any it couldn't send.
    if (autoToday(date)) return rosterOf(p.id).filter((st) => st.parents.length && needsEmail(marks[st.id]) && !marks[st.id].n && marks[st.id].nf).length;
    return rosterOf(p.id).filter((st) => st.parents.length && needsEmail(marks[st.id]) && !marks[st.id].n).length;
  }
  // Every absent or tardy student in the open period on the day being viewed, each with a button that opens a
  // written email to their parent. refresh redraws the open list in place (after an email or a change of app).
  function openParentEmails(refresh) {
    const p = S.periods[ui.periodId];
    if (!p) return;
    const date = ui.date;
    const marks = marksOf(date, p.id);
    const auto = autoToday(date);
    const rows = rosterOf(p.id).map((st) => ({ st, mk: marks[st.id] })).filter((r) => needsEmail(r.mk))
      .sort((a, b) => (a.mk.s === b.mk.s ? byName(a.st, b.st) : (a.mk.s === 'A' ? -1 : 1)));
    const day = date === todayStr() ? 'Today' : fmtDateShort(date);
    const list = rows.length
      ? `<ul class="pm-list">${rows.map(({ st, mk }) => {
        const action = !st.parents.length
          ? `<button type="button" class="btn sm" data-act="add-parent-email" data-id="${esc(st.id)}">${ic('plus')} Add parent email</button>`
          : (mk.n ? `<span class="sent">${ic('check')}${mk.na ? 'Emailed automatically' : 'Opened'} ${esc(fmtClock(mk.n))}</span>${emailLink(st, p, date, mk, 'Email again')}`
            : mk.nf ? `<span class="sent failed">${ic('alert')}Couldn’t send</span>${emailLink(st, p, date, mk)}`
            : (auto ? `<span class="sent later">${ic('clock')}Sends after class</span>${emailLink(st, p, date, mk, 'Email now')}` : emailLink(st, p, date, mk)));
        return `<li class="pm-row"><span class="pill ${mk.s === 'A' ? 'a' : 't'}">${mk.s === 'A' ? 'Absent' : 'Tardy'}</span>`
          + `<span class="pm-who"><b>${esc(fullName(st))}</b><span>${st.parents.length ? esc(st.parents.join(', ')) : 'No parent email yet'}${mk.s === 'T' ? ` · in at ${esc(fmtClock(mk.t))}` : ''}</span></span>`
          + `<span class="pm-act">${action}</span></li>`;
      }).join('')}</ul>`
      : `<p class="m-text">No one in ${esc(periodLabel(p))} is absent or tardy ${day === 'Today' ? 'today' : `on ${esc(day)}`}.</p>`;
    const html = `${modalHead('Email parents', `${periodLabel(p)} · ${day}`)}<div class="m-body">`
      + `<p class="m-text small">${auto ? 'TapRoll emails these parents automatically a few minutes after class ends. To send one now from your own account, use its button.' : 'Each button opens an email to that student’s parent, already written. Read it over, then send it from your own account.'}</p>`
      + `<div class="field"><span>Open emails in</span>${viaSeg()}</div>${list}</div>`;
    const box = $('#modal-root .modal');
    if (refresh && ui.parentsOpen && box) { box.innerHTML = html; return; }
    openModal(html, { label: 'Email parents', onClose: () => { ui.parentsOpen = false; } });
    ui.parentsOpen = true;
  }
  // Records that a parent email was opened for this mark, after the click has opened it.
  function markEmailed(sid, date, pid) {
    const mk = marksOf(date, pid)[sid];
    if (!needsEmail(mk) || !editable()) return;
    const { na, ...rest } = mk;   // opened by hand now, even if it was emailed automatically before
    setMark(date, pid, sid, { ...rest, n: Date.now() });
    if (ui.openStudent === sid) refreshStudent();
    if (ui.parentsOpen) openParentEmails(true);
    scheduleRender();
  }
  function excuseTardy(sid, date, pid, why) {
    const mk = marksOf(date, pid)[sid];
    const st = S.students[sid];
    if (!mk || mk.s !== 'T' || !st || !editable()) return;
    setMark(date, pid, sid, { ...mk, s: 'P', xt: 1, why });
    ui.excuseFor = null;
    refreshStudent();
    scheduleRender();
    toast({ kind: 'ok', text: 'Tardy excused', sub: `${fullName(st)} · ${periodLabel(S.periods[pid])}`, actions: [{ label: 'Undo', run: () => { setMark(date, pid, sid, mk); refreshStudent(); scheduleRender(); } }] });
  }
  function unexcuseTardy(sid, date, pid) {
    const mk = marksOf(date, pid)[sid];
    if (!mk || !mk.xt || !editable()) return;
    setMark(date, pid, sid, { s: 'T', t: mk.t, m: mk.m, px: mk.px });

    scheduleRender();
  }
  function refreshStudent() {
    if (!ui.openStudent || !modal.open) return;

  function studentHtml(sid) {
    const st = S.students[sid];
    if (!st) return `${modalHead('Student removed')}<p class="m-text">This student is no longer on any roster.</p>`;
    const periods = st.periods.map((id) => S.periods[id]).filter(Boolean).sort((a, b) => a.num - b.num);
    const hasTag = !!(st.token || st.uids.length);
    const nfc = NFC.status();
    const can = editable();
    const tagLine = hasTag ? `Tag linked${st.tagAt ? ` · ${fmtDay(dateStr(new Date(st.tagAt)))}` : ''}` : 'No tag yet';
    const tagDetail = [st.token ? `Tag code ${st.token}` : '', st.uids.length ? `Reader ID ${st.uids.join(', ')}` : ''].filter(Boolean).join(' · ');
    const payload = st.token || st.sk ? tagPayload(st.token || st.sk).text : '';
    const hist = periods.map((p) => {
      const h = studentHistory(st, p.id);
      const marked = h.P + h.T + h.A + h.E;
      const rate = marked ? `${pct(h.P + h.T, marked)}%` : '—';
      return `<div class="hrow"><span class="pnum">P${esc(p.num)}</span><div class="cells">${h.cells.length ? h.cells.map((c) => `<span class="cell ${c.s}" title="${esc(fmtDay(c.d))}: ${esc(c.xt ? 'Excused tardy' : (STATUS[c.s] || 'Not marked'))}">${c.s === 'U' ? '·' : c.s}</span>`).join('') : '<span class="m-text small">No sessions yet</span>'}</div><span class="hrate">${rate}</span></div>`;

      + `<div class="dr-title"><h2>${esc(fullName(st))}</h2><p>${esc(periods.map((p) => `P${p.num} ${p.course}`).join(' · ') || 'Not in any period')}</p></div>`

      + `${can ? `<div class="row"><button class="btn primary" data-act="write-tag" data-id="${esc(st.id)}" ${nfc.ok ? '' : 'disabled'}>${ic('nfc')} ${hasTag ? 'Write a new tag' : 'Write tag'}</button>`
        + `<button class="btn" data-act="link-tag" data-id="${esc(st.id)}">${ic('link')} Link existing tag</button>`
        + `${hasTag ? `<button class="btn ghost danger" data-act="unlink-tag" data-id="${esc(st.id)}">Remove tag</button>` : ''}</div>`
        + (st.sk ? `<p class="m-text small">${esc(st.first || 'This student')}’s school office added them, so a tag written in any of their classes at your school works here too, and a tag written here works there.</p>`
          : `<p class="m-text small">Already has a TapRoll tag from another class? Choose <b>Link existing tag</b> so one tag works in both classes.</p>`) : ''}`
      + `${nfc.ok ? '' : `<p class="m-text small">${esc(nfc.title)}. ${esc(nfc.detail)}</p>`}`
      + `${can ? `<details class="tip"><summary>Write the tag with another app instead</summary><p class="m-text small">Any NFC writer app (NFC Tools works on iPhone and Android) can write this ${tagPayload('x').kind === 'link' ? 'link' : 'text'} to an NTAG sticker or card. TapRoll recognizes the tag once it’s written.</p>`
        + `<div class="payload"><code id="payload-code">${payload ? esc(payload) : 'A code is created when you copy.'}</code><button class="btn sm" data-act="copy-payload" data-id="${esc(st.id)}">${ic('copy')} Copy</button></div></details>` : ''}`
      + `<div id="tag-op"></div></section>`
      + `<section class="dsec"><h3>Last 15 class sessions</h3><div class="hist">${hist || '<p class="m-text small">Not in any period.</p>'}</div></section>`
      + `${can ? `<section class="dsec"><h3>Details</h3><form id="stu-form" class="m-body"><div class="grid2"><label class="field"><span>First name</span><input id="sf-first" maxlength="40" value="${esc(st.first)}"></label>`
        + `<label class="field"><span>Last name</span><input id="sf-last" maxlength="40" value="${esc(st.last)}"></label></div>`
        + `<label class="field"><span>Parent or guardian email <em>optional</em></span><input id="sf-parents" type="text" inputmode="email" autocomplete="off" spellcheck="false" maxlength="300" placeholder="parent@example.com" value="${esc(st.parents.join(', '))}">`
        + `<small>Used to email a parent when ${esc(st.first || 'this student')} is absent or tardy. Separate two addresses with a comma.</small></label>`
        + `<div class="field"><span>Periods</span><div class="checks">${periodList().map((p) => `<label class="check"><input type="checkbox" name="sp" value="${esc(p.id)}" ${st.periods.includes(p.id) ? 'checked' : ''}> P${esc(p.num)} · ${esc(p.course)}</label>`).join('')}</div></div>`
        + `<p class="m-text small" id="sf-err" hidden></p>`
        + `<div class="m-foot"><button type="button" class="btn danger spacer" data-act="delete-student" data-id="${esc(st.id)}">${ic('trash')} Remove student</button><button type="submit" class="btn primary">Save</button></div></form></section>` : ''}`;
  }
  function bindStudentForm(sid) {
    const ex = document.querySelector('#modal-root .excuse-form');

  function opStatus(kind, text, cancelable) {
