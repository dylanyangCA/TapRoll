  function bindImport() {
    const err = (msg) => { const el = $('#imp-err'); if (el) { el.textContent = msg; el.hidden = false; } };
    const file = $('#imp-file');
    const loadFile = async (f) => {
      if (!f) return;
      try {
        const sheets = await readSpreadsheet(f);
        const usableSheets = sheets.filter((s) => s.rows.length);
        if (!usableSheets.length) { err('That file looks empty.'); return; }
        imp.sheets = usableSheets; imp.file = f.name || '';
        selectSheet(0);
        renderImport();
      } catch (e) { err(sheetErrorText(e)); }
    };
    if (file) file.addEventListener('change', () => { loadFile(file.files && file.files[0]); file.value = ''; });
    const drop = $('#imp-drop');
    if (drop) {
      drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
      drop.addEventListener('dragleave', () => drop.classList.remove('over'));
      drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); loadFile(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]); });
    }
    const pasteGo = $('#imp-paste-go');
    if (pasteGo) pasteGo.addEventListener('click', () => {
      const rows = parseDelimited($('#imp-paste').value);
      if (!rows.length) { err('Choose a file, or paste cells from a spreadsheet first.'); return; }
      imp.sheets = [{ name: 'Pasted cells', rows }]; imp.file = 'Pasted cells';
      selectSheet(0);
      renderImport();
    });
    const sheetSel = $('#imp-sheet');
    if (sheetSel) sheetSel.addEventListener('change', () => { selectSheet(Number(sheetSel.value)); renderImport(); });
    const hdr = $('#imp-hdr');
    if (hdr) hdr.addEventListener('change', () => {
      const sh = imp.sheets[imp.sheet];
      if (hdr.checked) { imp.header = Math.max(0, findHeader(sh.rows)); imp.hasHeader = true; imp.map = guessMap(sh.rows[imp.header]); }
      else { imp.hasHeader = false; imp.header = -1; }
      renderImport();
    });
    document.querySelectorAll('#modal-root .imp-map select').forEach((s) => s.addEventListener('change', () => {
      const v = Number(s.value);
      if (v >= 0) { for (const k of Object.keys(imp.map)) if (imp.map[k] === v) delete imp.map[k]; imp.map[s.dataset.f] = v; }
      else delete imp.map[s.dataset.f];
      renderImport();
    }));
    const ot = $('#imp-one-t'), op = $('#imp-one-p');
    if (ot) ot.addEventListener('change', () => { imp.one = { uid: ot.value, pid: '' }; renderImport(); });
    if (op) op.addEventListener('change', () => { imp.one.pid = op.value; renderImport(); });
    const back = $('#imp-back');
    if (back) back.addEventListener('click', () => { imp.step = 'pick'; renderImport(); });
    const go = $('#imp-go');
    if (go) go.addEventListener('click', async () => {
      if (imp.busy || !imp.plan || !imp.plan.places) return;
      imp.busy = true;
      go.disabled = true; go.innerHTML = '<span class="spin" aria-hidden="true"></span>Adding…';
      const items = [...imp.plan.students.values()].map((s) => ({ first: s.first, last: s.last, parents: [...s.parents], places: s.places }));
      imp.result = await applyPlacements(items);
      imp.busy = false;
      imp.step = 'done';
      renderImport();
      schoolChanged();
    });
    const sk = $('#imp-skipped');
    if (sk) sk.addEventListener('click', () => {
      const { header } = importRows();
      const rows = [[...header, 'Why it was skipped'], ...imp.plan.skipped.map((s) => [...header.map((_, i) => s.r[i] || ''), s.why])];
      saveFile(`skipped-rows-${todayStr()}.csv`, toCsv(rows));
    });
  }

  /* ----- Actions ----- */
  function schoolAct(act, el) {
    const d = el.dataset;
    switch (act) {
      case 'sc-tab': ui.scTab = d.v; ui.scAll = false; scheduleRender(); break;
      case 'sc-teacher': openSchoolTeacher(d.id); break;
      case 'sc-student': openSchoolStudent(d.key); break;
      case 'sc-all': ui.scAll = true; scheduleRender(); break;
      case 'sc-csv': exportSchoolCsv(); break;
      case 'sc-invite': openInvite(); break;
      case 'sc-member': openMember(d.id); break;
      case 'sc-uninvite':
        cancelInvite(d.email).then(() => { toast({ kind: 'info', text: 'Invite canceled', sub: d.email }); schoolChanged(); })
          .catch((e) => toast({ kind: 'warn', text: 'Couldn’t cancel the invite', sub: schoolErrText(e, 'that change') }));
        break;
      case 'sc-add': openSchoolAdd(d.uid, d.pid); break;
      case 'sc-import': openImport(); break;
      case 'sc-unplace': unplace(d.uid, d.sid, d.pid, d.key); break;
      case 'sc-panel': openSchoolPanel(); break;
      case 'sc-create': openSchoolCreate(); break;
      case 'sc-rename': openRename(); break;
      case 'sc-join':
        if (School.state === 'loading' || (School.state === 'member' && !School.owner)) { toast({ kind: 'info', text: 'Still loading your school', sub: 'Try again in a moment.' }); break; }
        if (School.state === 'member' && School.owner === meUid()) { toast({ kind: 'warn', text: `You run ${School.name}`, sub: 'Email us to hand it to someone else before joining another school.' }); break; }
        el.disabled = true;
        {
          const inv = findInvite(d.sid) || School.invite || {};
          pendingSchoolLink = isStaffRole(inv.role);
          joinSchool(inv).then(() => {
            closeModal();
            toast({ kind: 'ok', text: `You joined ${inv.school || 'your school'}`, sub: inv.role === 'teacher' ? 'The school office can now see your classes.' : 'Opening the School office…' });
            schoolChanged();
          })
            .catch((e) => {
              pendingSchoolLink = false; el.disabled = false;
              const denied = String((e && e.code) || '').includes('permission-denied');
              toast({ kind: 'warn', text: 'Couldn’t join', sub: denied ? 'The invite may have been canceled or changed. Ask the school office to invite you again.' : schoolErrText(e, 'joining the school') });
              if (denied) checkInvite();
            });
        }
        break;
      case 'sc-decline':
        declineInvite(findInvite(d.sid) || School.invite).then(() => { toast({ kind: 'info', text: 'Invite declined' }); schoolChanged(); })
          .catch((e) => toast({ kind: 'warn', text: 'Couldn’t decline', sub: schoolErrText(e, 'that change') }));
        break;
      case 'sc-leave':
        confirmBox({
          title: `Leave ${School.name}?`, body: `${School.name}’s admins and registrars won’t see your classes anymore. Your classes and students, including any the school office added, stay in your account.`,
          okLabel: 'Leave school', danger: true,
          onOk: () => leaveSchool().then(() => toast({ kind: 'info', text: `You left ${School.name}` })).catch((e) => toast({ kind: 'warn', text: 'Couldn’t leave', sub: schoolErrText(e, 'leaving the school') }))
        });
        break;
      case 'sc-verify-send':
        sendVerifyEmail().then(() => { toast({ kind: 'ok', text: 'Confirmation email sent', sub: School.me.email }); schoolChanged(); if (ui.scInviteOpen) openInvite(); })
          .catch((e) => toast({ kind: 'warn', text: 'Couldn’t send the email', sub: authMessage(e) }));
        break;
      case 'sc-verify-check':
        recheckVerified().then((ok) => {
          if (!ok) { toast({ kind: 'info', text: 'Not confirmed yet', sub: 'Open the link in the email from TapRoll, then try again.' }); return; }
          toast({ kind: 'ok', text: 'Email confirmed' });
          checkInvite();
          if (ui.scInviteOpen) openInvite();
        }).catch((e) => toast({ kind: 'warn', text: 'Couldn’t check', sub: authMessage(e) }));
        break;
      default: break;
    }
  }

  /* ============================== Example school ==============================
     The example classroom is one teacher at a made-up Harbor View High. Five more made-up teachers share its bell
     schedule, and their classes are filled from the example classroom's students, so each student has several
     classes. Their check-ins follow the clock, so the School office fills in during the day like a real one. */
  const DEMO_SCHOOL_KEY = 'taproll.data.demo.school';
  const DEMO_TEACHERS = [
    { uid: 'demo-alvarez', name: 'Ms. Alvarez', email: 'alvarez@harborview.example', room: '102', courses: ['English 10', 'English 10', 'AP Literature', null, 'English 10', 'Creative Writing'] },
    { uid: 'demo-okafor', name: 'Mr. Okafor', email: 'okafor@harborview.example', room: '210', courses: ['Algebra 2', 'Geometry', 'Algebra 2', 'Precalculus', null, 'Geometry'] },
    { uid: 'demo-chen', name: 'Ms. Chen', email: 'chen@harborview.example', room: '120', courses: ['World History', null, 'US History', 'World History', 'US History', 'Government'] },
    { uid: 'demo-brooks', name: 'Coach Brooks', email: 'brooks@harborview.example', room: 'Gym', courses: ['PE', 'PE', 'Health', 'PE', 'PE', null] },
    { uid: 'demo-patel', name: 'Mr. Patel', email: 'patel@harborview.example', room: '220', courses: [null, 'Chemistry', 'Physics', 'Chemistry', 'Physics', 'Chemistry'] }
  ];
  function demoHash(s) { let h = 2166136261; for (const ch of String(s)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967296; }
  function schoolStartDemo(fresh) {
    schoolStop();
    School.kind = 'demo';
    School.me = { uid: 'demo', email: 'you@harborview.example', name: 'Example classroom', verified: true, provider: 'demo' };
    School.sid = 'demo-school'; School.owner = 'demo'; School.role = 'admin'; School.state = 'member'; School.watching = true;
    School.name = S.settings.school || 'Harbor View High';
    let saved = null;
    if (!fresh) { try { saved = JSON.parse(localStorage.getItem(DEMO_SCHOOL_KEY) || 'null'); } catch (e) { saved = null; } }
    if (saved && isObj(saved) && saved.date === todayStr() && saved.base === S.settings.sampleDate && isObj(saved.t) && isObj(saved.members)) {
      School.members = saved.members; School.invites = isObj(saved.invites) ? saved.invites : {};
      for (const [uid, t] of Object.entries(saved.t)) {
        School.t[uid] = { uid, profile: { teacher: (saved.members[uid] || {}).name || '' }, ws: 'demo', periods: cleanMap(t.periods, normPeriod), students: cleanMap(t.students, normStudent), day: {}, status: 'ready' };
      }
    } else buildDemoSchool();
    demoRefreshDays();
    saveDemoSchool();
  }
  function buildDemoSchool() {
    const bell = (window.TapRollDemo && window.TapRollDemo.periods) || [];
    const mine = Object.values(S.students);
    const mineAt = new Map();   // period number -> ids of the example classroom's students in it
    for (const st of mine) for (const pid of st.periods) { const p = S.periods[pid]; if (p) mineAt.set(p.num, [...(mineAt.get(p.num) || []), st.id]); }
    const at = Date.now();
    School.members = { demo: { role: 'admin', name: 'Example classroom', email: 'you@harborview.example', at } };
    School.members['demo-reyes'] = { role: 'registrar', name: 'Daniel Reyes', email: 'registrar@harborview.example', at };
    School.invites = { 'new.teacher@harborview.example': { email: 'new.teacher@harborview.example', role: 'teacher', byName: 'Daniel Reyes', byEmail: 'registrar@harborview.example', at: at - 86400000 } };
    const entries = new Map();   // teacher uid -> Map(student id in the example classroom -> entry)
    const seats = {};
    for (const T of DEMO_TEACHERS) {
      School.members[T.uid] = { role: 'teacher', name: T.name, email: T.email, at };
      const t = { uid: T.uid, profile: { teacher: T.name }, ws: 'demo', periods: {}, students: {}, day: {}, status: 'ready' };
      T.courses.forEach((course, i) => {
        const b = bell[i];
        if (!course || !b) return;
        const id = `p${b.num}${T.uid.slice(5, 9)}`;
        t.periods[id] = normPeriod({ id, num: b.num, course, room: T.room, start: b.start, end: b.end });
        (seats[b.num] = seats[b.num] || []).push({ t, pid: id });
      });
      School.t[T.uid] = t;
      entries.set(T.uid, new Map());
    }
    // Each period, students who aren't in the example classroom then are spread across the other teachers' classes.
    for (const [num, list] of Object.entries(seats)) {
      const busy = new Set(mineAt.get(Number(num)) || []);
      const free = mine.filter((st) => !busy.has(st.id)).sort((a, b) => demoHash(a.id + num) - demoHash(b.id + num));
      const per = Math.min(28, Math.ceil(free.length / list.length));
      list.forEach(({ t, pid }, k) => {
        for (const st of free.slice(k * per, (k + 1) * per)) {
          const map = entries.get(t.uid);
          let e = map.get(st.id);
          if (!e) {
            const linked = !!st.token && demoHash(st.id + t.uid) < 0.85;
            e = normStudent({ id: 's' + st.id.slice(1, 6) + t.uid.slice(5, 9), first: st.first, last: st.last, periods: [], token: linked ? st.token : null, uids: [], tagAt: linked ? st.tagAt : null, parents: st.parents });
            e.sk = st.token || `k${st.id.slice(1)}`.slice(0, 12);
            map.set(st.id, e);
          }
          e.periods.push(pid);
        }
      });
    }
    for (const [uid, map] of entries) for (const e of map.values()) School.t[uid].students[e.id] = e;
  }
  // Check-ins follow the clock: each student's arrival time is fixed for the day, so they appear as time passes.
  function demoRefreshDays() {
    if (School.kind !== 'demo') return;
    const date = todayStr();
    const base = parseDate(date).getTime();
    const now = Date.now();
    const absentMine = new Set();
    for (const per of Object.values(S.days[date] || {})) for (const [sid, mk] of Object.entries(per)) if (mk.s === 'A' || mk.s === 'E') { const st = S.students[sid]; if (st) absentMine.add(nameKey(st.first, st.last)); }
    for (const t of Object.values(School.t)) {
      const day = {};
      for (const p of Object.values(t.periods)) {
        const s = base + toMin(p.start) * 60000, e = base + toMin(p.end) * 60000;
        if (now < s - passOf(p) * 60000) continue;
        const marks = {};
        for (const st of Object.values(t.students)) {
          if (!st.periods.includes(p.id)) continue;
          const r = demoHash(`${st.sk || st.id}|${date}`), r2 = demoHash(`${st.id}|${p.id}|${date}`);
          const out = absentMine.has(nameKey(st.first, st.last)) || r < 0.03;
          if (out) { if (now >= s + 10 * 60000) marks[st.id] = { s: r < 0.008 ? 'E' : 'A', t: s + 10 * 60000, m: 'manual' }; continue; }
          const late = r2 < 0.06;
          const arrive = late ? s + (6 + Math.floor(r2 * 180)) * 60000 : s - 240000 + Math.floor(r2 * 420000);
          if (arrive > now) { if (now >= e) marks[st.id] = { s: 'A', t: s + 10 * 60000, m: 'manual' }; continue; }
          marks[st.id] = { s: arrive > s + graceOf(p) * 60000 ? 'T' : 'P', t: arrive, m: st.token ? 'nfc' : 'manual' };
        }
        if (Object.keys(marks).length) day[p.id] = marks;
      }
      t.day = day;
    }
  }
  function saveDemoSchool() {
    if (School.kind !== 'demo') return;
    const t = {};
    for (const [uid, d] of Object.entries(School.t)) t[uid] = { periods: d.periods, students: d.students };
    try { localStorage.setItem(DEMO_SCHOOL_KEY, JSON.stringify({ date: todayStr(), base: S.settings.sampleDate, members: School.members, invites: School.invites, t })); } catch (e) { /* storage full or blocked */ }
  }

  /* ============================== Late passes ==============================
     When a teacher keeps a class past the bell, they send a late pass from that period: the students' tardies in
     their next class today are excused, with the reason "Held by <teacher> (P1)". A pass covers a class that starts
     within 30 minutes after the period it came from ended.
     Passes for your own classes are saved with your attendance (days/<date>.passes). In a school, they're also
     shared with the school (schools/<sid>/passes/<id>), and every teacher's TapRoll applies them to their own
     classes, matching students by school key, or by name for students a teacher added themselves. */
  const PASS_WINDOW = 30;   // minutes after the period ends that the next class can start
  function normPass(p, id) {
    const f = isObj(p.from) ? p.from : {};
    return {
      id: String(p.id || id || ''), date: String(p.date || ''), at: Number(p.at) || 0,
      by: String(p.by || ''), byName: String(p.byName || '').slice(0, 80),
      from: { pid: String(f.pid || ''), num: Number(f.num) || 0, course: String(f.course || '').slice(0, 60), end: /^\d{2}:\d{2}$/.test(f.end) ? f.end : '' },
      students: (Array.isArray(p.students) ? p.students : []).filter(isObj).slice(0, 80).map((e) => {
        const out = { id: String(e.id || ''), nk: String(e.nk || '').slice(0, 80), name: String(e.name || '').slice(0, 80) };
        if (typeof e.sk === 'string' && /^[a-z0-9]{6,40}$/.test(e.sk)) out.sk = e.sk;
        return out;
      })
    };
  }
  function cleanPasses(map) {
    const out = {};
    if (isObj(map)) for (const [k, v] of Object.entries(map)) if (isObj(v)) { const p = normPass(v, k); if (p.id && p.from.end) out[p.id] = p; }
    return out;
  }
  const passWhy = (pass) => `Held by ${pass.byName || 'another teacher'}${pass.from.num ? ` (P${pass.from.num})` : ''}`;
  const myId = () => (Session.user && Session.user.id) || '';
  // Today's passes: your own, plus any shared in your school.
  function todaysPasses(date = todayStr()) {
    const out = new Map();
    for (const p of Object.values((S.passes && S.passes[date]) || {})) out.set(p.id, p);
    for (const p of School.passes || []) if (p.date === date && !out.has(p.id)) out.set(p.id, p);
    return [...out.values()];
  }
  function passHasStudent(pass, st) {
    const nk = nameKey(st.first, st.last);
    return pass.students.some((e) => (pass.by === myId() && e.id === st.id)
      || (e.sk && st.sk ? e.sk === st.sk : (!!e.nk && e.nk === nk)));
  }
  // Does this pass cover the student's class in period p? The class has to start soon after the pass's period ended.
  function passCovers(pass, st, p) {
    if (pass.by === myId() && pass.from.pid === p.id) return false;
    const end = toMin(pass.from.end), start = toMin(p.start);
    if (end == null || start == null || start < end - 2 || start > end + PASS_WINDOW) return false;
    return passHasStudent(pass, st);
  }
  function passFor(st, p, date) { return todaysPasses(date).find((pass) => passCovers(pass, st, p)) || null; }
  // Excuses tardies that a pass covers, once per pass. A teacher can still mark one tardy again afterward.
  // Returns how many it excused. quiet: the caller says so itself.
  function applyPasses(quiet) {
    if (!editable() || !ui.ready) return 0;
    const date = todayStr();
    const passes = todaysPasses(date);
    if (!passes.length) return 0;
    let changed = 0;
    for (const p of periodList()) {
      const marks = marksOf(date, p.id);
      const fixes = [];
      for (const st of rosterOf(p.id)) {
        const mk = marks[st.id];
        if (!mk || mk.s !== 'T' || mk.xt) continue;
        const pass = passes.find((x) => mk.px !== x.id && passCovers(x, st, p));
        if (pass) fixes.push({ sid: st.id, mark: { ...mk, s: 'P', xt: 1, why: passWhy(pass), px: pass.id } });
      }
      if (fixes.length) { setMarks(date, p.id, fixes); changed += fixes.length; }
    }
    if (changed) {
      if (!quiet) toast({ kind: 'info', text: `Excused ${plural(changed, 'tardy', 'tardies')}`, sub: 'Another class ran late, so the teacher sent a late pass.' });
      scheduleRender();
    }
    return changed;
  }
  function sentPasses(p, date) {
    return Object.values((S.passes && S.passes[date]) || {}).filter((x) => x.from.pid === p.id).sort((a, b) => b.at - a.at);
  }
  function latePassNote(p, date) {
    const list = sentPasses(p, date);
    if (!list.length) return '';
    const last = list[0];
    return `<p class="lp-note">${ic('clock')}<span>Late pass sent at ${esc(fmtClock(last.at))} for ${esc(plural(last.students.length, 'student'))}. Their tardies in their next class today are excused.</span></p>`;
  }
  function openLatePass() {
    const p = S.periods[ui.periodId];
    if (!p || !editable()) return;
    const date = todayStr();
    const marks = marksOf(date, p.id);
    const roster = rosterOf(p.id);
    const here = (st) => { const mk = marks[st.id]; return !!mk && (mk.s === 'P' || mk.s === 'T'); };
    const teacher = S.settings.teacher || (Session.user && Session.user.name) || 'your teacher';
    const inSchool = School.state === 'member' && Session.kind === 'cloud';
    const scope = inSchool ? `It works in your classes and in other teachers’ classes at ${esc(School.name || 'your school')}.`
      : (Session.kind === 'cloud' ? 'It works in your own classes. To excuse students in other teachers’ classes too, join your school in TapRoll (Settings › School).' : 'It works in your own classes.');
    openModal(`${modalHead('Kept the class late?', `Send a late pass from ${periodLabel(p)}${p.course ? ` ${p.course}` : ''}. Tardies in each student’s next class today are excused.`)}`
      + `<form id="lp-form" class="m-body"><div class="lp-tools"><span class="m-text small">The reason shows as “${esc(passWhy({ byName: teacher, from: { num: p.num } }))}”.</span>`
      + `<button type="button" class="linkbtn" id="lp-all">Select all</button><button type="button" class="linkbtn" id="lp-none">Clear</button></div>`
      + `<ul class="lp-list">${roster.map((st) => `<li><label class="check"><input type="checkbox" name="lp-s" value="${esc(st.id)}" ${here(st) ? 'checked' : ''}> ${esc(fullName(st))}<small>${esc(marks[st.id] ? markLabel(marks[st.id]) : 'Not marked')}</small></label></li>`).join('')}</ul>`
      + `<p class="m-text small">${scope} Students who were here are selected.</p>`
      + `<p class="m-text small err-text" id="lp-err" hidden></p>`
      + `<div class="m-foot"><button type="button" class="btn" data-act="close-modal">Cancel</button><button type="submit" class="btn primary" id="lp-go">Send late pass</button></div></form>`, { label: 'Late pass' });
    const boxes = () => Array.from(document.querySelectorAll('#lp-form input[name="lp-s"]'));
    const count = () => {
      const n = boxes().filter((b) => b.checked).length;
      $('#lp-go').textContent = n ? `Send late pass for ${plural(n, 'student')}` : 'Send late pass';
      if (n) $('#lp-err').hidden = true;
    };
    $('#lp-all').addEventListener('click', () => { boxes().forEach((b) => { b.checked = true; }); count(); });
    $('#lp-none').addEventListener('click', () => { boxes().forEach((b) => { b.checked = false; }); count(); });
    $('#lp-form').addEventListener('change', count);
    count();
    $('#lp-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const ids = boxes().filter((b) => b.checked).map((b) => b.value);
      if (!ids.length) { const err = $('#lp-err'); err.textContent = 'Pick at least one student.'; err.hidden = false; return; }
      const pass = normPass({
        id: 'lp' + rid(10), date, at: Date.now(), by: myId(), byName: teacher,
        from: { pid: p.id, num: p.num, course: p.course, end: p.end },
        students: ids.map((id) => S.students[id]).filter(Boolean).map((st) => ({ id: st.id, sk: st.sk, nk: nameKey(st.first, st.last), name: fullName(st) }))
      });
      addPass(pass);
      closeModal();
      const mine = applyPasses(true);
      const here = mine ? `Excused ${plural(mine, 'tardy', 'tardies')} in your classes.` : '';
      toast({ kind: 'ok', text: `Late pass sent for ${plural(pass.students.length, 'student')}`, sub: inSchool ? `${here ? `${here} ` : ''}Their next teachers’ TapRoll excuses the tardy.` : (here || 'Tardies in their next class are excused.'), actions: [{ label: 'Undo', run: () => removePass(pass) }] });
      scheduleRender();
    });
  }
  function addPass(pass) {
    ensureWs();
    const day = S.passes[pass.date] || (S.passes[pass.date] = {});
    day[pass.id] = pass;
    Store.persist({ doc: 'day', date: pass.date, patch: { date: pass.date, passes: { [pass.id]: pass } } });
    if (School.state === 'member' && School.kind === 'cloud') {
      const { id, ...rest } = pass;
      Cloud.fs.doc(`schools/${School.sid}/passes/${id}`).set(rest).catch((e) => toast({ kind: 'warn', text: 'The late pass reached only your classes', sub: schoolErrText(e, 'sharing it with your school') }));
    }
  }
  // Undo: the pass is withdrawn and the tardies it excused in your own classes come back.
  function removePass(pass) {
    const day = S.passes[pass.date];
    if (day) delete day[pass.id];
    Store.persist({ doc: 'day', date: pass.date, patch: { date: pass.date, passes: { [pass.id]: null } } });
    if (School.state === 'member' && School.kind === 'cloud') Cloud.fs.doc(`schools/${School.sid}/passes/${pass.id}`).delete().catch(() => {});
    for (const p of periodList()) {
      const marks = marksOf(pass.date, p.id);
      const back = Object.entries(marks).filter(([, mk]) => mk.px === pass.id && mk.xt).map(([sid, mk]) => ({ sid, mark: { s: 'T', t: mk.t, m: mk.m } }));
      if (back.length) setMarks(pass.date, p.id, back);
    }
    toast({ kind: 'info', text: 'Late pass withdrawn' });
    scheduleRender();
  }

  /* ============================== Automatic parent emails ==============================
     A small sender that the site's owner runs on Cloudflare (taproll-mail-worker.js, see openMailGuide) emails the
     parents of students marked absent or tardy a few minutes after each class ends, from the site's own address,
     with replies going to the teacher. It works for teachers in the schools the owner lists, and each teacher can
     turn it off (mailAuto: false in their profile). Each run is recorded at site/mail:
       { lastRun, ok, error, sent, from, schools: [school IDs, or '*'], delay: minutes after class }
     Marks it emailed get n (when) and na (automatically). */
  // state: idle (not checked yet), done, blocked (rules), error. busy: a check is on its way.
  const Mail = { state: 'idle', busy: false, data: null, at: 0, tzTried: false };
  const MAIL_STALE = 40 * 60000;   // the sender runs every 10 minutes; after this long it has stopped
  function mailReset() { Mail.state = 'idle'; Mail.busy = false; Mail.data = null; Mail.at = 0; Mail.tzTried = false; }
  // Checks site/mail, at most every maxAge ms unless forced.
  function loadMail(force, maxAge = 10 * 60000) {
    if (Session.kind !== 'cloud' || !Cloud.fs) return;
    if (Mail.busy || (!force && Mail.at && Date.now() - Mail.at < maxAge)) return;
    Mail.busy = true;
    const uid = Session.user && Session.user.id;
    const done = (state, data) => {
      if (!Session.user || Session.user.id !== uid) return;
      Mail.busy = false; Mail.state = state; Mail.data = data; Mail.at = Date.now();
      mailChanged();
    };
    Cloud.fs.doc('site/mail').get().then((snap) => done('done', snap.exists ? (snap.data() || {}) : null),
      (e) => done(String((e && e.code) || '') === 'permission-denied' ? 'blocked' : 'error', null));
  }
  function mailChanged() {
    const sec = $('#mail-sec');
    if (sec) sec.innerHTML = mailSectionInner();
    if (ui.parentsOpen) openParentEmails(true);
    if (ui.openStudent) refreshStudent();
    scheduleRender();
  }
  const tzName = () => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { return ''; } };
  // The sender works out "today" and when classes end in each teacher's own time zone.
  function syncMailTz() {
    if (Session.kind !== 'cloud' || ui.readOnly || Mail.tzTried) return;
    Mail.tzTried = true;
    const tz = tzName();
    if (tz && S.settings.mailTz !== tz) setSettings({ mailTz: tz });
  }
  const mailFrom = (d) => { const m = /<([^>]+)>/.exec(String((d && d.from) || '')); return m ? m[1] : String((d && d.from) || '').trim(); };
  /* What automatic emails do for this teacher now. auto: TapRoll sends them. why says what's going on:
     on, trouble (the last run hit a problem), off (turned off), stalled (the sender stopped), approve (school not
     turned on), school (not in a school), none (not set up on this site), blocked (rules), unknown (couldn't
     check), loading, device, demo. */
  function mailInfo() {
    if (Session.kind === 'demo') return { auto: false, why: 'demo' };
    if (Session.kind !== 'cloud') return { auto: false, why: 'device' };
    if (Mail.state === 'idle') return { auto: false, why: 'loading' };
    if (Mail.state === 'blocked') return { auto: false, why: 'blocked' };
    if (Mail.state === 'error') return { auto: false, why: 'unknown' };
    const d = Mail.data;
    if (!d || !Number(d.lastRun)) return { auto: false, why: 'none' };
    const inSchool = School.kind === 'cloud' && School.state === 'member' && !!School.sid;
    const list = Array.isArray(d.schools) ? d.schools : [];
    const base = { from: mailFrom(d), delay: Number(d.delay) >= 0 ? Number(d.delay) : 5, last: Number(d.lastRun), error: String(d.error || '') };
    if (!inSchool) return { ...base, auto: false, why: list.includes('*') ? 'school' : (School.state === 'loading' ? 'loading' : 'school') };
    if (!list.includes('*') && !list.includes(School.sid)) return { ...base, auto: false, why: 'approve' };
    if (S.settings.mailAuto === false) return { ...base, auto: false, why: 'off' };
    if (Date.now() - base.last > MAIL_STALE) return { ...base, auto: false, why: 'stalled' };
    return { ...base, auto: true, why: d.ok === false ? 'trouble' : 'on' };
  }
  const autoToday = (date) => date === todayStr() && mailInfo().auto;
  function setMailAuto(on) {
    if (Session.kind !== 'cloud' || !editable()) return;
    if (on === (S.settings.mailAuto !== false)) return;
    setSettings(on ? { mailAuto: true, mailSince: Date.now(), mailTz: tzName() || S.settings.mailTz || '' } : { mailAuto: false });
    toast(on ? { kind: 'ok', text: 'Automatic parent emails are on', sub: 'For classes that end from now on.' } : { kind: 'info', text: 'Automatic parent emails are off', sub: 'Send them yourself with Email parents.' });
    mailChanged();
  }

  /* ----- Settings ----- */
  function mailSectionInner() {
    const info = mailInfo();
    const manual = '<p class="m-text small">TapRoll writes the email to the parent of a student marked absent or tardy. It opens in your own email so you can check it and send it. Add parent emails in each student’s details.</p>';
    const via = `<div class="field"><span>Open emails you send in (this device)</span>${viaSeg()}</div>`;
    const status = (kind, icon, html, extra = '') => `<div class="opstatus ${kind}">${ic(icon)}<div class="op-body"><p>${html}</p>${extra}</div></div>`;
    const again = Mail.busy ? '<button type="button" class="btn sm ghost" disabled><span class="spin" aria-hidden="true"></span>Checking…</button>'
      : '<button type="button" class="btn sm ghost" data-act="mail-recheck">Check again</button>';
    const guide = `<div class="row"><button type="button" class="btn sm" data-act="mail-guide">How to set it up</button>${again}</div>`;
    const seg = `<div class="field"><span>Send parent emails</span><div class="seg" role="radiogroup" aria-label="Send parent emails">`
      + `<button type="button" role="radio" aria-checked="${S.settings.mailAuto !== false}" data-act="mail-auto" data-v="on" ${editable() ? '' : 'disabled'}>Automatically after class</button>`
      + `<button type="button" role="radio" aria-checked="${S.settings.mailAuto === false}" data-act="mail-auto" data-v="off" ${editable() ? '' : 'disabled'}>Myself</button></div></div>`;
    const school = esc(School.name || 'your school');
    let top = '';
    switch (info.why) {
      case 'demo':
        return `${manual}<p class="m-text small">With cloud sign-in, a school can also have TapRoll email parents automatically a few minutes after each class ends. In this example, nothing is sent.</p>${via}`;
      case 'device':
        return manual + via;
      case 'loading':
        return `<p class="m-text small">Checking automatic emails…</p>${via}`;
      case 'blocked':
        top = status('warn', 'alert', 'TapRoll couldn’t check automatic emails. If you run this TapRoll site, paste the latest Firestore rules from the setup guide into Firebase.', `<div class="row"><button type="button" class="btn sm" data-act="setup-guide">Setup guide</button>${again}</div>`);
        return top + manual + via;
      case 'unknown':
        return `${manual}<p class="m-text small">TapRoll couldn’t check whether automatic emails are on. Check your connection.</p><div class="row">${again}</div>${via}`;
      case 'none':
        return `${manual}<p class="m-text small">TapRoll can also email parents automatically after class, from the site’s own address. It isn’t set up on this TapRoll site yet.</p>${guide}${via}`;
      case 'school':
        return `${manual}<p class="m-text small">Automatic emails after class are for teachers in a school. When your school invites you, join it under School above.</p>${via}`;
      case 'approve': {
        const admin = School.role === 'admin';
        const ask = admin
          ? `To turn them on, email <a href="mailto:${esc(SUPPORT_EMAIL)}">${esc(SUPPORT_EMAIL)}</a> with your school ID, <code>${esc(School.sid)}</code>.`
          : `Your school’s admin can ask TapRoll to turn them on.`;
        return `${manual}<p class="m-text small">Automatic emails after class aren’t turned on for ${school} yet. ${ask}</p><div class="row">${again}</div>${via}`;
      }
      default: break;
    }
    const from = info.from ? ` from <b>${esc(info.from)}</b>` : '';
    const reply = Session.user && Session.user.email ? ` Replies go to ${esc(School.me && School.me.email ? School.me.email : Session.user.email)}.` : '';
    if (info.why === 'off') top = `<p class="m-text small">You send parent emails yourself. TapRoll writes each one and opens it in your email.</p>`;
    else if (info.why === 'stalled') top = status('warn', 'alert', `Automatic emails stopped running ${esc(sinceText(info.last))}. Until they’re back, send parent emails yourself with Email parents.`, `<div class="row">${again}</div>`);
    else {
      const when = info.delay ? `About ${esc(plural(info.delay, 'minute'))} after each class ends` : 'When each class ends';
      top = `<p class="m-text small">${when}, TapRoll emails the parents of students you marked absent or tardy${from}.${reply} Excused tardies aren’t emailed.</p>`;
      if (info.why === 'trouble') top += status('warn', 'alert', `The last try hit a problem${info.error ? `: ${esc(info.error)}` : ''}. TapRoll tries again every few minutes. You can also send emails yourself.`);
    }
    const tip = info.why === 'off' ? 'Add parent emails in each student’s details.' : 'Only students marked absent or tardy get an email, so before class ends, mark anyone who didn’t tap in. Add parent emails in each student’s details.';
    return `${seg}${top}<p class="m-text small">${tip}</p>${via}`;
  }
  const mailSettingsSection = () => `<section class="dsec" aria-label="Parent emails"><h3>Parent emails</h3><div class="m-body" id="mail-sec">${mailSectionInner()}</div></section>`;
  function sinceText(ms) {
    if (!ms) return '';
    const d = dateStr(new Date(ms));
    return `${d === todayStr() ? 'today' : `on ${fmtDateShort(d)}`} at ${fmtClock(ms)}`;
  }

  /* ----- In a class ----- */
  // A line under the roster tools: when parents get emailed, or that they were.
  function autoMailNote(p, date) {
    if (!editable() || date !== todayStr()) return '';
    const info = mailInfo();
    if (!info.auto) return '';
    const marks = marksOf(date, p.id);
    const roster = rosterOf(p.id);
    const due = roster.filter((st) => needsEmail(marks[st.id]));
    const done = due.filter((st) => marks[st.id].na).length;
    const failed = due.filter((st) => !marks[st.id].n && marks[st.id].nf).length;
    const waiting = due.filter((st) => !marks[st.id].n && !marks[st.id].nf && st.parents.length).length;
    const noEmail = due.filter((st) => !marks[st.id].n && !st.parents.length).length;
    const ended = phaseOf(p, date) === 'done';
    const unmarked = ended ? roster.filter((st) => !marks[st.id]).length : 0;
    const end = toMin(p.end);
    const parts = [];
    if (done) parts.push(`Parents of ${plural(done, 'student')} were emailed automatically.`);
    if (waiting) parts.push(`Parents of ${plural(waiting, done ? 'more student' : 'student', done ? 'more students' : 'students')} get an email automatically${end == null ? ' after class' : ` at about ${fmtHMap(minToHM(Math.min(end + info.delay, 1439)))}`}.`);
    if (failed) parts.push(`TapRoll couldn’t email the parents of ${plural(failed, 'student')}. Check ${failed === 1 ? 'the address' : 'their addresses'}, then use Email parents.`);
    if (noEmail) parts.push(`${plural(noEmail, 'student')} ${noEmail === 1 ? 'has' : 'have'} no parent email.`);
    if (unmarked) parts.push(`${plural(unmarked, 'student')} ${unmarked === 1 ? 'isn’t' : 'aren’t'} marked, so ${unmarked === 1 ? 'their parent isn’t' : 'their parents aren’t'} emailed.`);
    if (info.why === 'trouble' && waiting) parts.push('Automatic emails hit a problem on the last try.');
    if (!parts.length) return '';
    return `<p class="lp-note am-note">${ic('mail')}<span>${esc(parts.join(' '))}</span></p>`;
  }

  /* ----- Setup guide for the site's owner ----- */

      + setupStep('Add your domain to Resend', `Sign up at <a href="https://resend.com" target="_blank" rel="noopener">resend.com</a>, open <b>Domains</b>, and add <code>${esc(domain)}</code>. Add the DNS records Resend lists in Cloudflare under <b>DNS › Records</b> (or let Resend add them), then click <b>Verify</b>. Email you receive at your domain keeps working.`)

      + setupStep('Create the Cloudflare Worker', `In Cloudflare, open <b>Workers &amp; Pages › Create › Start with Hello World</b>, name it taproll-mail, and click <b>Deploy</b>. Click <b>Edit code</b>, replace everything with <a href="${esc(WORKER_URL)}" target="_blank" rel="noopener">the TapRoll sender code</a>, and click <b>Deploy</b>.`)
      + setupStep('Add its settings', `In the Worker, open <b>Settings › Variables and Secrets</b> and add these, then deploy:<ul class="mg-vars">${vars.map(([k, t, v]) => `<li><code>${k}</code> <span class="pill e">${t}</span> ${v}</li>`).join('')}</ul>`)
      + setupStep('Run it every 10 minutes', 'Open <b>Settings › Trigger Events</b>, add a <b>Cron Trigger</b>, and enter <code class="nw">*/10 * * * *</code>. Within 10 minutes, Settings › Parent emails shows that automatic emails are on.')
      + `</ol><p class="m-text small">Only schools listed in SCHOOLS get automatic emails, so strangers who sign up can’t send email from your address. Each teacher can turn them off. During school hours, each run reads about 5 Firestore documents per teacher, so for more than about 20 teachers, move Firebase to the pay-as-you-go Blaze plan. Resend’s free plan sends 100 emails a day.</p></div>`,
    { cls: 'wide', label: 'Set up automatic parent emails' });
  }

  /* ============================== Accounts ==============================
     Device accounts need no setup. They live in this browser, with passwords hashed (PBKDF2, SHA-256).
     Cloud accounts use Firebase Authentication once config.js holds a Firebase web config.
     Then teachers sign in with email or Google on any device, and their classes sync through Firestore.
     The example classroom needs no account at all. */
  const SESSION_KEY = 'taproll.session.v1';
  const LEGACY_KEY = 'taproll.data.v1';          // data saved before sign-in existed
  const LEGACY_DONE_KEY = 'taproll.legacy.done';
  const DEMO_KEY = 'taproll.data.demo';
  const dataKey = (id) => `taproll.data.acct.${id}`;

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { /* storage blocked */ } }
  const toB64 = (bytes) => btoa(String.fromCharCode(...new Uint8Array(bytes)));
  const fromB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const normEmail = (e) => String(e || '').trim().toLowerCase();
  const validEmail = (e) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(e || '').trim());
  const authErr = (code) => Object.assign(new Error(code), { code });
  function firstName(name) {
    const n = String(name || '').trim();
    if (/^(mr|mrs|ms|mx|dr|coach)\.?\s/i.test(n)) return n;
    return n.split(/\s+/)[0] || 'there';
  }

  /* ----- Device accounts ----- */
  const Device = {
    KEY: 'taproll.accounts.v1', ITER: 250000, mem: null,
    blank() { return { v: 1, accounts: {}, current: null }; },
    read() {
      if (this.mem) return this.mem;
      try { const r = JSON.parse(localStorage.getItem(this.KEY) || 'null'); if (isObj(r) && isObj(r.accounts)) return r; } catch (e) { /* blocked or unreadable */ }
      return this.blank();
    },
    // Falls back to memory when the browser blocks storage, so sign-in still works until the page closes.
    write(reg) { if (lsSet(this.KEY, JSON.stringify(reg))) { this.mem = null; return true; } this.mem = reg; return false; },
    find(reg, email) { const e = normEmail(email); return Object.values(reg.accounts).find((a) => a.email === e) || null; },
    async derive(password, salt, iterations) {
      if (!(window.crypto && crypto.subtle)) throw authErr('no-crypto');
      const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
      const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations }, key, 256);
      return toB64(bits);
    },
    async create({ name, school, email, password }) {
      const reg = this.read();
      if (this.find(reg, email)) throw authErr('email-in-use');
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const hash = await this.derive(password, salt, this.ITER);
      const acct = { id: 'a' + rid(10), name, school, email: normEmail(email), salt: toB64(salt), hash, iter: this.ITER, created: Date.now() };
      reg.accounts[acct.id] = acct;
      reg.current = acct.id;
      this.write(reg);
      return acct;
    },
    async signIn(email, password) {
      const reg = this.read();
      const acct = this.find(reg, email);
      // Hash even for an unknown email, so both cases take the same time.
      const hash = await this.derive(password, acct ? fromB64(acct.salt) : new Uint8Array(16), acct ? acct.iter : this.ITER);
      if (!acct || hash !== acct.hash) throw authErr('bad-credentials');
      reg.current = acct.id;
      this.write(reg);
      return acct;
    },
    current() { const reg = this.read(); return (reg.current && reg.accounts[reg.current]) || null; },
    signOut() { const reg = this.read(); reg.current = null; this.write(reg); },
    update(id, patch) { const reg = this.read(); if (!reg.accounts[id]) return; Object.assign(reg.accounts[id], patch); this.write(reg); },
    async changePassword(id, current, next) {
      const reg = this.read();
      const acct = reg.accounts[id];
      if (!acct) throw authErr('bad-credentials');
      if (await this.derive(current, fromB64(acct.salt), acct.iter) !== acct.hash) throw authErr('bad-current');
      const salt = crypto.getRandomValues(new Uint8Array(16));
      acct.hash = await this.derive(next, salt, this.ITER);
      acct.salt = toB64(salt);
      acct.iter = this.ITER;
      this.write(reg);
    },
    remove(id) { const reg = this.read(); delete reg.accounts[id]; if (reg.current === id) reg.current = null; this.write(reg); lsDel(dataKey(id)); }
  };

  /* ----- Cloud accounts (Firebase) ----- */
  const FIREBASE_VERSION = '12.19.0';
  const FIREBASE_CDN = `https://cdn.jsdelivr.net/npm/firebase@${FIREBASE_VERSION}/`;
  const Cloud = {
    cfg: null, auth: null, fs: null, state: 'off', pendingProfile: null,
    // config.js may set window.TAPROLL_FIREBASE, or simply hold Firebase's own `const firebaseConfig = {...}` block.
    readConfig() {
      let c = null;
      try { c = window.TAPROLL_FIREBASE || null; } catch (e) { c = null; }
      if (!c) { try { c = typeof firebaseConfig !== 'undefined' ? firebaseConfig : null; } catch (e) { c = null; } }
      if (!isObj(c)) return null;
      const filled = ['apiKey', 'authDomain', 'projectId'].every((k) => typeof c[k] === 'string' && c[k].trim() && !/^(paste|your)/i.test(c[k].trim()));
      return filled ? c : null;
    },
    async init(cfg) {
      this.cfg = cfg;
      this.state = 'loading';
      try {
        await loadFirebase();
        const fb = window.firebase;
        if (!fb.apps.length) fb.initializeApp(cfg);
        this.auth = fb.auth();
        this.fs = fb.firestore();
        // For local testing only: { emulators: { auth: 'http://127.0.0.1:9099', firestore: '127.0.0.1:8080' } }
        const emu = isObj(cfg.emulators) ? cfg.emulators : null;
        if (emu && emu.auth) this.auth.useEmulator(emu.auth);
        if (emu && emu.firestore) { const m = /^(.+):(\d+)$/.exec(String(emu.firestore)); if (m) this.fs.useEmulator(m[1], Number(m[2])); }
        // Keep working through Wi-Fi drops: changes are saved on the device and sent when the connection returns.
        try { const r = this.fs.enablePersistence({ synchronizeTabs: true }); if (r && r.catch) r.catch(() => {}); } catch (e) { /* optional */ }
        this.state = 'ready';
      } catch (err) {
        this.state = 'error';
        console.warn('TapRoll: cloud sign-in didn’t load', err);
        throw err;
      }

    }
  };
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const el = document.createElement('script');
      el.src = src;
      el.async = false;
      el.onload = () => resolve();
      el.onerror = () => reject(new Error(`Couldn’t load ${src}`));
      document.head.appendChild(el);
    });
  }
  async function loadFirebase() {
    const work = (async () => {
      if (!(window.firebase && window.firebase.initializeApp)) await loadScript(FIREBASE_CDN + 'firebase-app-compat.js');
      const jobs = [];
      if (!window.firebase.auth) jobs.push(loadScript(FIREBASE_CDN + 'firebase-auth-compat.js'));
      if (!window.firebase.firestore) jobs.push(loadScript(FIREBASE_CDN + 'firebase-firestore-compat.js'));
      await Promise.all(jobs);
    })();
    let timer;
    const timeout = new Promise((_, reject) => { timer = setTimeout(() => reject(new Error('Firebase took too long to load')), 20000); });
    try { await Promise.race([work, timeout]); } finally { clearTimeout(timer); }
  }
  function requireCloud() { if (!Cloud.auth || Cloud.state !== 'ready') throw authErr('cloud-unavailable'); }

  /* ----- Sessions ----- */
  function endSession() {
    NFC.stopScan(true);
    if (ui.kiosk) { ui.kiosk = false; renderKiosk(); try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) { /* optional */ } }
    closeModal();
    // Messages about the last account's work shouldn't linger for whoever signs in next.
    const host = $('#toasts');
    if (host) host.innerHTML = '';
    schoolStop();
    mailReset();
    Store.close();
    Session.kind = null;
    Session.user = null;
    Session.office = false;
    ui.ready = false; ui.readOnly = false; ui.syncError = null; ui.scanning = false;
    releaseWakeLock();
  }
  function enterApp() {
    ui.screen = 'app';
    pendingAuthView = null;
    stopTicker();
    document.body.classList.remove('on-auth');
    const auth = $('#auth');
    auth.hidden = true;
    auth.innerHTML = '';
    $('#app').hidden = false;
    resetView();
    ui.readOnly = false; ui.syncError = null;
    firstReadyDone = false;
    lastChip = null;
    window.scrollTo({ top: 0 });
    dataChanged();
  }
  function startDevice(acct) {
    endSession();
    Session.kind = 'device';
    Session.user = { id: acct.id, name: acct.name || '', email: acct.email, school: acct.school || '' };
    Store.openLocal(dataKey(acct.id), () => emptyState({ teacher: acct.name || '', school: acct.school || '' }));
    enterApp();
  }
  function startCloud(user) {
    endSession();
    const pending = Cloud.pendingProfile || {};
    Cloud.pendingProfile = null;
    const provider = ((user.providerData || [])[0] || {}).providerId || 'password';
    Session.kind = 'cloud';
    Session.user = { id: user.uid, name: user.displayName || pending.name || '', email: user.email || '', provider };
    // Signed up as a school admin or registrar: offer to set up the school (or join it) once the app opens.
    Session.office = !!pending.office;
    schoolStartCloud(user);
    Store.openFirestore(Cloud.fs, user.uid);
    loadMail(true);
    // First sign-in: create the teacher's profile document.
    Store.onNewProfile = () => {
      const name = pending.name || user.displayName || '';
      setSettings({ name, email: user.email || '', school: pending.school || '', teacher: name, graceMin: 5, createdAt: Date.now() });
    };
    enterApp();
  }
  function onCloudUser(user) {
    if (Session.kind === 'demo') return;   // the example classroom stays open until it's closed
    if (user) {
      if (Session.kind === 'cloud' && Session.user && Session.user.id === user.uid) return;
      startCloud(user);
      return;
    }
    if (Session.kind === 'cloud') endSession();
    if (ui.screen !== 'auth' || authUI.view === 'loading') showAuth('signin');
  }
  function makeDemoState(seed) {
    const st = normalizeState(window.TapRollDemo.generate({ now: new Date(), seed }));
    st.settings.sample = true;
    st.settings.sampleDate = todayStr();
    return st;
  }
  function startDemo() {
    endSession();
    lsSet(SESSION_KEY, 'demo');
    Session.kind = 'demo';
    Session.user = { id: 'demo', name: 'Example classroom', email: '' };
    Store.openLocal(DEMO_KEY, () => makeDemoState());
    // Example data is built around today's bell schedule, so refresh it on a new day.
    if (S.settings.sampleDate !== todayStr()) { S = makeDemoState(); Store.saveLocalSoon(); }
    schoolStartDemo();
    enterApp();
  }
  function resetDemoData(seed) {
    S = makeDemoState(seed);
    Store.saveLocalSoon();
    schoolStartDemo(true);
    resetView();
    pickInitialView();
    dataChanged();
  }
  function leaveDemo(view) {
    endSession();
    lsDel(SESSION_KEY);
    if (view !== 'signup') {
      if (Cloud.auth && Cloud.auth.currentUser) { startCloud(Cloud.auth.currentUser); return; }
      if (!Cloud.cfg) { const acct = Device.current(); if (acct) { startDevice(acct); return; } }
    }
    showAuth(view || 'signin');
  }
  async function signOut() {
    const kind = Session.kind;
    if (kind === 'demo') { leaveDemo('signin'); return; }
    if (Session.user && Session.user.email) authUI.email = Session.user.email;
    authUI.role = 'teacher';
    endSession();
    if (kind === 'device') Device.signOut();
    showAuth('signin');
    if (kind === 'cloud' && Cloud.auth) { try { await Cloud.auth.signOut(); } catch (e) { /* already signed out */ } }
    toast({ kind: 'info', text: 'Signed out' });
  }
  async function boot() {
    const cfg = BUILD_TARGET === 'site' ? Cloud.readConfig() : null;
    const demo = pendingAuthView === 'example' || lsGet(SESSION_KEY) === 'demo';
    if (pendingAuthView === 'example') pendingAuthView = null;
    if (cfg) {
      Cloud.cfg = cfg;
      if (demo) startDemo(); else showAuth('loading');
      try { await Cloud.init(cfg); } catch (err) { if (!Session.kind) showAuth('signin'); }
      return;
    }
    if (demo) { startDemo(); return; }
    const acct = Device.current();
    if (acct) startDevice(acct); else showAuth('signin');
  }

  /* ============================== Sign-in screen ============================== */
  // role: who's signing up, 'teacher' or 'office' (a school admin or registrar). Only asked with cloud sign-in.
  const authUI = { view: 'signin', email: '', name: '', school: '', busy: false, role: 'teacher' };
  function setAuthRole(v) {
    authUI.role = v === 'office' ? 'office' : 'teacher';
    document.querySelectorAll('[data-act="au-role"]').forEach((b) => b.setAttribute('aria-checked', String(b.dataset.v === authUI.role)));
    const note = $('#au-role-note');
    if (note) note.textContent = roleNote();
    const lab = $('#au-school-label');
    if (lab) lab.innerHTML = authUI.role === 'office' ? 'School' : 'School <em>optional</em>';
  }
  const roleNote = () => (authUI.role === 'office'
    ? 'Next, you’ll set up your school or join the one that invited you. Then you’ll see every class live.'
    : 'You’ll set up your periods and rosters. If your school uses TapRoll, you can join it later.');

  function showAuth(view) {
    ui.screen = 'auth';
    ui.ready = false;
    $('#app').hidden = true;
    $('#scanbar').hidden = true;
    $('#kiosk').hidden = true;
    $('#auth').hidden = false;
    document.body.classList.add('on-auth');
    // Arriving from the home page's "Create a free account" link opens the sign-up form instead of sign-in.
    if (view === 'signin' && pendingAuthView) { if (pendingAuthView === 'signup') view = 'signup'; pendingAuthView = null; }
    authUI.view = view || 'signin';
    authUI.busy = false;
    renderAuth();
  }
  function switchAuthView(v) {
    captureAuthFields();
    authUI.view = v;
    authUI.busy = false;
    renderAuth();

    if (f) f.focus({ preventScroll: true });
  }
  function captureAuthFields() {
    const val = (id) => { const el = document.getElementById(id); return el ? el.value : null; };
    const email = val('au-email'); if (email != null) authUI.email = email.trim();
    const name = val('au-name'); if (name != null) authUI.name = name;
    const school = val('au-school'); if (school != null) authUI.school = school;
  }

  // Made-up check-ins for the preview card on the sign-in page.
  const LIVE_ROWS = [
    ['Maya Patel', 'P', '9:49'], ['Jordan Brooks', 'P', '9:50'], ['Aiden Nguyen', 'P', '9:50'], ['Sofia Ramirez', 'P', '9:51'],
    ['Leo Santos', 'P', '9:51'], ['Imani Okafor', 'P', '9:52'], ['Ethan Cho', 'P', '9:52'], ['Kai Hernandez', 'T', '9:58'], ['Grace Kim', 'T', '10:01']
  ];
  const LIVE_BASE = 14, LIVE_TOTAL = 24, LIVE_START = 4;
  function liveRow(r, enter) {
    const [name, s, t] = r;
    const ini = name.split(' ').map((x) => x.charAt(0)).join('');
    return `<li class="lv-row${enter ? ' enter' : ''}"><span class="av" style="--h:${hueOf(name)}">${esc(ini)}</span><span class="lv-name">${esc(name)}</span>`
      + `<span class="pill ${s === 'T' ? 't' : 'p'}">${s === 'T' ? 'Tardy' : 'Present'}</span><time>${esc(t)}</time></li>`;
  }
  function liveCounts(shown) {
    const rows = LIVE_ROWS.slice(0, shown);
    const tardy = rows.filter((r) => r[1] === 'T').length;
    return { n: LIVE_BASE + shown, present: LIVE_BASE + shown - tardy, tardy };
  }
  function liveBar(shown) {
    const c = liveCounts(shown);
    return `<i class="b-p" style="width:${(c.present / LIVE_TOTAL) * 100}%"></i><i class="b-t" style="width:${(c.tardy / LIVE_TOTAL) * 100}%"></i>`;
  }
  function liveCard() {
    const rows = LIVE_ROWS.slice(0, LIVE_START).reverse().map((r) => liveRow(r)).join('');
    return `<div class="live" aria-hidden="true"><div class="lv-head"><span class="pnum">P3</span><span class="lv-title"><b>AP Biology</b><span>Room 214 · bell 9:52</span></span>`
      + `<span class="lv-live"><i></i>Live</span></div>`
      + `<div class="lv-count"><b class="num" id="lv-n">${liveCounts(LIVE_START).n}</b><span>/${LIVE_TOTAL} checked in</span></div>`
      + `<div class="bar" id="lv-bar">${liveBar(LIVE_START)}</div><ol class="lv-rows" id="lv-rows">${rows}</ol></div>`;
  }
  let ticker = null, tickIdx = LIVE_START;

  }

  }
  const WAVES = '<svg class="ab-waves" viewBox="0 0 400 400" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round">'
    + '<path d="M111 139A80 80 0 0 1 111 261"/><path d="M150 93A140 140 0 0 1 150 307"/>'
    + '<path d="M189 47A200 200 0 0 1 189 353"/><path d="M227 1A260 260 0 0 1 227 399"/></svg>';
  function brandPanel() {

      + (BUILD_TARGET === 'site' ? `<a class="ab-logo" href="./" aria-label="TapRoll home">${logo}</a>` : `<div class="ab-logo">${logo}</div>`)
      + `<div class="ab-mid"><div class="ab-copy"><p class="ab-title">Take roll<br>in one tap.</p>`

      + `<ul class="ab-feats"><li>${ic('check')}Live counts for every period</li><li>${ic('check')}Tardies marked from your bell schedule</li><li>${ic('check')}Works with Android phones and USB readers</li></ul>`

  }
  function authNotices() {

  function signInForm() {

  function signUpForm() {

        + `<button type="button" role="radio" aria-checked="${authUI.role !== 'office'}" data-act="au-role" data-v="teacher">A teacher</button>`
        + `<button type="button" role="radio" aria-checked="${authUI.role === 'office'}" data-act="au-role" data-v="office">School admin or registrar</button></div>`
        + `<small id="au-role-note">${esc(roleNote())}</small></div>` : '')
      + `<div class="grid2"><label class="field"><span>Your name</span><input id="au-name" name="name" autocomplete="name" maxlength="60" placeholder="Ms. Rivera" value="${esc(authUI.name)}" required></label>`
      + `<label class="field"><span id="au-school-label">${authUI.role === 'office' && Cloud.cfg ? 'School' : 'School <em>optional</em>'}</span><input id="au-school" name="school" autocomplete="organization" maxlength="60" value="${esc(authUI.school)}"></label></div>`
      + emailField()

  function authMessage(err) {
    const code = String((err && err.code) || '').replace(/^auth\//, '');
    const mismatch = 'That email and password don’t match.';
    const map = {
      'bad-credentials': mismatch, 'invalid-credential': mismatch, 'wrong-password': mismatch, 'user-not-found': mismatch, 'invalid-login-credentials': mismatch,
      'email-in-use': 'There’s already an account for this email on this device. Sign in instead.',
      'email-already-in-use': 'There’s already an account for this email. Sign in instead.',
      'weak-password': 'Use at least 8 characters for your password.',
      'invalid-email': 'Enter a valid email address.',
      'missing-password': 'Enter your password.',
      'missing-email': 'Enter your email address.',
      'too-many-requests': 'Too many tries. Wait a few minutes, or reset your password.',
      'user-disabled': 'This account has been turned off.',
      'network-request-failed': 'Can’t reach the sign-in service. Check your internet connection.',
      'popup-blocked': 'Your browser blocked the Google window. Allow pop-ups for this site, then try again.',
      'operation-not-allowed': 'This sign-in method is turned off in Firebase. Turn it on under Authentication › Sign-in method.',
      'unauthorized-domain': `Firebase doesn’t allow sign-in from ${location.hostname}. Add it under Authentication › Settings › Authorized domains.`,
      'account-exists-with-different-credential': 'This email already signs in with a password. Use your email and password.',
      'cloud-unavailable': 'Sign-in isn’t connected. Check your internet connection, then reload the page.',
      'no-crypto': 'This browser can’t create accounts here. Open TapRoll from its https address.'
    };
    if (map[code]) return map[code];
    if (/api-key/.test(code)) return 'Firebase didn’t accept the settings in config.js. Copy the firebaseConfig block again.';
    return 'Something went wrong. Try again.';
  }
  function onAuthSubmit(e) {
    const form = e.target && e.target.closest ? e.target.closest('form[data-form]') : null;
    if (!form) return;

    if (form.dataset.form === 'change-pw') { submitChangePassword(form); return; }
    if (authUI.busy) return;
    captureAuthFields();
    if (form.dataset.form === 'signin') submitSignIn(form);
    else if (form.dataset.form === 'signup') submitSignUp(form);
    else if (form.dataset.form === 'reset') submitReset(form);
  }
  async function submitSignIn(form) {
    const email = form.elements.email.value.trim(), pw = form.elements.password.value;
    if (!validEmail(email)) { showAuthError('Enter a valid email address.', 'au-email'); return; }
    if (!pw) { showAuthError('Enter your password.', 'au-pw'); return; }
    setAuthBusy(true, 'submit', 'Signing in…');
    try {
      if (Cloud.cfg) { requireCloud(); await Cloud.auth.signInWithEmailAndPassword(email, pw); }
      else startDevice(await Device.signIn(email, pw));
    } catch (err) {
      setAuthBusy(false);
      showAuthError(authMessage(err), /password|credential|not-found/.test(String(err && err.code)) ? 'au-pw' : null);
      return;
    }
    setAuthBusy(false);
  }
  async function submitSignUp(form) {
    const name = form.elements.name.value.trim(), school = form.elements.school.value.trim();
    const email = form.elements.email.value.trim(), pw = form.elements.password.value;
    if (!name) { showAuthError('Enter your name.', 'au-name'); return; }
    if (!validEmail(email)) { showAuthError('Enter a valid email address.', 'au-email'); return; }
    if (pw.length < 8) { showAuthError('Use at least 8 characters for your password.', 'au-pw'); return; }
    setAuthBusy(true, 'submit', 'Creating account…');
    try {
      if (Cloud.cfg) {
        requireCloud();
        Cloud.pendingProfile = { name, school, office: authUI.role === 'office' };
        const cred = await Cloud.auth.createUserWithEmailAndPassword(email, pw);
        try { await cred.user.updateProfile({ displayName: name }); } catch (e) { /* the profile document holds the name too */ }
      } else {
        startDevice(await Device.create({ name, school, email, password: pw }));
      }
    } catch (err) {
      Cloud.pendingProfile = null;
      setAuthBusy(false);
      const code = String(err && err.code);
      showAuthError(authMessage(err), /email/.test(code) ? 'au-email' : (/password/.test(code) ? 'au-pw' : null));
      return;
    }
    setAuthBusy(false);
    const office = authUI.role === 'office' && !!Cloud.cfg;
    authUI.name = ''; authUI.school = ''; authUI.role = 'teacher';
    toast({ kind: 'ok', text: `Welcome, ${firstName(name)}`, sub: office ? 'Next, set up your school or join the one that invited you.' : 'Add your first period to get started.' });
  }
  async function submitReset(form) {
    const email = form.elements.email.value.trim();
    if (!validEmail(email)) { showAuthError('Enter a valid email address.', 'au-email'); return; }
    setAuthBusy(true, 'submit', 'Sending…');
    try { requireCloud(); await Cloud.auth.sendPasswordResetEmail(email); }
    catch (err) {
      // Don't reveal whether an account exists for this email.
      if (!/user-not-found/.test(String(err && err.code))) { setAuthBusy(false); showAuthError(authMessage(err), 'au-email'); return; }
    }
    setAuthBusy(false);
    authUI.email = email;
    authUI.view = 'reset-sent';

  function signInGoogle() {
    if (!Cloud.cfg || authUI.busy) return;

    } catch (err) { showAuthError(authMessage(err)); return; }
    setAuthBusy(true, 'google', 'Waiting for Google…');
    captureAuthFields();
    if (authUI.view === 'signup') Cloud.pendingProfile = { school: String(authUI.school || '').trim(), office: !!Cloud.cfg && authUI.role === 'office' };
    // Called straight from the click, so browsers allow the Google window to open.
    Cloud.auth.signInWithPopup(provider).then(() => { setAuthBusy(false); authUI.role = 'teacher'; }).catch((err) => {
      Cloud.pendingProfile = null;

  /* ============================== Cloud sign-in setup guide ============================== */
  const FIRESTORE_RULES = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function signedIn() { return request.auth != null; }
    function me() { return request.auth.uid; }
    function myEmail() { return request.auth.token.email.lower(); }
    function verified() { return request.auth.token.email_verified == true; }
    function isMember(sid) {
      return signedIn() && exists(/databases/$(database)/documents/schools/$(sid)/members/$(request.auth.uid));
    }
    function myRole(sid) {
      return get(/databases/$(database)/documents/schools/$(sid)/members/$(request.auth.uid)).data.role;
    }
    function isStaff(sid) { return isMember(sid) && myRole(sid) in ['admin', 'registrar']; }
    function isAdmin(sid) { return isMember(sid) && myRole(sid) == 'admin'; }
    function ownerOf(sid) { return get(/databases/$(database)/documents/schools/$(sid)).data.owner; }
    function profile(uid) { return get(/databases/$(database)/documents/teachers/$(uid)).data; }
    // A school's admins and registrars can see a teacher's classes while the teacher
    // is a member of that school and has joined it (schoolId), and only the classes
    // the teacher uses now (ws).
    function staffOver(uid) {
      let sid = profile(uid).get('schoolId', '');
      return sid != '' && isStaff(sid)
        && exists(/databases/$(database)/documents/schools/$(sid)/members/$(uid));
    }
    function staffOverWs(uid, ws) { return staffOver(uid) && profile(uid).get('ws', '') == ws; }
    // Joining uses up the invite: the school's own copy names the role, and the
    // same batch that adds the member must delete it.
    function invitedTo(sid, role) {
      return get(/databases/$(database)/documents/schools/$(sid)/invites/$(request.auth.token.email.lower())).data.role == role
        && !existsAfter(/databases/$(database)/documents/schools/$(sid)/invites/$(request.auth.token.email.lower()));
    }
    // Only people with a confirmed email can invite, so invites show who really sent them.
    // Registrars invite teachers. Admins invite anyone.
    function canInvite(sid, d) {
      return signedIn() && verified() && d.byEmail == myEmail()
        && d.byName is string && d.byName.size() <= 80
        && d.role in ['teacher', 'registrar', 'admin']
        && ((d.role == 'teacher' && isStaff(sid)) || isAdmin(sid));
    }
    // Registrars can't replace or cancel an invite for an admin or registrar.
    function canTouchInvite(sid, r) { return r == null || r.data.role == 'teacher' || isAdmin(sid); }
    function validName(d) { return d.name is string && d.name.size() > 0 && d.name.size() <= 80; }
    function memberFields(d) {
      return d.keys().hasOnly(['role', 'name', 'email', 'at'])
        && d.role in ['teacher', 'registrar', 'admin'] && d.name is string && d.name.size() <= 80;
    }

    // Each teacher reads and writes their own classes. Their school's admins and
    // registrars can read them and put students in class rosters.
    match /teachers/{uid}/{document=**} {
      allow read, write: if signedIn() && me() == uid;
    }
    match /teachers/{uid} {
      allow read: if signedIn() && staffOver(uid);
    }
    match /teachers/{uid}/ws/{ws}/{document=**} {
      allow read: if signedIn() && staffOverWs(uid, ws);
    }
    match /teachers/{uid}/ws/{ws}/meta/roster {
      allow create, update: if signedIn() && staffOverWs(uid, ws);
    }

    // Whoever sets up a school owns it and is its first admin.
    match /schools/{sid} {
      allow read: if isMember(sid);
      allow create: if signedIn() && request.resource.data.owner == me() && validName(request.resource.data)
        && request.resource.data.keys().hasOnly(['name', 'owner', 'createdAt']);
      allow update: if isAdmin(sid) && request.resource.data.owner == resource.data.owner
        && validName(request.resource.data) && request.resource.data.keys().hasOnly(['name', 'owner', 'createdAt']);
    }
    match /schools/{sid}/members/{uid} {
      // Admins and registrars see who's in the school. Everyone sees their own membership.
      allow read: if isStaff(sid) || (signedIn() && uid == me());
      // Joining: the owner adds themselves as admin. Anyone else accepts an invite
      // sent to their confirmed email, with the role it names.
      allow create: if signedIn() && uid == me() && memberFields(request.resource.data)
        && request.resource.data.email == myEmail() && (
          (request.resource.data.role == 'admin'
            && getAfter(/databases/$(database)/documents/schools/$(sid)).data.owner == me())
          || (verified() && invitedTo(sid, request.resource.data.role)));
      // Admins change roles. Members can change their own name.
      allow update: if memberFields(request.resource.data) && (
        (isAdmin(sid) && uid != ownerOf(sid))
        || (signedIn() && uid == me()
          && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['name'])));
      // Anyone but the owner can leave. Admins remove anyone else; registrars remove teachers.
      allow delete: if signedIn() && uid != ownerOf(sid)
        && (uid == me() || isAdmin(sid) || (isStaff(sid) && resource.data.role == 'teacher'));
    }

    // Pending invites. The school's own list is what lets someone join...
    match /schools/{sid}/invites/{email} {
      allow read: if isStaff(sid);
      allow create, update: if canInvite(sid, request.resource.data) && canTouchInvite(sid, resource)
        && request.resource.data.email == email
        && request.resource.data.keys().hasOnly(['email', 'role', 'byName', 'byEmail', 'at']);
      allow delete: if (isStaff(sid) && canTouchInvite(sid, resource))
        || (signedIn() && verified() && myEmail() == email);
    }
    // ...and a copy keyed by school and email lets the invited person find it.
    match /invites/{iid} {
      allow list: if signedIn() && verified() && resource.data.email == myEmail();
      allow get: if signedIn() && ((verified() && resource.data.email == myEmail()) || isStaff(resource.data.sid));
      allow create, update: if iid == request.resource.data.sid + '~' + request.resource.data.email
        && canInvite(request.resource.data.sid, request.resource.data)
        && canTouchInvite(request.resource.data.sid, resource)
        && request.resource.data.school == get(/databases/$(database)/documents/schools/$(request.resource.data.sid)).data.name
        && request.resource.data.keys().hasOnly(['sid', 'email', 'school', 'role', 'byName', 'byEmail', 'at']);
      allow delete: if signedIn() && (resource == null
        || (verified() && resource.data.email == myEmail()) || isStaff(resource.data.sid));
    }

    // Late passes: a teacher who kept a class late excuses those students' tardies in
    // their next class. Every member's TapRoll applies them to its own classes.
    match /schools/{sid}/passes/{passId} {
      allow read: if isMember(sid);
      allow create: if isMember(sid) && request.resource.data.by == me()
        && request.resource.data.keys().hasOnly(['date', 'at', 'by', 'byName', 'from', 'students'])
        && request.resource.data.date is string && request.resource.data.from is map
        && request.resource.data.byName is string && request.resource.data.byName.size() <= 80
        && request.resource.data.students is list && request.resource.data.students.size() <= 80;
      allow delete: if isMember(sid) && resource.data.by == me();
    }
    // Site status, like whether automatic parent emails are running. Only the
    // site's own email sender (with its service account) writes here.
    match /site/{doc} {
      allow read: if signedIn();
    }
  }
}`;
  function cloudStatus() {
    if (BUILD_TARGET !== 'site') return { kind: 'info', icon: 'info', text: 'This preview can’t connect to Firebase. Follow these steps for your hosted TapRoll site.' };
    const c = window.__taprollCfg || {};
    if (Cloud.state === 'ready') return { kind: 'ok', icon: 'check', text: 'Cloud sign-in is on for this site.' };
    if (Cloud.state === 'error') return { kind: 'err', icon: 'alert', text: 'config.js is filled in, but Firebase didn’t load. Check your connection and the values you pasted, then reload.' };
    if (c.error) return { kind: 'err', icon: 'alert', text: `config.js has a mistake (${c.error}). Paste only the firebaseConfig block.` };
    if (c.missing || !c.loaded) return { kind: 'info', icon: 'info', text: 'There’s no config.js next to app.html yet, so accounts are saved on each device.' };
    return { kind: 'info', icon: 'info', text: 'config.js is there but still empty. Paste your Firebase values into it.' };
  }
  const setupStep = (title, body) => `<li><div><b>${esc(title)}.</b> ${body}</div></li>`;
  const codeBlock = (id, text) => `<div class="codeblock"><pre id="${id}">${esc(text)}</pre><button type="button" class="btn sm" data-act="copy-text" data-target="${id}">${ic('copy')} Copy</button></div>`;
  function openSetupGuide() {
    const st = cloudStatus();
    const host = BUILD_TARGET === 'site' && location.hostname && !/^(localhost|127\.|\[)/.test(location.hostname) ? location.hostname : 'yourname.github.io';
    openModal(`${modalHead('Set up cloud sign-in', 'A free Firebase project lets teachers sign in with email or Google on any device, with classes that stay in sync.')}<div class="m-body">`
      + `<div class="opstatus ${st.kind}">${ic(st.icon)}<p>${esc(st.text)}</p></div><ol class="steps">`
      + setupStep('Create a Firebase project', 'Go to <a href="https://console.firebase.google.com" target="_blank" rel="noopener">console.firebase.google.com</a>, choose <b>Create a project</b>, and name it TapRoll. You can turn off Google Analytics.')
      + setupStep('Register a web app', 'On the project’s home page, click the web icon <code>&lt;/&gt;</code>, name the app TapRoll, and click <b>Register app</b>. Firebase shows a <code>firebaseConfig</code> block. Keep that page open.')
      + setupStep('Turn on sign-in', 'Open <b>Authentication</b>, click <b>Get started</b>, then enable <b>Email/Password</b> and <b>Google</b>.')
      + setupStep('Allow your site', `In Authentication, open <b>Settings › Authorized domains</b> and add <code>${esc(host)}</code>.`)
      + setupStep('Create the database', 'Open <b>Firestore Database</b>, click <b>Create database</b>, keep the defaults, and start in <b>production mode</b>.')
      + setupStep('Paste these rules', `In Firestore, open the <b>Rules</b> tab, replace everything with these rules, and click <b>Publish</b>. Each teacher reads and writes only their own classes, and a school’s admins and registrars can see the classes of teachers who join their school. If you set up TapRoll before late passes and automatic parent emails, paste these again.${codeBlock('rules-code', FIRESTORE_RULES)}`)
      + setupStep('Fill in config.js', 'Copy the <code>const firebaseConfig = { … };</code> block from step 2 and paste it into <code>config.js</code> in place of everything there. Upload <code>config.js</code> to the same folder as <code>app.html</code>. You can find the block again later under <b>Project settings › General › Your apps</b>.')
      + setupStep('Reload TapRoll', 'GitHub can take a few minutes to update. Then the sign-in page shows <b>Continue with Google</b>, and classes sync across devices.')
      + `</ol><p class="m-text small">Accounts made on a device before the switch stay on that device. To move classes over, download a backup in Settings, sign in with your new account, and restore it.</p>`
      + `<p class="m-text small">Next, if you like: <button type="button" class="linkbtn" data-act="mail-guide">Set up automatic parent emails</button></p></div>`,
    { cls: 'wide', label: 'Set up cloud sign-in' });
  }

  init();
})();
</script>
