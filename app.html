<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2343CE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121A3A" media="(prefers-color-scheme: dark)">
<meta name="description" content="TapRoll: NFC attendance for every period.">
<title>TapRoll</title>
<link rel="privacy-policy" href="privacy.html">
<link rel="terms-of-service" href="terms.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@500;600&family=Public+Sans:wght@400..700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: a bell-schedule rail lists the day's periods with live counts; the open period's roll book
   fills the right (tally, scan panel, student tiles). On phones the rail becomes a period strip and
   the scan button docks at the bottom of the screen. */
:root {
  --bg: #F1F3F6;
  --surface: #FFFFFF;
  --surface-2: #F6F8FA;
  --rail: #E8ECF2;
  --line: #DAE0E8;
  --line-2: #C3CBD7;
  --ink: #0F172A;
  --ink-2: #334155;
  --muted: #5F6B82;
  --accent: #2343CE;
  --accent-2: #1A34A6;
  --on-accent: #FFFFFF;
  --accent-soft: #E3E8FD;
  --p: #12803F; --p-soft: #DDF3E5;
  --t: #A85A06; --t-soft: #FCEED7;
  --a: #C22B33; --a-soft: #FBE2E3;
  --e: #6B40C6; --e-soft: #ECE4FB;
  --u: #8B95A8; --u-soft: #E9EDF3;
  --av-bg: 91%;
  --av-fg: 30%;
  --scrim: rgb(9 13 22 / .46);
  --shadow-1: 0 1px 2px rgb(15 23 42 / .06), 0 1px 1px rgb(15 23 42 / .03);
  --shadow-2: 0 18px 44px rgb(15 23 42 / .18);
  --panel: #2343CE;
  --panel-ink: #FFFFFF;
  --panel-muted: rgb(255 255 255 / .8);
  --panel-line: rgb(255 255 255 / .15);
  --display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r-sm: 8px;
  --r: 12px;
  --r-lg: 18px;
  --rail-w: 292px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0E14; --surface: #131821; --surface-2: #19202B; --rail: #0F131A;
    --line: #242C39; --line-2: #36404F;
    --ink: #E8ECF3; --ink-2: #C2CAD7; --muted: #8E99AD;
    --accent: #93A6FF; --accent-2: #B3C0FF; --on-accent: #0A0F1F; --accent-soft: #1D2647;
    --p: #4BD487; --p-soft: #10301F; --t: #F4B24A; --t-soft: #35260D;
    --a: #FF7D82; --a-soft: #3B171A; --e: #BB9EFF; --e-soft: #271D44;
    --u: #7C889C; --u-soft: #1C222D;
    --av-bg: 25%; --av-fg: 84%;
    --scrim: rgb(0 0 0 / .62);
    --shadow-1: 0 0 0 1px rgb(255 255 255 / .02);
    --shadow-2: 0 22px 50px rgb(0 0 0 / .55);
    --panel: #121A3A; --panel-ink: #EEF1F8; --panel-muted: #A7B1CF; --panel-line: rgb(147 166 255 / .13);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B0E14; --surface: #131821; --surface-2: #19202B; --rail: #0F131A;
  --line: #242C39; --line-2: #36404F;
  --ink: #E8ECF3; --ink-2: #C2CAD7; --muted: #8E99AD;
  --accent: #93A6FF; --accent-2: #B3C0FF; --on-accent: #0A0F1F; --accent-soft: #1D2647;
  --p: #4BD487; --p-soft: #10301F; --t: #F4B24A; --t-soft: #35260D;
  --a: #FF7D82; --a-soft: #3B171A; --e: #BB9EFF; --e-soft: #271D44;
  --u: #7C889C; --u-soft: #1C222D;
  --av-bg: 25%; --av-fg: 84%;
  --scrim: rgb(0 0 0 / .62);
  --shadow-1: 0 0 0 1px rgb(255 255 255 / .02);
  --shadow-2: 0 22px 50px rgb(0 0 0 / .55);
  --panel: #121A3A; --panel-ink: #EEF1F8; --panel-muted: #A7B1CF; --panel-line: rgb(147 166 255 / .13);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.5 var(--body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 60;
  background: var(--rail);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
img, svg { max-width: 100%; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
svg.ic { width: 18px; height: 18px; flex: none; }
.dim { color: var(--muted); }
.m-text { margin: 0; color: var(--ink-2); }
.m-text.small { font-size: 13px; }
code {
  font-family: var(--mono); font-size: .9em;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px;
  padding: 1px 6px; overflow-wrap: anywhere;
}

/* ---------- App frame ---------- */
.app {
  display: grid;
  grid-template-columns: var(--rail-w) minmax(0, 1fr);
  min-height: 100%;
}
.rail {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  align-self: start;
  height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow-y: auto;
  background: var(--rail);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding-block: 20px 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: 16px;
}
.main {
  min-width: 0;
  padding-block: 26px 56px;
  padding-left: 32px;
  padding-right: max(28px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

/* ---------- Rail ---------- */
.brand { display: flex; align-items: center; gap: 10px; padding: 0 4px; }
.logo {
  width: 36px; height: 36px; border-radius: 10px; flex: none;
  display: grid; place-items: center;
  background: var(--accent); color: var(--on-accent);
}
.logo svg { width: 22px; height: 22px; }
.brand-text { min-width: 0; display: flex; flex-direction: column; }
.brand-name { font-family: var(--display); font-stretch: 118%; font-weight: 800; font-size: 20px; line-height: 1; letter-spacing: -.01em; }
.brand-sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
.brand-tools { margin-left: auto; display: none; gap: 4px; }

.schedule { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.sched-head { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 8px 0; }
.sched-label { font: 600 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sched-clock { font: 600 12px/1 var(--mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.plist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.plist > li { min-width: 0; }

.pitem {
  width: 100%;
  display: grid;
  grid-template-columns: 38px minmax(0, 1fr) auto;
  column-gap: 10px;
  row-gap: 7px;
  align-items: center;
  text-align: left;
  padding: 9px 10px;
  border-radius: 11px;
  border: 1px solid transparent;
  background: transparent;
}
.pitem:hover { background: color-mix(in srgb, var(--surface) 60%, transparent); }
.pitem.is-active { background: var(--surface); border-color: var(--line); box-shadow: var(--shadow-1); }
.pnum {
  grid-row: span 2;
  width: 38px; height: 38px; border-radius: 10px;
  display: grid; place-items: center;
  font: 600 13px/1 var(--mono);
  background: var(--surface); border: 1px solid var(--line); color: var(--ink-2);
}
.pitem.is-active .pnum { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.pitem.ph-now:not(.is-active) .pnum { border-color: var(--accent); color: var(--accent); }
.pitem.today .pnum svg { width: 18px; height: 18px; }
.pmain { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.pcourse { font-weight: 600; font-size: 14px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ptime { font: 500 12px/1.3 var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pside { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.pcount { font: 600 12px/1 var(--mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.nowchip {
  font: 700 10px/1 var(--body); letter-spacing: .08em; text-transform: uppercase;
  color: var(--on-accent); background: var(--accent); padding: 3px 6px; border-radius: 999px;
}
.pbar { grid-column: 2 / span 2; height: 4px; border-radius: 999px; background: var(--u-soft); display: flex; overflow: hidden; }
.pbar i, .bar i { display: block; height: 100%; }
.b-p { background: var(--p); } .b-t { background: var(--t); } .b-a { background: var(--a); } .b-e { background: var(--e); }
.addp {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 9px 12px; border-radius: 10px; border: 1px dashed var(--line-2);
  background: transparent; color: var(--ink-2); font-weight: 600; font-size: 13px;
}
.addp:hover { border-color: var(--accent); color: var(--accent); }

.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 4px; }
.rail-link {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 9px 10px; border-radius: 10px; border: 0; background: transparent;
  font-weight: 600; font-size: 14px; color: var(--ink-2); text-align: left;
}
.rail-link:hover { background: color-mix(in srgb, var(--surface) 60%, transparent); color: var(--ink); }
.syncstate { display: flex; align-items: center; gap: 8px; padding: 8px 10px 0; font-size: 12px; color: var(--muted); }
.syncstate svg { width: 15px; height: 15px; }

/* ---------- Generic controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 38px; padding: 0 14px;
  border-radius: var(--r-sm); border: 1px solid var(--line-2);
  background: var(--surface); color: var(--ink);
  font-weight: 600; font-size: 14px; white-space: nowrap; text-decoration: none;
  transition: background-color .15s, border-color .15s, color .15s;
}
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn.danger { color: var(--a); }
.btn.danger:hover { border-color: var(--a); }
.btn.sm { min-height: 32px; padding: 0 10px; font-size: 13px; }
.btn.icon { width: 38px; padding: 0; }
.btn.sm.icon { width: 32px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.field small { color: var(--muted); font-size: 12px; }
.input, .field input:not([type=checkbox]):not([type=radio]):not([type=file]), .field select, .field textarea {
  width: 100%; min-height: 40px; padding: 8px 11px;
  border-radius: var(--r-sm); border: 1px solid var(--line-2);
  background: var(--surface); color: var(--ink);
}
.field textarea { min-height: 150px; resize: vertical; line-height: 1.5; }
.field input:not([type=checkbox]):focus, .field select:focus, .field textarea:focus, .input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.check {
  display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px;
  border: 1px solid var(--line-2); border-radius: 999px; font-size: 13px; font-weight: 600;
  background: var(--surface); cursor: pointer;
}
.check input { accent-color: var(--accent); margin: 0; }
.check:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }

.seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.seg button {
  border: 0; background: transparent; padding: 6px 12px; border-radius: 7px;
  font-size: 13px; font-weight: 600; color: var(--muted);
}
.seg button[aria-checked="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }

/* ---------- View header ---------- */
.vhead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 20px; }
.vhead-text { min-width: 0; }
.eyebrow { font: 600 12px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.vtitle {
  margin: 6px 0 0;
  font-family: var(--display); font-stretch: 114%; font-weight: 800;
  font-size: clamp(28px, 3.4vw, 40px); line-height: 1.04; letter-spacing: -.015em;
  text-wrap: balance;
}
.vhead-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.datenav { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.datenav .dlabel { padding: 0 10px; font-weight: 600; font-size: 13px; min-width: 112px; text-align: center; font-variant-numeric: tabular-nums; }

.banner {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
  padding: 12px 14px; border-radius: var(--r); border: 1px solid var(--line);
  background: var(--surface); font-size: 14px;
}
.banner .ic { color: var(--accent); }
.banner p { margin: 0; flex: 1 1 260px; min-width: 0; color: var(--ink-2); }
.banner.warn .ic { color: var(--t); }

/* ---------- Tally ---------- */
.tally { padding: 16px 18px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px 24px; align-items: center; }
.tally-big { font-family: var(--display); font-stretch: 112%; font-weight: 800; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.tally-big small { display: block; margin-top: 6px; font: 500 12px/1.2 var(--body); color: var(--muted); letter-spacing: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: flex-end; }
.lg { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-2); }
.lg b { font: 600 14px var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.lg::before { content: ""; width: 9px; height: 9px; border-radius: 3px; background: var(--dot, var(--u)); }
.lg.p { --dot: var(--p); } .lg.t { --dot: var(--t); } .lg.a { --dot: var(--a); } .lg.e { --dot: var(--e); } .lg.u { --dot: var(--u-soft); }
.lg.u::before { box-shadow: inset 0 0 0 1.5px var(--u); }
.bar { grid-column: 1 / -1; height: 10px; border-radius: 999px; overflow: hidden; display: flex; background: var(--u-soft); }

/* ---------- Scan panel ---------- */
.scanpanel { padding: 16px; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 14px 22px; }
.scanpanel.is-live { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.scan-main { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.scan-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.btn-scan {
  display: inline-flex; align-items: center; gap: 10px;
  min-height: 48px; padding: 0 20px; border-radius: 12px;
  border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent);
  font-weight: 700; font-size: 15px;
}
.btn-scan:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn-scan.live { background: var(--surface); color: var(--accent); }
.btn-scan:disabled { opacity: .5; cursor: not-allowed; }
.btn-scan svg { width: 20px; height: 20px; }
.pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); position: relative; flex: none; }
.pulse::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 2px solid var(--accent); animation: ping 1.4s ease-out infinite; }
@keyframes ping { from { transform: scale(.6); opacity: .9; } to { transform: scale(1.6); opacity: 0; } }
.sources { display: flex; flex-direction: column; gap: 6px; }
.src { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; color: var(--ink-2); }
.src .ic { width: 16px; height: 16px; margin-top: 2px; color: var(--muted); }
.src.ok .ic { color: var(--p); }
.src b { color: var(--ink); font-weight: 600; }
.scan-side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.rule { font-size: 12px; color: var(--muted); }
.rule b { font-family: var(--mono); font-weight: 600; color: var(--ink-2); }
.feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.feed li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; min-width: 0; }
.feed .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--u); }
.feed .fx { min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.feed time { font: 500 12px var(--mono); color: var(--muted); }
.feed-empty { font-size: 13px; color: var(--muted); padding: 8px 0 0; }
.k-present { background: var(--p) !important; } .k-tardy { background: var(--t) !important; }
.k-unknown, .k-warn { background: var(--a) !important; } .k-dup { background: var(--u) !important; }

/* ---------- Roster ---------- */
.rtools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.search { position: relative; flex: 1 1 220px; max-width: 320px; }
.search .ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 17px; height: 17px; }
.search input { padding-left: 36px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
  font-size: 13px; font-weight: 600; color: var(--ink-2);
}
.chip b { font-family: var(--mono); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip[aria-pressed="true"] b { color: var(--bg); opacity: .75; }
.rtools-actions { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; }

.roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 10px; }
.stu {
  display: flex; align-items: center; gap: 10px; min-width: 0;
  padding: 10px 10px 10px 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
}
.stu.flash { animation: flash 1.2s ease-out; }
@keyframes flash { from { background: var(--accent-soft); } to { background: var(--surface); } }
.stu-main { display: flex; align-items: center; gap: 11px; min-width: 0; flex: 1; border: 0; background: transparent; padding: 0; text-align: left; }
.av {
  --ring: transparent;
  width: 40px; height: 40px; border-radius: 50%; flex: none;
  display: grid; place-items: center;
  font: 700 13px/1 var(--body); letter-spacing: .02em;
  background: hsl(var(--h) 46% var(--av-bg)); color: hsl(var(--h) 52% var(--av-fg));
  box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ring);
}
.s-p .av { --ring: var(--p); } .s-t .av { --ring: var(--t); } .s-a .av { --ring: var(--a); } .s-e .av { --ring: var(--e); }
.stu-txt { min-width: 0; display: flex; flex-direction: column; }
.stu-name { font-size: 14.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stu-name b { font-weight: 700; }
.stu-meta { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; min-width: 0; }
.stu-meta .mt { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stu-meta .how { display: inline-grid; place-items: center; flex: none; }
.stu-meta .ic { width: 13px; height: 13px; }
.s-p .stu-meta { color: var(--p); } .s-t .stu-meta { color: var(--t); } .s-a .stu-meta { color: var(--a); } .s-e .stu-meta { color: var(--e); }
.notag { color: var(--muted); }
.marks { display: flex; gap: 3px; flex: none; }
.mk {
  width: 30px; height: 32px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface-2);
  font: 600 13px/1 var(--mono); color: var(--muted);
}
.mk:hover { border-color: var(--line-2); color: var(--ink); }
.mk.on { color: var(--surface); }
.mk-P.on { background: var(--p); border-color: var(--p); }
.mk-T.on { background: var(--t); border-color: var(--t); }
.mk-A.on { background: var(--a); border-color: var(--a); }
.mk-E.on { background: var(--e); border-color: var(--e); }
.mk:disabled { cursor: not-allowed; }

.empty {
  display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
  padding: 26px; border: 1px dashed var(--line-2); border-radius: var(--r-lg); background: var(--surface);
}
.empty h3 { margin: 0; font-family: var(--display); font-stretch: 110%; font-size: 21px; }
.empty p { margin: 0; color: var(--ink-2); max-width: 60ch; }
.empty .row { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- Overview ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; padding: 0; overflow: hidden; }
.kpi { padding: 14px 18px; border-right: 1px solid var(--line); min-width: 0; }
.kpi:last-child { border-right: 0; }
.kpi .k { font-size: 12px; font-weight: 600; color: var(--muted); }
.kpi .v { margin-top: 4px; font-family: var(--display); font-stretch: 112%; font-weight: 800; font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .v small { font: 500 12px var(--mono); color: var(--muted); margin-left: 6px; }
.ov-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.sect-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.sect { margin: 0; font: 700 12px/1.2 var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); }
.sect-note { font-size: 12px; color: var(--muted); }

.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.tl { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; }
.tl-time { padding-top: 14px; text-align: right; font: 500 12px/1.35 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.tl-time b { display: block; color: var(--ink); font-weight: 600; font-size: 13px; }
.pcard {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 14px; align-items: center;
  padding: 13px 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface);
  text-align: left; width: 100%; position: relative; overflow: hidden;
}
.pcard:hover { border-color: var(--line-2); }
.pcard.ph-now { border-color: var(--accent); }
.pcard-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
.pcard-title .pnum { width: 32px; height: 32px; border-radius: 8px; font-size: 12px; }
.pcard.ph-now .pnum { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.pcard-name { min-width: 0; display: flex; flex-direction: column; }
.pcard-name b { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pcard-name span { font-size: 12px; color: var(--muted); }
.phase { font: 700 10.5px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; padding: 5px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.phase.now { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.phase.done { color: var(--p); background: var(--p-soft); border-color: transparent; }
.pcard .bar { height: 6px; }
.pcard .legend { justify-content: flex-start; grid-column: 1 / -1; gap: 4px 14px; }
.pcard .lg { font-size: 12px; }
.pcard .lg b { font-size: 12.5px; }
.elapsed { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); }
.nowline { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: center; }
.nowline span { text-align: right; font: 600 12px var(--mono); color: var(--a); }
.nowline i { height: 2px; background: var(--a); border-radius: 2px; position: relative; }
.nowline i::before { content: ""; position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--a); }

.side-stack { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.watch { list-style: none; margin: 0; padding: 4px 14px; }
.watch li { border-bottom: 1px solid var(--line); }
.watch li:last-child { border-bottom: 0; }
.watch button { width: 100%; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border: 0; background: transparent; text-align: left; }
.watch .av { width: 34px; height: 34px; font-size: 12px; box-shadow: none; }
.watch .wname { min-width: 0; display: flex; flex-direction: column; }
.watch .wname b { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.watch .wname span { font-size: 12px; color: var(--muted); }
.watch .rate { font: 600 13px var(--mono); color: var(--a); font-variant-numeric: tabular-nums; }
.watch-empty { padding: 14px; font-size: 13px; color: var(--muted); }
.trend { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.trow { display: grid; grid-template-columns: 34px minmax(0, 1fr) 96px 44px; gap: 10px; align-items: center; font-size: 13px; }
.trow .pnum { width: 30px; height: 30px; font-size: 12px; border-radius: 8px; grid-row: auto; }
.trow .tname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trow svg { width: 96px; height: 26px; }
.trow .tv { font: 600 12.5px var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.spark-line { fill: none; stroke: var(--accent); stroke-width: 1.6; }
.spark-area { fill: var(--accent-soft); stroke: none; }
.spark-dot { fill: var(--accent); }
.spark-grid { stroke: var(--line); stroke-width: 1; }

/* ---------- Student drawer ---------- */
.dr-head { display: flex; align-items: center; gap: 14px; }
.dr-head .av { width: 54px; height: 54px; font-size: 17px; }
.dr-title { min-width: 0; flex: 1; }
.dr-title h2 { margin: 0; font-family: var(--display); font-stretch: 112%; font-weight: 800; font-size: 24px; line-height: 1.1; }
.dr-title p { margin: 3px 0 0; font-size: 13px; color: var(--muted); }
.dsec { display: flex; flex-direction: column; gap: 10px; padding-top: 18px; margin-top: 18px; border-top: 1px solid var(--line); }
.dsec h3 { margin: 0; font: 700 12px/1.2 var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); }
.tagcard { display: flex; align-items: flex-start; gap: 12px; padding: 12px; border-radius: var(--r); background: var(--surface-2); border: 1px solid var(--line); }
.tagcard .ic { width: 22px; height: 22px; color: var(--muted); }
.tagcard.linked .ic { color: var(--p); }
.tagcard b { display: block; font-size: 14px; }
.tagcard span { font-size: 12.5px; color: var(--muted); word-break: break-all; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.opstatus { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: var(--r); font-size: 14px; border: 1px solid var(--line); background: var(--surface); }
.opstatus.ok { border-color: var(--p); background: var(--p-soft); }
.opstatus.err { border-color: var(--a); background: var(--a-soft); }
.opstatus.warn { align-items: flex-start; border-color: var(--t); background: var(--t-soft); }
.opstatus.warn > .ic { color: var(--t); margin-top: 1px; }
.op-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.opstatus.wait .pulse { margin: 0 4px; }
.opstatus p { margin: 0; flex: 1; min-width: 0; }
.hist { display: flex; flex-direction: column; gap: 8px; }
.hrow { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.hrow .pnum { width: 30px; height: 30px; font-size: 12px; border-radius: 8px; grid-row: auto; }
.cells { display: flex; gap: 3px; flex-wrap: wrap; }
.cell { width: 16px; height: 22px; border-radius: 4px; display: grid; place-items: center; font: 600 10px/1 var(--mono); background: var(--u-soft); color: var(--muted); }
.cell.P { background: var(--p-soft); color: var(--p); } .cell.T { background: var(--t-soft); color: var(--t); }
.cell.A { background: var(--a-soft); color: var(--a); } .cell.E { background: var(--e-soft); color: var(--e); }
.hrate { font: 600 12.5px var(--mono); font-variant-numeric: tabular-nums; color: var(--ink-2); }
.payload { display: flex; gap: 8px; align-items: center; }
.payload code { flex: 1; min-width: 0; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); font: 12.5px var(--mono); word-break: break-all; user-select: all; }

/* ---------- Tag tools ---------- */
.caps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.cap { padding: 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface-2); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.cap-h { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
.cap-h .ic { width: 17px; height: 17px; }
.cap.ok .cap-h .ic { color: var(--p); } .cap.no .cap-h .ic { color: var(--t); }
.cap p { margin: 0; font-size: 12.5px; color: var(--ink-2); }
.tip { font-size: 13px; color: var(--ink-2); }
.tip summary { cursor: pointer; font-weight: 600; color: var(--ink); }
.tip ul { margin: 8px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }

/* ---------- Modal ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 90; animation: fade .15s ease-out; }
.modal {
  position: fixed; z-index: 91; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: min(580px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  box-shadow: var(--shadow-2); padding: 22px;
  animation: pop .18s ease-out;
}
.modal.wide { width: min(760px, calc(100vw - 32px)); }
.modal.drawer {
  top: 0; right: 0; left: auto; transform: none;
  width: min(500px, 100vw); height: 100%; max-height: none; border-radius: 0; border-width: 0 0 0 1px;
  padding-top: calc(22px + env(safe-area-inset-top, 0px));
  padding-right: max(22px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px));
  animation: slide .2s ease-out;
}
.modal:focus, .modal:focus-visible { outline: none; }
.m-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.m-head h2 { margin: 0; font-family: var(--display); font-stretch: 112%; font-weight: 800; font-size: 23px; line-height: 1.15; }
.m-head p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }
.m-body { display: flex; flex-direction: column; gap: 14px; }
.m-foot { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.m-foot .spacer { margin-right: auto; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: translate(-50%, -48%); } to { opacity: 1; transform: translate(-50%, -50%); } }
@keyframes slide { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }

.pick { list-style: none; margin: 0; padding: 0; max-height: 46vh; overflow: auto; border: 1px solid var(--line); border-radius: var(--r); }
.pick li + li { border-top: 1px solid var(--line); }
.pick button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 0; background: transparent; text-align: left; }
.pick button:hover { background: var(--surface-2); }
.pick .av { width: 30px; height: 30px; font-size: 11px; box-shadow: none; }
.pick small { margin-left: auto; color: var(--muted); font-size: 12px; }

.confirm-big { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 8px 0 4px; }
.confirm-big .badge { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; color: var(--surface); }
.confirm-big .badge svg { width: 32px; height: 32px; }
.confirm-big h2 { margin: 0; font-family: var(--display); font-stretch: 112%; font-size: 28px; }
.confirm-big p { margin: 0; color: var(--ink-2); }

/* ---------- Toasts ---------- */
.toasts {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  z-index: 95; display: flex; flex-direction: column-reverse; gap: 8px;
  width: min(460px, calc(100vw - 32px)); pointer-events: none;
}
.toast {
  pointer-events: auto; display: flex; align-items: center; gap: 12px;
  padding: 11px 12px 11px 12px; border-radius: 14px;
  background: var(--ink); color: var(--bg); box-shadow: var(--shadow-2);
  animation: rise .2s ease-out;
}
.toast .tbadge { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none; color: var(--surface); background: var(--u); }
.toast .tbadge svg { width: 17px; height: 17px; }
.toast .ttxt { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.toast .ttxt b { font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toast .ttxt span { font-size: 12.5px; opacity: .78; }
.toast .tact { border: 1px solid color-mix(in srgb, var(--bg) 35%, transparent); background: transparent; color: var(--bg); border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 700; }
.toast .tact:hover { background: color-mix(in srgb, var(--bg) 14%, transparent); }
.toast .tact.x { padding: 5px; border-color: transparent; opacity: .75; display: grid; place-items: center; }
.toast .tact.x svg { width: 15px; height: 15px; }
.check.fit { align-self: flex-start; }

/* Period form: typed bell times, minutes fields with a unit, and a plain-language summary of the timing */
.field .tinput { font-variant-numeric: tabular-nums; }
.field > .ufield { position: relative; display: block; font: inherit; color: inherit; }
.ufield input { padding-right: 46px !important; font-variant-numeric: tabular-nums; -moz-appearance: textfield; appearance: textfield; }
.ufield input::-webkit-inner-spin-button, .ufield input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.ufield > span { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 13px; color: var(--muted); pointer-events: none; }
.pf-sum { margin: 0; padding: 10px 12px; border-radius: var(--r-sm); background: var(--surface-2); border: 1px solid var(--line); font-size: 13.5px; color: var(--ink-2); }

/* Student drawer: an absence or tardy to follow up on (excuse it, email a parent) */
.dsec.late h3 { color: var(--t); }
.dsec.absent h3 { color: var(--a); }
.dsec.late.is-excused h3 { color: var(--p); }
.sent-line { display: flex; align-items: center; gap: 6px; }
.sent-line .ic, .sent .ic { width: 15px; height: 15px; color: var(--p); }

/* Email parents: one row per absent or tardy student */
.pm-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.pm-row { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; align-items: center; gap: 10px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.pm-row .pill { justify-self: start; }
.pill.a { color: var(--a); background: var(--a-soft); }
.pm-who { min-width: 0; display: flex; flex-direction: column; }
.pm-who b { font-size: 14.5px; }
.pm-who span { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.pm-act { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; }
.sent { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; color: var(--p); white-space: nowrap; }
.btn .cnt { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; display: inline-grid; place-items: center; background: var(--accent); color: var(--on-accent); font: 700 11.5px/1 var(--body); }
@media (max-width: 560px) {
  .pm-row { grid-template-columns: 62px minmax(0, 1fr); }
  .pm-act { grid-column: 2; justify-content: flex-start; }
}
.excuse-form { display: flex; flex-direction: column; gap: 12px; }
.reasons { margin: 0; padding: 0; border: 0; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.reasons legend { padding: 0; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.dsec.first { border-top: 0; margin-top: 0; padding-top: 0; }
.opstatus code { background: var(--surface); }

/* ---------- Kiosk ---------- */
.kiosk {
  position: fixed; inset: 0; z-index: 80; background: var(--bg);
  display: flex; flex-direction: column; gap: 16px;
  padding-top: calc(18px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
}
.k-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.k-head b { font-family: var(--display); font-stretch: 112%; font-size: 20px; }
.k-head span { color: var(--muted); font: 500 13px var(--mono); }
.k-center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center; }
.k-ring { width: 150px; height: 150px; border-radius: 50%; display: grid; place-items: center; color: var(--accent); background: var(--accent-soft); position: relative; }
.k-ring svg { width: 64px; height: 64px; }
.k-ring::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 2px solid var(--accent); animation: ping 1.8s ease-out infinite; }
.k-prompt { font-family: var(--display); font-stretch: 112%; font-weight: 800; font-size: clamp(26px, 5vw, 44px); line-height: 1.1; max-width: 18ch; text-wrap: balance; }
.k-last { min-height: 96px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.k-last b { font-family: var(--display); font-stretch: 112%; font-size: clamp(30px, 6vw, 56px); line-height: 1.05; }
.k-last span { font-size: 18px; font-weight: 600; }
.k-last.present b, .k-last.present span { color: var(--p); }
.k-last.tardy b, .k-last.tardy span { color: var(--t); }
.k-last.unknown b, .k-last.unknown span, .k-last.warn b, .k-last.warn span { color: var(--a); }
.k-last.dup span { color: var(--muted); }
.k-foot { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px 22px; font-size: 15px; color: var(--ink-2); }
.k-foot b { font: 700 18px var(--mono); color: var(--ink); margin-right: 4px; }

/* ---------- Mobile scan dock ---------- */
.scanbar { display: none; }

/* ---------- Responsive ---------- */
@media (max-width: 1180px) {
  .ov-grid { grid-template-columns: minmax(0, 1fr); }
  .scanpanel { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 959px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail {
    z-index: 30; height: auto; overflow: visible;
    gap: 10px; padding-block: 10px 8px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    border-right: 0; border-bottom: 1px solid var(--line);
  }
  .brand-tools { display: flex; }
  .brand .logo { width: 32px; height: 32px; }
  .sched-head, .rail-foot, .pbar, .ptime { display: none; }
  .schedule { flex-direction: row; gap: 6px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x proximity; }
  .schedule::-webkit-scrollbar { display: none; }
  .plist { flex-direction: row; gap: 6px; }
  .plist > li { flex: none; }
  .pitem {
    width: auto; grid-template-columns: auto auto; column-gap: 8px; row-gap: 0;
    padding: 5px 10px 5px 5px; border-radius: 999px; border-color: var(--line); background: var(--surface);
    white-space: nowrap; scroll-snap-align: start;
  }
  .pitem.is-active { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .pitem .pnum { grid-row: auto; width: 28px; height: 28px; border-radius: 999px; font-size: 12px; }
  .pitem.is-active .pnum { background: var(--bg); color: var(--ink); border-color: var(--bg); }
  .pmain { display: none; }
  .pside { flex-direction: row; align-items: center; gap: 6px; }
  .pitem.is-active .pcount { color: var(--bg); }
  .pitem.today { padding-right: 12px; }
  .pitem.today .pmain { display: flex; }
  .pitem.today .pcourse { font-size: 13px; }
  .addp { width: auto; white-space: nowrap; border-radius: 999px; padding: 6px 12px; }
  .main {
    padding-block: 18px calc(110px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .scanbar {
    display: flex; align-items: center; gap: 10px;
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    padding-top: 10px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: var(--surface); border-top: 1px solid var(--line);
    box-shadow: 0 -6px 20px rgb(15 23 42 / .06);
  }
  .scanbar .btn-scan { flex: 1; justify-content: center; }
  .scanbar .sb-count { font: 600 13px var(--mono); color: var(--ink-2); text-align: right; line-height: 1.25; }
  .scanbar .sb-count b { display: block; font-size: 17px; color: var(--ink); }
  .toasts { bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi:nth-child(2) { border-right: 0; }
  .kpi:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
  .caps { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 640px) {
  .vtitle { font-size: 28px; }
  .tally { grid-template-columns: minmax(0, 1fr); }
  .legend { justify-content: flex-start; }
  .rtools-actions { margin-left: 0; width: 100%; }
  .rtools-actions .btn { flex: 1; }
  .search { max-width: none; flex-basis: 100%; }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .tl { grid-template-columns: 50px minmax(0, 1fr); gap: 8px; }
  .nowline { grid-template-columns: 50px minmax(0, 1fr); gap: 8px; }
  .modal, .modal.wide, .modal.drawer {
    top: auto; bottom: 0; left: 0; right: 0; transform: none;
    width: 100%; height: auto; max-height: 92vh;
    border-radius: 20px 20px 0 0; border-width: 1px 0 0;
    padding-top: 20px;
    padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    animation: rise .2s ease-out;
  }
  .stu { padding: 9px 8px 9px 10px; gap: 8px; }
  .mk { width: 30px; height: 34px; }
  .datenav .dlabel { min-width: 92px; padding: 0 6px; }
  .trow { grid-template-columns: 30px minmax(0, 1fr) 72px 40px; }
  .cells { gap: 2px; }
  .cell { width: 14px; height: 20px; }
  .trow svg { width: 72px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}


/* ---------- Sign-in portal ---------- */
.authroot { min-height: 100%; display: flex; flex-direction: column; }
.auth { flex: 1; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); min-height: 100%; }
body.on-auth::before { background: var(--panel); }

.auth-brand {
  position: relative; overflow: hidden; isolation: isolate; display: flex;
  background: var(--panel); color: var(--panel-ink);
  padding-block: 36px 40px;
  padding-left: max(52px, env(safe-area-inset-left, 0px));
  padding-right: 52px;
}
.ab-inner { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 32px; max-width: 580px; }
.ab-logo { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-stretch: 118%; font-weight: 800; font-size: 21px; letter-spacing: -.01em; }
.ab-logo .logo { background: var(--panel-ink); color: var(--panel); }
a.ab-logo { align-self: flex-start; color: inherit; text-decoration: none; border-radius: 10px; }
.auth-brand :focus-visible { outline-color: var(--panel-ink); }
.ab-mid { display: flex; flex-direction: column; gap: 30px; }
.ab-copy { display: flex; flex-direction: column; gap: 14px; }
.ab-title { margin: 0; font-family: var(--display); font-stretch: 122%; font-weight: 800; font-size: clamp(42px, 4.6vw, 66px); line-height: .96; letter-spacing: -.025em; text-wrap: balance; }
.ab-sub { margin: 0; max-width: 40ch; color: var(--panel-muted); font-size: 16.5px; line-height: 1.5; }
.ab-feats { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px 22px; color: var(--panel-muted); font-size: 14px; }
.ab-feats li { display: inline-flex; align-items: center; gap: 8px; }
.ab-feats .ic { width: 16px; height: 16px; color: var(--panel-ink); }
.ab-waves { position: absolute; z-index: 0; right: -110px; bottom: -90px; width: 560px; height: 560px; color: var(--panel-line); pointer-events: none; }

/* Live check-in preview on the brand panel */
.live { width: min(100%, 430px); display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 18px; background: var(--surface); color: var(--ink); border: 1px solid var(--panel-line); box-shadow: 0 24px 60px rgb(4 12 48 / .3); }
.lv-head { display: flex; align-items: center; gap: 10px; }
.lv-head .pnum { grid-row: auto; width: 34px; height: 34px; border-radius: 9px; font-size: 12px; background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.lv-title { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.lv-title b { font-size: 15px; }
.lv-title span { font-size: 12px; color: var(--muted); }
.lv-live { display: inline-flex; align-items: center; gap: 7px; font: 700 11px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--p); }
.lv-live i { position: relative; width: 8px; height: 8px; border-radius: 50%; background: var(--p); }
.lv-live i::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--p); animation: ping 1.6s ease-out infinite; }
.lv-count { display: flex; align-items: baseline; gap: 4px; }
.lv-count b { font-family: var(--display); font-stretch: 112%; font-weight: 800; font-size: 30px; line-height: 1; }
.lv-count span { font-size: 13px; color: var(--muted); }
.live .bar { height: 8px; }
.live .bar i { transition: width .5s ease; }
.lv-rows { list-style: none; margin: 0; padding: 0; height: 176px; overflow: hidden; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.lv-row { flex: none; height: 44px; overflow: hidden; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto 50px; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); }
.lv-row .av { width: 30px; height: 30px; font-size: 11px; box-shadow: none; }
.lv-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lv-row time { font: 500 12px var(--mono); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.lv-row.enter { animation: lvIn .55s cubic-bezier(.2, .7, .2, 1); }
@keyframes lvIn { from { height: 0; opacity: 0; } to { height: 44px; opacity: 1; } }
.pill { padding: 5px 8px; border-radius: 999px; font: 700 11px/1 var(--body); letter-spacing: .02em; }
.pill.p { color: var(--p); background: var(--p-soft); }
.pill.t { color: var(--t); background: var(--t-soft); }

/* Form column */
.auth-main {
  min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 22px;
  padding-block: 40px 28px;
  padding-left: 32px;
  padding-right: max(32px, env(safe-area-inset-right, 0px));
  background: var(--bg);
}
.auth-box { width: min(100%, 410px); margin-block: auto; display: flex; flex-direction: column; gap: 16px; }
.auth-form { display: flex; flex-direction: column; gap: 14px; }
.af-head { display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px; }
.af-head h1 { margin: 0; font-family: var(--display); font-stretch: 114%; font-weight: 800; font-size: 34px; line-height: 1.05; letter-spacing: -.015em; text-wrap: balance; }
.af-head p { margin: 0; color: var(--muted); font-size: 15px; }
.af-icon { width: 44px; height: 44px; margin-bottom: 6px; border-radius: 50%; display: grid; place-items: center; background: var(--p-soft); color: var(--p); }
.af-icon .ic { width: 22px; height: 22px; }
.field-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.field-row label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.field-row .hint { font-size: 12px; color: var(--muted); }
.field > span em { font-style: normal; font-weight: 500; color: var(--muted); margin-left: 4px; }
.field input[aria-invalid="true"] { border-color: var(--a); box-shadow: 0 0 0 3px var(--a-soft); }
.pw { position: relative; }
.field .pw input { padding-right: 46px; }
.pw-toggle { position: absolute; right: 3px; top: 50%; transform: translateY(-50%); width: 38px; height: 34px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); display: grid; place-items: center; }
.pw-toggle:hover { color: var(--ink); background: var(--surface-2); }
.btn.block { width: 100%; min-height: 46px; font-size: 15px; border-radius: 10px; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
.linkbtn:hover { text-decoration: underline; }
.af-switch { margin: 2px 0 0; text-align: center; font-size: 14px; color: var(--ink-2); }
.af-switch .linkbtn { font-size: 14px; }
.or { display: flex; align-items: center; gap: 12px; font: 600 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.auth-error { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--a); background: var(--a-soft); color: var(--a); font-size: 14px; font-weight: 600; }
.af-note { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; color: var(--ink-2); }
.af-note .ic { width: 18px; height: 18px; margin-top: 1px; color: var(--accent); }
.af-note.warn .ic { color: var(--t); }
.af-note span { flex: 1; min-width: 0; }
.af-loading { display: flex; align-items: center; gap: 14px; padding: 24px 0; color: var(--ink-2); }
.af-loading p { margin: 0; font-weight: 600; }
.demo-btn { width: 100%; display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: 12px; border: 1px dashed var(--line-2); background: transparent; color: var(--ink); text-align: left; transition: border-color .15s, background-color .15s; }
.demo-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
.demo-btn > .ic { color: var(--accent); }
.demo-btn > .ic:first-child { width: 20px; height: 20px; }
.demo-btn > span { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.demo-btn b { font-size: 14.5px; }
.demo-btn small { font-size: 12.5px; color: var(--muted); }
.auth-foot { width: min(100%, 410px); display: flex; flex-direction: column; gap: 12px; font-size: 12.5px; color: var(--muted); }
.af-sync { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.auth-foot .ic { width: 15px; height: 15px; }
.auth-foot .linkbtn { font-size: 12.5px; }
.af-legal, .set-legal { display: flex; flex-wrap: wrap; gap: 4px 18px; border-top: 1px solid var(--line); }
.af-legal { padding-top: 12px; }
.af-legal a, .set-legal a { color: var(--muted); text-decoration: none; }
.af-legal a:hover, .set-legal a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
.af-terms { margin: 0; text-align: center; font-size: 12.5px; line-height: 1.5; color: var(--muted); text-wrap: balance; }
.af-terms a { color: var(--ink-2); text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 2px; }
.af-terms a:hover { text-decoration-color: currentColor; }
.set-legal { margin-top: 18px; padding-top: 14px; font-size: 13px; }

/* Shown only when JavaScript is off */
.nojs {
  max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px;
  padding-block: 64px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.nojs-brand { margin: 0; display: flex; align-items: center; gap: 10px; font-family: var(--display); font-stretch: 118%; font-weight: 800; font-size: 20px; }
.nojs h1 { margin: 0; font-family: var(--display); font-stretch: 120%; font-weight: 800; font-size: clamp(38px, 7vw, 56px); line-height: 1; letter-spacing: -.02em; text-wrap: balance; }
.nojs p { margin: 0; max-width: 60ch; color: var(--ink-2); font-size: 16px; }
.nojs-links { display: flex; flex-wrap: wrap; gap: 6px 18px; }
.spin { width: 16px; height: 16px; flex: none; display: inline-block; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Account ---------- */
.acct { display: flex; align-items: center; gap: 10px; width: 100%; margin-top: 8px; padding: 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); text-align: left; }
.acct:hover { border-color: var(--line-2); }
.acct .av { width: 34px; height: 34px; font-size: 12px; box-shadow: none; }
.acct-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.acct-txt b { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acct-txt span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acct > .ic { width: 16px; height: 16px; color: var(--muted); }
.av-demo { background: var(--accent-soft); color: var(--accent); }
.av-demo .ic { width: 55%; height: 55%; }
.av.av-lg { width: 48px; height: 48px; font-size: 16px; box-shadow: none; }
.av-btn { border: 0; background: transparent; padding: 3px; border-radius: 50%; display: grid; place-items: center; }
.av-btn .av { width: 32px; height: 32px; font-size: 12px; box-shadow: none; }
.acct-card { display: flex; align-items: center; gap: 12px; min-width: 0; padding: 12px; border-radius: var(--r); background: var(--surface-2); border: 1px solid var(--line); }
.acct-card > div { min-width: 0; display: flex; flex-direction: column; }
.acct-card b { font-size: 15.5px; }
.acct-card span { font-size: 13px; color: var(--muted); word-break: break-all; }
.sync-line { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.sync-line .ic { width: 16px; height: 16px; }
.err-text { color: var(--a); font-weight: 600; }

/* ---------- Setup guide ---------- */
.steps { list-style: none; margin: 0; padding: 0; counter-reset: st; display: flex; flex-direction: column; gap: 14px; }
.steps > li { counter-increment: st; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; font-size: 14px; line-height: 1.55; color: var(--ink-2); }
.steps > li::before { content: counter(st); width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font: 700 12px/1 var(--mono); }
.steps > li > div { min-width: 0; }
.steps b { color: var(--ink); }
.steps a { font-weight: 600; }
.codeblock { position: relative; margin-top: 10px; }
.codeblock pre { margin: 0; padding: 12px 88px 12px 14px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); font: 12px/1.55 var(--mono); color: var(--ink); overflow-x: auto; white-space: pre; }
.codeblock .btn { position: absolute; top: 8px; right: 8px; }
.opstatus.info .ic { color: var(--accent); }

@media (max-width: 1100px) {
  .auth-brand { padding-left: max(36px, env(safe-area-inset-left, 0px)); padding-right: 36px; }
  .ab-feats { flex-direction: column; gap: 8px; }
}
@media (max-width: 900px) {
  .auth { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; }
  .auth-brand {
    padding-block: 18px 24px;
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
  }
  .ab-inner { gap: 18px; max-width: none; }
  .ab-mid { gap: 0; }
  .live, .ab-feats { display: none; }
  .ab-title { font-size: 38px; }
  .ab-sub { font-size: 14.5px; }
  .ab-waves { width: 300px; height: 300px; right: -170px; bottom: -130px; }
  .auth-main {
    justify-content: flex-start;
    padding-block: 26px 28px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .auth-box { margin-block: 0; }
  .af-head h1 { font-size: 28px; }
}

/* ---------- School office ---------- */
.pitem.school .pnum svg { width: 19px; height: 19px; }
.pitem.school:not(.is-active) .pnum { color: var(--accent); }
.sc-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-top: -4px; overflow-x: auto; scrollbar-width: none; }
.sc-tabs::-webkit-scrollbar { display: none; }
.sc-tabs button {
  display: inline-flex; align-items: center; gap: 7px; flex: none;
  padding: 9px 14px 10px; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px;
  background: transparent; font-weight: 600; font-size: 14px; color: var(--muted);
}
.sc-tabs button:hover { color: var(--ink); }
.sc-tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.sc-tabs .cnt { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; display: inline-grid; place-items: center; background: var(--accent); color: var(--on-accent); font: 700 11.5px/1 var(--body); }
.sc-who { min-width: 0; display: flex; flex-direction: column; text-align: left; }
.sc-who b { font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sc-who b em { font-style: normal; font-weight: 500; color: var(--muted); }
.sc-who > span { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.sc-live { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.sc-trow {
  width: 100%; display: grid; grid-template-columns: 40px minmax(0, 1fr) minmax(150px, 230px) 84px; align-items: center; gap: 12px 14px;
  padding: 11px 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); text-align: left;
}
.sc-trow:hover { border-color: var(--line-2); }
.sc-trow.ph-now { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.sc-trow .av { width: 40px; height: 40px; box-shadow: none; }
.sc-trow .phase { justify-self: end; }
.sc-meter { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.sc-meter .bar { height: 8px; }
.sc-nums { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sc-nums b { font: 700 15px var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.sc-absent { list-style: none; margin: 0; padding: 4px 14px; }
.sc-absent li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.sc-absent li:last-child { border-bottom: 0; }
.sc-absent .av { width: 34px; height: 34px; font-size: 12px; box-shadow: none; }

.sc-people { list-style: none; margin: 0; padding: 4px 14px; }
.sc-prow { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto auto; gap: 10px 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
.sc-prow:last-child { border-bottom: 0; }
.sc-prow .av { width: 38px; height: 38px; font-size: 12.5px; box-shadow: none; }
.av-pend { background: var(--surface-2); color: var(--muted); border: 1px dashed var(--line-2); }
.av-pend .ic { width: 17px; height: 17px; }
.sc-pact { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
.role { justify-self: start; padding: 4px 9px; border-radius: 999px; font: 700 11px/1.2 var(--body); letter-spacing: .02em; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.role.r-admin { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.role.r-registrar { background: var(--e-soft); color: var(--e); border-color: transparent; }

.sc-students { list-style: none; margin: 0; padding: 4px 6px; }
.sc-students li + li { border-top: 1px solid var(--line); }
.sc-srow { width: 100%; display: grid; grid-template-columns: 36px minmax(150px, 1fr) minmax(0, 1.3fr) 22px; gap: 10px 14px; align-items: center; padding: 10px 8px; border: 0; background: transparent; border-radius: 10px; text-align: left; }
.sc-srow:hover { background: var(--surface-2); }
.sc-srow .av { width: 36px; height: 36px; font-size: 12px; box-shadow: none; }
.sc-cls { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.ctag { padding: 3px 7px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); font: 600 11.5px/1.2 var(--mono); color: var(--ink-2); white-space: nowrap; }
.sc-tag { display: grid; place-items: center; color: var(--line-2); }
.sc-tag.on { color: var(--p); }

  var FIRST = ['Aaliyah', 'Adrian', 'Aiden', 'Alejandro', 'Amara', 'Andre', 'Ava', 'Benjamin', 'Bianca',

  var LAST = ['Adams', 'Ahmed', 'Alvarez', 'Anderson', 'Bautista', 'Brooks', 'Castillo', 'Chen', 'Cho',
    'Cruz', 'Davis', 'Diaz', 'Edwards', 'Flores', 'Foster', 'Garcia', 'Gonzalez', 'Gupta', 'Hall',

    'Lopez', 'Martin', 'Martinez', 'Mendoza', 'Morales', 'Nakamura', 'Nguyen', 'Okafor', 'Ortiz',
    'Park', 'Patel', 'Perez', 'Phillips', 'Ramirez', 'Reyes', 'Rivera', 'Robinson', 'Rodriguez',
    'Ruiz', 'Santos', 'Sharma', 'Singh', 'Smith', 'Tanaka', 'Taylor', 'Thomas', 'Torres', 'Tran',
    'Walker', 'Washington', 'Williams', 'Wilson', 'Wong', 'Young'];

  var PERIODS = [
    { num: 1, course: 'Biology', room: '214', start: '08:00', end: '08:50' },
    { num: 2, course: 'Biology', room: '214', start: '08:56', end: '09:46' },
    { num: 3, course: 'AP Biology', room: '214', start: '09:52', end: '10:42' },
    { num: 4, course: 'Marine Science', room: '118', start: '10:48', end: '11:38' },
    { num: 5, course: 'Biology', room: '214', start: '12:20', end: '13:10' },
    { num: 6, course: 'Environmental Science', room: '214', start: '13:16', end: '14:06' }
  ];

  var CODE = 'abcdefghijkmnpqrstuvwxyz23456789';

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function dstr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function toMin(hm) { var p = hm.split(':'); return Number(p[0]) * 60 + Number(p[1]); }

  /**
   * opts.now        Date used as "today" (default: now)
   * opts.nowMinutes minutes after midnight used to decide which of today's periods have happened
   * opts.seed       random seed
   * Returns { settings, periods, students, days } in TapRoll's state shape.
   */
  function generate(opts) {
    opts = opts || {};
    var now = opts.now ? new Date(opts.now) : new Date();
    var nowMin = typeof opts.nowMinutes === 'number' ? opts.nowMinutes : now.getHours() * 60 + now.getMinutes();
    var rand = mulberry32(opts.seed || 20261026);
    function pick(arr) { return arr[Math.floor(rand() * arr.length)]; }
    function code(n) { var s = ''; for (var i = 0; i < n; i++) s += CODE[Math.floor(rand() * 32)]; return s; }

    var periods = {}, students = {}, days = {};
    var risk = {};
    var plist = PERIODS.map(function (p) {
      var id = 'p' + p.num + code(5);
      periods[id] = { id: id, num: p.num, course: p.course, room: p.room, start: p.start, end: p.end };
      return periods[id];
    });

    var used = {};
    plist.forEach(function (p) {
      var size = 22 + Math.floor(rand() * 8);
      for (var i = 0; i < size; i++) {
        var first, last, guard = 0;
        do { first = pick(FIRST); last = pick(LAST); guard++; } while (used[first + ' ' + last] && guard < 60);
        used[first + ' ' + last] = true;
        var id = 's' + code(9);
        var hasTag = rand() < 0.9;
        var r = rand();
        students[id] = {
          id: id, first: first, last: last, periods: [p.id],
          token: hasTag ? code(12) : null, uids: [],
          tagAt: hasTag ? now.getTime() - (3 + Math.floor(rand() * 25)) * 86400000 : null
        };
        risk[id] = {
          abs: r < 0.07 ? 0.16 + rand() * 0.14 : (r < 0.2 ? 0.05 + rand() * 0.05 : 0.012),
          tardy: rand() < 0.15 ? 0.12 : 0.025
        };
      }
    });

    // The 15 school days (Mon-Fri) before today, oldest first.
    var base = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var dates = [];
    var cur = new Date(base);
    for (var guard2 = 0; dates.length < 15 && guard2 < 40; guard2++) {
      cur.setDate(cur.getDate() - 1);
      var g = cur.getDay();
      if (g !== 0 && g !== 6) dates.push(new Date(cur));
    }
    dates.reverse();

    function rosterOf(pid) {
      return Object.keys(students).map(function (k) { return students[k]; })
        .filter(function (s) { return s.periods.indexOf(pid) !== -1; });
    }

    // complete: whole roll taken. inSession: only students who have arrived so far.
    function fill(dayDate, p, mode) {
      var per = {};
      var dayBase = dayDate.getTime();
      var startTs = dayBase + toMin(p.start) * 60000;
      var nowTs = dayBase + nowMin * 60000;
      rosterOf(p.id).forEach(function (s) {
        var rk = risk[s.id];
        var x = rand();
        // Mid-period, a few students haven't tapped in yet.
        if (mode === 'inSession' && rand() < 0.12) return;
        var method = s.token ? 'nfc' : 'manual';
        var mark;
        if (x < rk.abs) {
          if (mode === 'inSession') return;
          mark = { s: rand() < 0.25 ? 'E' : 'A', t: startTs + 8 * 60000, m: 'manual' };
        } else if (x < rk.abs + rk.tardy) {
          mark = { s: 'T', t: startTs + (6 + Math.floor(rand() * 12)) * 60000 + Math.floor(rand() * 59000), m: method };
        } else {
          mark = { s: 'P', t: startTs - 240000 + Math.floor(rand() * 420000), m: method };
        }
        if (mode === 'inSession' && mark.t > nowTs) return;
        per[s.id] = mark;
      });
      return per;
    }

    dates.forEach(function (d) {
      var key = dstr(d);
      days[key] = {};
      plist.forEach(function (p) { days[key][p.id] = fill(d, p, 'complete'); });
    });

    var todayKey = dstr(base);
    plist.forEach(function (p) {
      var s = toMin(p.start), e = toMin(p.end);
      var mode = nowMin >= e ? 'complete' : (nowMin >= s ? 'inSession' : null);
      if (!mode) return;
      var per = fill(base, p, mode);
      if (Object.keys(per).length) {
        days[todayKey] = days[todayKey] || {};
        days[todayKey][p.id] = per;
      }
    });

    return {
      settings: { school: 'Harbor View High', teacher: '', graceMin: 5, sample: true },
      periods: periods,
      students: students,
      days: days
    };
  }

  // The example bell schedule, shared with the example school's other teachers.
  var api = { generate: generate, periods: PERIODS };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.TapRollDemo = api;
})(typeof window !== 'undefined' ? window : this);

  const ic = (name) => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ''}</svg>`;
  const LOGO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12.8l3.4 3.4 6-7.2"/><path d="M15.8 8.4a5 5 0 0 1 0 7.2"/><path d="M18.7 5.9a8.6 8.6 0 0 1 0 12.2"/></svg>';

  /* ============================== State ============================== */
  const STATUS = { P: 'Present', T: 'Tardy', A: 'Absent', E: 'Excused' };
  const STATUS_CLS = { P: 'p', T: 't', A: 'a', E: 'e' };
  const METHOD = { nfc: 'NFC tag', usb: 'USB reader', manual: 'by hand', link: 'tag link', demo: 'simulated tap' };
  const METHOD_ICON = { nfc: 'nfc', usb: 'usb', manual: 'hand', link: 'link', demo: 'spark' };
  const DEFAULT_SETTINGS = { school: '', teacher: '', graceMin: 5, tagBase: '', sample: false, ws: '' };
  // Each period has a passing time (check-in opens this many minutes before its bell) and a tardy grace (taps up to
  // this many minutes after the bell still count as present). Periods saved before these existed use the defaults:
  // the passing time below, and the grace from Settings (graceMin), which used to apply to every period.
  const DEFAULT_PASS = 10;
  const mins0to60 = (v) => { if (v === null || v === undefined || v === '') return null; const n = Number(v); return Number.isFinite(n) ? Math.max(0, Math.min(60, Math.round(n))) : null; };
  const defaultGrace = () => { const g = mins0to60(S.settings.graceMin); return g == null ? 5 : g; };
  const passOf = (p) => (p && p.pass != null ? p.pass : DEFAULT_PASS);
  const graceOf = (p) => (p && p.grace != null ? p.grace : defaultGrace());
  // An excused tardy is stored as present (so it counts as on time) with xt set and the reason in why.
  const EXCUSES = ['Held by another teacher', 'Office pass', 'Late bus', 'Other'];
  const markLabel = (mk) => (mk.xt ? 'Excused tardy' : STATUS[mk.s]);

  /* Parent emails. A teacher can open a draft, addressed and written, in their own email (their email app, Gmail or
     Outlook on the web), review it and send it. Where the site's owner runs the automatic sender (see Automatic
     parent emails), TapRoll also emails parents itself a few minutes after class ends. */
  const EMAIL_RE = /^[^\s@,;<>()"']+@[^\s@,;<>()"']+\.[^\s@,;<>()"'.]{2,}$/;
  // Up to 3 addresses, separated by commas, semicolons or spaces. Returns { ok, bad }.
  function parseEmails(text) {
    const parts = String(text || '').split(/[\s,;]+/).map((x) => x.trim()).filter(Boolean);
    return { ok: [...new Set(parts.filter((x) => EMAIL_RE.test(x)))].slice(0, 3), bad: parts.filter((x) => !EMAIL_RE.test(x)) };
  }
  const MAIL_VIA = [['app', 'Email app'], ['gmail', 'Gmail'], ['outlook', 'Outlook']];
  const needsEmail = (mk) => !!mk && !mk.xt && (mk.s === 'A' || mk.s === 'T');
  function parentMessage(st, p, date, mk) {
    const d = parseDate(date);
    const day = d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
    const short = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    const cls = `${periodLabel(p)}${p.course ? ` (${p.course})` : ''}`;
    const when = date === todayStr() ? `today, ${day}` : `on ${day}`;
    const name = fullName(st);
    let subject, line;
    if (mk.s === 'A') {
      subject = `${name} was absent from ${cls} on ${short}`;
      line = `${name} was marked absent from ${cls} ${when}.`;
    } else {
      const bell = toMin(p.start), at = new Date(mk.t);
      const late = bell == null ? 0 : at.getHours() * 60 + at.getMinutes() - bell;
      subject = `${name} was late to ${cls} on ${short}`;
      line = `${name} arrived late to ${cls} ${when}, checking in at ${fmtClock(mk.t)}${late > 0 ? `, ${late} minute${late === 1 ? '' : 's'} after the bell` : ''}.`;
    }
    const sign = [S.settings.teacher || (Session.user && Session.user.name) || '', S.settings.school || ''].filter(Boolean);
    return { subject, body: ['Hello,', '', line, '', 'If you have any questions, please reply to this email.', '', 'Thank you,', ...sign].join('\r\n') };
  }
  function composeUrl(to, subject, body, via = prefs.mailVia) {
    const e = encodeURIComponent;
    if (via === 'gmail') return `https://mail.google.com/mail/?view=cm&fs=1&to=${e(to.join(','))}&su=${e(subject)}&body=${e(body)}`;
    if (via === 'outlook') return `https://outlook.office.com/mail/deeplink/compose?to=${e(to.join(','))}&subject=${e(subject)}&body=${e(body)}`;
    return `mailto:${to.map(e).join(',')}?subject=${e(subject)}&body=${e(body)}`;
  }
  // The "Email parent" link for one mark. Clicking it opens the draft and records when (n) on the mark.
  function emailLink(st, p, date, mk, label) {
    const msg = parentMessage(st, p, date, mk);
    const web = prefs.mailVia !== 'app';
    return `<a class="btn sm" href="${esc(composeUrl(st.parents, msg.subject, msg.body))}"${web ? ' target="_blank" rel="noopener"' : ''} data-act="email-parent" data-sid="${esc(st.id)}" data-date="${esc(date)}" data-pid="${esc(p.id)}">${ic('mail')} ${esc(label || 'Email parent')}</a>`;
  }
  const viaSeg = () => `<div class="seg" role="radiogroup" aria-label="Open parent emails in">${MAIL_VIA.map(([v, l]) => `<button type="button" role="radio" aria-checked="${prefs.mailVia === v}" data-act="mail-via" data-v="${v}">${l}</button>`).join('')}</div>`;

  // Bell times are typed, like 8:05, 805, 1:16 pm or 13:16. Without am/pm, 1 to 5 o'clock means afternoon and
  // 6 to 11 means morning, which fits a school day. Returns minutes after midnight, or null.
  function parseClock(text) {
    let t = String(text || '').trim().toLowerCase().replace(/\s+/g, '');
    if (!t) return null;
    let half = null;
    const suf = /(a|p)\.?m?\.?$/.exec(t);
    if (suf) { half = suf[1]; t = t.slice(0, suf.index); }
    let h, m;
    let mm = /^(\d{1,2})[:.](\d{2})$/.exec(t);
    if (mm) { h = +mm[1]; m = +mm[2]; }
    else if ((mm = /^(\d{1,2})$/.exec(t))) { h = +mm[1]; m = 0; }
    else if ((mm = /^(\d{1,2})(\d{2})$/.exec(t))) { h = +mm[1]; m = +mm[2]; }
    else return null;
    if (m > 59) return null;
    if (half) {
      if (h < 1 || h > 12) return null;
      h = (h % 12) + (half === 'p' ? 12 : 0);
    } else if (h > 23) return null;
    else if (h >= 1 && h <= 5) h += 12;
    return h * 60 + m;
  }

  // passes: late passes by date ({ <date>: { <passId>: pass } }), see Late passes.
  const emptyState = (settings) => ({ settings: { ...DEFAULT_SETTINGS, ...(settings || {}) }, periods: {}, students: {}, days: {}, passes: {} });
  let S = emptyState();
  const ui = {

  const PKEY = 'taproll.prefs.v1';

  const editable = () => ui.ready && !ui.readOnly;

  /* ============================== Normalizers ============================== */
  function normPeriod(p) {
    return {
      id: String(p.id), num: Number(p.num) || 0, course: String(p.course || '').trim().slice(0, 60), room: String(p.room || '').trim().slice(0, 20),
      start: p.start || '', end: p.end || '', pass: mins0to60(p.pass), grace: mins0to60(p.grace)
    };
  }
  function normMark(mk) {
    const out = { s: mk.s, t: Number(mk.t) || 0, m: String(mk.m || 'manual') };
    if (mk.xt && mk.s === 'P') { out.xt = 1; if (mk.why) out.why = String(mk.why).slice(0, 90); }
    // n: when a parent email was opened for this absence or tardy
    if (Number(mk.n) && (mk.s === 'A' || mk.s === 'T')) { out.n = Number(mk.n); if (mk.na) out.na = 1; }
    // nf: TapRoll couldn't email the parent automatically (the address was refused), so the teacher can send it
    else if (mk.nf && (mk.s === 'A' || mk.s === 'T')) out.nf = 1;
    // px: the late pass that excused this tardy (kept after "Mark tardy again", so it isn't applied twice)
    if (typeof mk.px === 'string' && mk.px && (mk.s === 'P' || mk.s === 'T')) out.px = mk.px.slice(0, 24);
    return out;
  }
  function normStudent(s) {
    const out = {
      id: String(s.id), first: String(s.first || '').trim().slice(0, 40), last: String(s.last || '').trim().slice(0, 40),
      periods: Array.isArray(s.periods) ? s.periods.filter((x) => typeof x === 'string') : [],
      token: typeof s.token === 'string' && s.token ? s.token : null,
      uids: Array.isArray(s.uids) ? s.uids.map(String).filter(Boolean) : [],
      tagAt: Number(s.tagAt) || null,
      parents: Array.isArray(s.parents) ? parseEmails(s.parents.join(' ')).ok : []
    };
    // sk: the school key a school office gave this student. It is also their school tag code (see Schools).
    // Left out when there isn't one, so a teacher's own save never erases it.
    if (typeof s.sk === 'string' && /^[a-z0-9]{6,40}$/.test(s.sk)) out.sk = s.sk;

  function cleanMap(map, norm) {
    const out = {};
    if (isObj(map)) for (const [k, v] of Object.entries(map)) if (isObj(v)) out[k] = norm({ ...v, id: v.id || k });
    return out;

  function cleanDay(periods) {
    const out = {};
    if (!isObj(periods)) return out;
    for (const [pid, marks] of Object.entries(periods)) {
      if (!isObj(marks)) continue;
      const m = {};
      for (const [sid, mk] of Object.entries(marks)) if (isObj(mk) && STATUS[mk.s]) m[sid] = normMark(mk);
      if (Object.keys(m).length) out[pid] = m;

    return out;
  }
  function normalizeState(raw) {
    raw = isObj(raw) ? raw : {};

      settings: { ...DEFAULT_SETTINGS, ...(isObj(raw.settings) ? raw.settings : {}) },
      periods: cleanMap(raw.periods, normPeriod),
      students: cleanMap(raw.students, normStudent),
      days: {},
      passes: {}
    };
    if (isObj(raw.days)) {
      for (const [date, per] of Object.entries(raw.days)) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) continue;
        const d = cleanDay(per);
        if (Object.keys(d).length) st.days[date] = d;
      }
    }
    if (isObj(raw.passes)) {
      for (const [date, map] of Object.entries(raw.passes)) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) continue;
        const ps = cleanPasses(map);
        if (Object.keys(ps).length) st.passes[date] = ps;
